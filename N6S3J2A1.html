<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pazapa – J'observe et je teste – S3 J2 – 6e</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --day-color:#b94040; --day-dark:#7a1f1f; --day-dark2:#5a1414;
      --day-light:#f7eded; --day-border:#e3bcbc; --day-glow:rgba(185,64,64,.28);
      --bg:#fffdf7; --surface:#ffffff; --border:#e8e4d9;
      --yellow:#f5c518; --green:#8dc63f; --green-light:#eaf3de; --green-dark:#3d7a10;
      --pink:#b94040; --pink-light:#f7eded;
      --orange:#f5a623; --orange-light:#fff5e0;
      --text:#1a1d23; --muted:#7a7470; --radius:16px; --radius-sm:10px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      padding: 1.5rem 0.75rem 3rem; overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    .wrap { width: 100%; max-width: 640px; }
    .bubble1 { position: fixed; border-radius: 50%; z-index: 0; opacity: .10;
      width: 220px; height: 220px; background: var(--day-color); top: -60px; right: -60px; pointer-events: none; }
    .bubble2 { position: fixed; border-radius: 50%; z-index: 0; opacity: .10;
      width: 160px; height: 160px; background: var(--green); bottom: 80px; left: -40px; pointer-events: none; }

    header { text-align: center; margin-bottom: 1.5rem; position: relative; z-index: 1; }
    .logo-badge {
      display: inline-flex; align-items: center; gap: .45rem;
      background: var(--yellow); color: #000;
      font-size: .75rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
      padding: .28rem .85rem; border-radius: 99px; margin-bottom: .45rem; white-space: nowrap;
    }
    .logo-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .week-label { font-family: 'JetBrains Mono', monospace; font-size: .8rem; color: var(--muted); margin-bottom: .45rem; }
    h1 { font-size: clamp(1.15rem, 4vw, 1.75rem); font-weight: 800; line-height: 1.3; word-break: break-word; }
    h1 .hl { color: var(--day-color); }
    .subtitle { color: var(--muted); font-size: clamp(.78rem, 2.5vw, .88rem);
      margin-top: .35rem; font-family: 'JetBrains Mono', monospace; word-break: break-word; }

    .progress-wrap { width: 100%; margin-bottom: 1rem; position: relative; z-index: 1; }
    .progress-info { display: flex; justify-content: space-between; font-size: .75rem; color: var(--muted);
      font-family: 'JetBrains Mono', monospace; margin-bottom: .35rem; }
    .progress-bg { background: var(--border); border-radius: 99px; height: 6px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--day-color), #d98a6a);
      border-radius: 99px; transition: width .5s ease; width: 0%; }

    .chips-row { display: flex; gap: .5rem; margin-bottom: 1.4rem; flex-wrap: wrap; position: relative; z-index: 1; }
    .chip { display: flex; align-items: center; gap: .35rem; padding: .25rem .65rem; border-radius: 99px;
      font-size: .76rem; font-family: 'JetBrains Mono', monospace;
      border: 1.5px solid var(--border); background: var(--surface); font-weight: 600; white-space: nowrap; }
    .chip .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .chip.ok   .dot { background: var(--green); }
    .chip.ko   .dot { background: var(--day-color); }
    .chip.rem  .dot { background: var(--muted); }

    .card { width: 100%; background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius);
      padding: 1.3rem 1.2rem 1.2rem; position: relative; z-index: 1;
      box-shadow: 0 4px 18px rgba(0,0,0,.06); animation: fadeUp .35s ease both; }
    .card-stripe { position: absolute; top: 0; left: 0; right: 0; height: 4px;
      border-radius: var(--radius) var(--radius) 0 0;
      background: linear-gradient(90deg, var(--day-color), var(--orange), var(--green), var(--yellow)); }
    .activity-title { font-size: clamp(.92rem,3vw,1.05rem); font-weight: 800; color: var(--day-dark);
      margin-bottom: .5rem; line-height: 1.35; }
    .q-num { font-size: .7rem; font-family: 'JetBrains Mono', monospace; color: var(--muted);
      margin-bottom: .4rem; text-transform: uppercase; letter-spacing: .1em; }
    .theme-badge { display: inline-block; font-size: .63rem; font-weight: 700; padding: .15rem .55rem;
      border-radius: 4px; text-transform: uppercase; letter-spacing: .07em; margin-bottom: .65rem;
      background: var(--day-light); color: var(--day-dark); border: 1.5px solid var(--day-border); white-space: nowrap; }
    .consigne-box { background: var(--day-light); border: 1.5px solid var(--day-border);
      border-left: 4px solid var(--day-color); border-radius: var(--radius-sm);
      padding: .7rem .9rem; margin-bottom: .9rem; font-size: clamp(.82rem, 2.5vw, .9rem);
      color: var(--day-dark); line-height: 1.7; word-break: break-word; }
    .question-box { background: var(--day-light); border: 2px solid var(--day-border);
      border-radius: var(--radius-sm); padding: .85rem 1rem; margin-bottom: .9rem;
      font-size: clamp(.95rem, 2.8vw, 1.1rem); font-weight: 700; color: var(--day-dark);
      line-height: 1.5; word-break: break-word; }
    .hint-box { display: none; margin-bottom: .8rem; padding: .65rem .9rem;
      background: #fffbeb; border: 1.5px dashed var(--yellow); border-radius: var(--radius-sm);
      font-size: .83rem; color: #7a6010; line-height: 1.75; word-break: break-word;
      font-family: 'JetBrains Mono', monospace; }
    .hint-box.show { display: block; }

    .choices { display: flex; flex-direction: column; gap: .5rem; margin-bottom: 1rem; }
    .choice { display: flex; align-items: flex-start; gap: .7rem; padding: .75rem .9rem;
      border: 2px solid var(--border); border-radius: var(--radius-sm); cursor: pointer;
      background: var(--bg); transition: border-color .13s, background .13s;
      font-size: clamp(.85rem, 2.5vw, .95rem); line-height: 1.55; word-break: break-word;
      min-height: 44px; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
    .choice:hover:not([aria-disabled="true"]) { border-color: var(--day-color); background: var(--day-light); }
    .choice.selected { border-color: var(--day-color); background: var(--day-light); }
    .choice.correct-c { border-color: var(--green); background: var(--green-light); color: var(--green-dark); font-weight: 700; }
    .choice.wrong-c   { border-color: var(--day-color); background: var(--pink-light); color: var(--day-dark); }
    .choice.reveal-c  { border-color: var(--green); background: var(--green-light); color: var(--green-dark); font-weight: 700; }
    .choice[aria-disabled="true"] { cursor: default; pointer-events: none; }
    .choice-letter { width: 26px; height: 26px; border-radius: 50%; background: var(--border); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700;
      font-family: 'JetBrains Mono', monospace; transition: background .13s, color .13s; min-width: 26px; }
    .choice.selected   .choice-letter { background: var(--day-color); color: #fff; }
    .choice.correct-c  .choice-letter { background: var(--green); color: #fff; }
    .choice.wrong-c    .choice-letter { background: var(--day-color); color: #fff; }
    .choice.reveal-c   .choice-letter { background: var(--green); color: #fff; }
    .choice-text { flex: 1; word-break: break-word; }

    .btn-row { display: flex; gap: .55rem; flex-wrap: wrap; }
    @media (max-width: 479px) {
      .btn-row { flex-direction: column; }
      .btn-row .btn { width: 100%; justify-content: center; }
    }
    .btn { display: inline-flex; align-items: center; gap: .4rem; padding: .65rem 1.2rem;
      border-radius: var(--radius-sm); font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(.85rem, 2.5vw, .92rem); font-weight: 700; cursor: pointer; border: none;
      transition: transform .12s, box-shadow .14s, opacity .12s; min-height: 2.8rem;
      -webkit-tap-highlight-color: transparent; position: relative; z-index: 2; }
    .btn:active { transform: scale(.96); }
    .btn:disabled { opacity: .38; cursor: default; transform: none !important; }
    .btn-primary { background: var(--day-color); color: #fff; box-shadow: 0 3px 10px var(--day-glow); }
    .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 5px 14px var(--day-glow); }
    .btn-ghost { background: transparent; color: var(--muted); border: 1.5px solid var(--border); }
    .btn-ghost:hover:not(:disabled) { border-color: var(--day-color); color: var(--text); }

    .feedback { margin-top: 1rem; padding: .8rem 1rem; border-radius: var(--radius-sm);
      font-size: clamp(.82rem, 2.5vw, .9rem); display: none; align-items: flex-start; gap: .6rem;
      line-height: 1.75; word-break: break-word; }
    .feedback.show { display: flex; }
    .feedback.ok  { background: var(--green-light); border: 1.5px solid var(--green); color: var(--green-dark); }
    .feedback.ko  { background: var(--pink-light);  border: 1.5px solid var(--day-color);  color: var(--day-dark); }
    .fb-icon { font-size: 1.3rem; flex-shrink: 0; }
    .fb-body .fb-title { font-weight: 700; margin-bottom: .2rem; }
    .fb-body .fb-detail { font-family: 'JetBrains Mono', monospace; font-size: .8rem;
      color: var(--text); margin-top: .25rem; line-height: 1.8; }

    .nav-row { display: flex; justify-content: space-between; align-items: center; margin-top: 1.2rem; gap: .5rem; }
    .nav-info { font-family: 'JetBrains Mono', monospace; font-size: .75rem; color: var(--muted); }

    .results { display: none; width: 100%; position: relative; z-index: 1; animation: fadeUp .4s ease both; }
    .results.show { display: block; }
    .results-card { background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius);
      padding: 2rem 1.4rem; box-shadow: 0 4px 18px rgba(0,0,0,.06); text-align: center; }
    .results-score { font-size: clamp(2.8rem, 10vw, 4.5rem); font-weight: 800; line-height: 1; margin: .6rem 0 .3rem; }
    .results-score .s-num { color: var(--day-color); }
    .stars { font-size: 1.8rem; margin: .4rem 0 .8rem; letter-spacing: .08em; }
    .results-msg { color: var(--muted); font-size: clamp(.85rem, 2.5vw, .95rem); margin-bottom: 1.5rem; line-height: 1.75; word-break: break-word; }
    .recap { text-align: left; display: flex; flex-direction: column; gap: .45rem; margin-bottom: 1.5rem; }
    .recap-sec { font-family:'JetBrains Mono',monospace; font-size:.72rem; font-weight:700; color:var(--day-dark);
      text-transform:uppercase; letter-spacing:.06em; margin-top:.6rem; }
    .recap-item { display: flex; align-items: flex-start; gap: .6rem; padding: .6rem .85rem;
      border-radius: var(--radius-sm); background: var(--bg); border: 1.5px solid var(--border);
      font-size: clamp(.78rem, 2.5vw, .84rem); line-height: 1.6; word-break: break-word; }
    .recap-item.ok-r { border-color: #b5e08a; }
    .recap-item.ko-r { border-color: var(--day-border); }
    .recap-q { flex: 1; color: var(--muted); font-size: .78rem; }
    .recap-a { color: var(--day-dark); font-weight: 700; font-size: .8rem; word-break: break-word; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="bubble1"></div>
  <div class="bubble2"></div>
  <div class="wrap">

    <header>
      <div class="logo-badge">
        <span class="logo-dot" style="background:#f5c518"></span>
        <span class="logo-dot" style="background:#8dc63f"></span>
        <span class="logo-dot" style="background:#f5a623"></span>
        Pazapa · Français · 6ème
      </div>
      <div class="week-label">Semaine 3 – Jour 2</div>
      <h1>J'observe et je teste ·<br><span class="hl">Les phrases imagées</span></h1>
      <p class="subtitle">Mène l'enquête sur les figures de style.</p>
    </header>

    <div class="progress-wrap">
      <div class="progress-info">
        <span id="prog-label">Question 1 / 10</span>
        <span id="prog-pct">0 %</span>
      </div>
      <div class="progress-bg">
        <div class="progress-fill" id="prog-fill"></div>
      </div>
    </div>

    <div class="chips-row">
      <div class="chip ok"><div class="dot"></div><span id="cnt-ok">0</span> correcte(s)</div>
      <div class="chip ko"><div class="dot"></div><span id="cnt-ko">0</span> erreur(s)</div>
      <div class="chip rem"><div class="dot"></div><span id="cnt-rem">10</span> restante(s)</div>
    </div>

    <div class="card" id="ex-card">
      <div class="card-stripe"></div>
      <div class="activity-title" id="q-activity"></div>
      <div class="q-num" id="q-num">Question 1 / 10</div>
      <div class="theme-badge" id="q-theme"></div>

      <div class="consigne-box" id="q-consigne"></div>

      <div class="question-box" id="q-question"></div>

      <div class="hint-box" id="hint-box"></div>

      <div class="choices" id="choices-container"></div>

      <div class="btn-row" id="row1">
        <button class="btn btn-primary" id="btn-check" onclick="checkAnswer()" disabled>✓ Vérifier</button>
        <button class="btn btn-ghost"   id="btn-hint"  onclick="showHint()">? Indice</button>
      </div>
      <div class="btn-row" id="row2" style="display:none;">
        <button class="btn btn-primary" id="btn-next" onclick="nextQ()">Suivant →</button>
      </div>

      <div class="feedback" id="feedback">
        <span class="fb-icon" id="fb-icon"></span>
        <div class="fb-body">
          <div class="fb-title" id="fb-title"></div>
          <div class="fb-detail" id="fb-detail"></div>
        </div>
      </div>

      <div class="nav-row">
        <button class="btn btn-ghost" id="btn-prev" onclick="prevQ()" style="min-height:2.8rem;">← Précédent</button>
        <span class="nav-info" id="nav-info">1 / 10</span>
      </div>
    </div>

    <div class="results" id="results-screen">
      <div class="results-card">
        <div class="logo-badge" style="margin-bottom:.6rem;">
          <span class="logo-dot" style="background:#f5c518"></span>
          <span class="logo-dot" style="background:#8dc63f"></span>
          <span class="logo-dot" style="background:#f5a623"></span>
          Résultats
        </div>
        <div class="results-score"><span class="s-num" id="r-score">0</span>/10</div>
        <div class="stars" id="r-stars"></div>
        <div class="results-msg" id="r-msg"></div>
        <div class="recap" id="r-recap"></div>
        <button class="btn btn-primary" onclick="restart()" style="width:100%;justify-content:center;">
          ↺ Recommencer
        </button>
      </div>
    </div>

  </div>

<script>
var A1 = "Activité 1 — Une phrase étrange s'est glissée ici";
var C1 = "Voici deux phrases qui décrivent la même scène. L'une est toute simple, l'autre crée une image dans l'esprit du lecteur. À toi de dire, pour chaque phrase, si elle est ordinaire ou imagée.";
var A2 = "Activité 2 — Quel indice attire ton attention ?";
var C2 = "Dans chaque phrase, repère le mot ou le groupe de mots qui rend la phrase particulière.";
var A3 = "Activité 3 — Classe les phrases";
var C3 = "Observe chaque phrase. Que fait l'auteur : il compare, il exagère, il donne vie, ou il oppose ?";
var AF = "Question finale";
var CF = "Une dernière question pour résumer ton enquête sur les figures de style.";

var QS = [
  /* ===== ACTIVITÉ 1 — Ordinaire ou imagée (la même scène, dite de deux façons) ===== */
  { activity:A1, consigne:C1, theme:"Ordinaire ou imagée",
    q:"« Le vent souffle dans les arbres. »",
    choices:["Phrase ordinaire","Phrase imagée"], ans:0,
    hint:"Le vent fait-il ici quelque chose d'étonnant, ou simplement ce qu'il fait d'habitude ?",
    fbOk:"Le vent « souffle » : c'est ce qu'il fait normalement. La phrase décrit la réalité sans créer d'image. Elle est ordinaire.",
    fbKo:"Ici le vent fait simplement ce qu'il fait d'habitude : « souffler ». Aucune image n'est créée, c'est une phrase ordinaire." },
  { activity:A1, consigne:C1, theme:"Ordinaire ou imagée",
    q:"« Le vent hurle dans les arbres. »",
    choices:["Phrase ordinaire","Phrase imagée"], ans:1,
    hint:"Compare avec la phrase d'avant : « hurler », est-ce une action d'être vivant ?",
    fbOk:"Les deux phrases décrivent la même scène, mais « hurler » prête au vent une voix, comme un être vivant : celle-ci crée une image. Elle est imagée.",
    fbKo:"Contrairement à « souffler », le verbe « hurler » donne au vent une voix, comme un être vivant : la phrase crée une image. Elle est imagée." },

  /* ===== ACTIVITÉ 2 — Repère l'indice ===== */
  { activity:A2, consigne:C2, theme:"Repère l'indice",
    q:"« Le soleil sourit aux voyageurs. »",
    choices:["soleil","voyageurs","sourit"], ans:2,
    hint:"Quel mot donne au soleil un comportement d'être vivant ?",
    fbOk:"« sourit » : c'est ce verbe qui prête un geste humain au soleil et rend la phrase imagée.",
    fbKo:"Le mot particulier est « sourit » : il donne au soleil un geste humain." },
  { activity:A2, consigne:C2, theme:"Repère l'indice",
    q:"« Il court aussi vite qu'un guépard. »",
    choices:["aussi vite qu'","court","guépard"], ans:0,
    hint:"Quel groupe de mots sert à comparer une personne à un animal rapide ?",
    fbOk:"« aussi vite qu' » est l'outil de comparaison : il relie la personne au modèle rapide.",
    fbKo:"Le groupe particulier est « aussi vite qu' » : c'est lui qui établit la comparaison." },
  { activity:A2, consigne:C2, theme:"Repère l'indice",
    q:"« J'ai attendu une éternité. »",
    choices:["attendu","une éternité","j'ai"], ans:1,
    hint:"Quel groupe exagère énormément la durée de l'attente ?",
    fbOk:"« une éternité » exagère la durée : personne n'attend vraiment l'éternité, c'est une exagération.",
    fbKo:"Le groupe particulier est « une éternité » : il exagère énormément la durée." },

  /* ===== ACTIVITÉ 3 — Compare / Exagère / Donne vie / Oppose ===== */
  { activity:A3, consigne:C3, theme:"Compare / Exagère / Donne vie / Oppose",
    q:"« Le ciel est bleu comme l'océan. »",
    choices:["Compare","Exagère","Donne vie","Oppose"], ans:0,
    hint:"Cherche le petit mot « comme » qui relie deux choses.",
    fbOk:"Le mot « comme » relie le ciel et l'océan : c'est une comparaison.",
    fbKo:"Le mot « comme » relie deux éléments : l'auteur compare. C'est une comparaison." },
  { activity:A3, consigne:C3, theme:"Compare / Exagère / Donne vie / Oppose",
    q:"« Ce coffre semble peser une tonne. »",
    choices:["Compare","Exagère","Donne vie","Oppose"], ans:1,
    hint:"Le coffre pèse-t-il vraiment une tonne, ou est-ce une grosse exagération ?",
    fbOk:"« peser une tonne » exagère le poids du coffre : c'est une exagération (hyperbole).",
    fbKo:"Le coffre ne pèse pas vraiment une tonne : l'auteur exagère. C'est une exagération." },
  { activity:A3, consigne:C3, theme:"Compare / Exagère / Donne vie / Oppose",
    q:"« La rivière chante dans la vallée. »",
    choices:["Compare","Exagère","Donne vie","Oppose"], ans:2,
    hint:"Une rivière peut-elle vraiment « chanter » ? Que lui prête l'auteur ?",
    fbOk:"« chante » prête à la rivière une action d'être vivant : l'auteur lui donne vie (personnification).",
    fbKo:"La rivière « chante » comme un être vivant : l'auteur lui donne vie. C'est une personnification." },
  { activity:A3, consigne:C3, theme:"Compare / Exagère / Donne vie / Oppose",
    q:"« Petit par la taille mais grand par le courage. »",
    choices:["Compare","Exagère","Donne vie","Oppose"], ans:3,
    hint:"Repère les deux mots contraires : « petit » et « grand ».",
    fbOk:"« petit » et « grand » sont opposés dans la même phrase : c'est une opposition.",
    fbKo:"« petit » et « grand » se font face : l'auteur oppose deux idées. C'est une opposition." },

  /* ===== QUESTION FINALE ===== */
  { activity:AF, consigne:CF, theme:"Le secret des écrivains",
    q:"Pourquoi les écrivains utilisent-ils parfois ce type de phrases ?",
    choices:[
      "Pour rendre leurs textes plus difficiles.",
      "Pour écrire plus de mots.",
      "Pour rendre leurs textes plus vivants et plus expressifs.",
      "Pour éviter d'expliquer leurs idées."
    ], ans:2,
    hint:"Repense aux phrases : « le soleil sourit », « la rivière chante »… Quel effet créent-elles ?",
    fbOk:"Exactement ! Les figures de style rendent les textes plus vivants, plus imagés et plus marquants pour le lecteur.",
    fbKo:"Les figures de style servent à rendre les textes plus vivants et plus expressifs : elles créent des images dans l'esprit du lecteur." }
];

var TOTAL        = QS.length;
var current      = 0;
var userAnswers  = new Array(TOTAL).fill(null);
var hintUsed     = new Array(TOTAL).fill(false);
var LETTERS      = ['A','B','C','D'];

function $(id){ return document.getElementById(id); }

function render(){
  var q = QS[current];
  $('q-activity').textContent = q.activity;
  $('q-num').textContent      = 'Question '+(current+1)+' / '+TOTAL;
  $('q-theme').textContent    = q.theme;
  $('q-consigne').textContent = q.consigne;
  $('q-question').textContent = q.q;
  $('nav-info').textContent   = (current+1)+' / '+TOTAL;

  var hb = $('hint-box');
  hb.className = 'hint-box' + (hintUsed[current] ? ' show' : '');
  hb.textContent = hintUsed[current] ? '💡 Indice : ' + q.hint : '';

  var cc = $('choices-container');
  cc.innerHTML = '';
  delete cc.dataset.sel;
  q.choices.forEach(function(txt, i){
    var div = document.createElement('div');
    div.className = 'choice';
    div.innerHTML = '<span class="choice-letter">'+LETTERS[i]+'</span><span class="choice-text">'+txt+'</span>';
    div.addEventListener('click', function(){ selectChoice(i); });
    cc.appendChild(div);
  });

  $('feedback').className = 'feedback';
  $('row1').style.display = 'flex';
  $('row2').style.display = 'none';
  $('btn-check').disabled = true;
  $('btn-hint').disabled  = hintUsed[current];

  if(userAnswers[current] !== null) applyResult(userAnswers[current]);

  updateProgress();
  $('btn-prev').disabled = (current === 0);
}

function selectChoice(idx){
  if(userAnswers[current] !== null) return;
  var items = $('choices-container').querySelectorAll('.choice');
  items.forEach(function(c){ c.classList.remove('selected'); });
  items[idx].classList.add('selected');
  $('choices-container').dataset.sel = idx;
  $('btn-check').disabled = false;
}

function checkAnswer(){
  var sel = parseInt($('choices-container').dataset.sel);
  if(isNaN(sel)) return;
  userAnswers[current] = sel;
  applyResult(sel);
  updateChips();
}

function applyResult(sel){
  var q       = QS[current];
  var correct = (sel === q.ans);
  var items   = $('choices-container').querySelectorAll('.choice');
  items.forEach(function(c){ c.setAttribute('aria-disabled','true'); });
  items[sel].classList.remove('selected');
  items[sel].classList.add(correct ? 'correct-c' : 'wrong-c');
  if(!correct) items[q.ans].classList.add('reveal-c');

  var fb = $('feedback');
  fb.className = 'feedback show ' + (correct ? 'ok' : 'ko');
  $('fb-icon').textContent  = correct ? '✅' : '❌';
  $('fb-title').textContent = correct ? 'Bonne réponse !' : 'Pas tout à fait…';
  $('fb-detail').textContent = correct ? q.fbOk : q.fbKo;

  $('row1').style.display = 'none';
  $('row2').style.display = 'flex';
  var isLast = (current === TOTAL - 1);
  $('btn-next').textContent = isLast ? '🏆 Voir mes résultats' : 'Suivant →';
}

function showHint(){
  var q = QS[current];
  hintUsed[current] = true;
  var hb = $('hint-box');
  hb.textContent = '💡 Indice : ' + q.hint;
  hb.className = 'hint-box show';
  $('btn-hint').disabled = true;
}

function nextQ(){
  if(current < TOTAL - 1){ current++; render(); scrollToTop(); }
  else showResults();
}
function prevQ(){ if(current > 0){ current--; render(); scrollToTop(); } }
function scrollToTop(){ window.scrollTo({ top: 0, behavior: 'smooth' }); }

function updateProgress(){
  var done = userAnswers.filter(function(a){ return a !== null; }).length;
  var pct  = Math.round(done / TOTAL * 100);
  $('prog-fill').style.width  = pct + '%';
  $('prog-label').textContent = 'Question '+(current+1)+' / '+TOTAL;
  $('prog-pct').textContent   = pct + ' %';
}

function updateChips(){
  var ok  = userAnswers.filter(function(a,i){ return a !== null && a === QS[i].ans; }).length;
  var ko  = userAnswers.filter(function(a,i){ return a !== null && a !== QS[i].ans; }).length;
  var rem = userAnswers.filter(function(a){ return a === null; }).length;
  $('cnt-ok').textContent  = ok;
  $('cnt-ko').textContent  = ko;
  $('cnt-rem').textContent = rem;
}

function showResults(){
  $('ex-card').style.display = 'none';
  $('results-screen').classList.add('show');

  var ok   = userAnswers.filter(function(a,i){ return a !== null && a === QS[i].ans; }).length;
  var pct  = ok / TOTAL;
  var stars = pct >= .9 ? 5 : pct >= .75 ? 4 : pct >= .5 ? 3 : pct >= .25 ? 2 : 1;

  $('r-score').textContent = ok;
  $('r-stars').textContent = '⭐'.repeat(stars) + '☆'.repeat(5-stars);

  var msg;
  if(pct >= .9)      msg = "Enquête brillamment résolue ! Tu repères très bien les phrases imagées et les figures de style.";
  else if(pct >= .75) msg = "Très bon travail d'enquêteur ! Tu maîtrises bien les comparaisons, exagérations et personnifications.";
  else if(pct >= .5)  msg = "Bon niveau ! Tu reconnais déjà plusieurs figures de style. La leçon va t'aider à tout consolider.";
  else if(ok > 0)     msg = "Tu es en cours d'apprentissage. Relis les corrections : tu vas vite progresser sur les figures de style.";
  else                msg = "Pas encore acquis pour le moment — pas de panique, la leçon va t'expliquer pas à pas chaque figure de style.";
  $('r-msg').textContent = msg;

  var rec = $('r-recap');
  rec.innerHTML = '';
  var lastAct = '';
  QS.forEach(function(q, i){
    if(q.activity !== lastAct){
      var sec = document.createElement('div');
      sec.className = 'recap-sec';
      sec.textContent = q.activity;
      rec.appendChild(sec);
      lastAct = q.activity;
    }
    var ua      = userAnswers[i];
    var correct = (ua !== null && ua === q.ans);
    var div     = document.createElement('div');
    div.className = 'recap-item ' + (correct ? 'ok-r' : 'ko-r');
    div.innerHTML =
      '<span style="flex-shrink:0;">'+(correct ? '✅' : '❌')+'</span>'
      +'<span class="recap-q">'+q.q+'</span>'
      +'<span class="recap-a">'+q.choices[q.ans]+'</span>';
    rec.appendChild(div);
  });

  scrollToTop();
}

function restart(){
  userAnswers = new Array(TOTAL).fill(null);
  hintUsed    = new Array(TOTAL).fill(false);
  current     = 0;
  $('ex-card').style.display = 'block';
  $('results-screen').classList.remove('show');
  updateChips();
  render();
  scrollToTop();
}

render();
updateChips();
</script>
</body>
</html>
