<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>La Rotative — Pazapa</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Arial,Helvetica,sans-serif;background:#0a1128;color:#e8ecf5;min-height:100vh;}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 50px;}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
h1{font-family:Georgia,serif;font-size:clamp(1.3rem,4.5vw,1.7rem);color:#f0b429;letter-spacing:.5px;}
.hud{display:flex;align-items:center;gap:12px;}
.score{background:#131c40;color:#f0b429;border:1.5px solid #35407a;border-radius:20px;
  padding:8px 16px;font-weight:700;font-size:.9rem;font-family:'Consolas',monospace;}
.sound{background:#131c40;border:1.5px solid #35407a;border-radius:50%;width:2.6rem;height:2.6rem;
  cursor:pointer;font-size:1.1rem;color:#f0b429;}
.scenewrap{background:#0f1838;border:1.5px solid #35407a;border-radius:16px;padding:10px;margin-bottom:16px;
  box-shadow:0 8px 24px rgba(0,0,0,.4);}
#press{width:100%;height:auto;display:block;}
.qcard{background:#fdf8ee;border-radius:14px;padding:20px 22px;box-shadow:0 8px 24px rgba(0,0,0,.3);}
.qtarget{font-family:'Consolas',monospace;font-size:.72rem;text-transform:uppercase;letter-spacing:1.5px;
  color:#b8842a;font-weight:700;margin-bottom:10px;}
.qtext{font-size:clamp(.95rem,2.6vw,1.08rem);line-height:1.7;color:#2a1a04;margin-bottom:14px;font-weight:600;}
.qcite{font-style:italic;background:#f3e6c8;border-left:3px solid #c8a44a;border-radius:0 8px 8px 0;
  padding:9px 13px;margin-bottom:14px;font-size:.95rem;color:#4a3410;}
.opts{display:grid;gap:9px;margin-bottom:8px;}
.opt{min-height:50px;background:#fff;border:1.5px solid #d8c9a0;border-radius:10px;padding:11px 15px;
  font-size:clamp(.88rem,2.4vw,.98rem);cursor:pointer;text-align:left;line-height:1.5;color:#2a1a04;
  transition:all .15s;font-family:inherit;}
.opt:hover:not(:disabled){background:#f3e6c8;border-color:#c8a44a;transform:translateX(2px);}
.opt:disabled{cursor:default;}
.opt.ok{background:#e7faec;border-color:#22c55e;color:#166534;font-weight:700;}
.opt.ko{background:#fdeaea;border-color:#ef4444;color:#991b1b;}
.feedback{margin-top:12px;padding:11px 14px;border-radius:9px;font-size:.9rem;line-height:1.65;display:none;}
.feedback.show{display:block;animation:fdin .35s ease;}
.feedback.ok{background:#e7faec;border-left:4px solid #22c55e;color:#166534;}
.feedback.ko{background:#fdeaea;border-left:4px solid #ef4444;color:#7a2018;}
@keyframes fdin{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
.chapitre{background:#131c40;color:#f0b429;font-family:'Consolas',monospace;font-size:.78rem;
  text-align:center;padding:10px;border-radius:10px;margin-bottom:14px;letter-spacing:1px;
  border:1px dashed #35407a;}
.overlay{position:fixed;inset:0;background:rgba(10,8,4,.92);display:flex;align-items:center;
  justify-content:center;z-index:100;padding:20px;}
.overlay.hide{display:none;}
#startScreen{position:fixed;inset:0;z-index:150;background:#0a1128;display:flex;align-items:center;justify-content:center;padding:16px;}
#startScreen.hide{display:none;}
#startImgWrap{position:relative;width:100%;max-width:1000px;aspect-ratio:1400/1050;margin:0 auto;
  border-radius:10px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.7);}
#startImgWrap img{width:100%;height:100%;object-fit:cover;display:block;}
#startBtnImg{position:absolute;left:32%;top:88.5%;width:34.7%;height:8%;background:transparent;border:none;cursor:pointer;}
.modal{background:#fdf8ee;border:2px solid #c8a44a;border-radius:18px;padding:30px 26px;
  max-width:460px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.5);max-height:90vh;overflow-y:auto;}
.trophy{font-size:3.2rem;}
.modal h2{margin:6px 0 8px;color:#8a5a10;font-family:Georgia,serif;}
.modal p{margin:0 0 14px;color:#4a3410;line-height:1.6;text-align:left;font-size:.92rem;}
.modal ul{text-align:left;margin:0 0 14px 20px;color:#4a3410;font-size:.9rem;line-height:1.8;}
.final{font-family:'Consolas',monospace;font-size:1.1rem;color:#8a5a10;margin-bottom:14px;font-weight:700;}
.replay{background:#c8a44a;color:#241c0c;border:none;border-radius:10px;padding:13px 24px;
  font-size:1.02rem;font-weight:700;cursor:pointer;min-height:2.8rem;}
.replay:hover{background:#dcbc66;}
.startbtn{background:linear-gradient(135deg,#c8a44a,#8a6a2a);color:#fff;border:none;border-radius:10px;
  padding:14px 30px;font-size:1.02rem;font-weight:700;cursor:pointer;min-height:2.8rem;
  font-family:Georgia,serif;letter-spacing:.5px;}
.startbtn:hover{transform:translateY(-2px);}
@media(max-width:560px){.opts{grid-template-columns:1fr;}}
</style>
</head>

<script>
/* =========================================================

   9 questions = 2 missions (reprises mot pour mot du document)
   { question, cite?, options, answer, fb }
   ========================================================= */
const questions = [
  /* ===== MISSION 1 : L'ÉDITEUR ===== */
  {chapitre:"MISSION 1 — L'ÉDITEUR",
   question:"Au CDI, Adam cherche une place. Il aperçoit Karim et lui demande ___",
   options:[

     ": « Il reste une place à la table du fond ? »",
     "il reste une place à la table du fond."
   ],answer:0,
   fb:{ok:"Exact ! Après il lui demande, la question peut être rapportée au discours indirect avec si.",
       1:"Cette formulation conviendrait après un verbe introducteur placé juste avant les deux-points.",
       2:"Le contenu de la question est là ; il manque la structure qui relie correctement la parole au verbe demande."}},

   question:"Karim sourit et répond : ___",

  {chapitre:null,

       1:"Les mots exacts apparaissent ici, puis le verbe introducteur manque dans la phrase.",
       2:"L'idée est intéressante ; la construction du verbe peut encore gagner en précision."}},
  {chapitre:null,
   question:"Adam promet ___",
   options:[
     "« Je parlerai plus doucement. »",
     "qu'il parlera plus doucement.",
     "il parlera plus doucement."
   ],answer:1,
   fb:{ok:"Exact ! Le discours indirect s'intègre bien à la phrase.",
       0:"Cette version conviendrait après Adam promet :.",
       2:"Le contenu est juste ; le lien avec le verbe promet demande un mot introducteur."}},
  {chapitre:null,
   question:"Quelle version complète est la plus fluide et la plus correcte ?",
   options:[
     "Au CDI, Adam demande s'il reste une place à la table du fond. Karim répond : « Tu peux t'installer ici ! » Le documentaliste s'approche et rappelle que le calme aide chacun à lire. Adam promet qu'il parlera plus doucement.",

   fb:{ok:"Bravo ! Le texte alterne correctement discours indirect et discours direct, avec une ponctuation claire.",

   question:"Le capitaine annonce : qu'ils partiront demain.\nChoisis la meilleure correction.",

     "Le capitaine annonce qu'ils partiront demain.",
     "Le capitaine annonce : « qu'ils partiront demain. »",
     "Le capitaine annonce : ils partiront demain."

const N=questions.length;
let opened=0, busy=false;
const $=id=>document.getElementById(id);

/* ---- Construire la presse SVG (s'adapte à N) ---- */
function buildPress(){
  const svg=$('press');
  let s='';
  s+='<rect width="700" height="260" fill="#1c140d"/>';
  // corps de la presse
  s+='<rect x="40" y="70" width="140" height="120" rx="8" fill="#1c2b5e" stroke="#f0b429" stroke-width="2"/>';
  s+='<circle cx="110" cy="100" r="22" fill="#0f1838" stroke="#f0b429" stroke-width="2"/>';
  s+='<circle cx="110" cy="100" r="8" fill="#f0b429"/>';
  s+='<text x="110" y="175" text-anchor="middle" fill="#e8c468" font-family="Consolas,monospace" font-size="11">ROTATIVE</text>';
  // rouleau
  s+='<rect x="180" y="110" width="30" height="20" rx="4" fill="#35407a"/>';
  // convoyeur de pages
  const startX=230, gap=Math.min(48,(700-startX-30)/N);
  for(let i=0;i<N;i++){
    const x=startX+i*gap;
    s+='<g id="page'+i+'">';
    s+='<rect x="'+x+'" y="90" width="'+(gap-8)+'" height="60" rx="3" fill="#f3e6c8" stroke="#8a6a2a" stroke-width="1.5" opacity="0.35"/>';
    s+='<g id="pageInk'+i+'" opacity="0">';
    s+='<line x1="'+(x+4)+'" y1="100" x2="'+(x+gap-12)+'" y2="100" stroke="#3a2c18" stroke-width="1.5"/>';
    s+='<line x1="'+(x+4)+'" y1="108" x2="'+(x+gap-16)+'" y2="108" stroke="#3a2c18" stroke-width="1.5"/>';
    s+='<line x1="'+(x+4)+'" y1="116" x2="'+(x+gap-12)+'" y2="116" stroke="#3a2c18" stroke-width="1.5"/>';
    s+='<circle cx="'+(x+gap-16)+'" cy="132" r="7" fill="#22c55e"/>';
    s+='<text x="'+(x+gap-16)+'" y="136" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">✓</text>';
    s+='</g></g>';
  }
  s+='<text x="465" y="220" text-anchor="middle" fill="#8a6a2a" font-family="Consolas,monospace" font-size="10">SORTIE PAPIER</text>';
  svg.innerHTML=s;
}
function printPage(i){
  const el=$('pageInk'+i);
  if(el)el.setAttribute('opacity','1');
}

function loadQuestion(){
  busy=false;
  if(opened>=N){ endGame(); return; }
  const q=questions[opened];
  $('qtarget').textContent='Page '+(opened+1)+' / '+N;
  $('chapitreWrap').innerHTML = q.chapitre ? '<div class="chapitre">'+q.chapitre+'</div>' : '';
  $('qtext').innerHTML = q.question.replace(/\n/g,'<br>');
  const oldCite=document.querySelector('.qcite'); if(oldCite)oldCite.remove();
  if(q.cite){
    $('qtext').insertAdjacentHTML('afterend','<div class="qcite">'+q.cite+'</div>');
  }
  const opts=$('opts'); opts.innerHTML='';
  q.options.forEach((txt,idx)=>{
    const b=document.createElement('button');
    b.className='opt'; b.textContent=txt;
    b.addEventListener('click',()=>answer(idx,b));
    opts.appendChild(b);
  });
  const fb=$('feedback'); fb.textContent=''; fb.className='feedback';
}

function answer(idx,btn){
  if(busy) return;
  const q=questions[opened];
  busy=true;
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  const fb=$('feedback');
  if(idx===q.answer){
    btn.classList.add('ok');
    fb.textContent=q.fb.ok; fb.className='feedback ok show';
    reveal();
    printPage(opened);
    opened++; updateHud();
    if(opened>=N){ fanf(); setTimeout(endGame,1500); }
    else setTimeout(loadQuestion,1300);
  } else {
    btn.classList.add('ko');
    fb.textContent=q.fb[idx]||"Ce n'est pas la meilleure formulation ici.";
    fb.className='feedback ko show';
    deny();
    setTimeout(()=>{
      document.querySelectorAll('.opt').forEach(b=>{b.disabled=false;b.classList.remove('ko');});
      busy=false;
      fb.className='feedback';
    },2200);
  }
}
function updateHud(){ $('score').textContent=opened; }
function endGame(){
  const ov=$('overlay');
  ov.querySelector('.modal').innerHTML =
    '<div class="trophy">🏆</div>'
    +'<h2>Édition bouclée !</h2>'
    +'<div class="final">'+opened+' / '+N+' pages imprimées</div>'
    +'<p><b>Bilan à retenir :</b><br>'
    +'Les paroles rapportées peuvent prendre plusieurs formes.<br>'
    +'Le choix entre discours direct, discours indirect et récit de paroles dépend de l\'effet recherché.<br>'
    +'La ponctuation et les mots introducteurs aident à reconnaître la forme utilisée.</p>'
    +'<p><b>🏆 Mission accomplie ! Tu sais désormais :</b></p>'
    +'<ul>'
    +'<li>reconnaître les différentes formes de paroles rapportées ;</li>'
    +'<li>distinguer le discours direct du discours indirect ;</li>'
    +'<li>identifier leurs principaux indices ;</li>'
    +'<li>choisir la formulation la plus adaptée selon la situation.</li>'
    +'</ul>'
    +'<button class="replay" onclick="rejouer()">🔄 Rejouer</button>';
  ov.classList.remove('hide');
}
function rejouer(){
  opened=0; updateHud(); buildPress();
  $('overlay').classList.add('hide');
  loadQuestion();
}
function startGame(){
  $('startScreen').classList.add('hide');
  initA();
  loadQuestion();
}

/* ---- Son ---- */
let actx=null, son=true;
function initA(){ if(actx) return; try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
function beep(f1,f2,d,type,vol){
  if(!actx||!son) return;
  const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;
  o.type=type||'sine'; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol||0.15,t+0.01); g.gain.exponentialRampToValueAtTime(0.0008,t+d);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d+0.02);
}
function reveal(){ initA(); beep(680,1020,0.22,'sine',0.13); }
function deny(){ initA(); beep(160,90,0.22,'sawtooth',0.11); }
function fanf(){ initA(); beep(523,659,0.25,'sine',0.14); setTimeout(()=>beep(659,880,0.3,'sine',0.13),130); setTimeout(()=>beep(880,1046,0.35,'sine',0.13),280); }

  son=!son; initA(); if(actx&&actx.state==='suspended') actx.resume();
  $('soundBtn').textContent=son?'🔊':'🔇';
});
document.addEventListener('pointerdown',initA,{once:true});
