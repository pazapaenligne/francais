<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pazapa – J'observe et je teste – S2 J2 – 5e</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --day:#f28b82;--day-color:#f28b82;--day-dark:#b94040;--day-dark2:#7a1f1f;
  --day-light:#fff0ef;--day-border:#f9c0bb;--day-glow:rgba(185,64,64,.25);
  --bg:#fffdf7;--surface:#ffffff;--surface2:#fff7f6;--border:#e8e4d9;
  --yellow:#f5c518;--green:#8dc63f;--green-light:#f0faeb;--green-dark:#3d7a10;
  --pink:#f28b82;--pink-light:#fff0ef;--pink-dark:#c0392b;
  --orange:#f5a623;--blue:#3ab5d8;
  --text:#1a1d23;--muted:#8a8f9a;
  --radius:16px;--radius-sm:10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:1.5rem .75rem 3rem;overflow-x:hidden;-webkit-tap-highlight-color:transparent;}
.wrap{width:100%;max-width:660px;}
body::before{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;
  width:340px;height:340px;background:var(--yellow);top:-80px;right:-80px;pointer-events:none;}
body::after{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.13;
  width:260px;height:260px;background:var(--day);bottom:-60px;left:-60px;pointer-events:none;}
.bubble1{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:180px;height:180px;
  background:var(--green);bottom:120px;right:-40px;pointer-events:none;}
.bubble2{position:fixed;border-radius:50%;z-index:0;opacity:.10;width:120px;height:120px;
  background:var(--pink);top:200px;left:-30px;pointer-events:none;}

header{text-align:center;margin-bottom:1.4rem;position:relative;z-index:1;}
.logo-badge{display:inline-flex;align-items:center;gap:.5rem;background:var(--yellow);
  color:#000;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:.3rem .9rem;border-radius:99px;margin-bottom:.5rem;white-space:nowrap;}
.logo-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0;}
.week-label{font-family:'JetBrains Mono',monospace;font-size:.82rem;color:var(--muted);margin-bottom:.4rem;}
h1{font-size:clamp(1.2rem,4vw,1.9rem);font-weight:900;line-height:1.25;}
h1 .hl{color:var(--day-dark);}

.prog-wrap{width:100%;margin-bottom:.8rem;position:relative;z-index:1;}
.prog-info{display:flex;justify-content:space-between;font-size:.73rem;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:.3rem;}
.prog-bg{background:var(--border);border-radius:99px;height:7px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--day-dark),var(--day));border-radius:99px;transition:width .5s ease;width:0%;}
.chips{display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap;position:relative;z-index:1;}
.chip{display:flex;align-items:center;gap:.35rem;padding:.25rem .65rem;border-radius:99px;font-size:.74rem;font-family:'JetBrains Mono',monospace;border:1.5px solid var(--border);background:var(--surface);font-weight:600;white-space:nowrap;}
.chip .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}

.card{background:var(--surface);border:1.5px solid #e0ddd5;border-radius:var(--radius);
  padding:0 0 1.4rem;box-shadow:0 6px 28px rgba(0,0,0,.07);
  animation:fadeUp .35s ease both;margin-bottom:1.6rem;overflow:hidden;position:relative;z-index:1;}
.card-stripe{height:4px;background:linear-gradient(90deg,var(--day-dark),var(--day),var(--yellow),var(--day-dark));}
.card-body{padding:1.3rem 1.3rem 0;}
.ex-num{font-size:.68rem;font-family:'JetBrains Mono',monospace;color:var(--muted);margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.1em;}
.theme-badge{display:inline-block;font-size:.63rem;font-weight:800;padding:.15rem .6rem;border-radius:99px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:.75rem;background:var(--day-light);color:var(--day-dark);border:1.5px solid var(--day-border);white-space:nowrap;}
.observe-box{background:var(--day-light);border:2px solid var(--day-border);border-left:4px solid var(--day-dark);border-radius:var(--radius-sm);padding:.8rem 1.1rem;margin-bottom:1rem;font-size:clamp(.95rem,2.6vw,1.05rem);font-weight:700;color:var(--day-dark2);font-family:'JetBrains Mono',monospace;line-height:1.9;word-break:break-word;}
.observe-label{font-size:.65rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:.3rem;display:block;}
.q-text{font-size:clamp(.92rem,2.5vw,1rem);font-weight:700;color:var(--text);margin-bottom:.9rem;line-height:1.65;}

.choices{display:flex;flex-direction:column;gap:.45rem;margin-bottom:.3rem;}
.choice-btn{background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:clamp(.9rem,2.4vw,.98rem);font-weight:600;padding:.65rem 1rem;cursor:pointer;transition:background .12s,border-color .12s;min-height:46px;-webkit-tap-highlight-color:transparent;font-family:Arial,Helvetica,sans-serif;text-align:left;display:flex;align-items:center;gap:.65rem;word-break:break-word;line-height:1.5;}
.choice-btn:hover:not(:disabled){background:var(--day-light);border-color:var(--day);}
.choice-btn:disabled{cursor:default;}
.choice-letter{width:26px;height:26px;border-radius:50%;flex-shrink:0;min-width:26px;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:800;font-family:'JetBrains Mono',monospace;background:var(--border);color:var(--text);}
.choice-btn.selected{background:var(--day-light);border-color:var(--day-dark);}
.choice-btn.selected .choice-letter{background:var(--day-dark);color:#fff;}
.choice-btn.correct-ans{border-color:var(--green)!important;background:var(--green-light)!important;color:var(--green-dark)!important;}
.choice-btn.correct-ans .choice-letter{background:var(--green);color:#fff;}
.choice-btn.wrong-ans{border-color:var(--pink-dark)!important;background:var(--pink-light)!important;color:var(--pink-dark)!important;}
.choice-btn.wrong-ans .choice-letter{background:var(--pink-dark);color:#fff;}

/* DRAG ACT6 */
.drag-bank{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.8rem;padding:.65rem;background:var(--surface2);border:1.5px dashed var(--border);border-radius:var(--radius-sm);min-height:48px;}
.drag-chip{background:var(--day-light);border:2px solid var(--day-border);border-radius:8px;padding:.35rem .8rem;font-size:.9rem;font-weight:700;color:var(--day-dark2);cursor:grab;user-select:none;-webkit-user-select:none;font-family:'JetBrains Mono',monospace;white-space:nowrap;-webkit-tap-highlight-color:transparent;}
.drag-chip:active{cursor:grabbing;}
.drag-chip.chip-ok{background:#d4edda;border-color:var(--green);color:var(--green-dark);cursor:default;}
.drag-chip.chip-ko{background:#ffe0de;border-color:var(--pink-dark);color:var(--pink-dark);cursor:default;}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:.5rem;}
.col-box{background:var(--surface2);border:2px solid var(--border);border-radius:var(--radius-sm);padding:.5rem .4rem;min-height:80px;}
.col-title{font-size:.73rem;font-weight:800;color:var(--day-dark);text-align:center;margin-bottom:.4rem;text-transform:uppercase;letter-spacing:.04em;font-family:'JetBrains Mono',monospace;line-height:1.4;}
.col-drop{min-height:48px;display:flex;flex-wrap:wrap;gap:.3rem;justify-content:center;align-items:flex-start;padding:.2rem;}
.col-drop .drag-chip{font-size:.78rem;padding:.3rem .55rem;}
.col-box.drag-over{border-color:var(--day-dark);background:var(--day-light);}

/* POPUP ACT8 */
.popup-box{display:none;background:var(--day-light);border:2px solid var(--day-border);border-radius:var(--radius-sm);padding:.9rem 1rem;margin-top:.8rem;font-size:.92rem;line-height:1.8;color:var(--day-dark2);}
.popup-box.show{display:block;animation:fadeUp .25s ease both;}
.popup-item{display:flex;gap:.5rem;align-items:flex-start;margin-bottom:.4rem;font-size:.9rem;}
.popup-item:last-child{margin-bottom:0;}

.btn-row{display:flex;gap:.55rem;flex-wrap:wrap;margin:1rem 1.3rem 0;}
@media(max-width:479px){.btn-row{flex-direction:column;}.btn-row .btn{width:100%;justify-content:center;}}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.65rem 1.2rem;border-radius:var(--radius-sm);font-family:Arial,Helvetica,sans-serif;font-size:clamp(.88rem,2.5vw,.97rem);font-weight:800;cursor:pointer;border:none;transition:transform .12s,box-shadow .14s;min-height:2.8rem;-webkit-tap-highlight-color:transparent;}
.btn:active{transform:scale(.96);}
.btn:disabled{opacity:.35;cursor:default;transform:none!important;}
.btn-primary{background:var(--day-dark);color:#fff;box-shadow:0 3px 12px var(--day-glow);flex:1;}
.btn-primary:hover:not(:disabled){transform:translateY(-1px);}
.btn-ghost{background:transparent;color:var(--muted);border:1.5px solid var(--border);}
.btn-ghost:hover:not(:disabled){border-color:var(--day-dark);color:var(--text);}

.feedback{margin-top:1rem;padding:.85rem 1rem;border-radius:var(--radius-sm);font-size:clamp(.87rem,2.4vw,.97rem);display:none;align-items:flex-start;gap:.6rem;line-height:1.75;margin-left:1.3rem;margin-right:1.3rem;word-break:break-word;}
.feedback.show{display:flex;}
.feedback.ok{background:var(--green-light);border:1.5px solid var(--green);color:var(--green-dark);}
.feedback.ko{background:var(--pink-light);border:1.5px solid var(--pink-dark);color:var(--pink-dark);}
.feedback.mid{background:var(--day-light);border:1.5px solid var(--day-border);color:var(--day-dark2);}
.fb-icon{font-size:1.3rem;flex-shrink:0;}
.fb-title{font-weight:800;margin-bottom:.2rem;}
.fb-det{font-family:'JetBrains Mono',monospace;font-size:.82rem;margin-top:.2rem;line-height:1.85;}

.results{display:none;position:relative;z-index:1;animation:fadeUp .4s ease both;}
.results.show{display:block;}
.results-card{background:var(--surface);border:1.5px solid #e0ddd5;border-radius:var(--radius);padding:2rem 1.4rem;box-shadow:0 6px 28px rgba(0,0,0,.07);text-align:center;position:relative;overflow:hidden;}
.results-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--day-dark),var(--day),var(--yellow),var(--day-dark));}
.score-big{font-size:clamp(2.8rem,10vw,4.5rem);font-weight:900;line-height:1;margin:.6rem 0 .3rem;color:var(--day-dark);}
.stars{font-size:1.9rem;margin:.4rem 0 .8rem;letter-spacing:.1em;}
.r-msg{color:var(--muted);font-size:clamp(.88rem,2.5vw,1rem);margin-bottom:1rem;line-height:1.8;}
.recap{text-align:left;display:flex;flex-direction:column;gap:.4rem;margin-bottom:1.4rem;}
.recap-item{display:flex;align-items:center;gap:.6rem;padding:.45rem .85rem;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:.8rem;font-family:'JetBrains Mono',monospace;}
.recap-item.ok-r{border-color:#b5e08a;}
.recap-item.ko-r{border-color:#f9c0bb;}

.fb-memo{margin-top:1rem;padding:1rem 1.1rem;border-radius:var(--radius-sm);
  display:none;line-height:1.85;word-break:break-word;
  background:#fff0ef;border:2.5px solid var(--day-dark);border-left:5px solid var(--day-dark);}
.fb-memo.show{display:block;animation:fadeUp .3s ease both;}
.fb-memo-title{font-family:'JetBrains Mono',monospace;font-size:.72rem;font-weight:800;
  color:var(--day-dark);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:.7rem;}
.fb-memo p{font-size:clamp(.92rem,2.5vw,1rem);color:var(--text);margin-bottom:.5rem;line-height:1.85;}
.fb-memo p:last-child{margin-bottom:0;}
.fb-memo strong{color:var(--day-dark);}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:500px){.card-body{padding:1.1rem 1rem 0;}.btn-row{margin:1rem 1rem 0;}.feedback{margin-left:1rem;margin-right:1rem;}}
</style>
</head>
<body>
<div class="bubble1"></div><div class="bubble2"></div>
<div class="wrap">

<header>
  <div class="logo-badge">
    <span class="logo-dot" style="background:#e8002d"></span>
    <span class="logo-dot" style="background:#8dc63f"></span>
    <span class="logo-dot" style="background:#3ab5d8"></span>
    Pazapa · Français · 5ème
  </div>
  <div class="week-label">Semaine 2 – Jour 2</div>
  <h1>J'observe et je teste · <span class="hl">Les adjectifs</span></h1>
</header>

<div class="prog-wrap">
  <div class="prog-info">
    <span id="prog-label">0 / 8 activités</span>
    <span id="prog-pct">0 %</span>
  </div>
  <div class="prog-bg"><div class="prog-fill" id="prog-fill"></div></div>
</div>
<div class="chips">
  <div class="chip"><div class="dot" style="background:#8dc63f"></div><span id="cnt-ok">0</span> correct(s)</div>
  <div class="chip"><div class="dot" style="background:#f28b82"></div><span id="cnt-ko">0</span> erreur(s)</div>
  <div class="chip"><div class="dot" style="background:#8a8f9a"></div><span id="cnt-rem">14</span> pts restants</div>
</div>

<div id="cards-zone"></div>

<div class="results" id="results-screen">
  <div class="results-card">
    <div class="logo-badge" style="margin-bottom:.6rem;">
      <span class="logo-dot" style="background:#e8002d"></span>
      <span class="logo-dot" style="background:#8dc63f"></span>
      <span class="logo-dot" style="background:#3ab5d8"></span>
      Résultats
    </div>
    <div class="score-big"><span id="r-score">0</span>/14</div>
    <div class="stars" id="r-stars"></div>
    <div class="r-msg" id="r-msg"></div>
    <div class="recap" id="r-recap"></div>
    <button class="btn btn-primary" onclick="restartAll()" style="width:100%;justify-content:center;">↺ Recommencer</button>
  </div>
</div>

</div>
<script>
var $ = function(id){ return document.getElementById(id); };

/* ══ DONNÉES ══ */
var QCM = {
  1:{q:'Quel mot pourrait compléter la phrase ?',obs:'Un chevalier ______ avance sur le chemin.',opts:['courageux','courageusement','courage','courageuxement'],ans:0,fbOk:'Exact ! <em>Courageux</em> est un adjectif qualificatif : il s\'accorde avec le nom <em>chevalier</em>.',fbKo:'La bonne réponse est A. <em>Courageusement</em> est un adverbe, <em>courage</em> est un nom. Seul <em>courageux</em> est un adjectif qui peut compléter un nom.'},
  2:{q:'Quel mot n\'est PAS un adjectif qualificatif ?',obs:null,opts:['imposant','prudent','rapidement','courageux'],ans:2,fbOk:'Exact ! <em>Rapidement</em> est un adverbe, pas un adjectif : il ne s\'accorde pas et ne qualifie pas un nom.',fbKo:'La bonne réponse est C. <em>Rapidement</em> est un adverbe : il précise un verbe, pas un nom.'},
  3:{q:'Quel est l\'adjectif qualificatif dans cette phrase ?',obs:'Le vieux château domine la vallée.',opts:['Le','vieux','château','domine'],ans:1,fbOk:'Exact ! <em>Vieux</em> est un adjectif épithète : il est directement lié au nom <em>château</em>.',fbKo:'La bonne réponse est B. <em>Vieux</em> qualifie le nom <em>château</em> — c\'est un adjectif épithète.'},
  4:{q:'Dans quelle phrase l\'adjectif est-il directement attaché au nom ?',obs:'1. Le chevalier courageux avance.\n2. Le chevalier semble courageux.',opts:['Phrase 1','Phrase 2'],ans:0,fbOk:'Exact ! Dans la phrase 1, <em>courageux</em> est épithète : il est dans le groupe nominal, directement lié au nom.',fbKo:'La bonne réponse est A. Dans la phrase 1, <em>courageux</em> est épithète (dans le GN). Dans la phrase 2, il est attribut du sujet (relié par <em>semble</em>).'},
  5:{q:'Quel adjectif ajoute une information sur l\'armure ?',obs:'Une armure robuste protège le combattant.',opts:['robuste','protège','combattant','une'],ans:0,fbOk:'Exact ! <em>Robuste</em> est un adjectif épithète qui qualifie le nom <em>armure</em>.',fbKo:'La bonne réponse est A. <em>Robuste</em> qualifie <em>armure</em> — c\'est un adjectif épithète.'},
  7:{q:'Dans cette phrase, quel mot l\'adjectif <em>immense</em> décrit-il ?',obs:'Le vieux château, depuis les remparts, paraît immense et menaçant.',opts:['les remparts','le vieux château','paraît','menaçant'],ans:1,fbOk:'Exact ! <em>Immense</em> est attribut du sujet : il décrit <em>le château</em> grâce au verbe d\'état <em>paraît</em>.',fbKo:'La bonne réponse est A. <em>Immense</em> est attribut du sujet : il décrit <em>le château</em>, relié par le verbe d\'état <em>paraît</em>.'}
};

var DRAG6 = {
  words: [{w:'sombre',cat:1},{w:'courageux',cat:0},{w:'immense',cat:1},{w:'prudent',cat:0},{w:'robuste',cat:1},{w:'fidèle',cat:0},{w:'ancien',cat:1},{w:'noble',cat:0}],
  cols: ['Décrire un personnage','Décrire un lieu ou un objet']
};

var scores = {}; // qi -> pts
var done   = {}; // qi -> bool
var dragSrc = null;

/* ══ BUILD ══ */
function buildAll(){
  var zone = $('cards-zone'); zone.innerHTML = '';
  [1,2,3,4,5,'6',7,'8'].forEach(function(qi){ zone.appendChild(buildCard(qi)); });
}

function buildCard(qi){
  var card = document.createElement('div'); card.className = 'card'; card.id = 'card'+qi;
  var stripe = document.createElement('div'); stripe.className = 'card-stripe'; card.appendChild(stripe);
  var body = document.createElement('div'); body.className = 'card-body'; card.appendChild(body);

  var num = document.createElement('div'); num.className = 'ex-num';
  num.textContent = 'Activité ' + qi + ' / 8'; body.appendChild(num);

  var badge = document.createElement('div'); badge.className = 'theme-badge';

  if(qi === '6'){
    badge.textContent = 'Classement'; body.appendChild(badge);
    var qt = document.createElement('div'); qt.className = 'q-text';
    qt.textContent = 'Range chaque adjectif dans la bonne colonne.'; body.appendChild(qt);
    buildDrag6(body);
  } else if(qi === '8'){
    badge.textContent = 'Cherche la différence'; body.appendChild(badge);
    var obs8 = document.createElement('div'); obs8.className = 'observe-box';
    obs8.innerHTML = '<span class="observe-label">Observe</span>Phrase 1 : Le jeune chevalier avance.<br>Phrase 2 : Le chevalier paraît jeune.';
    body.appendChild(obs8);
    var qt8 = document.createElement('div'); qt8.className = 'q-text';
    qt8.textContent = 'Quelle observation est correcte ?'; body.appendChild(qt8);
    var ch8 = document.createElement('div'); ch8.className = 'choices'; ch8.id = 'ch8'; body.appendChild(ch8);
    var opts8 = [
      'Dans les deux phrases, l’adjectif <em>jeune</em> est collé au nom <em>chevalier</em> et fait partie du même groupe de mots.',
      'Dans la phrase 1, l’adjectif est collé au nom ; dans la phrase 2, il est séparé du nom par le verbe <em>paraît</em>.',
      'Dans les deux phrases, l’adjectif est séparé du nom par un verbe.'
    ];
    var letters8 = ['A','B','C'];
    opts8.forEach(function(opt,i){
      var btn = document.createElement('button'); btn.className = 'choice-btn';
      btn.innerHTML = '<span class="choice-letter">'+letters8[i]+'</span><span>'+opt+'</span>';
      btn.addEventListener('click', function(){
        if(done['8']) return;
        ch8.querySelectorAll('.choice-btn').forEach(function(b){ b.classList.remove('selected'); });
        btn.classList.add('selected');
      });
      ch8.appendChild(btn);
    });
  } else {
    var q = QCM[qi];
    var badges = {1:'Portrait incomplet',2:'Intrus recherché',3:'Où se cache l\'adjectif ?',4:'Même rôle ?',5:'Le mot qui change tout',7:'Cherche le lien'};
    badge.textContent = badges[qi]; body.appendChild(badge);
    if(q.obs){
      var obs = document.createElement('div'); obs.className = 'observe-box';
      obs.innerHTML = '<span class="observe-label">Observe</span>' + q.obs.replace(/\n/g,'<br>');
      body.appendChild(obs);
    }
    var qtext = document.createElement('div'); qtext.className = 'q-text'; qtext.innerHTML = q.q; body.appendChild(qtext);
    buildQCMEl(qi, q, body);
  }

  var fb = document.createElement('div'); fb.className = 'feedback'; fb.id = 'fb'+qi;
  fb.innerHTML = '<span class="fb-icon" id="fbi'+qi+'"></span><div><div class="fb-title" id="fbt'+qi+'"></div><div class="fb-det" id="fbd'+qi+'"></div></div>';
  card.appendChild(fb);

  var brow = document.createElement('div'); brow.className = 'btn-row';
  var vbtn = document.createElement('button'); vbtn.className = 'btn btn-primary'; vbtn.id = 'vbtn'+qi;
  vbtn.innerHTML = '✓ Vérifier';

  if(qi === '6') vbtn.addEventListener('click', function(){ verif6(); });
  else if(qi === '8') vbtn.addEventListener('click', function(){ verif8(); });
  else { (function(q2){ vbtn.addEventListener('click', function(){ verifQCM(q2); }); })(qi); }



  var rbtn = document.createElement('button'); rbtn.className = 'btn btn-ghost';
  rbtn.innerHTML = '↺';
  (function(q2){ rbtn.addEventListener('click', function(){ resetCard(q2); }); })(qi);

  brow.appendChild(vbtn); brow.appendChild(rbtn);
  card.appendChild(brow);
  if(qi === '8'){
    var memo = document.createElement('div'); memo.className = 'fb-memo'; memo.id = 'fbmemo8';
    var mLines = [
      '<div class="fb-memo-title">&#128221;&nbsp;&#192; retenir</div>',
      '<p><strong>Adjectif &#233;pith&#232;te</strong>&nbsp;: directement coll&#233; au nom dans le groupe nominal.</p>',
      '<p style="margin-left:.8rem;color:#555;font-size:.9em;">Ex.&nbsp;: Le <strong>jeune</strong> chevalier avance. &#8594; <em>jeune</em> est &#233;pith&#232;te de <em>chevalier</em>.</p>',
      '<p style="margin-top:.5rem;"><strong>Adjectif attribut du sujet</strong>&nbsp;: s&#233;par&#233; du nom par un verbe d&#8217;&#233;tat (<em>&#234;tre, para&#238;tre, sembler&#8230;</em>).</p>',
      '<p style="margin-left:.8rem;color:#555;font-size:.9em;">Ex.&nbsp;: Le chevalier para&#238;t <strong>jeune</strong>. &#8594; <em>jeune</em> est attribut du sujet <em>chevalier</em>.</p>',
      '<hr style="border:none;border-top:1.5px solid #f9c0bb;margin:.8rem 0;"/>',
      '<p style="color:var(--day-dark);font-weight:800;">&#9658;&nbsp;Rendez-vous &#224; la prochaine &#233;tape du parcours pour visionner une vid&#233;o et comprendre ce point plus en d&#233;tail.</p>'
    ];
    memo.innerHTML = mLines.join('');
    card.appendChild(memo);
  }
  return card;
}

function buildQCMEl(qi, q, body){
  var ch = document.createElement('div'); ch.className = 'choices'; ch.id = 'ch'+qi; body.appendChild(ch);
  var letters = ['A','B','C','D'];
  q.opts.forEach(function(opt,i){
    var btn = document.createElement('button'); btn.className = 'choice-btn';
    btn.innerHTML = '<span class="choice-letter">'+letters[i]+'</span><span>'+opt+'</span>';
    btn.addEventListener('click', function(){
      if(done[qi]) return;
      ch.querySelectorAll('.choice-btn').forEach(function(b){ b.classList.remove('selected'); });
      btn.classList.add('selected');
    });
    ch.appendChild(btn);
  });
}

function buildDrag6(body){
  var bank = document.createElement('div'); bank.className = 'drag-bank'; bank.id = 'bank6'; body.appendChild(bank);
  shuffle(DRAG6.words).forEach(function(v){ bank.appendChild(makeChip(v.w)); });
  var grid = document.createElement('div'); grid.className = 'cols2'; body.appendChild(grid);
  DRAG6.cols.forEach(function(col,ci){
    var box = document.createElement('div'); box.className = 'col-box'; box.dataset.col = ci;
    var title = document.createElement('div'); title.className = 'col-title'; title.textContent = col;
    var drop = document.createElement('div'); drop.className = 'col-drop'; drop.id = 'drop6_'+ci; drop.dataset.col = ci;
    drop.addEventListener('dragover', function(e){ e.preventDefault(); box.classList.add('drag-over'); });
    drop.addEventListener('dragleave', function(){ box.classList.remove('drag-over'); });
    drop.addEventListener('drop', function(e){ e.preventDefault(); box.classList.remove('drag-over'); if(dragSrc && !done['6']) doDropChip(dragSrc, drop); });
    drop.addEventListener('touchend', function(e){
      if(!dragSrc||done['6']) return;
      var t=e.changedTouches[0]; var el=document.elementFromPoint(t.clientX,t.clientY);
      var target=el?el.closest('.col-drop'):null;
      if(target) doDropChip(dragSrc, target); dragSrc=null;
    });
    box.appendChild(title); box.appendChild(drop); grid.appendChild(box);
  });
}

function makeChip(w){
  var chip = document.createElement('div'); chip.className = 'drag-chip'; chip.textContent = w; chip.dataset.word = w;
  chip.draggable = true;
  chip.addEventListener('dragstart', function(e){ dragSrc = chip; e.dataTransfer.effectAllowed = 'move'; });
  chip.addEventListener('touchstart', function(){ dragSrc = chip; },{passive:true});
  return chip;
}

function doDropChip(chip, drop){
  if(chip.parentElement) chip.parentElement.removeChild(chip);
  drop.appendChild(chip); dragSrc = null;
}

/* ══ VÉRIFICATION ══ */
function verifQCM(qi){
  if(done[qi]) return; done[qi] = true; $('vbtn'+qi).disabled = true;
  var q = QCM[qi]; var btns = $('ch'+qi).querySelectorAll('.choice-btn'); var sel = -1;
  btns.forEach(function(b,i){ if(b.classList.contains('selected')) sel = i; });
  var ok = (sel === q.ans);
  btns.forEach(function(b,i){
    b.disabled = true; b.classList.remove('selected');
    if(i === q.ans) b.classList.add('correct-ans');
    else if(i === sel && !ok) b.classList.add('wrong-ans');
  });
  scores[qi] = ok ? 1 : 0;
  showFb(qi, ok ? 'ok' : 'ko', ok ? '✅' : '❌', ok ? 'Exact !' : 'Pas tout à fait.', ok ? q.fbOk : q.fbKo);
  updateGlobal(); checkAllDone();
}

function verif6(){
  if(done['6']) return; done['6'] = true; $('vbtn6').disabled = true;
  var pts = 0;
  document.querySelectorAll('#cards-zone .drag-chip').forEach(function(chip){
    var w = chip.dataset.word;
    var d = DRAG6.words.find(function(v){ return v.w === w; });
    var col = chip.parentElement ? parseInt(chip.parentElement.dataset.col) : -1;
    chip.draggable = false;
    if(col === d.cat){ chip.classList.add('chip-ok'); pts++; }
    else { chip.classList.add('chip-ko'); }
  });
  scores['6'] = pts;
  var ok = pts >= 7;
  showFb('6', ok ? 'ok' : pts >= 4 ? 'mid' : 'ko',
    ok ? '✅' : pts >= 3 ? '→' : '❌',
    ok ? 'Excellent !' : pts >= 4 ? 'Bien !' : 'À retravailler.',
    pts + ' / 8 mots bien classés. Personnage : <em>courageux, prudent, fidèle, noble</em>. Lieu/objet : <em>sombre, immense, robuste, ancien</em>.');
  updateGlobal(); checkAllDone();
}

function verif8(){
  if(done['8']) return; done['8'] = true; $('vbtn8').disabled = true;
  var btns = $('ch8').querySelectorAll('.choice-btn'); var sel = -1;
  btns.forEach(function(b,i){ if(b.classList.contains('selected')) sel = i; });
  var ans = 1;
  var ok = (sel === ans);
  btns.forEach(function(b,i){
    b.disabled = true; b.classList.remove('selected');
    if(i === ans) b.classList.add('correct-ans');
    else if(i === sel && !ok) b.classList.add('wrong-ans');
  });
  scores['8'] = ok ? 1 : 0;
  showFb('8', ok ? 'ok' : 'ko', ok ? '✅' : '❌',
    ok ? 'Exact !' : 'Pas tout à fait.',
    ok ? 'Dans la phrase 1, <em>jeune</em> est collé directement au nom : on l’appelle épithète. Dans la phrase 2, il est séparé du nom par le verbe <em>paraît</em> : on l’appelle attribut du sujet.'
       : 'La bonne réponse est B. Dans la phrase 1, <em>jeune</em> est collé au nom (on dit épithète). Dans la phrase 2, il est séparé du nom par le verbe <em>paraît</em> (on dit attribut du sujet).');
  var memo8 = $('fbmemo8'); if(memo8) memo8.classList.add('show');
  updateGlobal(); checkAllDone();
}

function resetCard(qi){
  done[qi] = false; scores[qi] = undefined;
  $('fb'+qi).className = 'feedback';
  if(QCM[qi]){
    $('ch'+qi).querySelectorAll('.choice-btn').forEach(function(b){
      b.disabled = false; b.classList.remove('selected','correct-ans','wrong-ans');
    });
  } else if(qi === '6'){
    var body = $('card6').querySelector('.card-body'); body.innerHTML = '';
    $('card6').querySelector('.ex-num').textContent = 'Activité 6 / 8';
    buildDrag6(body);
  } else if(qi === '8'){
    var ch8r = $('ch8');
    if(ch8r) ch8r.querySelectorAll('.choice-btn').forEach(function(b){ b.disabled=false; b.classList.remove('selected','correct-ans','wrong-ans'); });
    var memo8r = $('fbmemo8'); if(memo8r) memo8r.classList.remove('show');
  }
  updateGlobal();
}

function showFb(qi, cls, icon, title, det){
  var fb = $('fb'+qi); fb.className = 'feedback show ' + cls;
  $('fbi'+qi).textContent = icon;
  $('fbt'+qi).textContent = title;
  $('fbd'+qi).innerHTML = det;
}

function scrollTo(qi){ var card = $('card'+qi); if(card) card.scrollIntoView({behavior:'smooth',block:'start'}); }

function shuffle(a){ var b=a.slice(); for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;} return b; }

function updateGlobal(){
  var qis = [1,2,3,4,5,'6',7,'8'];
  var totalPts = 0, earnedPts = 0, doneCnt = 0;
  qis.forEach(function(qi){
    var max = (qi === '6') ? 8 : 1;
    totalPts += max;
    if(done[qi]){ doneCnt++; earnedPts += (scores[qi] || 0); }
  });
  var rem = totalPts - earnedPts;
  $('cnt-ok').textContent = earnedPts;
  $('cnt-ko').textContent = doneCnt > 0 ? Math.max(0, (doneCnt <= 7 ? doneCnt : 7) - earnedPts + (scores['6']!==undefined ? 6-scores['6'] : 0)) : 0;
  $('cnt-rem').textContent = rem;
  var pct = Math.round(doneCnt / 8 * 100);
  $('prog-fill').style.width = pct + '%';
  $('prog-label').textContent = doneCnt + ' / 8 activités';
  $('prog-pct').textContent = pct + ' %';
}

function checkAllDone(){
  var qis = [1,2,3,4,5,'6',7,'8'];
  if(qis.every(function(qi){ return done[qi]; })) setTimeout(showResults, 500);
}

function showResults(){
  var total = [1,2,3,4,5,'6',7,'8'].reduce(function(acc,qi){ return acc + (scores[qi]||0); }, 0);
  $('r-score').textContent = total;
  var s = total>=13?5:total>=10?4:total>=7?3:total>=4?2:1;
  $('r-stars').textContent = '⭐'.repeat(s)+'☆'.repeat(5-s);
  var msgs=['À retravailler — reprends les activités !','Courage — tu progresses !','Pas mal — quelques points à revoir.','Très bien ! Tu maîtrises les adjectifs.','Parfait ! Tu distingues épithète et attribut.'];
  $('r-msg').textContent = msgs[s-1];
  var recap = $('r-recap'); recap.innerHTML = '';
  var labels=['Portrait incomplet','Intrus recherché','Où se cache l\'adjectif ?','Même rôle ?','Le mot qui change tout','Classement ('+( scores['6']||0)+'/6)','Cherche le lien','Cherche la différence'];
  [1,2,3,4,5,'6',7,'8'].forEach(function(qi,i){
    var pts = scores[qi]||0;
    var max = (qi==='6')?8:1;
    var ok2 = pts>=max;
    var d = document.createElement('div'); d.className='recap-item '+(ok2?'ok-r':'ko-r');
    d.innerHTML='<span>'+(ok2?'✅':pts>0?'→':'❌')+'</span><span style="flex:1;color:#8a8f9a;">Act.'+qi+' — '+labels[i]+'</span><span style="color:var(--day-dark);font-weight:700;">'+pts+'/'+max+'</span>';
    recap.appendChild(d);
  });
  $('results-screen').classList.add('show');
  window.scrollTo({top:0,behavior:'smooth'});
}

function restartAll(){
  scores={}; done={};
  $('results-screen').classList.remove('show');
  buildAll(); updateGlobal();
  window.scrollTo({top:0,behavior:'smooth'});
}

buildAll(); updateGlobal();
</script>
