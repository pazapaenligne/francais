<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Défi Conjugaison - Verbes irréguliers</title>

<style>

body{
    font-family: Arial, sans-serif;
    background-color:#fffdf7;
    background-image:
        radial-gradient(circle at 8% 15%, rgba(58,181,216,0.10) 0, rgba(58,181,216,0.10) 40px, transparent 41px),
        radial-gradient(circle at 88% 12%, rgba(58,181,216,0.08) 0, rgba(58,181,216,0.08) 55px, transparent 56px),
        radial-gradient(circle at 15% 85%, rgba(58,181,216,0.08) 0, rgba(58,181,216,0.08) 60px, transparent 61px),
        radial-gradient(circle at 92% 80%, rgba(58,181,216,0.10) 0, rgba(58,181,216,0.10) 45px, transparent 46px),
        radial-gradient(circle at 50% 95%, rgba(58,181,216,0.06) 0, rgba(58,181,216,0.06) 70px, transparent 71px),
        radial-gradient(circle at 45% 5%, rgba(58,181,216,0.06) 0, rgba(58,181,216,0.06) 35px, transparent 36px);
    background-repeat:no-repeat;
    margin:0;
    padding:20px;
    text-align:center;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 0 15px rgba(0,0,0,0.15);
}

.pop-correct{
    animation: popCorrect 0.4s ease;
}

@keyframes popCorrect{
    0%   { transform:scale(1); }
    40%  { transform:scale(1.03); box-shadow:0 0 0 6px rgba(0,184,148,0.25); }
    100% { transform:scale(1); }
}

.shake-erreur{
    animation: shakeErreur 0.4s ease;
}

@keyframes shakeErreur{
    0%   { transform:translateX(0); }
    20%  { transform:translateX(-8px); }
    40%  { transform:translateX(8px); }
    60%  { transform:translateX(-6px); }
    80%  { transform:translateX(6px); }
    100% { transform:translateX(0); }
}

.zone-etoiles{
    height:34px;
    margin-top:6px;
}

.etoile{
    display:inline-block;
    font-size:22px;
    color:#e5c417;
    opacity:0;
    animation: etoilePop 0.7s ease forwards;
}

@keyframes etoilePop{
    0%   { opacity:0; transform:translateY(6px) scale(0.6); }
    40%  { opacity:1; transform:translateY(-4px) scale(1.15); }
    70%  { opacity:1; transform:translateY(0) scale(1); }
    100% { opacity:0; transform:translateY(-10px) scale(0.9); }
}

h1{
    font-size:2.2rem;
    font-weight:900;
    letter-spacing:1px;
    margin-bottom:4px;
    background:linear-gradient(90deg, #0984e3, #00b894);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 2px 10px rgba(9,132,227,0.15);
}

p.consigne{
    color:#636e72;
    font-size:15px;
    font-style:italic;
    margin-top:6px;
}

.zone-question{
    margin-top:30px;
    font-size:28px;
    font-weight:bold;
    color:#2c3e50;
}

.verbe-cible{
    font-size:26px;
    color:#0984e3;
    font-weight:900;
    margin-top:8px;
    animation: pulseVerbe 1.2s ease-in-out infinite;
}

@keyframes pulseVerbe{
    0%   { transform:scale(1); }
    50%  { transform:scale(1.08); }
    100% { transform:scale(1); }
}

input{
    margin-top:20px;
    padding:12px;
    width:220px;
    font-size:24px;
    text-align:center;
    border-radius:10px;
    border:2px solid #ccc;
}

button{
    margin-top:20px;
    padding:12px 25px;
    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#00b894;
    color:white;
}

button:hover{
    background:#019875;
}

.resultat{
    margin-top:20px;
    font-size:22px;
    font-weight:bold;
    min-height:30px;
}

.resultat.anime{
    animation: monteFondu 1.1s ease forwards;
}

@keyframes monteFondu{
    0%   { opacity:0; transform:translateY(6px); }
    20%  { opacity:1; transform:translateY(0); }
    75%  { opacity:1; transform:translateY(-4px); }
    100% { opacity:0; transform:translateY(-16px); }
}

.score{
    margin-top:20px;
    font-size:20px;
}

.vies{
    margin-top:15px;
    font-size:22px;
    letter-spacing:6px;
}

.vies span.pleine{
    color:#00b894;
}

.vies span.vide{
    color:#dfe6e9;
}

.timer{
    display:inline-block;
    margin-top:15px;
    padding:8px 22px;
    font-size:24px;
    font-weight:900;
    letter-spacing:1px;
    color:#d63031;
    background:#fff5f5;
    border:2px solid #d63031;
    border-radius:30px;
}

.fin{
    margin-top:30px;
    font-size:26px;
    color:#0984e3;
    font-weight:bold;
}

.barre{
    width:100%;
    background:#dfe6e9;
    border-radius:20px;
    overflow:hidden;
    margin-top:20px;
    height:22px;
}

.progression{
    height:100%;
    width:0%;
    background:#00b894;
    transition:0.4s;
}

#btnRecommencer{
    display:none;
}

</style>
</head>

<body>

<div style="width:100%; box-sizing:border-box; background:#e5c417; color:#795700; font-family:Arial, sans-serif; font-weight:bold; font-size:16px; letter-spacing:3px; text-align:center; padding:10px 0; margin:-20px -20px 20px -20px;">PAZAPA</div>

<div class="container">

<h1>Défi Conjugaison</h1>

<p style="font-weight:900; text-decoration:underline; text-underline-offset:3px; color:#d63031; font-size:17px; letter-spacing:1px; margin:0;">Présent de l'indicatif</p>

<p class="consigne">Écris la forme correcte du verbe au présent de l'indicatif.</p>

<div class="timer">
Temps : <span id="temps">180</span>s
</div>

<div class="vies" id="vies">
<span class="pleine">■</span><span class="pleine">■</span><span class="pleine">■</span>
</div>

<div class="barre">
<div class="progression" id="progression"></div>
</div>

<div class="zone-question" id="question">
Il ...
</div>

<div class="verbe-cible" id="verbeCible">(verbe)</div>

<input type="text" id="reponse" autocomplete="off" placeholder="Tape ta réponse">

<br>

<button onclick="verifier()">Valider</button>

<br>

<button id="btnRecommencer" onclick="recommencer()">
Recommencer
</button>

<div class="resultat" id="resultat"></div>

<div class="zone-etoiles" id="zoneEtoiles"></div>

<div class="score">
Score : <span id="score">0</span>
</div>

<div class="fin" id="fin"></div>

</div>

<script>

const verbes = {
    "être":    { pron:["Je","Tu","Il","Nous","Vous","Ils"], formes:["suis","es","est","sommes","êtes","sont"] },
    "avoir":   { pron:["J'","Tu","Elle","Nous","Vous","Elles"], formes:["ai","as","a","avons","avez","ont"] },
    "aller":   { pron:["Je","Tu","Il","Nous","Vous","Ils"], formes:["vais","vas","va","allons","allez","vont"] },
    "faire":   { pron:["Je","Tu","Elle","Nous","Vous","Elles"], formes:["fais","fais","fait","faisons","faites","font"] },
    "pouvoir": { pron:["Je","Tu","Il","Nous","Vous","Ils"], formes:["peux","peux","peut","pouvons","pouvez","peuvent"] },
    "vouloir": { pron:["Je","Tu","Elle","Nous","Vous","Elles"], formes:["veux","veux","veut","voulons","voulez","veulent"] },
    "venir":   { pron:["Je","Tu","Il","Nous","Vous","Ils"], formes:["viens","viens","vient","venons","venez","viennent"] },
    "croire":  { pron:["Je","Tu","Elle","Nous","Vous","Elles"], formes:["crois","crois","croit","croyons","croyez","croient"] },
    "recevoir":{ pron:["Je","Tu","Il","Nous","Vous","Ils"], formes:["reçois","reçois","reçoit","recevons","recevez","reçoivent"] },
    "devoir":  { pron:["Je","Tu","Elle","Nous","Vous","Elles"], formes:["dois","dois","doit","devons","devez","doivent"] }
};

const listeVerbes = Object.keys(verbes);

let verbeActuel;
let indicePronom;
let bonneReponse;
let estRevision = false;

let erreursAmemoriser = [];

let score = 0;
let vies = 3;
let questions = 0;

let temps = 180;
let chrono;
let dejaValide = false;

function nouvelleQuestion(){

    dejaValide = false;

    if(erreursAmemoriser.length > 0 && Math.random() < 0.4){

        const item = erreursAmemoriser[Math.floor(Math.random()*erreursAmemoriser.length)];
        verbeActuel = item.verbe;
        indicePronom = item.indice;
        estRevision = true;

    }else{

        verbeActuel = listeVerbes[Math.floor(Math.random()*listeVerbes.length)];
        indicePronom = Math.floor(Math.random()*6);
        estRevision = false;
    }

    const pronom = verbes[verbeActuel].pron[indicePronom];
    bonneReponse = verbes[verbeActuel].formes[indicePronom];

    document.getElementById("question").innerHTML =
        pronom + " ... .";

    document.getElementById("verbeCible").innerHTML =
        "(" + verbeActuel + ")";

    const champ = document.getElementById("reponse");
    champ.value = "";
    champ.focus();

    let pourcentage = (questions/20)*100;

    if(pourcentage > 100){
        pourcentage = 100;
    }

    document.getElementById("progression").style.width =
        pourcentage + "%";
}

function normaliser(texte){
    return texte.trim().toLowerCase();
}

let contexteAudio;

function jouerBip(frequence, duree){

    if(!contexteAudio){
        contexteAudio = new (window.AudioContext || window.webkitAudioContext)();
    }

    const oscillateur = contexteAudio.createOscillator();
    const gain = contexteAudio.createGain();

    oscillateur.type = "sine";
    oscillateur.frequency.value = frequence;

    gain.gain.setValueAtTime(0.15, contexteAudio.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, contexteAudio.currentTime + duree);

    oscillateur.connect(gain);
    gain.connect(contexteAudio.destination);

    oscillateur.start();
    oscillateur.stop(contexteAudio.currentTime + duree);
}

function bipPositif(){
    jouerBip(880, 0.15);
    setTimeout(function(){ jouerBip(1175, 0.18); }, 130);
}

function bipNegatif(){
    jouerBip(220, 0.25);
}

const messagesPositifs = [
    "Bravo, c'est exact.",
    "Excellent !",
    "Parfait, continue ainsi.",
    "Très bien !",
    "Bonne réponse.",
    "Impeccable."
];

function afficherEtoiles(){

    const zone = document.getElementById("zoneEtoiles");
    zone.innerHTML = "";

    for(let i=0;i<3;i++){

        const etoile = document.createElement("span");
        etoile.className = "etoile";
        etoile.innerHTML = "★";
        etoile.style.animationDelay = (i*0.1) + "s";

        zone.appendChild(etoile);
    }

    setTimeout(function(){ zone.innerHTML = ""; }, 800);
}

function verifier(){

    if(dejaValide){
        return;
    }

    const champ = document.getElementById("reponse");
    const rep = champ.value;

    if(rep.trim() === ""){
        return;
    }

    dejaValide = true;

    const conteneur = document.querySelector(".container");
    conteneur.classList.remove("pop-correct","shake-erreur");
    void conteneur.offsetWidth;

    const resultat = document.getElementById("resultat");
    resultat.classList.remove("anime");
    void resultat.offsetWidth;

    if(normaliser(rep) === normaliser(bonneReponse)){

        document.getElementById("resultat").innerHTML =
            messagesPositifs[Math.floor(Math.random()*messagesPositifs.length)];

        document.getElementById("resultat").style.color =
            "#00b894";

        score++;

        if(estRevision){
            erreursAmemoriser = erreursAmemoriser.filter(function(item){
                return !(item.verbe === verbeActuel && item.indice === indicePronom);
            });
        }

        conteneur.classList.add("pop-correct");
        resultat.classList.add("anime");
        afficherEtoiles();
        bipPositif();

    }else{

        vies--;

        document.getElementById("resultat").innerHTML =
            "Incorrect. Réponse attendue : " + bonneReponse;

        document.getElementById("resultat").style.color =
            "#d63031";

        afficherVies();

        const dejaDansLeStock = erreursAmemoriser.some(function(item){
            return item.verbe === verbeActuel && item.indice === indicePronom;
        });

        if(!dejaDansLeStock){
            erreursAmemoriser.push({ verbe: verbeActuel, indice: indicePronom });
        }

        conteneur.classList.add("shake-erreur");
        resultat.classList.add("anime");
        bipNegatif();
    }

    questions++;

    document.getElementById("score").innerHTML = score;

    if(vies <= 0){
        finJeu("Partie terminée.");
        return;
    }

    setTimeout(nouvelleQuestion, 1200);
}

function afficherVies(){

    let affichage = "";

    for(let i=0;i<vies;i++){
        affichage += '<span class="pleine">■</span>';
    }

    for(let i=vies;i<3;i++){
        affichage += '<span class="vide">■</span>';
    }

    document.getElementById("vies").innerHTML = affichage;
}

function finJeu(message){

    document.getElementById("question").innerHTML = "";
    document.getElementById("verbeCible").innerHTML = "";

    document.getElementById("fin").innerHTML =
        message + "<br>Score final : " + score;

    document.getElementById("resultat").innerHTML = "";

    document.getElementById("progression").style.width = "100%";

    document.getElementById("btnRecommencer").style.display =
        "inline-block";

    document.getElementById("reponse").disabled = true;

    if(chrono){
        clearInterval(chrono);
    }
}

function compteARebours(){

    chrono = setInterval(function(){

        temps--;

        document.getElementById("temps").innerHTML = temps;

        if(temps <= 0){

            clearInterval(chrono);

            finJeu("Temps écoulé.");
        }

    },1000);
}

function recommencer(){
    location.reload();
}

document.getElementById("reponse").addEventListener("keydown", function(e){
    if(e.key === "Enter"){
        verifier();
    }
});

afficherVies();
nouvelleQuestion();
compteARebours();

</script>

</body>
</html>
