<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Réalisme — Analyse d'extraits — 3e S5 J1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;}
:root{
 --day-color:#f5a623;--day-dark:#a85e00;--day-light:#fff3e0;--day-border:#f5c98a;--day-glow:rgba(245,166,35,.3);
 --gold:#f5c518;--bg:#fffdf7;--rouge:#c0392b;--vert:#1f7a4d;--rouge-bg:#fbdcd6;--vert-bg:#d7f3e3;
 --surface:#fff;--border:#d8dee5;--yellow:#f5c518;--green:#1f7a4d;--pink:#f9c0bb;--orange:#f5a623;
 --text:#1f2937;--muted:#6b7280;--radius:10px;
}
body{margin:0;background:var(--bg);color:#1f2937;font-family:'Segoe UI',system-ui,Arial,sans-serif;min-height:100vh;padding:18px;position:relative;overflow-x:hidden;}
.bubble{position:fixed;border-radius:50%;z-index:0;pointer-events:none;filter:blur(2px);opacity:.3;}
.bubble.b1{width:130px;height:130px;background:var(--gold);top:-34px;right:-30px;}
.bubble.b2{width:96px;height:96px;background:var(--day-color);bottom:26px;left:-24px;}
.bubble.b3{width:74px;height:74px;background:#3ab5d8;top:42%;right:-28px;}
.bubble.b4{width:84px;height:84px;background:#f9c0bb;top:26%;left:-32px;}
.wrap{max-width:720px;margin:0 auto;position:relative;z-index:1;}
.logo-badge{display:inline-flex;align-items:center;gap:8px;background:var(--gold);border-radius:999px;padding:5px 16px;}
.logo-badge .dots{display:flex;gap:4px;}
.logo-badge .dots i{width:8px;height:8px;border-radius:50%;display:block;}
.logo-badge .dots i:nth-child(1){background:#c0392b;}
.logo-badge .dots i:nth-child(2){background:#8a6000;}
.logo-badge .dots i:nth-child(3){background:var(--day-dark);}
.logo-badge .lab{font-family:Arial,sans-serif;font-size:12px;font-weight:800;color:#3a2a00;letter-spacing:.5px;}
.week{font-family:'JetBrains Mono',monospace;font-size:.78rem;color:#7a6f54;margin:8px 0 4px;letter-spacing:1px;}
h1{font-family:'Orbitron',sans-serif;font-size:clamp(1.15rem,4vw,1.7rem);margin:2px 0 4px;color:var(--day-dark);font-weight:700;}
.theme-badge{display:inline-block;background:var(--day-light);border:1px solid var(--day-border);color:var(--day-dark);
 font-family:Arial,sans-serif;font-size:.82rem;font-weight:700;padding:5px 14px;border-radius:20px;margin-bottom:14px;}

.hud{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;align-items:center;}
.hud-box{font-family:'Orbitron',monospace;font-size:.85rem;background:#fff;border:1px solid var(--day-border);
 padding:8px 14px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.btn-recommencer-perm{font-family:Arial,sans-serif;background:#fff;border:1.5px solid var(--day-border);color:var(--day-dark);
 font-weight:800;font-size:.82rem;padding:8px 16px;border-radius:10px;cursor:pointer;min-height:40px;}
.btn-recommencer-perm:hover{background:var(--day-light);}
.nav-row{display:flex;justify-content:flex-end;margin-top:6px;}
.btn-suivant{font-family:Arial,sans-serif;background:var(--day-color);color:#3a2000;border:none;border-radius:8px;
 padding:12px 26px;font-weight:800;font-size:1rem;cursor:pointer;min-height:44px;}
.btn-suivant:hover{filter:brightness(1.06);}
.hud-box b{color:var(--day-dark);}
.progress-track{flex:1;min-width:140px;height:10px;background:#eef2f4;border:1px solid var(--day-border);border-radius:6px;overflow:hidden;}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--day-color),var(--vert));transition:width .5s ease;}

.extrait-card{background:#fff;border:1px solid var(--day-border);border-top:4px solid var(--day-color);border-radius:14px;
 padding:20px 22px;margin-bottom:16px;box-shadow:0 4px 16px rgba(0,0,0,.06);}
.extrait-num{font-family:'JetBrains Mono',monospace;font-size:.72rem;letter-spacing:1.5px;color:var(--day-dark);
 text-transform:uppercase;font-weight:700;margin-bottom:6px;}
.extrait-ref{font-family:Arial,sans-serif;font-style:italic;font-size:.85rem;color:var(--muted);margin-bottom:12px;}
.extrait-texte{font-size:1rem;line-height:1.85;color:#1f2937;background:#faf9f5;border-left:3px solid var(--day-border);
 padding:12px 16px;margin-bottom:16px;}
.niveau-lbl{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:.7rem;font-weight:700;
 color:var(--day-dark);background:var(--day-light);padding:3px 10px;border-radius:12px;margin-bottom:10px;}
.question-txt{font-size:1.02rem;font-weight:700;color:#1a2430;margin-bottom:14px;line-height:1.5;}
.choix-col{display:flex;flex-direction:column;gap:10px;margin-bottom:6px;}
.choix-btn{font-family:Arial,sans-serif;text-align:left;padding:12px 14px;min-height:50px;border:2px solid #b0b8c2;
 border-radius:8px;background:#fff;color:#1a2430;font-weight:600;cursor:pointer;font-size:.95rem;line-height:1.5;transition:all .15s;}
.choix-btn:hover:not(:disabled){border-color:var(--day-color);background:var(--day-light);}
.choix-btn.sel{border-color:var(--day-dark);background:var(--day-light);}
.choix-btn.correct{background:var(--vert-bg);border-color:var(--vert);color:#0f5c34;font-weight:800;}
.choix-btn.wrong{background:var(--rouge-bg);border-color:var(--rouge);color:#7a1e14;font-weight:800;}
.choix-btn:disabled{cursor:default;}
.btn-valider{font-family:Arial,sans-serif;background:var(--day-color);color:#3a2000;border:none;border-radius:8px;
 padding:10px 22px;font-weight:800;cursor:pointer;font-size:.9rem;min-height:44px;}
.btn-valider:disabled{background:#e0e0e0;color:#9aa0a6;cursor:not-allowed;}
.item-feedback{margin-top:10px;font-size:.9rem;line-height:1.65;padding:10px 12px;border-radius:6px;display:none;}
.item-feedback.show{display:block;}
.item-feedback.ok{background:var(--vert-bg);border-left:3px solid var(--vert);color:#0f5c34;}
.item-feedback.no{background:var(--rouge-bg);border-left:3px solid var(--rouge);color:#7a1e14;}

.bilan-card{background:#fff;border:2px solid var(--day-color);border-radius:14px;padding:24px;text-align:center;
 box-shadow:0 8px 24px rgba(0,0,0,.1);margin-top:20px;display:none;}
.bilan-card.show{display:block;}
.bilan-score{font-family:'Orbitron',monospace;font-size:2.2rem;color:var(--day-dark);font-weight:900;margin-bottom:10px;}
.btn-recommencer{font-family:Arial,sans-serif;background:var(--day-color);color:#3a2000;border:none;border-radius:8px;
 padding:12px 26px;font-weight:800;cursor:pointer;font-size:.95rem;min-height:44px;margin-top:10px;}

.flash-v{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.3);
 font-size:3.4rem;font-weight:900;z-index:9999;pointer-events:none;opacity:0;font-family:'JetBrains Mono',monospace;}
.flash-v.pop{animation:flashPop 1s ease-out forwards;}
@keyframes flashPop{0%{opacity:1;transform:translate(-50%,-50%) scale(.3);}40%{opacity:1;transform:translate(-50%,-50%) scale(1.2);}100%{opacity:0;transform:translate(-50%,-60%) scale(1);}}
@keyframes rainFall{0%{opacity:1;transform:translateY(-40px) rotate(0);}100%{opacity:0;transform:translateY(110vh) rotate(var(--rot));}}
@keyframes confFall{0%{opacity:1;transform:translateY(-30px) rotate(0);}100%{opacity:0;transform:translateY(100vh) rotate(720deg);}}
</style>
</head>
<body>
<div class="bubble b1"></div><div class="bubble b2"></div>
<div class="bubble b3"></div><div class="bubble b4"></div>
<div class="flash-v" id="flashV"></div>

<div class="wrap">
  <div class="logo-badge"><span class="dots"><i></i><i></i><i></i></span><span class="lab">PAZAPA · FRANÇAIS · 3E</span></div>
  <div class="week">SEMAINE 5 — JOUR 1 · LE RÉALISME</div>
  <h1>📖 Le Réalisme — Analyse d'extraits</h1>
  <div class="theme-badge">Procédés réalistes et effets sur le lecteur</div>

  <div class="hud">
    <div class="hud-box">Score : <b id="score">0</b> / 5</div>
    <div class="progress-track"><div class="progress-fill" id="progFill"></div></div>
    <button class="btn-recommencer-perm" id="btnRecommencerPerm">🔄 Recommencer</button>
  </div>

  <div id="extraitsZone"></div>
  <div class="nav-row" id="navRow"><button class="btn-suivant" id="btnSuivant" style="display:none;">Suivant ▸</button></div>

  <div class="bilan-card" id="bilanCard">
    <div class="bilan-score" id="bilanScore"></div>
    <button class="btn-recommencer" id="btnRecommencer">🔄 Recommencer</button>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════
   N3S5J1 — Le Réalisme — Analyse d'extraits — 3e
   5 extraits × 1 QCM = /5
   Aucun bilan à paliers fourni par le document → score chiffré uniquement.
   Référentiel non fourni dans le document source → non inclus.
   ═══════════════════════════════════════════ */
const $=id=>document.getElementById(id);

const EXTRAITS = [
  {
    ref: "Honoré de Balzac, Le Père Goriot, 1835.",
    texte: "« Cette pièce est dans tout son lustre au moment où, vers sept heures du matin, le chat de madame Vauquer précède sa maîtresse, saute sur les buffets, y flaire le lait que contiennent plusieurs jattes couvertes d'assiettes, et fait entendre son rourou matinal. »",
    niveau: null,
    question: "Quel procédé réaliste domine dans cet extrait ?",
    opts: [
      "La précision descriptive portée sur les détails matériels et le rituel quotidien d'une pension modeste.",
      "Le jugement explicite du narrateur sur la propreté de la pension.",
      "La comparaison entre cette pension et une demeure plus luxueuse."
    ],
    rep: 0,
    feedback: "Le texte précise l'heure exacte (sept heures du matin), le geste du chat, le contenu des jattes : c'est une observation minutieuse d'un rituel quotidien banal, sans jugement moral du narrateur ni comparaison avec un autre lieu. Ces deux derniers procédés existent dans d'autres passages du réalisme, mais pas ici."
  },
  {
    ref: "Honoré de Balzac, Eugénie Grandet, 1833.",
    texte: "« Le grand air de cette salle, dont les murailles étaient garnies en haut de moulures sculptées, contrastait étrangement avec la table basse, faite en bois de noyer et les six chaises de paille à dossier droit que possédait M. Grandet. »",
    niveau: null,
    question: "Quel effet produit le contraste décrit dans cet extrait ?",
    opts: [
      "Il met en valeur le bon goût raffiné de M. Grandet.",
      "Il souligne le décalage entre l'apparence du lieu et l'avarice du propriétaire.",
      "Il exprime la nostalgie du narrateur pour un temps révolu."
    ],
    rep: 1,
    feedback: "Le contraste entre les moulures sculptées (un cadre riche) et le mobilier simple (table basse, chaises de paille) ne valorise en rien le goût de M. Grandet : il révèle au contraire un décalage révélateur de son avarice. Il n'y a aucune nostalgie exprimée dans ce passage purement descriptif."
  },
  {
    ref: "Stendhal, Le Rouge et le Noir, 1830.",
    texte: "« Julien, en entrant dans l'atelier de son père, ne fut point aperçu de lui. Le vieux Sorel, tout occupé à examiner la coupe d'une pièce de bois, ne vit pas arriver son fils, dont la taille svelte contrastait avec la carrure des ouvriers qui l'environnaient. »",
    niveau: null,
    question: "Quel élément réaliste caractérise cette présentation du personnage de Julien ?",
    opts: [
      "L'affection visible que lui porte son père dès son arrivée.",
      "Son ambition affichée de quitter au plus vite l'atelier familial.",
      "Son insertion précise dans un cadre de travail, avec un milieu social déterminé."
    ],
    rep: 2,
    feedback: "Le texte montre au contraire que le père ne remarque même pas son fils (« ne fut point aperçu de lui ») : il n'y a donc aucune affection visible exprimée ici. L'ambition de Julien n'est pas non plus évoquée dans cet extrait : seul le cadre matériel (l'atelier, le bois, les ouvriers) et le contraste physique du personnage avec son entourage sont décrits."
  },
  {
    ref: "Guy de Maupassant, « La Ficelle », 1883.",
    texte: "« Maître Hauchecorne, de Bréauté, venait d'arriver à Goderville, et il se dirigeait vers la place, quand il aperçut par terre un petit bout de ficelle. Maître Hauchecorne, économe en vrai Normand, pensa que tout était bon à ramasser qui peut servir ; et il se baissa péniblement, car il souffrait de rhumatismes. »",
    niveau: "Niveau A",
    question: "Quel principe du réalisme illustre ce passage ?",
    opts: [
      "La peinture d'un trait de caractère ordinaire, ancré dans un milieu social précis.",
      "La célébration d'un geste de grande générosité envers autrui.",
      "La description d'un paysage normand grandiose et idéalisé."
    ],
    rep: 0,
    feedback: "Le texte décrit un geste très ordinaire (ramasser un bout de ficelle par économie), motivé par un trait de caractère courant chez les paysans normands de l'époque, tel que le présente Maupassant. Il ne s'agit ni d'un acte de générosité ni d'une description de paysage : l'attention porte uniquement sur le geste et le personnage."
  },
  {
    ref: "Honoré de Balzac, Le Père Goriot, 1835.",
    texte: "« La pension Vauquer est meublée comme on sait. Les murs sont peints en couleur claire, mais la couleur a disparu sous une couche grasse et sale ; on y voit des paysages collés sur le papier verni dont les cadres en bois noirci filetés d'or sont à peine visibles tant la poussière les a recouverts. »",
    niveau: null,
    question: "Quel procédé réaliste domine ce passage ?",
    opts: [
      "Le rappel nostalgique d'une décoration autrefois luxueuse et aujourd'hui regrettée.",
      "L'accumulation de détails dégradés qui traduit la pauvreté du lieu.",
      "La condamnation explicite par le narrateur de la négligence des locataires."
    ],
    rep: 1,
    feedback: "Le texte accumule des détails de dégradation (couche grasse, poussière, cadres à peine visibles) sans jamais exprimer de regret nostalgique ni condamner explicitement qui que ce soit. C'est l'accumulation elle-même, neutre en apparence, qui suffit à donner au lecteur une image précise de la misère du lieu."
  }
];

let score = 0;
let state = EXTRAITS.map(()=>({sel:null, done:false}));

let cur = 0;

function renderExtrait(i){
  const e = EXTRAITS[i];
  const zone = $('extraitsZone');
  zone.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'extrait-card';
  card.id = 'card-'+i;
  let optsHTML = e.opts.map((o,oi)=>'<button class="choix-btn" data-i="'+i+'" data-v="'+oi+'">'+o+'</button>').join('');
  card.innerHTML =
    '<div class="extrait-num">Extrait '+(i+1)+'</div>'
    +'<div class="extrait-ref">'+e.ref+'</div>'
    +'<div class="extrait-texte">'+e.texte+'</div>'
    +(e.niveau ? '<div class="niveau-lbl">'+e.niveau+'</div>' : '')
    +'<div class="question-txt">'+e.question+'</div>'
    +'<div class="choix-col">'+optsHTML+'</div>'
    +'<button class="btn-valider" id="valid-'+i+'" disabled>Valider</button>'
    +'<div class="item-feedback" id="fb-'+i+'"></div>';
  zone.appendChild(card);

  card.querySelectorAll('.choix-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(state[i].done) return;
      state[i].sel = Number(btn.dataset.v);
      card.querySelectorAll('.choix-btn').forEach(b=>b.classList.toggle('sel', b===btn));
      $('valid-'+i).disabled = false;
    });
  });
  $('valid-'+i).addEventListener('click', ()=>validateItem(i));
  $('btnSuivant').style.display = 'none';
}

function validateItem(i){
  const st = state[i];
  if(st.done || st.sel===null) return;
  st.done = true;
  const ok = st.sel === EXTRAITS[i].rep;
  const card = $('card-'+i);
  card.querySelectorAll('.choix-btn').forEach(b=>{
    b.disabled=true;
    if(Number(b.dataset.v)===EXTRAITS[i].rep) b.classList.add('correct');
    else if(Number(b.dataset.v)===st.sel && !ok) b.classList.add('wrong');
  });
  $('valid-'+i).disabled=true;
  if(ok) score++;
  updateScore();
  flashV(ok);
  if(ok) okSound(); else errSound();
  const fb = $('fb-'+i);
  fb.className = 'item-feedback show '+(ok?'ok':'no');
  fb.textContent = ok ? 'Correct.' : EXTRAITS[i].feedback;

  if(i<EXTRAITS.length-1){
    $('btnSuivant').textContent = 'Suivant ▸';
    $('btnSuivant').style.display = 'inline-block';
  } else {
    $('btnSuivant').textContent = 'Voir le bilan ▸';
    $('btnSuivant').style.display = 'inline-block';
  }
}

$('btnSuivant').addEventListener('click', ()=>{
  if(cur<EXTRAITS.length-1){ cur++; renderExtrait(cur); }
  else { showBilan(); }
});

function updateScore(){
  $('score').textContent = score;
  $('progFill').style.width = (state.filter(s=>s.done).length/EXTRAITS.length*100)+'%';
}

function showBilan(){
  $('bilanScore').textContent = score+' / 5';
  $('bilanCard').classList.add('show');
  beepFinal(score>=4);
  if(score/5>=0.85) rainEmojis();
}

function rejouer(){
  score=0; cur=0; updateScore();
  state = EXTRAITS.map(()=>({sel:null, done:false}));
  renderExtrait(0);
  $('bilanCard').classList.remove('show');
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ── FLASH ── */
function flashV(ok){
  const el=$('flashV');
  el.textContent=ok?'✓':'✗'; el.style.color=ok?'#1f7a4d':'#c0392b';
  el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
}

/* ── PLUIE EMOJIS + CONFETTIS ── */
function confetti(){
  const cols=['#f5a623','#1f7a4d','#c0392b','#3ab5d8'];
  for(let i=0;i<30;i++){
    setTimeout(()=>{
      const el=document.createElement('div');
      el.style.cssText='position:fixed;top:-20px;left:'+(Math.random()*100)+'vw;width:8px;height:8px;'
        +'background:'+cols[i%4]+';z-index:9997;pointer-events:none;'
        +'animation:confFall '+(1.6+Math.random()*1.2).toFixed(2)+'s ease-in forwards;';
      document.body.appendChild(el);
      setTimeout(()=>el.remove(),3000);
    }, i*40);
  }
}
const RAIN=['🌊','💧','⛵','🔭','🗺️','🌧️','💫','⚓'];
function rainEmojis(){
  confetti();
  for(let i=0;i<25;i++){
    setTimeout(()=>{
      const el=document.createElement('div');
      el.textContent=RAIN[Math.floor(Math.random()*RAIN.length)];
      el.style.cssText='position:fixed;top:-40px;left:'+(Math.random()*100)+'vw;'
        +'font-size:'+(1+Math.random()*1.3).toFixed(2)+'rem;z-index:9998;pointer-events:none;'
        +'--rot:'+(Math.random()*60-30)+'deg;animation:rainFall '+(1.8+Math.random()*1.4).toFixed(2)+'s ease-in forwards;';
      document.body.appendChild(el);
      setTimeout(()=>el.remove(),3500);
    }, i*85);
  }
}

/* ── AUDIO ── */
let actx=null, son=true;
function initA(){ if(actx) return; try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
function beep(f1,f2,d,type,vol){ if(!actx||!son) return; const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;
 o.type=type||'sine'; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+d);
 g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol||0.16,t+0.01); g.gain.exponentialRampToValueAtTime(0.0008,t+d);
 o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d+0.02); }
function okSound(){ initA(); beep(523,784,0.13,'sine',0.13); setTimeout(()=>beep(784,1046,0.11,'sine',0.11),80); }
function errSound(){ initA(); beep(320,140,0.24,'sawtooth',0.12); }
function beepFinal(good){
  initA();
  if(good){ [523,659,784,1046,1318].forEach((f,k)=>setTimeout(()=>beep(f,f,0.2,'sine',0.14),k*90)); }
  else { beep(300,150,0.4,'sine',0.14); }
}
document.addEventListener('pointerdown', initA, {once:true});

$('btnRecommencer').addEventListener('click', rejouer);
$('btnRecommencerPerm').addEventListener('click', rejouer);
renderExtrait(0);
</script>
</body>
</html>
