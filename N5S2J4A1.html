<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pazapa – J'observe et je teste – S2 J4 – 5e</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --day:#3ab5d8;--day-dark:#1a6e88;--day-dark2:#0d3d4d;
  --day-light:#e8f6fb;--day-border:#9dd4e8;--day-glow:rgba(58,181,216,.28);
  --day-color:#3ab5d8;
  --bg:#fffdf7;--surface:#ffffff;--surface2:#f0f9fd;--border:#e8e4d9;
  --yellow:#f5c518;--green:#8dc63f;--green-light:#f0faeb;--green-dark:#3d7a10;
  --pink:#f28b82;--pink-light:#fff0ef;--pink-dark:#c0392b;
  --orange:#f5a623;
  --text:#1a1d23;--muted:#8a8f9a;
  --radius:16px;--radius-sm:10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:1.5rem .75rem 3rem;overflow-x:hidden;-webkit-tap-highlight-color:transparent;}
.wrap{width:100%;max-width:660px;}
body::before{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.11;
  width:340px;height:340px;background:var(--yellow);top:-80px;right:-80px;pointer-events:none;}
body::after{content:'';position:fixed;border-radius:50%;z-index:0;opacity:.09;
  width:260px;height:260px;background:var(--day);bottom:-60px;left:-60px;pointer-events:none;}
.bubble1{position:fixed;border-radius:50%;z-index:0;opacity:.09;width:180px;height:180px;
  background:var(--day);bottom:120px;right:-40px;pointer-events:none;}
.bubble2{position:fixed;border-radius:50%;z-index:0;opacity:.08;width:120px;height:120px;
  background:var(--pink);top:200px;left:-30px;pointer-events:none;}

header{text-align:center;margin-bottom:1.4rem;position:relative;z-index:1;}
.logo-badge{display:inline-block;background:var(--yellow);border-radius:50px;
  padding:6px 16px;box-shadow:0 2px 8px rgba(245,197,24,.35);margin-bottom:.5rem;}
.week-label{font-family:'JetBrains Mono',monospace;font-size:.82rem;color:var(--muted);margin-bottom:.4rem;}
h1{font-size:clamp(1.2rem,4vw,1.9rem);font-weight:900;line-height:1.25;}
h1 .hl{color:var(--day-dark);}

.prog-wrap{width:100%;margin-bottom:.8rem;position:relative;z-index:1;}
.prog-info{display:flex;justify-content:space-between;font-size:.73rem;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:.3rem;}
.prog-bg{background:var(--border);border-radius:99px;height:7px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--day-dark),var(--day));border-radius:99px;transition:width .5s ease;width:0%;}
.chips{display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap;position:relative;z-index:1;}
.chip{display:flex;align-items:center;gap:.35rem;padding:.25rem .65rem;border-radius:99px;font-size:.74rem;font-family:'JetBrains Mono',monospace;border:1.5px solid var(--border);background:var(--surface);font-weight:600;white-space:nowrap;}
.chip .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}

.card{background:var(--surface);border:1.5px solid #e0ddd5;border-radius:var(--radius);
  padding:0 0 1.4rem;box-shadow:0 6px 28px rgba(0,0,0,.07);
  animation:fadeUp .35s ease both;margin-bottom:1.6rem;overflow:hidden;position:relative;z-index:1;}
.card-stripe{height:4px;background:linear-gradient(90deg,var(--day-dark),var(--day),var(--yellow),var(--day-dark));}
.card-body{padding:1.3rem 1.3rem 0;}
.act-num{font-size:.68rem;font-family:'JetBrains Mono',monospace;color:var(--muted);margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.1em;}
.theme-badge{display:inline-block;font-size:.63rem;font-weight:800;padding:.15rem .6rem;border-radius:99px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:.75rem;background:var(--day-light);color:var(--day-dark);border:1.5px solid var(--day-border);white-space:nowrap;}
.observe-box{background:var(--day-light);border:2px solid var(--day-border);border-left:4px solid var(--day-dark);border-radius:var(--radius-sm);padding:.8rem 1.1rem;margin-bottom:1rem;font-size:clamp(.95rem,2.6vw,1.05rem);font-weight:700;color:var(--day-dark2);font-family:'JetBrains Mono',monospace;line-height:1.9;word-break:break-word;}
.observe-label{font-size:.65rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:.3rem;display:block;}
.q-text{font-size:clamp(.92rem,2.5vw,1rem);font-weight:700;color:var(--text);margin-bottom:.9rem;line-height:1.65;}

/* QCM */
.choices{display:flex;flex-direction:column;gap:.45rem;margin-bottom:.3rem;}
.choice-btn{background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:clamp(.9rem,2.4vw,.98rem);font-weight:600;padding:.65rem 1rem;cursor:pointer;transition:background .12s,border-color .12s;min-height:46px;-webkit-tap-highlight-color:transparent;font-family:Arial,Helvetica,sans-serif;text-align:left;display:flex;align-items:flex-start;gap:.65rem;word-break:break-word;line-height:1.5;}
.choice-btn:hover:not(:disabled){background:var(--day-light);border-color:var(--day-dark);}
.choice-btn:disabled{cursor:default;}
.choice-letter{width:26px;height:26px;border-radius:50%;flex-shrink:0;min-width:26px;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:800;font-family:'JetBrains Mono',monospace;background:var(--border);color:var(--text);margin-top:1px;}
.choice-btn.selected{background:var(--day-light);border-color:var(--day-dark);}
.choice-btn.selected .choice-letter{background:var(--day-dark);color:#fff;}
.choice-btn.correct-ans{border-color:var(--green)!important;background:var(--green-light)!important;color:var(--green-dark)!important;}
.choice-btn.correct-ans .choice-letter{background:var(--green);color:#fff;}
.choice-btn.wrong-ans{border-color:var(--pink-dark)!important;background:var(--pink-light)!important;color:var(--pink-dark)!important;}
.choice-btn.wrong-ans .choice-letter{background:var(--pink-dark);color:#fff;}

/* CHECKBOXES ACT5 */
.check-list{display:flex;flex-direction:column;gap:.5rem;margin-bottom:.5rem;}
.check-item{display:flex;align-items:center;gap:.75rem;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:.65rem 1rem;cursor:pointer;min-height:46px;-webkit-tap-highlight-color:transparent;transition:background .12s,border-color .12s;}
.check-item:hover:not(.locked){background:var(--day-light);border-color:var(--day-dark);}
.check-item.checked{background:var(--day-light);border-color:var(--day-dark);}
.check-item.ok-c{border-color:var(--green)!important;background:var(--green-light)!important;}
.check-item.ko-c{border-color:var(--pink-dark)!important;background:var(--pink-light)!important;}
.check-item.missed-c{border-color:var(--yellow)!important;background:#fffbeb!important;}
.check-box{width:22px;height:22px;border-radius:5px;border:2px solid var(--day-border);background:var(--surface);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.85rem;transition:background .12s,border-color .12s;}
.check-item.checked .check-box{background:var(--day-dark);border-color:var(--day-dark);color:#fff;}
.check-item.ok-c .check-box{background:var(--green);border-color:var(--green);color:#fff;}
.check-item.ko-c .check-box{background:var(--pink-dark);border-color:var(--pink-dark);color:#fff;}
.check-item.missed-c .check-box{background:var(--yellow);border-color:var(--yellow);color:#fff;}
.check-label{font-size:clamp(.9rem,2.4vw,.98rem);font-weight:600;color:var(--text);line-height:1.5;}

/* POPUP */
.popup-memo{display:none;background:var(--day-light);border:2.5px solid var(--day-dark);border-left:5px solid var(--day-dark);border-radius:var(--radius-sm);padding:1rem 1.1rem;margin-top:.9rem;}
.popup-memo.show{display:block;animation:fadeUp .3s ease both;}
.popup-memo-title{font-family:'JetBrains Mono',monospace;font-size:.72rem;font-weight:800;color:var(--day-dark);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:.6rem;}
.popup-memo p{font-size:clamp(.9rem,2.4vw,.98rem);color:var(--text);line-height:1.8;margin-bottom:.4rem;}
.popup-memo p:last-child{margin:0;}
.popup-memo strong{color:var(--day-dark);}

.btn-row{display:flex;gap:.55rem;flex-wrap:wrap;margin:1rem 1.3rem 0;}
@media(max-width:479px){.btn-row{flex-direction:column;}.btn-row .btn{width:100%;justify-content:center;}}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.65rem 1.2rem;border-radius:var(--radius-sm);font-family:Arial,Helvetica,sans-serif;font-size:clamp(.88rem,2.5vw,.97rem);font-weight:800;cursor:pointer;border:none;transition:transform .12s,box-shadow .14s;min-height:2.8rem;-webkit-tap-highlight-color:transparent;}
.btn:active{transform:scale(.96);}
.btn:disabled{opacity:.35;cursor:default;transform:none!important;}
.btn-primary{background:var(--day-dark);color:#fff;box-shadow:0 3px 12px var(--day-glow);flex:1;}
.btn-primary:hover:not(:disabled){transform:translateY(-1px);}
.btn-ghost{background:transparent;color:var(--muted);border:1.5px solid var(--border);}
.btn-ghost:hover:not(:disabled){border-color:var(--day-dark);color:var(--text);}

.feedback{margin-top:1rem;padding:.85rem 1rem;border-radius:var(--radius-sm);font-size:clamp(.87rem,2.4vw,.97rem);display:none;align-items:flex-start;gap:.6rem;line-height:1.75;margin-left:1.3rem;margin-right:1.3rem;word-break:break-word;}
.feedback.show{display:flex;}
.feedback.ok{background:var(--green-light);border:1.5px solid var(--green);color:var(--green-dark);}
.feedback.ko{background:var(--pink-light);border:1.5px solid var(--pink-dark);color:var(--pink-dark);}
.feedback.mid{background:var(--day-light);border:1.5px solid var(--day-border);color:var(--day-dark2);}
.fb-icon{font-size:1.3rem;flex-shrink:0;}
.fb-title{font-weight:800;margin-bottom:.2rem;}
.fb-det{font-family:'JetBrains Mono',monospace;font-size:.82rem;margin-top:.2rem;line-height:1.85;}

.results{display:none;position:relative;z-index:1;animation:fadeUp .4s ease both;}
.results.show{display:block;}
.results-card{background:var(--surface);border:1.5px solid #e0ddd5;border-radius:var(--radius);padding:2rem 1.4rem;box-shadow:0 6px 28px rgba(0,0,0,.07);text-align:center;position:relative;overflow:hidden;}
.results-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--day-dark),var(--day),var(--yellow),var(--day-dark));}
.score-big{font-size:clamp(2.8rem,10vw,4.5rem);font-weight:900;line-height:1;margin:.6rem 0 .3rem;color:var(--day-dark);}
.stars{font-size:1.9rem;margin:.4rem 0 .8rem;letter-spacing:.1em;}
.r-msg{color:var(--muted);font-size:clamp(.88rem,2.5vw,1rem);margin-bottom:1rem;line-height:1.8;}
.recap{text-align:left;display:flex;flex-direction:column;gap:.4rem;margin-bottom:1.4rem;}
.recap-item{display:flex;align-items:center;gap:.6rem;padding:.45rem .85rem;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:.8rem;font-family:'JetBrains Mono',monospace;}
.recap-item.ok-r{border-color:#9dd4e8;}
.recap-item.ko-r{border-color:#f9c0bb;}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:500px){.card-body{padding:1.1rem 1rem 0;}.btn-row{margin:1rem 1rem 0;}.feedback{margin-left:1rem;margin-right:1rem;}}
</style>
</head>
<body>
<div class="bubble1"></div><div class="bubble2"></div>
<div class="wrap">

<header>
  <div class="logo-badge">
    <span style="color:#e8002d;font-size:14px;">&#9679;</span>
    <span style="color:#8dc63f;font-size:14px;">&#9679;</span>
    <span style="color:#3ab5d8;font-size:14px;">&#9679;</span>
    <span style="font-family:monospace;font-size:13px;font-weight:bold;color:#000;">&nbsp;Pazapa · Français · 5ème</span>
  </div>
  <div class="week-label">Semaine 2 – Jour 4</div>
  <h1>J'observe et je teste · <span class="hl">L'imparfait</span></h1>
</header>

<div class="prog-wrap">
  <div class="prog-info">
    <span id="prog-label">0 / 5 activités</span>
    <span id="prog-pct">0 %</span>
  </div>
  <div class="prog-bg"><div class="prog-fill" id="prog-fill"></div></div>
</div>
<div class="chips">
  <div class="chip"><div class="dot" style="background:#8dc63f"></div><span id="cnt-ok">0</span> correct(s)</div>
  <div class="chip"><div class="dot" style="background:#f28b82"></div><span id="cnt-ko">0</span> erreur(s)</div>
  <div class="chip"><div class="dot" style="background:#8a8f9a"></div><span id="cnt-rem">10</span> pts restants</div>
</div>

<div id="cards-zone"></div>

<div class="results" id="results-screen">
  <div class="results-card">
    <div class="logo-badge" style="display:inline-block;background:var(--yellow);border-radius:50px;padding:6px 16px;box-shadow:0 2px 8px rgba(245,197,24,.35);margin-bottom:.6rem;">
      <span style="color:#e8002d;font-size:14px;">&#9679;</span>
      <span style="color:#8dc63f;font-size:14px;">&#9679;</span>
      <span style="color:#3ab5d8;font-size:14px;">&#9679;</span>
      <span style="font-family:monospace;font-size:13px;font-weight:bold;color:#000;">&nbsp;Résultats</span>
    </div>
    <div class="score-big"><span id="r-score">0</span>/10</div>
    <div class="stars" id="r-stars"></div>
    <div class="r-msg" id="r-msg"></div>
    <div class="recap" id="r-recap"></div>
    <button class="btn btn-primary" onclick="restartAll()" style="width:100%;justify-content:center;">↺ Recommencer</button>
  </div>
</div>

</div>
<script>
var $ = function(id){ return document.getElementById(id); };
var scores = new Array(5).fill(null);
var done   = new Array(5).fill(false);

var QCM = [
  {num:1,badge:'Dans quel temps ?',
   obs:'Chaque matin, le berger gardait ses moutons près de la rivière.',
   q:'Le verbe gardait parle :',
   opts:['du présent','du futur','du passé'],
   ans:2,
   fbOk:'Exact ! <em>Gardait</em> est à l\'imparfait : il exprime une action passée qui se répétait régulièrement.',
   fbKo:'La bonne réponse est C. <em>Gardait</em> est à l\'imparfait : ce temps exprime une action passée qui se répétait.'},
  {num:2,badge:'Une habitude ou une action unique ?',
   obs:'Tous les soirs, elle lisait quelques pages avant de dormir.',
   q:'Cette phrase évoque :',
   opts:['une habitude','une action qui n\'a eu lieu qu\'une seule fois'],
   ans:0,
   fbOk:'Exact ! <em>Tous les soirs</em> indique une habitude : c\'est l\'une des valeurs principales de l\'imparfait.',
   fbKo:'La bonne réponse est A. <em>Tous les soirs</em> indique une répétition : l\'imparfait exprime ici une habitude passée.'},
  {num:3,badge:'Que comprends-tu ?',
   obs:'Quand il était petit, Arthur passait ses journées près du lac.',
   q:'Cette phrase nous apprend surtout :',
   opts:['une habitude du passé','un ordre','un projet pour l\'avenir'],
   ans:0,
   fbOk:'Exact ! L\'imparfait exprime ici une habitude du passé liée à l\'enfance d\'Arthur.',
   fbKo:'La bonne réponse est A. L\'imparfait exprime ici une habitude du passé : ce que faisait Arthur régulièrement quand il était petit.'},
  {num:4,badge:'Description ou action ?',
   obs:'Le vent soufflait doucement.\nLes oiseaux chantaient dans les arbres.\nLa lumière éclairait la vallée.',
   q:'Ces phrases servent surtout à :',
   opts:['décrire une scène','donner un ordre','poser une question'],
   ans:0,
   fbOk:'Exact ! Ces verbes à l\'imparfait créent une description : on imagine la scène comme dans un tableau.',
   fbKo:'La bonne réponse est A. L\'imparfait sert ici à décrire une scène : le vent, les oiseaux, la lumière — c\'est une ambiance.'}
];

var CHECKS = [
  {label:'raconter une habitude du passé',            ans:true},
  {label:'décrire une personne, un lieu ou une ambiance', ans:true},
  {label:'donner un ordre',                           ans:false},
  {label:'raconter une action qui se répète',         ans:true},
  {label:'exprimer un projet futur',                  ans:false},
  {label:'présenter une situation dans le passé',     ans:true}
];

function buildAll(){
  var zone=$('cards-zone'); zone.innerHTML='';
  QCM.forEach(function(q,qi){ zone.appendChild(buildQCMCard(q,qi)); });
  zone.appendChild(buildAct5());
}

function buildQCMCard(q,qi){
  var card=document.createElement('div'); card.className='card'; card.id='card'+qi;
  var stripe=document.createElement('div'); stripe.className='card-stripe'; card.appendChild(stripe);
  var body=document.createElement('div'); body.className='card-body'; card.appendChild(body);
  var num=document.createElement('div'); num.className='act-num'; num.textContent='Activité '+q.num+' / 5'; body.appendChild(num);
  var badge=document.createElement('div'); badge.className='theme-badge'; badge.textContent=q.badge; body.appendChild(badge);
  var obs=document.createElement('div'); obs.className='observe-box';
  obs.innerHTML='<span class="observe-label">Observe</span>'+q.obs.replace(/\n/g,'<br>'); body.appendChild(obs);
  var qtext=document.createElement('div'); qtext.className='q-text'; qtext.textContent=q.q; body.appendChild(qtext);
  var ch=document.createElement('div'); ch.className='choices'; ch.id='ch'+qi; body.appendChild(ch);
  var letters=['A','B','C','D'];
  q.opts.forEach(function(opt,i){
    var btn=document.createElement('button'); btn.className='choice-btn';
    btn.innerHTML='<span class="choice-letter">'+letters[i]+'</span><span>'+opt+'</span>';
    btn.addEventListener('click',function(){
      if(done[qi]) return;
      ch.querySelectorAll('.choice-btn').forEach(function(b){ b.classList.remove('selected'); });
      btn.classList.add('selected');
    });
    ch.appendChild(btn);
  });
  var fb=document.createElement('div'); fb.className='feedback'; fb.id='fb'+qi;
  fb.innerHTML='<span class="fb-icon" id="fbi'+qi+'"></span><div><div class="fb-title" id="fbt'+qi+'"></div><div class="fb-det" id="fbd'+qi+'"></div></div>';
  card.appendChild(fb);
  var brow=document.createElement('div'); brow.className='btn-row';
  var vbtn=document.createElement('button'); vbtn.className='btn btn-primary'; vbtn.id='vbtn'+qi;
  vbtn.innerHTML='✓ Vérifier';
  (function(q2,qi2){ vbtn.addEventListener('click',function(){ verifQCM(qi2,q2); }); })(q,qi);
  var rbtn=document.createElement('button'); rbtn.className='btn btn-ghost';
  rbtn.innerHTML='↺';
  (function(qi2){ rbtn.addEventListener('click',function(){ resetQCM(qi2); }); })(qi);
  brow.appendChild(vbtn); brow.appendChild(rbtn); card.appendChild(brow);
  return card;
}

function buildAct5(){
  var card=document.createElement('div'); card.className='card'; card.id='card4';
  var stripe=document.createElement('div'); stripe.className='card-stripe'; card.appendChild(stripe);
  var body=document.createElement('div'); body.className='card-body'; card.appendChild(body);
  var num=document.createElement('div'); num.className='act-num'; num.textContent='Activité 5 / 5'; body.appendChild(num);
  var badge=document.createElement('div'); badge.className='theme-badge'; badge.textContent='Formule ton hypothèse'; body.appendChild(badge);
  var qtext=document.createElement('div'); qtext.className='q-text';
  qtext.textContent='En observant les phrases précédentes, coche toutes les utilisations correctes de l\'imparfait.'; body.appendChild(qtext);
  var cl=document.createElement('div'); cl.className='check-list'; cl.id='checklist5'; body.appendChild(cl);
  shuffle(CHECKS.map(function(c,i){return{i:i,label:c.label,ans:c.ans};})).forEach(function(item){
    var row=document.createElement('div'); row.className='check-item'; row.dataset.idx=item.i; row.dataset.checked='0';
    var box=document.createElement('div'); box.className='check-box'; box.textContent='';
    var lbl=document.createElement('span'); lbl.className='check-label'; lbl.textContent=item.label;
    row.appendChild(box); row.appendChild(lbl);
    row.addEventListener('click',function(){
      if(done[4]) return;
      var c=row.dataset.checked==='1';
      row.dataset.checked=c?'0':'1';
      row.classList.toggle('checked',!c);
      box.textContent=c?'':'✓';
    });
    cl.appendChild(row);
  });
  var memo=document.createElement('div'); memo.className='popup-memo'; memo.id='memo5';
  memo.innerHTML='<div class="popup-memo-title">&#10003;&nbsp;Très bonne observation !</div>'
    +'<p>L\'imparfait est souvent utilisé pour <strong>décrire</strong>, <strong>présenter une situation passée</strong> ou <strong>raconter des habitudes</strong> et des actions qui se répétaient dans le passé.</p>'
    +'<p style="color:var(--day-dark);font-weight:700;">&#9658;&nbsp;Passe à l\'étape suivante pour t\'entraîner !</p>';
  card.appendChild(memo);
  var fb=document.createElement('div'); fb.className='feedback'; fb.id='fb4';
  fb.innerHTML='<span class="fb-icon" id="fbi4"></span><div><div class="fb-title" id="fbt4"></div><div class="fb-det" id="fbd4"></div></div>';
  card.appendChild(fb);
  var brow=document.createElement('div'); brow.className='btn-row';
  var vbtn=document.createElement('button'); vbtn.className='btn btn-primary'; vbtn.id='vbtn4';
  vbtn.innerHTML='✓ Vérifier';
  vbtn.addEventListener('click',verif5);
  var rbtn=document.createElement('button'); rbtn.className='btn btn-ghost';
  rbtn.innerHTML='↺';
  rbtn.addEventListener('click',reset5);
  brow.appendChild(vbtn); brow.appendChild(rbtn); card.appendChild(brow);
  return card;
}

function verifQCM(qi,q){
  if(done[qi]) return; done[qi]=true; $('vbtn'+qi).disabled=true;
  var btns=$('ch'+qi).querySelectorAll('.choice-btn'); var sel=-1;
  btns.forEach(function(b,i){ if(b.classList.contains('selected')) sel=i; });
  var ok=(sel===q.ans);
  btns.forEach(function(b,i){
    b.disabled=true; b.classList.remove('selected');
    if(i===q.ans) b.classList.add('correct-ans');
    else if(i===sel&&!ok) b.classList.add('wrong-ans');
  });
  scores[qi]=ok?1:0;
  showFb(qi,ok?'ok':'ko',ok?'✅':'❌',ok?'Exact !':'Pas tout à fait.',ok?q.fbOk:q.fbKo);
  updateGlobal(); checkAllDone();
}

function resetQCM(qi){
  done[qi]=false; scores[qi]=null; $('vbtn'+qi).disabled=false; $('fb'+qi).className='feedback';
  $('ch'+qi).querySelectorAll('.choice-btn').forEach(function(b){ b.disabled=false; b.classList.remove('selected','correct-ans','wrong-ans'); });
  updateGlobal();
}

function verif5(){
  if(done[4]) return; done[4]=true; $('vbtn4').disabled=true;
  var ok=0;
  $('checklist5').querySelectorAll('.check-item').forEach(function(row){
    var idx=parseInt(row.dataset.idx);
    var checked=row.dataset.checked==='1';
    var correct=CHECKS[idx].ans;
    row.classList.remove('checked'); row.classList.add('locked');
    if(checked&&correct){   row.classList.add('ok-c');     row.querySelector('.check-box').textContent='✓'; ok++; }
    else if(checked&&!correct){ row.classList.add('ko-c');  row.querySelector('.check-box').textContent='✗'; }
    else if(!checked&&correct){ row.classList.add('missed-c'); row.querySelector('.check-box').textContent='○'; }
    else {                      row.querySelector('.check-box').textContent=''; }
  });
  scores[4]=ok;
  var pct=ok/CHECKS.length*100;
  var cls=pct>=83?'ok':pct>=50?'mid':'ko';
  showFb(4,cls,pct>=83?'✅':pct>=50?'→':'❌',
    pct>=83?'Excellent !':pct>=50?'Bien !':'À retravailler.',
    ok+' / 6 cases correctes. &#128308; Cases manquées affichées avec ○. Cases incorrectes affichées avec ✗.');
  if(ok>=4){ var memo=$('memo5'); if(memo) memo.classList.add('show'); }
  updateGlobal(); checkAllDone();
}

function reset5(){
  done[4]=false; scores[4]=null; $('vbtn4').disabled=false; $('fb4').className='feedback';
  var memo=$('memo5'); if(memo) memo.classList.remove('show');
  $('checklist5').querySelectorAll('.check-item').forEach(function(row){
    row.dataset.checked='0'; row.className='check-item';
    row.querySelector('.check-box').textContent='';
  });
  updateGlobal();
}

function showFb(n,cls,icon,title,det){
  var fb=$('fb'+n); fb.className='feedback show '+cls;
  $('fbi'+n).textContent=icon;
  $('fbt'+n).textContent=title;
  $('fbd'+n).innerHTML=det;
}

function shuffle(a){ var b=a.slice(); for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;} return b; }

function updateGlobal(){
  var ok=0,ko=0,rem=0;
  scores.forEach(function(s,i){
    var max=i===4?6:1;
    if(s===null) rem+=max;
    else { ok+=s; ko+=max-s; }
  });
  $('cnt-ok').textContent=ok; $('cnt-ko').textContent=ko; $('cnt-rem').textContent=rem;
  var doneCnt=done.filter(Boolean).length;
  var pct=Math.round(doneCnt/5*100);
  $('prog-fill').style.width=pct+'%';
  $('prog-label').textContent=doneCnt+' / 5 activités';
  $('prog-pct').textContent=pct+' %';
}

function checkAllDone(){ if(done.every(Boolean)) setTimeout(showResults,500); }

function showResults(){
  var total=scores.reduce(function(a,b){ return a+(b||0); },0);
  $('r-score').textContent=total;
  var s=total>=9?5:total>=7?4:total>=5?3:total>=3?2:1;
  $('r-stars').textContent='⭐'.repeat(s)+'☆'.repeat(5-s);
  var msgs=['À retravailler !','Courage, tu progresses !','Pas mal — continue !','Très bien !','Parfait !'];
  $('r-msg').textContent=msgs[s-1];
  var recap=$('r-recap'); recap.innerHTML='';
  var labels=['Dans quel temps ?','Une habitude ou une action unique ?','Que comprends-tu ?','Description ou action ?','Formule ton hypothèse'];
  var maxes=[1,1,1,1,6];
  scores.forEach(function(sc,i){
    var pts=sc||0; var max=maxes[i]; var ok2=pts>=max;
    var d=document.createElement('div'); d.className='recap-item '+(ok2?'ok-r':'ko-r');
    d.innerHTML='<span>'+(ok2?'✅':pts>0?'→':'❌')+'</span><span style="flex:1;color:#8a8f9a;">Act.'+(i+1)+' — '+labels[i]+'</span><span style="color:var(--day-dark);font-weight:700;">'+pts+'/'+max+'</span>';
    recap.appendChild(d);
  });
  $('results-screen').classList.add('show');
  window.scrollTo({top:0,behavior:'smooth'});
}

function restartAll(){
  scores=new Array(5).fill(null); done=new Array(5).fill(false);
  $('results-screen').classList.remove('show');
  buildAll(); updateGlobal();
  window.scrollTo({top:0,behavior:'smooth'});
}

buildAll(); updateGlobal();
</script>
</body>
</html>
