    Lis la question, les propositions de réponses et déplace ta montgolfière pour sélectionner la bonne réponse.<br><br>
    <b style="color:#e5c417">↑ Espace/Clic</b> — Monter<br>
    <b style="color:#e5c417">← →</b> — Se déplacer
  </p>

<script>
const QUESTIONS=[
  {q:"Q1A — Quelle région les voyageurs traversent-ils ?",
   ch:["Une forêt tropicale pleine d'animaux.","Un désert aride, sans habitants.","Une région montagneuse couverte de neige."],a:1,
   fb:"Le texte décrit une région de plus en plus désertique : pas de village, pas de végétation, seulement du sable, des pierres et des rochers."},
  {q:"Q1B — Quelle phrase du texte le montre ?",
   ch:["« Nous allons nous lancer dans l'inconnu désormais. »","« Le désert se faisait peu à peu. Plus un village, pas même une réunion de quelques huttes. »","« Tout cela était rigoureusement mathématique. »"],a:1,
   fb:"Cette phrase résume parfaitement la région : le désert avance, les habitations et la végétation ont complètement disparu."},
  {q:"Q2A — Comment se déplacent les voyageurs ?",
   ch:["En avion, survolant le désert d'Afrique.","À pied, en suivant une caravane.","Dans une montgolfière appelée le Victoria."],a:2,
   fb:"Le Victoria est le nom de la montgolfière du docteur Fergusson. C'est dans cette nacelle suspendue à un ballon qu'ils survolent l'Afrique."},
  {q:"Q2B — Quelle phrase du texte le montre ?",
   ch:["« il eût souhaité une tempête pour l'entraîner au delà de ce pays »","« À la fin de cette journée, le Victoria n'avait pas franchi trente milles. »","« il ne semblait pas qu'une caravane eût jamais affronté cette contrée »"],a:1,
   fb:"Le nom Victoria est clairement mentionné dans cette phrase, avec la distance parcourue dans la journée."},
  {q:"Q3A — Quel est le principal danger ?",
   ch:["Ils risquent d'être attaqués par des animaux sauvages.","Ils manquent d'eau et risquent de mourir de soif.","Leur montgolfière est en train de se déchirer."],a:1,
   fb:"La menace principale est le manque d'eau. Avec une chaleur de plus de 32 degrés et seulement 4 litres d'eau pour trois personnes, la situation est très grave."},
  {q:"Q3B — Quelle phrase montre ce danger ?",
   ch:["« Et pas un nuage au ciel ! »","« Si l'eau n'eût pas manqué ! Mais il en restait en tout trois gallons ! »","« La végétation se retirait. »"],a:1,
   fb:"Cette exclamation montre l'inquiétude du narrateur : trois gallons (environ 4 litres), c'est vraiment très peu pour survivre dans un désert aussi chaud."},
  {q:"Q4A — Quels adjectifs décrivent la région dans le texte ?",
   ch:["triste et mystérieuse","désolée et déserte","peuplée et triste"],a:1,
   fb:"Dans le texte, on trouve 'cette contrée déserte' et 'cette région désolée'. Les trois autres adjectifs (triste, mystérieuse, peuplée) ne figurent pas dans cet extrait."},
  {q:"Q4B — Ces adjectifs sont-ils positifs ou négatifs ?",
   ch:["Positifs : ils montrent que la région est belle.","Négatifs : ils montrent que la région est inhospitalière et sans vie.","Neutres : ils décrivent simplement la région sans jugement."],a:1,
   fb:"Déserte (sans habitants) et désolée (abandonnée, triste) sont deux adjectifs très négatifs qui montrent que cette région est hostile et sans vie."},
  {q:"Q5A — Combien de temps leur reste-t-il pour trouver de l'eau ?",
   ch:["Une semaine entière.","Trois jours et demi.","Vingt-quatre heures."],a:1,
   fb:"Le docteur Fergusson calcule précisément : avec l'eau restante, la montgolfière peut voler encore 54 heures, soit trois jours et demi."},
  {q:"Q5B — Quelle phrase du texte le dit clairement ?",
   ch:["« Tout cela était rigoureusement mathématique. »","« il ne restait en tout que trois gallons »","« c'est trois jours et demi de voyage qu'il nous reste, et pendant lesquels il faut trouver de l'eau à tout prix. »"],a:2,
   fb:"Cette phrase est la conclusion du calcul du docteur : il annonce clairement à ses amis la durée qu'il leur reste pour trouver de l'eau."},
  {q:"Q6A — Comment le docteur parle-t-il de la situation grave ?",
   ch:["Il leur cache la vérité pour ne pas les inquiéter.","Il s'énerve et leur reproche de trop consommer d'eau.","Il leur explique calmement et avec précision la situation, en leur demandant de faire des efforts."],a:2,
   fb:"Le docteur Fergusson est un homme de science : il ne cache rien, ne s'énerve pas, mais informe ses compagnons avec calme et précision de la réalité de leur situation."},
  {q:"Q6B — Quelle phrase montre ce comportement ?",
   ch:["« il eût souhaité une tempête pour l'entraîner au delà de ce pays »","« J'ai cru devoir vous prévenir de cette situation grave, mes amis. »","« Le désert se faisait peu à peu. »"],a:1,
   fb:"En disant 'j'ai cru devoir vous prévenir', le docteur montre qu'il assume son rôle de chef d'expédition : il informe ses compagnons honnêtement, même quand la nouvelle est mauvaise."},
];

/* ── État ── */
let by=GROUND_Y;        /* Y ballon (coord monde, 0=haut) */
let bx=CX;              /* X ballon */
let vy=0;
let heating=false, moveL=false, moveR=false;
let score=0, qIdx=0, progress=0;
let gameRunning=false;
let tick=0;
let collisionCooldown=0;
let clouds=[];          /* nuages-réponses */
let feedback=null;      /* {text,color,timer} */
let particles=[];

/* ── Audio ── */
let ac=null;
function beep(f,d,t,v){
  try{
    if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=t||'sine';o.frequency.value=f;
    g.gain.setValueAtTime(v||0.08,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+d/1000);
    o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d/1000);
  }catch(e){}
}
const sRight=()=>{beep(880,70);setTimeout(()=>beep(1100,70),80);setTimeout(()=>beep(1320,180),160);};
const sWrong=()=>beep(180,300,'sawtooth',.12);
const sWin=()=>{beep(660,80);setTimeout(()=>beep(880,80),100);setTimeout(()=>beep(1100,80),200);setTimeout(()=>beep(1320,280),300);};

/* ── Particules ── */
function spawnP(x,y,col,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=2+Math.random()*5;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,
      life:30+Math.random()*20,max:50,r:2+Math.random()*4,col});
  }
}

/* ── Spawn question ── */
function loadQuestion(){
  collisionCooldown=60;
  if(qIdx>=QUESTIONS.length){ endGame(true); return; }
  const q=QUESTIONS[qIdx];
  const colW=W/CLOUD_COLS;
  /* Mélanger les choix */
  const shuffled=q.ch.map((c,i)=>(({text:c,correct:i===q.a})));
  for(let i=shuffled.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];
  }
  clouds=shuffled.map((ch,i)=>(({
    text:ch.text,
    correct:ch.correct,
    cx:colW*(i+0.5),
    cy:CLOUD_Y+CLOUD_H/2,
    w:CLOUD_W,h:CLOUD_H,
    popped:false,popTimer:0,
    phase:Math.random()*Math.PI*2,
    color:['#e74c3c','#3498db','#27ae60','#9b59b6'][i],
  })));
}

/* ── Contrôles ── */
window.addEventListener('keydown',e=>{
  if(['Space','ArrowUp','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(e.code==='Space'||e.code==='ArrowUp'){ heating=true; resume(); }
  if(e.code==='ArrowLeft')  moveL=true;
  if(e.code==='ArrowRight') moveR=true;
});
window.addEventListener('keyup',e=>{
  if(e.code==='Space'||e.code==='ArrowUp') heating=false;
  if(e.code==='ArrowLeft')  moveL=false;
  if(e.code==='ArrowRight') moveR=false;
});
window.addEventListener('mousedown',()=>{heating=true;resume();});
window.addEventListener('mouseup',()=>{heating=false;});
window.addEventListener('touchstart',e=>{e.preventDefault();heating=true;resume();},{passive:false});
window.addEventListener('touchend',()=>{heating=false;});

function resume(){
  if(!gameRunning)return;
}

/* ── Physique ── */
function update(){
  tick++;
  if(!gameRunning)return;

  /* Vertical */
  if(heating){ if(vy>-8)vy-=0.35; }
  else{ if(vy<5)vy+=0.18; }
  by+=vy;
  if(by>=GROUND_Y){by=GROUND_Y;vy=0;}
  if(by<60){by=60;if(vy<0)vy=0;}

  /* Horizontal */
  const HSPEED=4;
  if(moveL) bx=Math.max(50,bx-HSPEED);
  if(moveR) bx=Math.min(W-50,bx+HSPEED);

  /* Collision nuages */
  if(collisionCooldown>0){collisionCooldown--;}
  clouds.forEach(c=>{
    if(c.popped)return;
    if(Math.abs(bx-c.cx)<c.w/2-25&&Math.abs(by-c.cy)<c.h/2-20){
      if(collisionCooldown>0)return;
      if(vy>=0)return; /* collision seulement si le ballon monte */
      c.popped=true;
      collisionCooldown=45;
      if(c.correct){
        sRight();score+=20;progress++;
        spawnP(c.cx,c.cy,'#89c843',20);spawnP(c.cx,c.cy,'#e5c417',10);
        feedback={text:'✓ Bonne réponse !',color:'#89c843',timer:60};
        clouds.forEach(c2=>{if(!c2.correct)c2.popped=true;});
        qIdx++;
        setTimeout(loadQuestion,1200);
      } else {
        const _q=QUESTIONS[qIdx];
        if(_q&&_q.fb){
          const _fb=document.getElementById('msg');
          const _tp=document.getElementById('msg-titre');
          const _bd=document.getElementById('msg-body');
          if(_fb&&_tp&&_bd){
            _tp.textContent='✗ Mauvaise réponse';
            _bd.innerHTML=_q.fb+'<br><br><i style="color:#aaa;font-size:12px">Le jeu va reprendre...</i>';
            _fb.style.display='block';
            setTimeout(()=>{_fb.style.display='none';},3500);
          }
        }
        sWrong();
        spawnP(c.cx,c.cy,'#e74c3c',14);
        feedback={text:'✗ Essaie encore !',color:'#e74c3c',timer:50};
        setTimeout(()=>{c.popped=false;c.popTimer=0;},700);
      }
    }
  });

  /* Particules */
  particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life--;return p.life>0;});

  /* Feedback timer */
  if(feedback&&--feedback.timer<=0)feedback=null;
}

/* ── RENDU ── */
function draw(){
  ctx.clearRect(0,0,W,H);

  /* Ciel africain */
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#1a6fa8');sky.addColorStop(0.5,'#f0a030');
  sky.addColorStop(0.8,'#e06010');sky.addColorStop(1,'#c04000');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  /* Soleil */
  const sx=W*.78,sy=80;
  const sg=ctx.createRadialGradient(sx,sy,0,sx,sy,55);
  sg.addColorStop(0,'rgba(255,245,150,1)');sg.addColorStop(0.4,'rgba(255,200,50,0.9)');sg.addColorStop(1,'transparent');
  ctx.fillStyle=sg;ctx.beginPath();ctx.arc(sx,sy,55,0,Math.PI*2);ctx.fill();

  /* Collines */
  drawHills();

  /* Sol */
  ctx.fillStyle='#c87830';ctx.fillRect(0,GROUND_Y,W,H-GROUND_Y);
  ctx.fillStyle='#a86020';ctx.fillRect(0,GROUND_Y,W,8);
  /* Termitières */
  for(let i=0;i<6;i++){
    const tx=W/6*i+60+Math.sin(i*1.3)*20;
    ctx.fillStyle='#8b4010';
    ctx.beginPath();ctx.moveTo(tx,GROUND_Y);ctx.lineTo(tx+12,-30+GROUND_Y);ctx.lineTo(tx+24,GROUND_Y);ctx.closePath();ctx.fill();
  }

  /* Nuages-réponses */
  drawClouds();

  /* Ballon */
  drawBalloon();

  /* Particules */
  particles.forEach(p=>{
    ctx.save();ctx.globalAlpha=p.life/p.max;
    ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.restore();
  });

  /* HUD */
  drawHUD();

  /* Feedback */
  if(feedback){
    ctx.save();ctx.globalAlpha=Math.min(1,feedback.timer/20);
    ctx.fillStyle=feedback.color;ctx.font='bold 22px Arial';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(feedback.text,W/2,H/2);
    ctx.restore();
  }
}

function drawHills(){
  const drawH=(base,spd,amp,col)=>{
    ctx.beginPath();ctx.moveTo(0,H);
    for(let x=0;x<=W;x++){
      const y=GROUND_Y-base+Math.sin((x*spd+tick*0.3)*0.008)*amp;
      x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.lineTo(W,H);ctx.closePath();ctx.fillStyle=col;ctx.fill();
  };
  drawH(90,1,22,'#c8731a');
  drawH(55,0.7,18,'#a85c10');
  drawH(20,4,8,'#8b4500');
}

function drawLabel(cx,cy,w,h,accentColor,text,bob){
  const r=14;
  const x=cx-w/2, y=cy-h/2+bob;
  /* Ombre */
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,0.25)';ctx.shadowBlur=10;ctx.shadowOffsetY=5;
  /* Fond dégradé */
  const grad=ctx.createLinearGradient(x,y,x,y+h);
  grad.addColorStop(0,'#f8fbff');
  grad.addColorStop(1,'#ddeeff');
  ctx.fillStyle=grad;
  ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();
  ctx.shadowBlur=0;ctx.shadowOffsetY=0;
  /* Bordure couleur */
  ctx.strokeStyle=accentColor;ctx.lineWidth=3;
  ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.stroke();
  /* Bande colorée en haut */
  ctx.fillStyle=accentColor;
  ctx.beginPath();ctx.roundRect(x,y,w,18,[r,r,0,0]);ctx.fill();
  ctx.restore();
  /* Texte — multi-lignes adaptatif */
  const pad=14;
  const maxW=w-pad*2;
  const fs=11;
  const isCit=text.trim().startsWith('\u00ab')||text.trim().startsWith('\u201c');
  ctx.fillStyle='#0a2040';
  ctx.font=(isCit?'italic ':'')+'bold '+fs+'px Arial';
  ctx.textAlign='center';ctx.textBaseline='top';
  const words=text.split(' ');
  const lines=[];let cur='';
  words.forEach(wd=>{
    const test=cur?cur+' '+wd:wd;
    if(ctx.measureText(test).width>maxW&&cur){lines.push(cur);cur=wd;}
    else cur=test;
  });
  if(cur)lines.push(cur);
  const lh=fs+3;
  const totalH=lines.length*lh;
  const startY=cy+bob-(totalH/2)+6;
  ctx.fillStyle='#1a3560';
  lines.forEach((l,i)=>ctx.fillText(l,cx,startY+i*lh));
}

function drawClouds(){
  if(!gameRunning)return;
  const q=QUESTIONS[Math.min(qIdx,QUESTIONS.length-1)];
  /* Bandeau question */
  ctx.fillStyle='rgba(5,10,30,0.92)';
  ctx.beginPath();ctx.roundRect(10,4,W-20,52,10);ctx.fill();
  ctx.strokeStyle='#e5c417';ctx.lineWidth=2;
  ctx.beginPath();ctx.roundRect(10,4,W-20,52,10);ctx.stroke();
  ctx.fillStyle='#e5c417';ctx.font='bold 10px monospace';
  ctx.textAlign='center';ctx.fillText('❓ QUESTION',W/2,18);
  ctx.fillStyle='#fff';ctx.font='bold 17px Arial';
  ctx.textBaseline='middle';ctx.fillText(q.q,W/2,40);

  /* Étiquettes */
  clouds.forEach(c=>{
    if(c.popped){
      const prog=Math.min(1,(c.popTimer++)/18);
      ctx.save();ctx.globalAlpha=1-prog;
      ctx.fillStyle=c.color;
      for(let i=0;i<8;i++){
        const a=i*Math.PI/4,d=prog*50;
        ctx.beginPath();ctx.arc(c.cx+Math.cos(a)*d,c.cy+Math.sin(a)*d,7*(1-prog),0,Math.PI*2);ctx.fill();
      }
      ctx.restore();return;
    }
    const bob=Math.sin(tick*.08+c.phase)*4;
    drawLabel(c.cx,c.cy,c.w,c.h,c.color,c.text,bob);
  });
}

function drawBalloon(){
  if(!gameRunning)return;
  ctx.save();
  ctx.translate(bx,by);
  ctx.scale(0.55,0.55);
  /* Flamme */
  const fI=heating?1:0.4;
  const fH=heating?22+Math.sin(tick*.4)*5:10+Math.sin(tick*.25)*3;
  const fW=fH*.55;
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(-8,-62,16,8);
  ctx.save();ctx.globalAlpha=fI;
  const fg=ctx.createRadialGradient(0,-62,0,0,-62-fH*.3,fH*.4);
  fg.addColorStop(0,'rgba(255,255,220,1)');fg.addColorStop(0.3,'rgba(255,200,50,0.95)');fg.addColorStop(1,'transparent');
  ctx.fillStyle=fg;
  ctx.beginPath();ctx.moveTo(-fW*.4,-62);ctx.quadraticCurveTo(-fW*.7,-62-fH*.4,0,-62-fH);ctx.quadraticCurveTo(fW*.7,-62-fH*.4,fW*.4,-62);ctx.closePath();ctx.fill();ctx.restore();
  /* Panier */
  const bkG=ctx.createLinearGradient(-28,-38,28,-8);
  bkG.addColorStop(0,'#a06820');bkG.addColorStop(1,'#704010');
  ctx.fillStyle=bkG;ctx.fillRect(-28,-38,56,10);
  ctx.fillStyle='#c88840';ctx.fillRect(-28,-28,56,28);
  ctx.strokeStyle='rgba(0,0,0,0.2)';ctx.lineWidth=1;
  for(let i=0;i<4;i++)ctx.strokeRect(-28+i*14,-28,14,28);
  ctx.fillStyle='#8b5e1a';ctx.fillRect(-30,-30,60,4);
  /* Câbles */
  ctx.strokeStyle='#8b4a00';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(-20,-38);ctx.lineTo(-22,-62);ctx.moveTo(20,-38);ctx.lineTo(22,-62);ctx.stroke();
  /* Ballon rayures */
  ctx.save();
  ctx.beginPath();ctx.moveTo(-28,-62);ctx.quadraticCurveTo(-75,-115,-75,-155);ctx.arc(0,-155,75,Math.PI,0,false);ctx.quadraticCurveTo(75,-115,28,-62);ctx.closePath();ctx.clip();
  const stripes=[[-Math.PI,-Math.PI*.6,'#c03000'],[-Math.PI*.6,-Math.PI*.2,'#e5c417'],[-Math.PI*.2,Math.PI*.2,'#c03000'],[Math.PI*.2,Math.PI*.6,'#e5c417'],[Math.PI*.6,Math.PI,'#c03000']];
  stripes.forEach(([f,t,col])=>{
    const x1=Math.cos(f)*80,x2=Math.cos(t)*80;
    ctx.fillStyle=col;ctx.fillRect(Math.min(x1,x2)-5,-240,Math.abs(x2-x1)+10,200);
  });
  ctx.fillStyle='#c03000';ctx.fillRect(-80,-240,160,200);
  ctx.restore();
  /* Contour */
  ctx.beginPath();ctx.moveTo(-28,-62);ctx.quadraticCurveTo(-75,-115,-75,-155);ctx.arc(0,-155,75,Math.PI,0,false);ctx.quadraticCurveTo(75,-115,28,-62);ctx.closePath();
  ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=2;ctx.stroke();
  /* Reflet */
  ctx.save();ctx.globalAlpha=0.18;ctx.fillStyle='#fff';
  ctx.beginPath();ctx.ellipse(-25,-155,20,35,-0.3,0,Math.PI*2);ctx.fill();ctx.restore();
  ctx.restore();
}

function drawHUD(){
  if(!gameRunning)return;
  /* Score */
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.beginPath();ctx.roundRect(W-120,8,110,36,8);ctx.fill();
  ctx.fillStyle='#f0c040';ctx.font='bold 15px Orbitron,monospace';
  ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillText(score+' pts',W-18,26);
  /* Progression */
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.beginPath();ctx.roundRect(10,8,110,36,8);ctx.fill();
  ctx.fillStyle='#e5c417';ctx.font='bold 13px Orbitron,monospace';
  ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText('❓ '+progress+'/'+QUESTIONS.length,18,26);
}

/* ── Fin ── */
function endGame(won){
  gameRunning=false;
  if(won)sWin();
  const msg=document.getElementById('msg');
  document.getElementById('msg-titre').textContent=won?'🎉 MISSION ACCOMPLIE !':'FIN DU JEU';
  document.getElementById('msg-body').innerHTML=
    (won?'Toutes les questions réussies !<br>':'')
    +'Score : <b style="color:#f0c040">'+score+' pts</b><br>'
    +'Questions : <b style="color:#89c843">'+progress+' / '+QUESTIONS.length+'</b>';
  try{window.parent.postMessage({type:'pazapaScore',score:progress},'*');}catch(e){}
  msg.querySelector('.btn').textContent='↺ Recommencer';
  msg.style.display='block';
}

/* ── Start ── */
function startGame(){
  document.getElementById('msg').style.display='none';
  score=0;progress=0;qIdx=0;tick=0;
  by=GROUND_Y;bx=CX;vy=0;
  particles=[];feedback=null;
  gameRunning=true;
  loadQuestion();
}

/* ── Boucle ── */
function loop(){
  update();draw();
  requestAnimationFrame(loop);
}

/* Init */
document.getElementById('msg').style.display='block';
loop();
</script>
