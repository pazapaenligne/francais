<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PAZAPA — Grand Prix des Équations</title>
<style>
:root{
  --rouge:#e8002d; --rouge-dark:#a0001f;
  --jaune:#f5c518; --jaune-dark:#c49010;
  --vert:#00c853;
  --bg:#0d0d1a; --bg2:#12121f;
  --surface:rgba(255,255,255,.06);
  --border:rgba(255,255,255,.12);
  --text:#f0f0f0; --muted:#888;
  --or:#ffd700; --argent:#c0c0c0;
  --radius:14px; --radius-sm:8px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow-x:hidden;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;}
.screen{display:none;width:100%;min-height:100vh;}
.screen.active{display:flex;}

/* ═══ ÉCRAN DÉPART ═══════════════════════════ */
#screen-start{
  flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 0%,#1a1040 0%,#0d0d1a 60%);
  padding:2rem 1.5rem;text-align:center;position:relative;overflow:hidden;
}
#screen-start::after{
  content:'';position:absolute;top:-20%;left:50%;transform:translateX(-50%);
  width:500px;height:500px;border-radius:50%;
  background:radial-gradient(circle,rgba(232,0,45,.08) 0%,transparent 70%);
  pointer-events:none;
}
.start-badge{
  position:relative;z-index:2;
  display:inline-flex;align-items:center;gap:.5rem;
  background:var(--jaune);color:#000;
  font-size:.76rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  padding:.3rem 1rem;border-radius:99px;margin-bottom:1.6rem;
  box-shadow:0 3px 16px rgba(245,197,24,.55);
}
.start-badge .dot{width:8px;height:8px;border-radius:50%;}
.start-title{
  position:relative;z-index:2;
  font-size:clamp(2.2rem,8vw,4rem);font-weight:900;line-height:1.1;
  letter-spacing:.04em;margin-bottom:.7rem;
  background:linear-gradient(135deg,#ff6b6b,#e8002d,#ff6b6b);
  background-size:200% auto;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:shimmer 2.5s linear infinite;text-transform:uppercase;
}
@keyframes shimmer{to{background-position:200% center;}}
.start-sub{position:relative;z-index:2;font-size:clamp(.88rem,2.5vw,1.05rem);color:var(--muted);margin-bottom:1.2rem;line-height:1.6;}
.start-info{
  position:relative;z-index:2;
  display:inline-flex;align-items:center;gap:.6rem;
  background:var(--surface);border:1px solid var(--border);
  border-radius:99px;padding:.4rem 1.1rem;margin-bottom:2rem;
  font-size:.82rem;color:var(--argent);
}
.btn-start{
  position:relative;z-index:2;
  background:var(--rouge);color:#fff;border:none;border-radius:20px;
  font-size:clamp(1.3rem,4vw,1.8rem);font-weight:900;
  padding:1.2rem 3.5rem;cursor:pointer;letter-spacing:.12em;text-transform:uppercase;
  box-shadow:0 0 0 6px rgba(232,0,45,.25),0 8px 40px rgba(232,0,45,.6);
  min-height:70px;-webkit-tap-highlight-color:transparent;
  animation:pulsStart 1.4s ease-in-out infinite;
  transition:transform .12s;
}
.btn-start:hover{transform:scale(1.05);}
.btn-start:active{transform:scale(.96);animation:none;}
@keyframes pulsStart{
  0%,100%{box-shadow:0 0 0 6px rgba(232,0,45,.25),0 8px 40px rgba(232,0,45,.6);}
  50%{box-shadow:0 0 0 16px rgba(232,0,45,.0),0 12px 50px rgba(232,0,45,.8);}
}

/* ═══ COMPTE À REBOURS ════════════════════════ */
#screen-countdown{flex-direction:column;align-items:center;justify-content:center;background:var(--bg);}
.countdown-lights{display:flex;gap:.8rem;margin-bottom:2.5rem;}
.light{width:48px;height:48px;border-radius:50%;background:#1a0000;border:3px solid #3a0000;transition:background .1s,box-shadow .1s;}
.light.on{background:var(--rouge);box-shadow:0 0 24px 10px rgba(232,0,45,.8);}
.light.go{background:var(--vert);box-shadow:0 0 28px 12px rgba(0,200,83,.9);}
.countdown-num{font-size:clamp(6rem,22vw,10rem);font-weight:900;line-height:1;text-align:center;text-shadow:0 0 50px currentColor;animation:countPop .4s cubic-bezier(.18,.89,.32,1.6) both;}
.rouge-txt{color:var(--rouge);}.vert-txt{color:var(--vert);}
@keyframes countPop{from{transform:scale(2.5);opacity:0;}to{transform:scale(1);opacity:1;}}

/* ═══ ÉCRAN JEU — 2 COLONNES ═════════════════ */
#screen-game{flex-direction:row;align-items:stretch;background:var(--bg);}
.col-circuit{flex:0 0 48%;max-width:48%;position:relative;overflow:hidden;background:#1c1c1c;display:flex;flex-direction:column;}
.circuit-road{position:absolute;inset:0;background:#2a2a2a;}
.road-edge-l{position:absolute;left:0;top:0;bottom:0;width:28px;background:repeating-linear-gradient(180deg,#e8002d 0,#e8002d 22px,#fff 22px,#fff 44px);z-index:2;}
.road-edge-r{position:absolute;right:0;top:0;bottom:0;width:28px;background:repeating-linear-gradient(180deg,#e8002d 0,#e8002d 22px,#fff 22px,#fff 44px);z-index:2;}
.road-center{position:absolute;left:50%;transform:translateX(-50%);width:6px;height:200%;top:-100%;background:repeating-linear-gradient(180deg,rgba(255,255,255,.6) 0,rgba(255,255,255,.6) 28px,transparent 28px,transparent 52px);animation:roadScroll .7s linear infinite;z-index:1;}
@keyframes roadScroll{from{transform:translateX(-50%) translateY(0);}to{transform:translateX(-50%) translateY(50%);}}
.finish-line{position:absolute;top:0;left:28px;right:28px;height:32px;background:repeating-linear-gradient(90deg,#fff 0,#fff 16px,#000 16px,#000 32px);z-index:3;}
.finish-flag{position:absolute;top:2px;right:32px;font-size:1.8rem;z-index:4;animation:flagWave .5s ease-in-out infinite alternate;}
@keyframes flagWave{from{transform:rotate(-4deg);}to{transform:rotate(4deg);}}
.car-in-circuit{position:absolute;left:50%;transform:translateX(-50%);z-index:10;transition:bottom .7s cubic-bezier(.22,1,.36,1);bottom:30px;}
.car-in-circuit img{width:clamp(90px,16vw,140px);display:block;filter:drop-shadow(0 0 18px rgba(232,0,45,.7)) drop-shadow(0 8px 24px rgba(0,0,0,.8));animation:carIdle .35s ease-in-out infinite alternate;}
@keyframes carIdle{from{transform:rotate(-.4deg) scale(1);}to{transform:rotate(.4deg) scale(1.015);}}
.car-in-circuit.zoom-effect img{animation:carZoom .5s ease-out both!important;}
@keyframes carZoom{0%{transform:scale(1);}40%{transform:scale(1.3);}100%{transform:scale(1);}}
.exhaust{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);width:12px;background:linear-gradient(180deg,rgba(245,197,24,.9),rgba(232,0,45,.4),transparent);border-radius:4px;animation:exhaustPulse .2s ease-in-out infinite alternate;}
@keyframes exhaustPulse{from{height:12px;opacity:.7;}to{height:28px;opacity:1;}}
.circuit-progress{position:absolute;bottom:0;left:28px;right:28px;height:6px;background:rgba(255,255,255,.1);z-index:5;}
.circuit-progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--vert),var(--jaune),var(--rouge));transition:width .6s cubic-bezier(.22,1,.36,1);box-shadow:0 0 8px rgba(245,197,24,.6);}
.col-questions{flex:1;display:flex;flex-direction:column;background:var(--bg2);padding:1.5rem 1.3rem;overflow-y:auto;position:relative;}
.questions-inner{flex:1;display:flex;flex-direction:row;gap:10px;align-items:flex-start;}
.questions-left{flex:1;display:flex;flex-direction:column;}
.questions-right{width:210px;flex-shrink:0;display:none;}
.questions-right.show{display:block;}
.hud-right{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.4rem;padding-bottom:1rem;border-bottom:1px solid var(--border);}
.hud-timer{font-size:1.5rem;font-weight:800;font-family:'Courier New',monospace;color:#fff;letter-spacing:.06em;}
.hud-q-label{font-size:.85rem;color:var(--rouge);font-weight:700;letter-spacing:.04em;}
.sound-btn{background:transparent;border:1px solid var(--border);border-radius:6px;padding:.3rem .6rem;cursor:pointer;color:var(--muted);font-size:.9rem;transition:color .15s;-webkit-tap-highlight-color:transparent;}
.sound-btn:hover{color:#fff;}
.eq-display{font-size:clamp(2rem,5vw,3.2rem);font-weight:900;color:#fff;text-align:center;font-family:'Courier New',monospace;margin:1rem 0 1.8rem;text-shadow:0 2px 20px rgba(255,255,255,.15);line-height:1.2;word-break:break-all;}
.choices-list{display:flex;flex-direction:column;gap:.7rem;}
.choice-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-sm);color:var(--rouge);font-size:clamp(1rem,2.5vw,1.2rem);font-weight:800;padding:.9rem 1.4rem;cursor:pointer;transition:background .12s,border-color .12s,transform .1s,color .12s;min-height:56px;-webkit-tap-highlight-color:transparent;font-family:'Courier New',monospace;letter-spacing:.04em;text-align:left;}
.choice-btn:hover:not(:disabled){background:rgba(232,0,45,.15);border-color:var(--rouge);transform:translateX(4px);color:#fff;}
.choice-btn:active:not(:disabled){transform:scale(.98);}
.choice-btn:disabled{cursor:default;}
.choice-btn.correct-ans{background:rgba(0,200,83,.18);border-color:var(--vert);color:var(--vert);animation:flashGreen .5s ease both;}
.choice-btn.wrong-ans{background:rgba(232,0,45,.18);border-color:var(--rouge);color:var(--rouge);opacity:.7;}
@keyframes flashGreen{0%{box-shadow:0 0 0 0 rgba(0,200,83,.8);}50%{box-shadow:0 0 0 14px rgba(0,200,83,0);}100%{box-shadow:none;}}
.feedback-right{margin-top:1rem;padding:.7rem 1rem;border-radius:var(--radius-sm);font-size:clamp(.9rem,2.3vw,1rem);font-weight:700;display:none;animation:popUp .3s cubic-bezier(.18,.89,.32,1.6) both;}
.feedback-right.show{display:block;}
.feedback-right.ok{background:rgba(0,200,83,.15);color:var(--vert);border:1px solid var(--vert);}
.feedback-right.ko{background:rgba(232,0,45,.15);color:var(--rouge);border:1px solid var(--rouge);}
@keyframes popUp{from{transform:scale(.85) translateY(6px);opacity:0;}to{transform:scale(1) translateY(0);opacity:1;}}

/* ═══ ÉCRAN VICTOIRE ═══════════════════════════ */
#screen-win{flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 0%,#1a2a1a,var(--bg));text-align:center;padding:2rem 1.5rem;position:relative;overflow:hidden;}
.confetti-c{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.conf{position:absolute;width:8px;height:8px;border-radius:2px;animation:confFall linear both;will-change:transform;}
@keyframes confFall{0%{opacity:1;transform:translateY(-20px) rotate(0deg);}100%{opacity:.3;transform:translateY(110vh) rotate(720deg);}}
.win-badge{position:relative;z-index:2;display:inline-flex;align-items:center;gap:.5rem;background:var(--jaune);color:#000;font-size:.76rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:.3rem 1rem;border-radius:99px;margin-bottom:1.2rem;box-shadow:0 3px 16px rgba(245,197,24,.55);}
.win-flags{position:relative;z-index:2;font-size:2rem;margin-bottom:.5rem;}
.win-title{position:relative;z-index:2;font-size:clamp(2rem,7vw,3.5rem);font-weight:900;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.4rem;background:linear-gradient(135deg,var(--or),var(--jaune),var(--or));-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 2s linear infinite;}
.win-car{position:relative;z-index:2;margin:1rem auto;animation:podiumDrive .6s cubic-bezier(.18,.89,.32,1.6) both .2s;}
.win-car img{width:clamp(100px,22vw,160px);filter:drop-shadow(0 0 28px rgba(245,197,24,.7));}
@keyframes podiumDrive{from{transform:translateX(-150px);opacity:0;}to{transform:translateX(0);opacity:1;}}
.win-stats{position:relative;z-index:2;display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin:1rem 0 1.5rem;}
.stat-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.75rem 1.3rem;min-width:110px;}
.stat-val{font-size:1.6rem;font-weight:800;color:var(--or);}
.stat-lbl{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
.stars-row{position:relative;z-index:2;font-size:2rem;margin-bottom:1.4rem;letter-spacing:.1em;}
.btn-replay{position:relative;z-index:2;background:linear-gradient(135deg,var(--or),var(--jaune-dark));color:#000;border:none;border-radius:var(--radius);font-size:clamp(1rem,3vw,1.15rem);font-weight:800;padding:.9rem 2.5rem;cursor:pointer;letter-spacing:.06em;box-shadow:0 6px 28px rgba(245,197,24,.5);transition:transform .12s,box-shadow .12s;min-height:52px;-webkit-tap-highlight-color:transparent;}
.btn-replay:hover{transform:translateY(-2px);box-shadow:0 10px 36px rgba(245,197,24,.7);}
.btn-replay:active{transform:scale(.97);}

/* ═══ CALCULATRICE FX-92 ═══════════════════════ */
.calc-toggle{position:fixed;bottom:55px;right:16px;z-index:200;background:transparent;border:none;padding:0;width:52px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .12s;-webkit-tap-highlight-color:transparent;filter:drop-shadow(0 3px 10px rgba(0,0,0,.55));}
.calc-toggle:hover{transform:scale(1.07);}
.calc-toggle.visible{display:flex;}
.calc-toggle img{width:52px;border-radius:8px;}
.calc-toggle .calc-label{background:rgba(0,0,0,.72);color:#fff;font-size:.55rem;font-weight:800;letter-spacing:.04em;padding:1px 6px;border-radius:99px;white-space:nowrap;}
.calc-panel{position:fixed;bottom:115px;right:16px;z-index:300;width:200px;background:#4a9d8a;border:2px solid #357a6a;border-radius:12px;padding:6px 6px 8px;box-shadow:0 10px 36px rgba(0,0,0,.7);display:none;animation:calcSlide .2s ease both;}
.calc-panel.open{display:block;}
@keyframes calcSlide{from{opacity:0;transform:translateY(8px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
.fx-brand{font-size:.68rem;font-weight:900;color:#fff;letter-spacing:.12em;line-height:1.2;}
.fx-model{font-size:.5rem;color:rgba(255,255,255,.75);letter-spacing:.05em;margin-bottom:3px;}
.fx-screen{background:#b8cc90;border:2px solid #6a8050;border-radius:5px;padding:3px 7px;margin-bottom:5px;min-height:34px;box-shadow:inset 0 2px 5px rgba(0,0,0,.2);}
.fx-classwiz{font-size:.42rem;letter-spacing:.18em;color:#4a6030;text-align:right;margin-bottom:1px;}
.fx-expr{font-size:.6rem;color:#2a4020;text-align:right;font-family:'Courier New',monospace;min-height:12px;}
.fx-result{font-size:1rem;font-weight:700;color:#1a2e10;text-align:right;font-family:'Courier New',monospace;word-break:break-all;line-height:1.2;}
.fx-row{display:flex;gap:2px;margin-bottom:2px;}
.fk{flex:1;border:none;border-radius:4px;cursor:pointer;min-height:22px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:filter .08s,transform .08s;-webkit-tap-highlight-color:transparent;font-family:Arial,sans-serif;position:relative;}
.fk:active{transform:scale(.88);filter:brightness(.72);}
.fk .sup{font-size:.36rem;color:#f5c518;line-height:1;position:absolute;top:2px;left:0;right:0;text-align:center;}
.fk .lbl{font-size:.68rem;font-weight:700;line-height:1;}
.fk .lbl.sm{font-size:.58rem;}
.fk .lbl.xs{font-size:.5rem;}
.fk.lt{background:#d0d8d0;color:#111;border-bottom:2px solid #9aaa9a;}
.fk.dk{background:#3a3a3a;color:#fff;border-bottom:2px solid #1a1a1a;}
.fk.wh{background:#f0f0f0;color:#111;border-bottom:2px solid #b0b0b0;}
.fk.ex{background:#c0392b;color:#fff;border-bottom:3px solid #8e1a10;font-size:.7rem;font-weight:900;letter-spacing:.04em;}
.fk.w2{flex:2.1;}

/* Logo Pazapa */
.pazapa-footer{position:fixed;bottom:14px;right:16px;z-index:100;opacity:.75;pointer-events:none;}
.pazapa-footer img{height:30px;display:block;}

/* Responsive */
@media(max-width:640px){
  #screen-game{flex-direction:column;}
  .col-circuit{flex:0 0 260px;max-width:100%;}
  .col-questions{padding:1rem .9rem;}
  .eq-display{font-size:clamp(1.6rem,7vw,2.2rem);margin:.8rem 0 1.2rem;}
  .choice-btn{font-size:clamp(.9rem,4vw,1rem);min-height:48px;}
  .car-in-circuit img{width:clamp(70px,18vw,100px);}
  .road-edge-l,.road-edge-r{width:18px;}
  .finish-line{left:18px;right:18px;}
}
</style>
</head>

<script>
/* ══ ÉQUATIONS ═══════════════════════════════ */
var EQS = [
  {a:2,b:-4,c:8,   label:'2x - 4 = 8'},
  {a:3,b:3, c:9,   label:'3x + 3 = 9'},
  {a:5,b:-7,c:18,  label:'5x - 7 = 18'},
  {a:7,b:4, c:39,  label:'7x + 4 = 39'},
  {a:9,b:-12,c:24, label:'9x - 12 = 24'},
  {a:6,b:5, c:29,  label:'6x + 5 = 29'},
  {a:4,b:-8,c:12,  label:'4x - 8 = 12'},
  {a:8,b:6, c:30,  label:'8x + 6 = 30'},
  {a:10,b:-20,c:40,label:'10x - 20 = 40'},
  {a:12,b:12,c:60, label:'12x + 12 = 60'}
];
var questions=[],current=0,score=0,answered=false;
var timerSec=0,timerInt=null,soundEnabled=true,engineRunning=false;
function $(id){return document.getElementById(id);}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
  $(id).classList.add('active');
  var t=$('calc-toggle');
  if(t) t.style.display = (id==='screen-game') ? 'flex' : 'none';
}
function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}return b;}
function fmtTime(s){var m=Math.floor(s/60),sec=s%60;return(m<10?'0':'')+m+':'+(sec<10?'0':'')+sec;}

/* ══ AUDIO ═══════════════════════════════════ */
function beep(freq,dur,vol,type){
  if(!soundEnabled)return;
  try{var ctx=new(window.AudioContext||window.webkitAudioContext)();var o=ctx.createOscillator();var g=ctx.createGain();var f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=2200;o.connect(f);f.connect(g);g.connect(ctx.destination);o.type=type||'sine';o.frequency.value=freq||440;g.gain.setValueAtTime(0,ctx.currentTime);g.gain.linearRampToValueAtTime(vol||0.25,ctx.currentTime+0.01);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+(dur||0.3));o.start();o.stop(ctx.currentTime+(dur||0.3)+0.05);}catch(e){}
}
function playBeepCount(){beep(220,.22,.35,'sine');}
function playGo(){[523,659,784].forEach(function(f,i){setTimeout(function(){beep(f,.35,.3,'sine');},i*80);});}
function playCorrect(){beep(523,.15,.28,'sine');setTimeout(function(){beep(784,.25,.28,'sine');},130);}
function playWrong(){beep(330,.12,.22,'sine');setTimeout(function(){beep(247,.3,.2,'sine');},100);}
function playWin(){var notes=[523,659,784,1047];notes.forEach(function(f,i){setTimeout(function(){beep(f,.4,.3,'sine');},i*160);});setTimeout(function(){beep(1047,.7,.35,'sine');},700);}

function startEngine(){
  if(engineRunning||!soundEnabled)return;
  var a=$('engine-audio');
  if(!a)return;
  a.volume=0.6;a.loop=true;a.currentTime=0;
  a.play().then(function(){engineRunning=true;}).catch(function(){});
}
function stopEngine(){
  engineRunning=false;
  var a=$('engine-audio');
  if(!a)return;
  var v=a.volume;
  var fade=setInterval(function(){v=Math.max(0,v-0.07);try{a.volume=v;}catch(e){}if(v<=0){clearInterval(fade);try{a.pause();}catch(e){};}},40);
}
function revEngine(){
  var a=$('engine-audio');
  if(!a||!engineRunning)return;
  a.volume=Math.min(1,a.volume+0.3);
  setTimeout(function(){if(a)a.volume=0.6;},400);
}
function toggleSound(){
  soundEnabled=!soundEnabled;
  $('sound-btn').textContent=soundEnabled?'\uD83D\uDD0A':'\uD83D\uDD07';
  if(!soundEnabled)stopEngine();
  else if($('screen-game').classList.contains('active'))startEngine();
}

/* ══ COMPTE À REBOURS ════════════════════════ */
function startCountdown(){
  showScreen('screen-countdown');
  var lights=[$('l1'),$('l2'),$('l3'),$('l4'),$('l5')];
  var num=$('countdown-num');
  lights.forEach(function(l){l.classList.remove('on','go');});
  num.textContent='';num.className='countdown-num rouge-txt';
  var t=0;
  for(var i=0;i<5;i++){
    (function(idx){setTimeout(function(){lights[idx].classList.add('on');playBeepCount();},t);})(i);
    t+=250;
  }
  setTimeout(function(){num.textContent='3';void num.offsetWidth;playBeepCount();},t);
  setTimeout(function(){num.textContent='2';void num.offsetWidth;playBeepCount();},t+700);
  setTimeout(function(){num.textContent='1';void num.offsetWidth;playBeepCount();},t+1400);
  setTimeout(function(){
    lights.forEach(function(l){l.classList.remove('on');l.classList.add('go');});
    num.textContent='GO !';num.className='countdown-num vert-txt';void num.offsetWidth;playGo();
  },t+2100);
  setTimeout(function(){startGame();},t+2900);
}

/* ══ JEU ═════════════════════════════════════ */
function startGame(){
  questions=shuffle(EQS);current=0;score=0;answered=false;
  $('car-in-circuit').style.bottom='30px';
  $('circuit-prog').style.width='0%';
  showScreen('screen-game');
  startTimer();
  showCalcOnGame();
  startEngine();
  renderQ();
}
function startTimer(){timerSec=0;clearInterval(timerInt);timerInt=setInterval(function(){timerSec++;$('hud-timer').textContent=fmtTime(timerSec);},1000);}
function makeChoices(eq){
  var sol=(eq.c-eq.b)/eq.a;
  var pool=[],offs=shuffle([-3,-2,-1,1,2,3,4,-4]);
  for(var i=0;i<offs.length;i++){var v=sol+offs[i];if(pool.indexOf(v)===-1)pool.push(v);if(pool.length===3)break;}
  return{choices:shuffle([sol].concat(pool)),correct:sol};
}
function renderQ(){
  answered=false;
  var eq=questions[current];var data=makeChoices(eq);
  $('hud-q').textContent='Question '+(current+1)+'/10';
  $('circuit-prog').style.width=(current/10*100)+'%';
  $('q-equation').textContent=eq.label;
  $('feedback-right').className='feedback-right';
  $('feedback-right').textContent='';
  var list=$('choices-list');list.innerHTML='';
  data.choices.forEach(function(val){
    var btn=document.createElement('button');btn.className='choice-btn';
    btn.textContent='x = '+val;btn.dataset.val=val;
    btn.addEventListener('click',function(){checkAnswer(val,data.correct,list);});
    list.appendChild(btn);
  });
}
function checkAnswer(chosen,correct,list){
  if(answered)return;answered=true;
  var btns=list.querySelectorAll('.choice-btn');
  btns.forEach(function(b){b.disabled=true;if(+b.dataset.val===correct)b.classList.add('correct-ans');else if(+b.dataset.val===chosen&&chosen!==correct)b.classList.add('wrong-ans');});
  var ok=(chosen===correct);
  var fb=$('feedback-right');
  if(ok){score++;fb.className='feedback-right show ok';fb.textContent='\u2705 Bonne r\u00e9ponse !';playCorrect();revEngine();advanceCar();}
  else{fb.className='feedback-right show ko';fb.textContent='\u274c Mauvaise r\u00e9ponse \u2014 x = '+correct;playWrong();}
  setTimeout(function(){if(current<9){current++;renderQ();}else{finishGame();}},ok?2500:3200);
}
function advanceCar(){
  var col=document.querySelector('.col-circuit');var h=col.offsetHeight;
  var car=$('car-in-circuit');var usable=h-90;var step=usable/10;
  var cur=parseFloat(car.style.bottom)||30;car.style.bottom=Math.min(cur+step,h-60)+'px';
  car.classList.remove('zoom-effect');void car.offsetWidth;car.classList.add('zoom-effect');
  setTimeout(function(){car.classList.remove('zoom-effect');},500);
}
function finishGame(){
  clearInterval(timerInt);$('circuit-prog').style.width='100%';
  var col=document.querySelector('.col-circuit');$('car-in-circuit').style.bottom=(col.offsetHeight-50)+'px';
  stopEngine();setTimeout(function(){playWin();showResults();},900);
}
function showResults(){
  $('win-score').textContent=score;$('win-time').textContent=fmtTime(timerSec);
  var s=score>=9?5:score>=7?4:score>=5?3:score>=3?2:1;
  $('win-stars').textContent='\u2b50'.repeat(s)+'\u2606'.repeat(5-s);
  launchConfetti();showScreen('screen-win');
}
function launchConfetti(){
  var c=$('confetti');c.innerHTML='';var cols=['#f5c518','#e8002d','#00c853','#3ab5d8','#ffffff','#ffd700'];
  for(var i=0;i<80;i++){var d=document.createElement('div');d.className='conf';d.style.left=Math.random()*100+'%';d.style.background=cols[Math.floor(Math.random()*cols.length)];d.style.width=(6+Math.random()*8)+'px';d.style.height=(6+Math.random()*8)+'px';d.style.animationDuration=(1.5+Math.random()*2.5)+'s';d.style.animationDelay=(Math.random()*1.2)+'s';c.appendChild(d);}
}
function resetGame(){clearInterval(timerInt);stopEngine();hideCalc();showScreen('screen-start');}

/* ══ CALCULATRICE ════════════════════════════ */
var calcExpr='',calcCurrent='0',calcJustEvaled=false,calcOpen=false;
function showCalcOnGame(){}
function hideCalc(){var p=$('calc-panel');if(p){p.classList.remove('open');}calcOpen=false;var p=$('calc-panel');if(p){p.classList.remove('open');calcOpen=false;}}
function toggleCalc(){calcOpen=!calcOpen;$('calc-panel').classList.toggle('open',calcOpen);}
function updateCalcScreen(){$('calc-expr').textContent=calcExpr;$('calc-result').textContent=calcCurrent||'0';}
function calcNum(n){if(calcJustEvaled){calcCurrent='';calcExpr='';calcJustEvaled=false;}if(calcCurrent==='0')calcCurrent=n;else calcCurrent+=n;updateCalcScreen();}
function calcDot(){if(calcJustEvaled){calcCurrent='0';calcJustEvaled=false;}if(calcCurrent.indexOf('.')===-1)calcCurrent+='.';updateCalcScreen();}
function isOp(c){return['+','-','\xD7','\xF7','%'].indexOf(c)!==-1;}
function calcOp(op){
  calcJustEvaled=false;
  if(calcExpr&&!isOp(calcExpr[calcExpr.length-1])){calcExpr+=calcCurrent+' '+op+' ';}
  else if(!calcExpr){calcExpr=calcCurrent+' '+op+' ';}
  else{calcExpr=calcExpr.slice(0,-3)+' '+op+' ';}
  calcCurrent='0';updateCalcScreen();
}
function calcEqual(){
  if(!calcExpr)return;
  var full=calcExpr+calcCurrent;
  try{
    var expr=full.replace(/\xD7/g,'*').replace(/\xF7/g,'/').replace(/\u2212/g,'-').replace(/%/g,'/100');
    var res=Function('"use strict";return('+expr+')')();
    res=Math.round(res*1e10)/1e10;
    calcExpr=full+' =';calcCurrent=String(res);calcJustEvaled=true;
  }catch(e){calcCurrent='Erreur';calcExpr='';calcJustEvaled=true;}
  updateCalcScreen();
}
function calcAC(){calcCurrent='0';calcExpr='';calcJustEvaled=false;updateCalcScreen();}
function calcDel(){if(calcJustEvaled){calcAC();return;}if(calcCurrent.length>1)calcCurrent=calcCurrent.slice(0,-1);else calcCurrent='0';updateCalcScreen();}
function calcPlusMinus(){if(calcCurrent!=='0'){calcCurrent=calcCurrent[0]==='-'?calcCurrent.slice(1):'-'+calcCurrent;updateCalcScreen();}}
function calcFn(fn){
  if(fn==='percent'){calcCurrent=String(parseFloat(calcCurrent)/100);updateCalcScreen();return;}
  if(fn==='pi'){if(calcJustEvaled){calcCurrent='';calcExpr='';calcJustEvaled=false;}calcCurrent=calcCurrent==='0'?'3.14159265':calcCurrent+'3.14159265';updateCalcScreen();return;}
  var v=parseFloat(calcCurrent),res;
  if(fn==='sqrt')res=Math.sqrt(v);
  else if(fn==='square')res=v*v;
  else if(fn==='inv')res=1/v;
  else if(fn==='sin')res=Math.sin(v*Math.PI/180);
  else if(fn==='cos')res=Math.cos(v*Math.PI/180);
  else if(fn==='tan')res=Math.tan(v*Math.PI/180);
  else if(fn==='abs')res=Math.abs(v);
  if(res!==undefined){res=Math.round(res*1e10)/1e10;calcCurrent=String(res);calcJustEvaled=true;}
  updateCalcScreen();
}
function calcInsert(ch){if(calcJustEvaled){calcCurrent='';calcExpr='';calcJustEvaled=false;}if(calcCurrent==='0')calcCurrent=ch;else calcCurrent+=ch;updateCalcScreen();}
