<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PAZAPA — Grand Prix des Équations</title>
<style>
:root{
  --rouge:#e8002d; --rouge-dark:#a0001f;
  --jaune:#f5c518; --jaune-dark:#c49010;
  --vert:#00c853;
  --bg:#0d0d1a; --bg2:#12121f; --bg3:#1a1a2e;
  --surface:rgba(255,255,255,.06);
  --border:rgba(255,255,255,.12);
  --text:#f0f0f0; --muted:#888;
  --or:#ffd700;   --argent:#c0c0c0;
  --radius:14px;  --radius-sm:8px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow-x:hidden;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;}

/* ═══ ÉCRANS ═══════════════════════════════ */
.screen{display:none;width:100%;min-height:100vh;}
.screen.active{display:flex;}

/* ═══ ÉCRAN DÉPART ══════════════════════════
   Layout : pleine largeur centré, pas de circuit */
#screen-start{
  flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 0%,#1a1040 0%,#0d0d1a 60%);
  padding:2rem 1.5rem;text-align:center;position:relative;overflow:hidden;
}
/* Lueur déco subtile */
#screen-start::after{
  content:'';position:absolute;top:-20%;left:50%;transform:translateX(-50%);
  width:500px;height:500px;border-radius:50%;
  background:radial-gradient(circle,rgba(232,0,45,.08) 0%,transparent 70%);
  pointer-events:none;
}
.start-badge{
  position:relative;z-index:2;
  display:inline-flex;align-items:center;gap:.5rem;
  background:var(--jaune);color:#000;
  font-size:.76rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  padding:.3rem 1rem;border-radius:99px;margin-bottom:1.6rem;
  box-shadow:0 3px 16px rgba(245,197,24,.55);
}
.start-badge .dot{width:8px;height:8px;border-radius:50%;}
.start-title{
  position:relative;z-index:2;
  font-size:clamp(2.2rem,8vw,4rem);font-weight:900;line-height:1.1;
  letter-spacing:.04em;margin-bottom:.7rem;
  background:linear-gradient(135deg,#ff6b6b,#e8002d,#ff6b6b);
  background-size:200% auto;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:shimmer 2.5s linear infinite;
  text-transform:uppercase;
}
@keyframes shimmer{to{background-position:200% center;}}
.start-sub{
  position:relative;z-index:2;
  font-size:clamp(.88rem,2.5vw,1.05rem);color:var(--muted);
  margin-bottom:1.2rem;line-height:1.6;
}
.start-info{
  position:relative;z-index:2;
  display:inline-flex;align-items:center;gap:.6rem;
  background:var(--surface);border:1px solid var(--border);
  border-radius:99px;padding:.4rem 1.1rem;margin-bottom:2rem;
  font-size:.82rem;color:var(--argent);
}
.btn-start{
  position:relative;z-index:2;
  background:linear-gradient(135deg,var(--rouge),var(--rouge-dark));
  color:#fff;border:none;border-radius:var(--radius);
  font-size:clamp(1rem,3vw,1.2rem);font-weight:800;
  padding:1rem 3rem;cursor:pointer;letter-spacing:.1em;text-transform:uppercase;
  box-shadow:0 6px 32px rgba(232,0,45,.55);
  transition:transform .12s,box-shadow .12s;
  min-height:56px;-webkit-tap-highlight-color:transparent;
}
.btn-start:hover{transform:translateY(-2px);box-shadow:0 10px 40px rgba(232,0,45,.7);}
.btn-start:active{transform:scale(.97);}

/* ═══ COMPTE À REBOURS ═══════════════════════ */
#screen-countdown{
  flex-direction:column;align-items:center;justify-content:center;
  background:var(--bg);
}
.countdown-lights{display:flex;gap:.8rem;margin-bottom:2.5rem;}
.light{width:48px;height:48px;border-radius:50%;background:#1a0000;border:3px solid #3a0000;transition:background .1s,box-shadow .1s;}
.light.on{background:var(--rouge);box-shadow:0 0 24px 10px rgba(232,0,45,.8);}
.light.go{background:var(--vert);box-shadow:0 0 28px 12px rgba(0,200,83,.9);}
.countdown-num{
  font-size:clamp(6rem,22vw,10rem);font-weight:900;line-height:1;text-align:center;
  text-shadow:0 0 50px currentColor;
  animation:countPop .4s cubic-bezier(.18,.89,.32,1.6) both;
}
.rouge-txt{color:var(--rouge);}
.vert-txt{color:var(--vert);}
@keyframes countPop{from{transform:scale(2.5);opacity:0;}to{transform:scale(1);opacity:1;}}

/* ═══ ÉCRAN JEU — 2 COLONNES ════════════════ */
#screen-game{
  flex-direction:row;align-items:stretch;
  background:var(--bg);
}

/* COLONNE GAUCHE — CIRCUIT */
.col-circuit{
  flex:0 0 48%;max-width:48%;
  position:relative;overflow:hidden;
  background:#1c1c1c;
  display:flex;flex-direction:column;
}
/* Route */
.circuit-road{
  position:absolute;inset:0;
  background:#2a2a2a;
}
/* Texture asphalte */
.circuit-road::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 1px 1px at 20% 30%,rgba(255,255,255,.06) 0%,transparent 100%),
    radial-gradient(ellipse 1px 1px at 70% 60%,rgba(255,255,255,.04) 0%,transparent 100%),
    radial-gradient(ellipse 1px 1px at 45% 80%,rgba(255,255,255,.05) 0%,transparent 100%);
}
/* Bords rouge/blanc */
.road-edge-l{
  position:absolute;left:0;top:0;bottom:0;width:28px;
  background:repeating-linear-gradient(180deg,#e8002d 0,#e8002d 22px,#fff 22px,#fff 44px);
  z-index:2;
}
.road-edge-r{
  position:absolute;right:0;top:0;bottom:0;width:28px;
  background:repeating-linear-gradient(180deg,#e8002d 0,#e8002d 22px,#fff 22px,#fff 44px);
  z-index:2;
}
/* Ligne centrale pointillée défilante */
.road-center{
  position:absolute;left:50%;transform:translateX(-50%);
  width:6px;height:200%;top:-100%;
  background:repeating-linear-gradient(
    180deg,
    rgba(255,255,255,.6) 0,rgba(255,255,255,.6) 28px,
    transparent 28px,transparent 52px
  );
  animation:roadScroll .7s linear infinite;
  z-index:1;
}
@keyframes roadScroll{
  from{transform:translateX(-50%) translateY(0);}
  to{transform:translateX(-50%) translateY(50%);}
}
/* Ligne d arrivée en haut */
.finish-line{
  position:absolute;top:0;left:28px;right:28px;height:32px;
  background:repeating-linear-gradient(90deg,#fff 0,#fff 16px,#000 16px,#000 32px);
  z-index:3;
}
.finish-flag{
  position:absolute;top:2px;right:32px;font-size:1.8rem;z-index:4;
  animation:flagWave .5s ease-in-out infinite alternate;
}
@keyframes flagWave{from{transform:rotate(-4deg);}to{transform:rotate(4deg);}}

/* VOITURE dans le circuit */
.car-in-circuit{
  position:absolute;
  left:50%;transform:translateX(-50%);
  z-index:10;
  transition:bottom .7s cubic-bezier(.22,1,.36,1);
  bottom:30px;
}
.car-in-circuit img{
  width:clamp(90px,16vw,140px);
  display:block;
  filter:drop-shadow(0 0 18px rgba(232,0,45,.7)) drop-shadow(0 8px 24px rgba(0,0,0,.8));
  animation:carIdle .35s ease-in-out infinite alternate;
}
@keyframes carIdle{
  from{transform:rotate(-.4deg) scale(1);}
  to{transform:rotate(.4deg) scale(1.015);}
}
.car-in-circuit.zoom-effect img{animation:carZoom .5s ease-out both!important;}
@keyframes carZoom{0%{transform:scale(1);}40%{transform:scale(1.3);}100%{transform:scale(1);}}

/* Flamme échappement */
.exhaust{
  position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);
  width:12px;height:0;
  background:linear-gradient(180deg,rgba(245,197,24,.9),rgba(232,0,45,.4),transparent);
  border-radius:4px;
  animation:exhaustPulse .2s ease-in-out infinite alternate;
}
@keyframes exhaustPulse{from{height:12px;opacity:.7;}to{height:28px;opacity:1;}}

/* Barre de progression en bas du circuit */
.circuit-progress{
  position:absolute;bottom:0;left:28px;right:28px;height:6px;
  background:rgba(255,255,255,.1);z-index:5;
}
.circuit-progress-fill{
  height:100%;width:0%;
  background:linear-gradient(90deg,var(--vert),var(--jaune),var(--rouge));
  transition:width .6s cubic-bezier(.22,1,.36,1);
  box-shadow:0 0 8px rgba(245,197,24,.6);
}

/* COLONNE DROITE — QUESTIONS */
.col-questions{
  flex:1;
  display:flex;flex-direction:column;
  background:var(--bg2);
  padding:1.5rem 1.3rem;
  overflow-y:auto;
}

/* HUD droite */
.hud-right{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:1.4rem;
  padding-bottom:1rem;
  border-bottom:1px solid var(--border);
}
.hud-timer{
  font-size:1.5rem;font-weight:800;
  font-family:'Courier New',monospace;color:#fff;
  letter-spacing:.06em;
}
.hud-q-label{font-size:.85rem;color:var(--rouge);font-weight:700;letter-spacing:.04em;}
.sound-btn{
  background:transparent;border:1px solid var(--border);
  border-radius:6px;padding:.3rem .6rem;cursor:pointer;color:var(--muted);
  font-size:.9rem;transition:color .15s;-webkit-tap-highlight-color:transparent;
}
.sound-btn:hover{color:#fff;}

/* Équation */
.eq-display{
  font-size:clamp(2rem,5vw,3.2rem);font-weight:900;
  color:#fff;text-align:center;
  font-family:'Courier New',monospace;
  margin:1rem 0 1.8rem;
  text-shadow:0 2px 20px rgba(255,255,255,.15);
  line-height:1.2;word-break:break-all;
}

/* Boutons réponses */
.choices-list{display:flex;flex-direction:column;gap:.7rem;}
.choice-btn{
  background:var(--surface);
  border:1.5px solid var(--border);
  border-radius:var(--radius-sm);
  color:var(--rouge);
  font-size:clamp(1rem,2.5vw,1.2rem);font-weight:800;
  padding:.9rem 1.4rem;cursor:pointer;
  transition:background .12s,border-color .12s,transform .1s,color .12s;
  min-height:56px;-webkit-tap-highlight-color:transparent;
  font-family:'Courier New',monospace;
  letter-spacing:.04em;text-align:left;
}
.choice-btn:hover:not(:disabled){
  background:rgba(232,0,45,.15);border-color:var(--rouge);
  transform:translateX(4px);color:#fff;}
.choice-btn:active:not(:disabled){transform:scale(.98);}
.choice-btn:disabled{cursor:default;}
.choice-btn.correct-ans{
  background:rgba(0,200,83,.18);border-color:var(--vert);color:var(--vert);
  animation:flashGreen .5s ease both;}
.choice-btn.wrong-ans{
  background:rgba(232,0,45,.18);border-color:var(--rouge);color:var(--rouge);
  opacity:.7;}
@keyframes flashGreen{
  0%{box-shadow:0 0 0 0 rgba(0,200,83,.8);}
  50%{box-shadow:0 0 0 14px rgba(0,200,83,0);}
  100%{box-shadow:none;}
}

/* Feedback */
.feedback-right{
  margin-top:1rem;padding:.7rem 1rem;border-radius:var(--radius-sm);
  font-size:clamp(.9rem,2.3vw,1rem);font-weight:700;
  display:none;animation:popUp .3s cubic-bezier(.18,.89,.32,1.6) both;
}
.feedback-right.show{display:block;}
.feedback-right.ok{background:rgba(0,200,83,.15);color:var(--vert);border:1px solid var(--vert);}
.feedback-right.ko{background:rgba(232,0,45,.15);color:var(--rouge);border:1px solid var(--rouge);}
@keyframes popUp{from{transform:scale(.85) translateY(6px);opacity:0;}to{transform:scale(1) translateY(0);opacity:1;}}

/* ═══ ÉCRAN VICTOIRE ═══════════════════════ */
#screen-win{
  flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 0%,#1a2a1a,var(--bg));
  text-align:center;padding:2rem 1.5rem;position:relative;overflow:hidden;
}
.confetti-c{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.conf{position:absolute;width:8px;height:8px;border-radius:2px;
  animation:confFall linear both;will-change:transform;}
@keyframes confFall{
  0%{opacity:1;transform:translateY(-20px) rotate(0deg);}
  100%{opacity:.3;transform:translateY(110vh) rotate(720deg);}
}
.win-badge{
  position:relative;z-index:2;
  display:inline-flex;align-items:center;gap:.5rem;
  background:var(--jaune);color:#000;
  font-size:.76rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  padding:.3rem 1rem;border-radius:99px;margin-bottom:1.2rem;
  box-shadow:0 3px 16px rgba(245,197,24,.55);
}
.win-flags{position:relative;z-index:2;font-size:2rem;margin-bottom:.5rem;}
.win-title{
  position:relative;z-index:2;
  font-size:clamp(2rem,7vw,3.5rem);font-weight:900;text-transform:uppercase;
  letter-spacing:.05em;margin-bottom:.4rem;
  background:linear-gradient(135deg,var(--or),var(--jaune),var(--or));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:shimmer 2s linear infinite;
}
.win-car{
  position:relative;z-index:2;
  margin:1rem auto;
  animation:podiumDrive .6s cubic-bezier(.18,.89,.32,1.6) both .2s;
}
.win-car img{width:clamp(100px,22vw,160px);filter:drop-shadow(0 0 28px rgba(245,197,24,.7));}
@keyframes podiumDrive{from{transform:translateX(-150px);opacity:0;}to{transform:translateX(0);opacity:1;}}
.win-stats{
  position:relative;z-index:2;
  display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin:1rem 0 1.5rem;
}
.stat-box{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:.75rem 1.3rem;min-width:110px;
}
.stat-val{font-size:1.6rem;font-weight:800;color:var(--or);}
.stat-lbl{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
.stars-row{position:relative;z-index:2;font-size:2rem;margin-bottom:1.4rem;letter-spacing:.1em;}
.btn-replay{
  position:relative;z-index:2;
  background:linear-gradient(135deg,var(--or),var(--jaune-dark));
  color:#000;border:none;border-radius:var(--radius);
  font-size:clamp(1rem,3vw,1.15rem);font-weight:800;
  padding:.9rem 2.5rem;cursor:pointer;letter-spacing:.06em;
  box-shadow:0 6px 28px rgba(245,197,24,.5);
  transition:transform .12s,box-shadow .12s;
  min-height:52px;-webkit-tap-highlight-color:transparent;
}
.btn-replay:hover{transform:translateY(-2px);box-shadow:0 10px 36px rgba(245,197,24,.7);}
.btn-replay:active{transform:scale(.97);}

/* ═══ RESPONSIVE MOBILE ═════════════════════ */
@media(max-width:640px){
  #screen-game{flex-direction:column;}
  .col-circuit{flex:0 0 260px;max-width:100%;}
  .col-questions{padding:1rem .9rem;}
  .eq-display{font-size:clamp(1.6rem,7vw,2.2rem);margin:.8rem 0 1.2rem;}
  .choice-btn{font-size:clamp(.9rem,4vw,1rem);min-height:48px;}
  .car-in-circuit img{width:clamp(70px,18vw,100px);}
  .road-edge-l,.road-edge-r{width:18px;}
  .finish-line{left:18px;right:18px;}
}

  /* Logo Pazapa fixe en bas droite */
  .pazapa-footer{
    position:fixed;bottom:14px;right:16px;
    z-index:100;opacity:.75;transition:opacity .2s;pointer-events:none;
  }
  .pazapa-footer img{height:36px;display:block;}
  /* Sur écran start : plus visible */
  #screen-start .pazapa-footer-inline{
    position:relative;z-index:2;margin-top:1.8rem;opacity:.8;
  }
  #screen-start .pazapa-footer-inline img{height:40px;display:block;margin:0 auto;}

</style>
</head>

<script>
/* ══ ÉQUATIONS ══════════════════════════════════════════ */
var EQS = [
  {a:2,b:-4,c:8,  label:'2x - 4 = 8'},
  {a:3,b:3, c:9,  label:'3x + 3 = 9'},
  {a:5,b:-7,c:18, label:'5x - 7 = 18'},
  {a:7,b:4, c:39, label:'7x + 4 = 39'},
  {a:9,b:-12,c:24,label:'9x - 12 = 24'},
  {a:6,b:5, c:29, label:'6x + 5 = 29'},
  {a:4,b:-8,c:12, label:'4x - 8 = 12'},
  {a:8,b:6, c:30, label:'8x + 6 = 30'},
  {a:10,b:-20,c:40,label:'10x - 20 = 40'},
  {a:12,b:12,c:60, label:'12x + 12 = 60'}
];

var questions=[], current=0, score=0, answered=false;
var timerSec=0, timerInt=null, soundEnabled=true;

function $(id){return document.getElementById(id);}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
  $(id).classList.add('active');
}
function shuffle(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}
function fmtTime(s){var m=Math.floor(s/60),sec=s%60;return(m<10?'0':'')+m+':'+(sec<10?'0':'')+sec;}

/* ── AUDIO SYNTHÉTIQUE ────────────────────── */
function beep(freq,dur,vol,type){
  if(!soundEnabled)return;
  try{
    var ctx=new(window.AudioContext||window.webkitAudioContext)();
    var o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.frequency.value=freq||440;o.type=type||'sine';
    g.gain.setValueAtTime(vol||0.3,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+(dur||0.3));
    o.start();o.stop(ctx.currentTime+(dur||0.3));
  }catch(e){}
}
function playCorrect(){beep(880,.1,.4,'square');setTimeout(function(){beep(1100,.15,.3,'square');},100);}
function playWrong(){beep(200,.4,.4,'sawtooth');}
function playBeepCount(){beep(660,.18,.5,'square');}
function playGo(){beep(1320,.2,.5,'square');setTimeout(function(){beep(1760,.28,.4,'square');},150);}
function playWin(){[0,150,300,450,600].forEach(function(d,i){setTimeout(function(){beep(440+i*220,.25,.4,'square');},d);});}
function toggleSound(){soundEnabled=!soundEnabled;$('sound-btn').textContent=soundEnabled?'\uD83D\uDD0A':'\uD83D\uDD07';}

/* ── GÉNÉRATION CHOIX ─────────────────────── */
function makeChoices(eq){
  var sol=(eq.c-eq.b)/eq.a;
  var pool=[],offsets=shuffle([-3,-2,-1,1,2,3,4,-4]);
  for(var i=0;i<offsets.length;i++){
    var v=sol+offsets[i];
    if(pool.indexOf(v)===-1)pool.push(v);
    if(pool.length===3)break;
  }
  return {choices:shuffle([sol].concat(pool)),correct:sol};
}

/* ── COMPTE À REBOURS ─────────────────────── */
function startCountdown(){
  showScreen('screen-countdown');
  var lights=[$('l1'),$('l2'),$('l3'),$('l4'),$('l5')];
  var num=$('countdown-num');
  var step=0;
  function nextLight(){
    if(step<5){lights[step].classList.add('on');playBeepCount();step++;setTimeout(nextLight,600);}
    else{
      num.textContent='3';num.className='countdown-num rouge-txt';playBeepCount();
      setTimeout(function(){
        num.textContent='2';num.className='countdown-num rouge-txt';
        void num.offsetWidth;playBeepCount();
        setTimeout(function(){
          num.textContent='1';void num.offsetWidth;playBeepCount();
          setTimeout(function(){
            lights.forEach(function(l){l.classList.remove('on');l.classList.add('go');});
            num.textContent='GO !';num.className='countdown-num vert-txt';
            void num.offsetWidth;playGo();
            setTimeout(function(){startGame();},900);
          },800);
        },800);
      },500);
    }
  }
  setTimeout(nextLight,400);
}

/* ── DÉMARRAGE ────────────────────────────── */
function startGame(){
  questions=shuffle(EQS);current=0;score=0;answered=false;
  $('car-in-circuit').style.bottom='30px';
  $('circuit-prog').style.width='0%';
  showScreen('screen-game');
  startTimer();
  renderQ();
}

/* ── TIMER ────────────────────────────────── */
function startTimer(){
  timerSec=0;clearInterval(timerInt);
  timerInt=setInterval(function(){timerSec++;$('hud-timer').textContent=fmtTime(timerSec);},1000);
}

/* ── RENDU QUESTION ───────────────────────── */
function renderQ(){
  answered=false;
  var eq=questions[current];
  var data=makeChoices(eq);
  $('hud-q').textContent='Question '+(current+1)+'/10';
  $('circuit-prog').style.width=(current/10*100)+'%';
  $('q-equation').textContent=eq.label;
  $('feedback-right').className='feedback-right';
  $('feedback-right').textContent='';
  var list=$('choices-list');list.innerHTML='';
  data.choices.forEach(function(val){
    var btn=document.createElement('button');
    btn.className='choice-btn';
    btn.textContent='x = '+val;
    btn.dataset.val=val;
    btn.addEventListener('click',function(){checkAnswer(val,data.correct,list);});
    list.appendChild(btn);
  });
}

/* ── VÉRIFICATION ─────────────────────────── */
function checkAnswer(chosen,correct,list){
  if(answered)return;
  answered=true;
  var btns=list.querySelectorAll('.choice-btn');
  btns.forEach(function(b){
    b.disabled=true;
    if(+b.dataset.val===correct)b.classList.add('correct-ans');
    else if(+b.dataset.val===chosen&&chosen!==correct)b.classList.add('wrong-ans');
  });
  var ok=(chosen===correct);
  var fb=$('feedback-right');
  if(ok){
    score++;
    fb.className='feedback-right show ok';fb.textContent='\u2705 Bonne r\u00e9ponse !';
    playCorrect();advanceCar();
  }else{
    fb.className='feedback-right show ko';
    fb.textContent='\u274c Mauvaise r\u00e9ponse \u2014 x = '+correct;
    playWrong();
  }
  setTimeout(function(){
    if(current<9){current++;renderQ();}else{finishGame();}
  },ok?2500:3200);
}

/* ── AVANCER LA VOITURE ───────────────────── */
function advanceCar(){
  var col=document.querySelector('.col-circuit');
  var h=col.offsetHeight;
  var car=$('car-in-circuit');
  var usable=h-90;
  var step=usable/10;
  var cur=parseFloat(car.style.bottom)||30;
  car.style.bottom=Math.min(cur+step,h-60)+'px';
  car.classList.remove('zoom-effect');
  void car.offsetWidth;
  car.classList.add('zoom-effect');
  setTimeout(function(){car.classList.remove('zoom-effect');},500);
}

/* ── FIN ──────────────────────────────────── */
function finishGame(){
  clearInterval(timerInt);
  $('circuit-prog').style.width='100%';
  var col=document.querySelector('.col-circuit');
  $('car-in-circuit').style.bottom=(col.offsetHeight-50)+'px';
  setTimeout(function(){playWin();showResults();},900);
}

/* ── RÉSULTATS ────────────────────────────── */
function showResults(){
  $('win-score').textContent=score;
  $('win-time').textContent=fmtTime(timerSec);
  var s=score>=9?5:score>=7?4:score>=5?3:score>=3?2:1;
  $('win-stars').textContent='\u2b50'.repeat(s)+'\u2606'.repeat(5-s);
  launchConfetti();
  showScreen('screen-win');
}

/* ── CONFETTIS ────────────────────────────── */
function launchConfetti(){
  var c=$('confetti');c.innerHTML='';
  var cols=['#f5c518','#e8002d','#00c853','#3ab5d8','#ffffff','#ffd700'];
  for(var i=0;i<80;i++){
    var d=document.createElement('div');d.className='conf';
    d.style.left=Math.random()*100+'%';
    d.style.background=cols[Math.floor(Math.random()*cols.length)];
    d.style.width=(6+Math.random()*8)+'px';d.style.height=(6+Math.random()*8)+'px';
    d.style.animationDuration=(1.5+Math.random()*2.5)+'s';
    d.style.animationDelay=(Math.random()*1.2)+'s';
    c.appendChild(d);
  }
}

/* ── RESET ────────────────────────────────── */
function resetGame(){
  clearInterval(timerInt);
  showScreen('screen-start');
}
</script>
