<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pazapa – Je m'entraîne – S2 J1 – 5e</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --day:#f5a623;--day-dark:#c47a10;--day-dark2:#8a5200;
  --day-light:#fff5e0;--day-border:#f5d080;--day-glow:rgba(245,166,35,.28);
  --bg:#ffffff;--surface:#ffffff;--surface2:#fff9f0;--border:#ede9e0;
  --green:#8dc63f;--green-light:#f0faeb;--green-dark:#3d7a10;
  --pink:#f28b82;--pink-light:#fff0ef;--pink-dark:#c0392b;
  --text:#1a1d23;--muted:#8a8f9a;
  --radius:16px;--radius-sm:10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:1.5rem .75rem 3rem;overflow-x:hidden;-webkit-tap-highlight-color:transparent;}
.wrap{width:100%;max-width:660px;}
.bul{position:fixed;border-radius:50%;pointer-events:none;z-index:0;}
.b1{width:300px;height:300px;top:-100px;right:-100px;background:radial-gradient(circle,rgba(245,166,35,.16),transparent 70%);}
.b2{width:240px;height:240px;bottom:-80px;left:-80px;background:radial-gradient(circle,rgba(242,139,130,.12),transparent 70%);}
.b3{width:160px;height:160px;top:40%;right:-60px;background:radial-gradient(circle,rgba(245,197,24,.10),transparent 70%);}
.b4{width:120px;height:120px;bottom:20%;left:-50px;background:radial-gradient(circle,rgba(245,208,128,.10),transparent 70%);}

header{text-align:center;margin-bottom:1.4rem;position:relative;z-index:1;}
.logo-badge{display:inline-block;background:var(--day);border-radius:50px;padding:7px 20px;
  box-shadow:0 2px 12px var(--day-glow);margin-bottom:.5rem;}
.logo-badge span{font-family:monospace;font-size:14px;font-weight:800;color:#fff;letter-spacing:.5px;}
.week-label{font-family:'JetBrains Mono',monospace;font-size:.85rem;color:var(--muted);margin-bottom:.4rem;font-weight:600;}
h1{font-size:clamp(1.3rem,4.5vw,1.9rem);font-weight:900;line-height:1.2;}
h1 .hl{color:var(--day-dark);}

.consigne{background:var(--day-light);border:1.5px solid var(--day-border);border-left:4px solid var(--day);
  border-radius:var(--radius-sm);padding:.85rem 1.1rem;margin-bottom:1.2rem;
  font-size:clamp(.88rem,2.4vw,.97rem);color:var(--text);line-height:1.75;position:relative;z-index:1;}

.prog-wrap{width:100%;margin-bottom:.8rem;position:relative;z-index:1;}
.prog-info{display:flex;justify-content:space-between;font-size:.73rem;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:.3rem;}
.prog-bg{background:var(--border);border-radius:99px;height:7px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--day),#f5c518);border-radius:99px;transition:width .5s ease;width:0%;}
.chips{display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap;position:relative;z-index:1;}
.chip{display:flex;align-items:center;gap:.35rem;padding:.25rem .65rem;border-radius:99px;font-size:.74rem;font-family:'JetBrains Mono',monospace;border:1.5px solid var(--border);background:var(--surface);font-weight:600;white-space:nowrap;}
.chip .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}

.card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);
  padding:0 0 1.4rem;box-shadow:0 6px 28px rgba(0,0,0,.07);
  animation:fadeUp .35s ease both;margin-bottom:1.6rem;overflow:hidden;position:relative;z-index:1;}
.card-stripe{height:4px;background:linear-gradient(90deg,var(--day),#f5c518,#f28b82,var(--day));}
.card-body{padding:1.3rem 1.3rem 0;}
.q-num{font-size:.68rem;font-family:'JetBrains Mono',monospace;color:var(--muted);margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.1em;}
.q-text{font-size:clamp(.95rem,2.6vw,1.05rem);font-weight:700;color:var(--text);margin-bottom:.9rem;line-height:1.6;}

.part-label{font-size:.72rem;font-weight:800;color:var(--day-dark);text-transform:uppercase;
  letter-spacing:.07em;margin:.85rem 0 .5rem;font-family:'JetBrains Mono',monospace;}
.part-label.part2{color:var(--muted);}

.choices{display:flex;flex-direction:column;gap:.45rem;margin-bottom:.3rem;}
.choice-btn{background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius-sm);
  color:var(--text);font-size:clamp(.88rem,2.4vw,.97rem);font-weight:600;
  padding:.65rem 1rem;cursor:pointer;transition:background .12s,border-color .12s;
  min-height:46px;-webkit-tap-highlight-color:transparent;
  font-family:Arial,Helvetica,sans-serif;text-align:left;
  display:flex;align-items:flex-start;gap:.65rem;word-break:break-word;line-height:1.5;}
.choice-btn:hover:not(:disabled){background:var(--day-light);border-color:var(--day);}
.choice-btn:disabled{cursor:default;}
.choice-letter{width:26px;height:26px;border-radius:50%;flex-shrink:0;min-width:26px;
  display:flex;align-items:center;justify-content:center;
  font-size:.78rem;font-weight:800;font-family:'JetBrains Mono',monospace;
  background:var(--border);color:var(--text);transition:background .12s,color .12s;margin-top:1px;}
.choice-btn.selected{background:var(--day-light);border-color:var(--day);}
.choice-btn.selected .choice-letter{background:var(--day);color:#fff;}
.choice-btn.correct-ans{border-color:var(--green)!important;background:var(--green-light)!important;color:var(--green-dark)!important;}
.choice-btn.correct-ans .choice-letter{background:var(--green);color:#fff;}
.choice-btn.wrong-ans{border-color:var(--pink)!important;background:var(--pink-light)!important;color:var(--pink-dark)!important;}
.choice-btn.wrong-ans .choice-letter{background:var(--pink);color:#fff;}

.citation-choice{font-style:italic;font-size:clamp(.85rem,2.3vw,.93rem);}

.sep{height:1px;background:var(--border);margin:.9rem 0;}

.feedback{padding:.85rem 1rem;border-radius:var(--radius-sm);font-size:clamp(.87rem,2.4vw,.97rem);
  display:none;align-items:flex-start;gap:.6rem;line-height:1.75;margin:0 1.3rem 0;word-break:break-word;}
.feedback.show{display:flex;}
.feedback.ok{background:var(--green-light);border:1.5px solid var(--green);color:var(--green-dark);}
.feedback.mid{background:#fff9f0;border:1.5px solid var(--day-border);color:var(--day-dark2);}
.feedback.ko{background:var(--pink-light);border:1.5px solid var(--pink);color:var(--pink-dark);}
.fb-icon{font-size:1.3rem;flex-shrink:0;}
.fb-title{font-weight:800;margin-bottom:.2rem;}
.fb-det{font-family:'JetBrains Mono',monospace;font-size:.82rem;margin-top:.25rem;line-height:1.85;}

.btn-row{display:flex;gap:.55rem;flex-wrap:wrap;margin:1rem 1.3rem 0;}
@media(max-width:479px){.btn-row{flex-direction:column;}.btn-row .btn{width:100%;justify-content:center;}}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.65rem 1.2rem;
  border-radius:var(--radius-sm);font-family:Arial,Helvetica,sans-serif;
  font-size:clamp(.88rem,2.5vw,.97rem);font-weight:800;cursor:pointer;border:none;
  transition:transform .12s,box-shadow .14s;min-height:2.8rem;-webkit-tap-highlight-color:transparent;}
.btn:active{transform:scale(.96);}
.btn:disabled{opacity:.35;cursor:default;transform:none!important;}
.btn-primary{background:var(--day-dark);color:#fff;box-shadow:0 3px 12px var(--day-glow);flex:1;}
.btn-primary:hover:not(:disabled){transform:translateY(-1px);}
.btn-ghost{background:transparent;color:var(--muted);border:1.5px solid var(--border);}
.btn-ghost:hover:not(:disabled){border-color:var(--day);color:var(--text);}
.btn-next{background:var(--day);color:#fff;flex:1;display:none;box-shadow:0 3px 12px var(--day-glow);}
.btn-next:hover:not(:disabled){transform:translateY(-1px);}

.results{display:none;position:relative;z-index:1;animation:fadeUp .4s ease both;}
.results.show{display:block;}
.results-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);
  padding:2rem 1.4rem;box-shadow:0 6px 28px rgba(0,0,0,.07);text-align:center;position:relative;overflow:hidden;}
.results-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--day),#f5c518,#f28b82,var(--day));}
.score-big{font-size:clamp(2.8rem,10vw,4.5rem);font-weight:900;line-height:1;margin:.6rem 0 .3rem;color:var(--day-dark);}
.stars{font-size:1.9rem;margin:.4rem 0 .8rem;letter-spacing:.1em;}
.r-msg{color:var(--muted);font-size:clamp(.88rem,2.5vw,1rem);margin-bottom:1rem;line-height:1.8;}
.recap{text-align:left;display:flex;flex-direction:column;gap:.4rem;margin-bottom:1.4rem;}
.recap-item{display:flex;align-items:center;gap:.6rem;padding:.45rem .85rem;
  background:#fafaf8;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  font-size:.8rem;font-family:'JetBrains Mono',monospace;}
.recap-item.ok-r{border-color:#b5e08a;}
.recap-item.mid-r{border-color:var(--day-border);}
.recap-item.ko-r{border-color:#f9c0bb;}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:500px){.card-body{padding:1.1rem 1rem 0;}.btn-row{margin:1rem 1rem 0;}.feedback{margin:0 1rem 0;}}
</style>
</head>
<body>
<div class="bul b1"></div><div class="bul b2"></div><div class="bul b3"></div><div class="bul b4"></div>
<div class="wrap">

<header>
  <div class="logo-badge"><span style="color:#e8002d;font-size:13px;">&#9679;</span> <span style="color:#8dc63f;font-size:13px;">&#9679;</span> <span style="color:#3ab5d8;font-size:13px;">&#9679;</span> <span>Pazapa · Français · 5ème</span></div>
  <div class="week-label">Semaine 2 – Jour 1</div>
  <h1>Je m&rsquo;entra&icirc;ne · <span class="hl">Perceval</span></h1>
  <div style="display:inline-block;font-size:.7rem;font-weight:800;padding:.2rem .7rem;border-radius:99px;text-transform:uppercase;letter-spacing:.07em;margin-top:.5rem;background:var(--day-light);color:var(--day-dark);border:1.5px solid var(--day-border);">Compréhension de texte</div>
</header>

<div class="consigne">Lis attentivement chaque question. Choisis d'abord la bonne réponse, puis sélectionne la citation qui justifie ton choix.</div>

<div class="prog-wrap">
  <div class="prog-info">
    <span id="prog-label">Question 1 / 5</span>
    <span id="prog-pct">0 %</span>
  </div>
  <div class="prog-bg"><div class="prog-fill" id="prog-fill"></div></div>
</div>
<div class="chips">
  <div class="chip"><div class="dot" style="background:#8dc63f"></div><span id="cnt-ok">0</span> correct(s)</div>
  <div class="chip"><div class="dot" style="background:#f28b82"></div><span id="cnt-ko">0</span> erreur(s)</div>
  <div class="chip"><div class="dot" style="background:#8a8f9a"></div><span id="cnt-rem">5</span> restant(s)</div>
</div>

<div id="cards-zone"></div>

<!-- RÉSULTATS -->
<div class="results" id="results-screen">
  <div class="results-card">
    <div class="logo-badge" style="display:inline-block;background:var(--day);border-radius:50px;padding:7px 20px;box-shadow:0 2px 12px var(--day-glow);margin-bottom:.6rem;">
      <span style="color:#e8002d;font-size:13px;">&#9679;</span> <span style="color:#8dc63f;font-size:13px;">&#9679;</span> <span style="color:#3ab5d8;font-size:13px;">&#9679;</span> <span style="font-family:monospace;font-size:13px;font-weight:800;color:#fff;letter-spacing:.5px;"> Résultats</span>
    </div>
    <div class="score-big"><span id="r-score">0</span>/10</div>
    <div class="stars" id="r-stars"></div>
    <div class="r-msg" id="r-msg"></div>
    <div class="recap" id="r-recap"></div>
    <button class="btn btn-primary" onclick="restartAll()" style="width:100%;justify-content:center;">↺ Recommencer</button>
  </div>
</div>

</div>
<script>
var $ = function(id){ return document.getElementById(id); };

var QS = [
  {
    num: 1,
    q: "Pourquoi Perceval entre-t-il dans la forêt ?",
    opts: ["Pour rejoindre le roi Arthur.", "Pour voir les chevaliers.", "Pour rendre visite à ses paysans.", "Pour chasser des oiseaux."],
    ans: 2,
    cits: [
      "« il irait voir ses paysans, qui semaient ses avoines »",
      "« il entendit venir à travers la forêt cinq chevaliers »",
      "« les oiseaux, chacun dans son langage, chantent doucement »",
      "« c'est le roi Arthur qui m'a donné tout cet équipement »"
    ],
    cAns: 0,
    fbOk: "Exact ! Perceval part voir ses paysans qui travaillent dans les champs.",
    fbMid: "Bonne réponse, mais la citation choisie ne justifie pas cette réponse. La bonne citation est A : « il irait voir ses paysans, qui semaient ses avoines ».",
    fbKo: "La bonne réponse est C. Perceval entre dans la forêt pour rendre visite à ses paysans — « il irait voir ses paysans, qui semaient ses avoines »."
  },
  {
    num: 2,
    q: "Quelle saison est évoquée au début du récit ?",
    opts: ["L'hiver.", "Le printemps.", "L'été.", "L'automne."],
    ans: 1,
    cits: [
      "« les oiseaux, chacun dans son langage, chantent doucement »",
      "« les arbres fleurissent où les bois et les prés reverdissent »",
      "« cinq chevaliers équipés de toutes leurs armes »",
      "« il entra dans la forêt »"
    ],
    cAns: 1,
    fbOk: "Exact ! Le printemps est décrit avec les arbres en fleurs et les prés qui reverdissent.",
    fbMid: "Bonne réponse, mais la citation choisie ne suffit pas à justifier la saison. La bonne citation est B : « les arbres fleurissent où les bois et les prés reverdissent ».",
    fbKo: "La bonne réponse est B. C'est le printemps — « les arbres fleurissent où les bois et les prés reverdissent »."
  },
  {
    num: 3,
    q: "Quels personnages Perceval rencontre-t-il dans la forêt ?",
    opts: ["Des paysans.", "Des chasseurs.", "Des marchands.", "Des chevaliers."],
    ans: 3,
    cits: [
      "« il irait voir ses paysans »",
      "« il entendit venir à travers la forêt cinq chevaliers équipés de toutes leurs armes »",
      "« les oiseaux [...] chantent doucement »",
      "« la Dame Veuve de la Forêt Déserte »"
    ],
    cAns: 1,
    fbOk: "Exact ! Perceval rencontre cinq chevaliers en armes dans la forêt.",
    fbMid: "Bonne réponse, mais la citation choisie ne justifie pas cette réponse. La bonne citation est B : « il entendit venir à travers la forêt cinq chevaliers équipés de toutes leurs armes ».",
    fbKo: "La bonne réponse est D. Perceval rencontre des chevaliers — « il entendit venir à travers la forêt cinq chevaliers équipés de toutes leurs armes »."
  },
  {
    num: 4,
    q: "Que ressent Perceval lorsqu'il aperçoit les chevaliers ?",
    opts: ["De la peur.", "De la colère.", "De l'émerveillement.", "De la tristesse."],
    ans: 2,
    cits: [
      "« il fut émerveillé »",
      "« il entra dans la forêt »",
      "« il eut vite fait de seller son cheval »",
      "« il irait voir ses paysans »"
    ],
    cAns: 0,
    fbOk: "Exact ! Le texte dit clairement « il fut émerveillé ».",
    fbMid: "Bonne réponse, mais la citation choisie ne justifie pas ce sentiment. La bonne citation est A : « il fut émerveillé ».",
    fbKo: "La bonne réponse est C. Perceval est émerveillé — le texte le dit explicitement : « il fut émerveillé »."
  },
  {
    num: 5,
    q: "Quel objet Perceval questionne-t-il en premier ?",
    opts: ["L'écu.", "Le haubert.", "La lance.", "Le heaume."],
    ans: 2,
    cits: [
      "« quel est ce vêtement ? »",
      "« quel est cet objet que vous tenez ? »",
      "« il saisit alors le bord de l'écu »",
      "« les heaumes brillants »"
    ],
    cAns: 1,
    fbOk: "Exact ! Perceval tend la main vers la lance et demande : « quel est cet objet que vous tenez ? »",
    fbMid: "Bonne réponse, mais la citation choisie ne justifie pas cette réponse. La bonne citation est B : « quel est cet objet que vous tenez ? »",
    fbKo: "La bonne réponse est C. Perceval saisit la lance en premier et demande : « quel est cet objet que vous tenez ? »"
  }
];

var scores = new Array(5).fill(null);
var done   = new Array(5).fill(false);
var selAns = new Array(5).fill(-1);
var selCit = new Array(5).fill(-1);

function buildAll(){
  var zone = $('cards-zone'); zone.innerHTML = '';
  QS.forEach(function(q, qi){ zone.appendChild(buildCard(q, qi)); });
}

function buildCard(q, qi){
  var card = document.createElement('div'); card.className = 'card'; card.id = 'card'+qi;
  var stripe = document.createElement('div'); stripe.className = 'card-stripe'; card.appendChild(stripe);
  var body = document.createElement('div'); body.className = 'card-body'; card.appendChild(body);

  var num = document.createElement('div'); num.className = 'q-num';
  num.textContent = 'Question ' + q.num + ' / ' + QS.length; body.appendChild(num);
  var qtext = document.createElement('div'); qtext.className = 'q-text'; qtext.textContent = q.q; body.appendChild(qtext);

  // Partie 1
  var p1 = document.createElement('div'); p1.className = 'part-label'; p1.textContent = 'Quelle est la bonne réponse ?'; body.appendChild(p1);
  var ch1 = document.createElement('div'); ch1.className = 'choices'; ch1.id = 'ch1_'+qi; body.appendChild(ch1);
  var letters = ['A','B','C','D'];
  q.opts.forEach(function(opt, i){
    var btn = document.createElement('button'); btn.className = 'choice-btn';
    btn.innerHTML = '<span class="choice-letter">'+letters[i]+'</span><span>'+opt+'</span>';
    btn.addEventListener('click', function(){
      if(done[qi]) return;
      ch1.querySelectorAll('.choice-btn').forEach(function(b){ b.classList.remove('selected'); });
      btn.classList.add('selected');
      selAns[qi] = i;
    });
    ch1.appendChild(btn);
  });

  // Séparateur
  var sep = document.createElement('div'); sep.className = 'sep'; body.appendChild(sep);

  // Partie 2
  var p2 = document.createElement('div'); p2.className = 'part-label part2'; p2.textContent = 'Quelle citation justifie ta réponse ?'; body.appendChild(p2);
  var ch2 = document.createElement('div'); ch2.className = 'choices'; ch2.id = 'ch2_'+qi; body.appendChild(ch2);
  q.cits.forEach(function(cit, i){
    var btn = document.createElement('button'); btn.className = 'choice-btn';
    btn.innerHTML = '<span class="choice-letter">'+letters[i]+'</span><span class="citation-choice">'+cit+'</span>';
    btn.addEventListener('click', function(){
      if(done[qi]) return;
      ch2.querySelectorAll('.choice-btn').forEach(function(b){ b.classList.remove('selected'); });
      btn.classList.add('selected');
      selCit[qi] = i;
    });
    ch2.appendChild(btn);
  });

  // Feedback
  var fb = document.createElement('div'); fb.className = 'feedback'; fb.id = 'fb'+qi;
  fb.innerHTML = '<span class="fb-icon" id="fbi'+qi+'"></span><div><div class="fb-title" id="fbt'+qi+'"></div><div class="fb-det" id="fbd'+qi+'"></div></div>';
  card.appendChild(fb);

  // Boutons
  var brow = document.createElement('div'); brow.className = 'btn-row';
  var vbtn = document.createElement('button'); vbtn.className = 'btn btn-primary'; vbtn.id = 'vbtn'+qi;
  vbtn.innerHTML = '✓ Vérifier';
  vbtn.addEventListener('click', function(){ verif(qi); });
  var nbtn = document.createElement('button'); nbtn.className = 'btn btn-next'; nbtn.id = 'nxt'+qi;
  nbtn.innerHTML = 'Suivant →';
  nbtn.addEventListener('click', function(){ scrollToCard(qi+1); });
  var rbtn = document.createElement('button'); rbtn.className = 'btn btn-ghost';
  rbtn.innerHTML = '↺';
  rbtn.addEventListener('click', function(){ resetQ(qi); });
  brow.appendChild(vbtn); brow.appendChild(nbtn); brow.appendChild(rbtn);
  card.appendChild(brow);
  return card;
}

function verif(qi){
  if(done[qi]) return;
  var q = QS[qi];
  var a = selAns[qi]; var ci = selCit[qi];
  if(a < 0 || ci < 0) return;
  done[qi] = true; $('vbtn'+qi).disabled = true;

  var okA = (a === q.ans); var okC = (ci === q.cAns);

  // Colorier partie 1
  var btns1 = $('ch1_'+qi).querySelectorAll('.choice-btn');
  btns1.forEach(function(b, i){
    b.disabled = true; b.classList.remove('selected');
    if(i === q.ans) b.classList.add('correct-ans');
    else if(i === a && !okA) b.classList.add('wrong-ans');
  });
  // Colorier partie 2
  var btns2 = $('ch2_'+qi).querySelectorAll('.choice-btn');
  btns2.forEach(function(b, i){
    b.disabled = true; b.classList.remove('selected');
    if(i === q.cAns) b.classList.add('correct-ans');
    else if(i === ci && !okC) b.classList.add('wrong-ans');
  });

  var pts = (okA ? 1 : 0) + (okC ? 1 : 0);
  scores[qi] = pts;

  var fb = $('fb'+qi);
  var cls = pts === 2 ? 'ok' : pts === 1 ? 'mid' : 'ko';
  fb.className = 'feedback show ' + cls;
  $('fbi'+qi).textContent = pts === 2 ? '✅' : pts === 1 ? '→' : '❌';
  $('fbt'+qi).textContent = pts === 2 ? 'Parfait !' : pts === 1 ? 'À moitié !' : 'Pas tout à fait.';
  $('fbd'+qi).textContent = pts === 2 ? q.fbOk : pts === 1 ? (okA ? q.fbMid : q.fbKo) : q.fbKo;

  // Bouton suivant
  var nxt = $('nxt'+qi);
  if(qi < QS.length - 1){
    nxt.style.display = 'inline-flex';
  } else {
    nxt.style.display = 'none';
  }

  updateGlobal();
  if(done.every(function(d){ return d; })) setTimeout(showResults, 500);
}

function scrollToCard(qi){
  if(qi >= QS.length){ showResults(); return; }
  var card = $('card'+qi);
  if(card) card.scrollIntoView({behavior:'smooth', block:'start'});
}

function resetQ(qi){
  done[qi] = false; scores[qi] = null; selAns[qi] = -1; selCit[qi] = -1;
  $('vbtn'+qi).disabled = false; $('nxt'+qi).style.display = 'none';
  $('fb'+qi).className = 'feedback';
  ['ch1_'+qi,'ch2_'+qi].forEach(function(id){
    $( id).querySelectorAll('.choice-btn').forEach(function(b){
      b.disabled = false; b.classList.remove('selected','correct-ans','wrong-ans');
    });
  });
  updateGlobal();
}

function updateGlobal(){
  var ok=0, ko=0, rem=0;
  scores.forEach(function(s){ if(s===null) rem++; else if(s===2) ok++; else ko++; });
  var done_count = 5 - rem;
  $('cnt-ok').textContent = ok; $('cnt-ko').textContent = ko; $('cnt-rem').textContent = rem;
  var pct = Math.round(done_count / 5 * 100);
  $('prog-fill').style.width = pct + '%';
  $('prog-label').textContent = done_count + ' / 5 questions';
  $('prog-pct').textContent = pct + ' %';
}

function showResults(){
  var total = scores.reduce(function(a,b){ return a + (b||0); }, 0);
  $('r-score').textContent = total;
  var s = total >= 10 ? 5 : total >= 8 ? 4 : total >= 6 ? 3 : total >= 4 ? 2 : 1;
  $('r-stars').textContent = '⭐'.repeat(s) + '☆'.repeat(5-s);
  var msgs = [
    'Relis le texte attentivement et recommence !',
    'Tu progresses — quelques passages à relire.',
    'Pas mal ! Certains détails t\'ont échappé.',
    'Très bien ! Tu as bien compris le texte.',
    'Excellent ! Tu maîtrises tous les détails du texte.'
  ];
  $('r-msg').textContent = msgs[s-1];
  var recap = $('r-recap'); recap.innerHTML = '';
  var labels = ['Perceval entre en forêt','La saison','La rencontre','L\'émerveillement','Le premier objet'];
  scores.forEach(function(sc, i){
    var d = document.createElement('div');
    var pts = sc || 0;
    d.className = 'recap-item ' + (pts===2?'ok-r':pts===1?'mid-r':'ko-r');
    d.innerHTML = '<span>'+(pts===2?'✅':pts===1?'→':'❌')+'</span>'
      +'<span style="flex:1;color:#8a8f9a;">Q.'+(i+1)+' — '+labels[i]+'</span>'
      +'<span style="color:var(--day-dark);font-weight:700;">'+pts+'/2</span>';
    recap.appendChild(d);
  });
  $('results-screen').classList.add('show');
  window.scrollTo({top:0, behavior:'smooth'});
}

function restartAll(){
  scores = new Array(5).fill(null);
  done = new Array(5).fill(false);
  selAns = new Array(5).fill(-1);
  selCit = new Array(5).fill(-1);
  $('results-screen').classList.remove('show');
  buildAll(); updateGlobal();
  window.scrollTo({top:0, behavior:'smooth'});
}

buildAll(); updateGlobal();
</script>
</body>
</html>
