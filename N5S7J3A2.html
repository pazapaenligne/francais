<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Je m'entraîne — Leur ou leurs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fffdf7;
  --surface:#ffffff;
  --border:#e8e2d4;
  --text:#1c1c1c;
  --muted:#8a8272;
  --day:#8dc63f;
  --day-dark:#3d7a10;
  --day-light:#f0faeb;
  --day-border:#b5e08a;
  --green:#1f7a3d;
  --green-bg:#e7faec;
  --green-txt:#14532d;
  --red:#b3261e;
  --red-bg:#fdeaea;
  --red-txt:#7f1d1d;
  --orange:#f5a623;
  --c-pron:#1a6e88;
  --c-pron-bg:#e8f6fb;
  --c-det:#a8541a;
  --c-det-bg:#fdf1e6;
  --radius:16px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  font-size:.95rem;
  line-height:1.6;
  overflow-x:hidden;
  position:relative;
  min-height:100vh;
}
.bubble{position:fixed;border-radius:50%;filter:blur(2px);opacity:.35;z-index:0;pointer-events:none;}
.b1{width:180px;height:180px;background:#f5e08a;top:-60px;right:-50px;}
.b2{width:150px;height:150px;background:var(--day-light);bottom:-40px;left:-40px;}
.b3{width:110px;height:110px;background:#b5e08a;top:40%;right:-60px;opacity:.25;}
.b4{width:120px;height:120px;background:#f7c6c6;top:15%;left:-60px;opacity:.22;}

.wrap{max-width:760px;margin:0 auto;padding:18px 16px 60px;position:relative;z-index:1;}

header{text-align:center;margin-bottom:14px;}
.logo-badge{display:inline-flex;align-items:center;gap:6px;background:#f5a623;border:1px solid #e09410;border-radius:999px;padding:5px 14px;margin-bottom:10px;}
.logo-badge .dots{display:flex;gap:3px;}
.logo-badge .dot{width:8px;height:8px;border-radius:50%;}
.dot.o{background:#7a3d00;}
.dot.g{background:#ffffff;}
.dot.r{background:#7a3d00;opacity:.45;}
.logo-badge span{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:#7a3d00;}
h1{font-size:clamp(1.3rem,4.5vw,2rem);font-weight:900;margin:0 0 4px;color:var(--text);}
.week-label{font-size:.88rem;font-weight:700;color:var(--day-dark);font-family:'JetBrains Mono',monospace;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem 1.3rem;margin-bottom:16px;box-shadow:0 2px 10px rgba(0,0,0,.04);animation:fadeUp .4s ease;position:relative;overflow:hidden;}
.card-stripe{position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,var(--day),var(--day-border));}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

.intro-titre{font-size:.85rem;text-transform:uppercase;font-weight:800;color:var(--day-dark);letter-spacing:.03em;margin-bottom:.5rem;}
.intro-txt{font-size:.92rem;line-height:1.75;}

.btn{font-family:Arial,sans-serif;font-size:clamp(.88rem,2.5vw,.97rem);font-weight:800;min-height:3rem;border-radius:12px;border:none;cursor:pointer;padding:0 1.4rem;transition:.15s;}
/* ── PHASE 1 : visuel d'accueil ── */
#phase1{max-width:900px;margin:0 auto;}
.hero{position:relative;line-height:0;border-radius:var(--radius);overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.10);}
.hero-img{width:100%;height:auto;display:block;}
.hero-btn{
  position:absolute;
  left:30.8%; width:38.7%;
  top:92.3%; transform:translateY(-50%);
  height:12.3%; min-height:44px;
  background:transparent;border:none;padding:0;
  border-radius:999px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:.15s;
}
.hero-btn:hover{background:rgba(255,255,255,.20);}
.hero-btn:active{background:rgba(0,0,0,.10);}
.hero-btn:focus-visible{outline:3px solid #fff;outline-offset:2px;}
#phase2{display:none;}
#phase2.show{display:block;}

#quizZone{display:none;}
#quizZone.show{display:block;}

.progress-bar-outer{background:var(--day-light);border-radius:999px;height:10px;overflow:hidden;border:1px solid var(--day-border);}
.progress-bar-inner{height:100%;background:linear-gradient(90deg,var(--day),var(--day-dark));width:0%;transition:width .5s ease;border-radius:999px;}
.chips{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
.chip{font-family:'JetBrains Mono',monospace;font-size:.74rem;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface);}
.chip.ok{color:var(--green);border-color:var(--green);}
.chip.ko{color:var(--red);border-color:var(--red);}
.chip.rest{color:var(--muted);}
.dots-prog{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px;}
.pdot{width:11px;height:11px;border-radius:50%;background:#e0dacb;transition:.2s;}
.pdot.done{background:var(--green);}
.pdot.done-ko{background:var(--red);}
.pdot.active{background:var(--orange);transform:scale(1.35);}

.theme-badge{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:.72rem;text-transform:uppercase;font-weight:800;color:var(--day-dark);background:var(--day-light);border:1px solid var(--day-border);border-radius:999px;padding:3px 10px;margin-bottom:8px;}
.q-label{font-family:'JetBrains Mono',monospace;font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:6px;}
.consigne{font-size:.9rem;color:var(--text);margin-bottom:.8rem;}
.aide{font-size:.82rem;color:var(--muted);margin-bottom:.9rem;font-style:italic;}

.q-phrase{background:var(--day-light);border-left:4px solid var(--day);border-radius:10px;padding:.85rem 1rem;margin-bottom:1rem;font-style:italic;font-weight:700;font-size:clamp(1.05rem,3.2vw,1.2rem);line-height:1.85;}
.q-phrase .trou{font-style:normal;font-family:'JetBrains Mono',monospace;color:var(--day-dark);letter-spacing:.06em;}
.q-texte{font-size:clamp(1rem,3vw,1.15rem);font-weight:700;line-height:1.6;margin-bottom:1rem;}

.opts{display:flex;flex-direction:column;gap:.6rem;margin-bottom:1rem;}
.opt{
  display:flex;align-items:center;gap:.7rem;
  font-family:Arial,sans-serif;
  font-size:clamp(.95rem,2.6vw,1.05rem);
  min-height:50px;text-align:left;
  padding:.65rem .9rem;border-radius:12px;
  border:2px solid var(--border);background:var(--surface);color:var(--text);
  cursor:pointer;transition:.15s;line-height:1.5;
}
.opt span:last-child{flex:1;min-width:0;word-break:break-word;}
.opt:hover:not(.locked){border-color:var(--day);background:var(--day-light);}
.opt.selected{border-color:var(--day);background:var(--day-light);}
.opt .lettre{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:var(--day-light);color:var(--day-dark);font-family:'JetBrains Mono',monospace;font-weight:800;font-size:.78rem;display:flex;align-items:center;justify-content:center;border:1px solid var(--day-border);}
.opt.selected .lettre{background:var(--day);color:#fff;}
.opt.locked{cursor:default;}
.opt.correct{border-color:var(--green);background:var(--green-bg);box-shadow:0 0 0 3px rgba(31,122,61,.14);}
.opt.correct .lettre{background:var(--green);color:#fff;}
.opt.wrong{border-color:var(--red);background:var(--red-bg);box-shadow:0 0 0 3px rgba(179,38,30,.12);}
.opt.wrong .lettre{background:var(--red);color:#fff;}

/* ── CLASSEMENT EN COLONNES ── */
.banque-lbl{font-family:'JetBrains Mono',monospace;font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:.4rem;}
.banque{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:1.1rem;min-height:50px;}
.banque.vide::after{content:"Toutes les phrases sont classées.";font-size:.82rem;color:var(--muted);font-style:italic;}
.etiq{
  font-family:Arial,sans-serif;font-size:clamp(.88rem,2.4vw,.98rem);
  min-height:44px;padding:.5rem .9rem;
  border:2px solid var(--border);border-radius:12px;
  background:var(--surface);color:var(--text);cursor:pointer;
  transition:.15s;line-height:1.4;max-width:100%;word-break:break-word;text-align:left;
}
.etiq:hover:not(.locked){border-color:var(--day);background:var(--day-light);}
.etiq.sel{border-color:var(--day);background:var(--day-light);box-shadow:0 0 0 3px rgba(141,198,63,.35);font-weight:700;}
.etiq.locked{cursor:default;}
.etiq.correct{border-color:var(--green);background:var(--green-bg);}
.etiq.wrong{border-color:var(--red);background:var(--red-bg);}

.cols{display:flex;gap:10px;margin-bottom:1rem;}
.col{
  flex:1 1 0;min-width:0;
  border:2px dashed var(--border);border-radius:14px;
  padding:.6rem .6rem .7rem;
  background:var(--surface);
  cursor:pointer;transition:.15s;
}
.col.actif{border-color:var(--day);background:var(--day-light);}
.col.locked{cursor:default;}
.col-titre{
  font-family:'JetBrains Mono',monospace;font-size:.7rem;font-weight:800;
  text-transform:uppercase;letter-spacing:.03em;text-align:center;
  padding:.4rem .3rem;border-radius:8px;margin-bottom:.55rem;line-height:1.4;
}
.col-pron .col-titre{background:var(--c-pron-bg);color:var(--c-pron);border:1px solid var(--c-pron);}
.col-det .col-titre{background:var(--c-det-bg);color:var(--c-det);border:1px solid var(--c-det);}
.col-body{display:flex;flex-direction:column;gap:6px;min-height:70px;}
.col-vide{font-size:.78rem;color:var(--muted);font-style:italic;text-align:center;padding:.6rem .2rem;}
@media(max-width:520px){ .cols{flex-direction:column;} }

.fb-box{display:none;padding:.75rem 1rem;line-height:1.75;font-size:clamp(.9rem,2.5vw,1rem);border-left:5px solid var(--border);border-radius:10px;margin-bottom:1rem;}
.fb-box.show{display:block;}
.fb-box.ok{border-left-color:var(--green);background:var(--green-bg);}
.fb-box.ko{border-left-color:var(--red);background:var(--red-bg);}
.fb-titre{font-weight:800;font-style:normal;display:block;margin-bottom:.35rem;}
.fb-box ul{margin:.4rem 0 .1rem 1.2rem;padding:0;}
.fb-box li{margin-bottom:.3rem;}
.hl-ok{color:var(--green-txt);font-weight:700;text-decoration:underline;}
.hl-ko{color:var(--red-txt);font-weight:700;text-decoration:underline;}
.hl-neu{color:var(--day-dark);font-weight:700;}

.btn-row{display:flex;gap:.6rem;flex-wrap:wrap;}
.btn-valider{background:var(--day);color:#fff;}
.btn-valider:disabled{background:#e5ddc9;color:#a99f86;cursor:not-allowed;}
.btn-valider:hover:not(:disabled){background:var(--day-dark);}
.btn-retry{background:var(--surface);color:var(--text);border:2px solid var(--border);}
.btn-retry:hover{border-color:var(--day);}
.btn-suivant{background:var(--day-dark);color:#fff;display:none;}
.btn-suivant.show{display:inline-block;}

.flash-pop{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%) scale(.4);font-size:5rem;z-index:50;pointer-events:none;opacity:0;}
.flash-pop.play{animation:flashPop 1s ease forwards;}
@keyframes flashPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4);}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15);}70%{opacity:1;transform:translate(-50%,-50%) scale(1);}100%{opacity:0;transform:translate(-50%,-50%) scale(1);}}

#resultats{display:none;text-align:center;}
#resultats.show{display:block;}
.res-score{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:clamp(2.8rem,10vw,4.5rem);color:var(--day-dark);}
.res-stars{font-size:1.9rem;letter-spacing:.15em;color:#d8b23a;margin:.3rem 0;}
.res-msg{font-size:clamp(.88rem,2.5vw,1rem);font-weight:700;margin-bottom:.8rem;}
.res-sub{font-family:'JetBrains Mono',monospace;font-size:.8rem;color:var(--muted);margin-bottom:1rem;line-height:1.8;}
.recap-list{text-align:left;font-size:.82rem;font-family:'JetBrains Mono',monospace;border-top:1px solid var(--border);padding-top:.8rem;margin-bottom:1rem;}
.recap-item{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed var(--border);}
.recap-item .st{font-weight:800;flex-shrink:0;}
.recap-item .st.ok{color:var(--green);}
.recap-item .st.ko{color:var(--red);}
.stamp{display:inline-block;font-family:'JetBrains Mono',monospace;font-weight:800;font-size:.9rem;border:3px solid var(--day-dark);color:var(--day-dark);border-radius:10px;padding:.3rem .9rem;transform:rotate(-6deg) scale(0);margin-bottom:.6rem;}
.stamp.play{animation:stampPop .5s ease forwards .1s;}
@keyframes stampPop{0%{transform:rotate(-6deg) scale(0);opacity:0;}60%{transform:rotate(-6deg) scale(1.2);opacity:1;}100%{transform:rotate(-6deg) scale(1);opacity:1;}}
.confetti{position:absolute;font-size:1.2rem;top:-30px;pointer-events:none;animation:particleUp 2.4s ease-in forwards;}
@keyframes particleUp{0%{transform:translateY(0) rotate(0deg);opacity:1;}100%{transform:translateY(340px) rotate(200deg);opacity:0;}}
.btn-restart{background:var(--day);color:#fff;margin-top:.4rem;}
</style>
</head>

      <div class="chip ok">✔ Corrects : <span id="chOk">0</span></div>
      <div class="chip ko">✘ Erreurs : <span id="chKo">0</span></div>
      <div class="chip rest">⏳ Restants : <span id="chRest">13</span></div>
    </div>
    <div class="dots-prog" id="dotsProg"></div>
  </div>

  <div class="card" id="qCard"><div class="card-stripe"></div><div id="qBody"></div></div>
</div>

<div class="card" id="resultats">
  <div class="card-stripe"></div>
  <div class="stamp" id="stamp">TERMINÉ</div>
  <div class="res-score" id="resScore">0/13</div>
  <div class="res-stars" id="resStars"></div>
  <div class="res-msg" id="resMsg"></div>
  <div class="res-sub" id="resSub"></div>
  <div class="recap-list" id="recapList"></div>
  <button class="btn btn-restart" id="btnRestart">↺ Recommencer toute l'activité</button>
</div>

</div>

</div>

<div class="flash-pop" id="flashPop"></div>

<script>
/* ══════════ PAZAPA — N5S7J3A1 — Leur / leurs ══════════ */

var $=function(id){return document.getElementById(id);};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ── DONNÉES (contenu professeure — verbatim) ── */
var DATA=[

/* ══ ACTIVITÉ 1 — Classer les phrases ══ */
{act:1,actLabel:"Activité 1 · Classer les phrases",emoji:"🗂️",type:"tri",
 consigne:"Classe chaque phrase dans la bonne colonne.",
 aide:"Clique sur une phrase, puis clique sur la colonne où tu veux la ranger. Pour la retirer, clique dessus dans la colonne.",
 label:"Manipulation 1",
 colonnes:[{k:"pron",titre:"Pronom personnel"},{k:"det",titre:"Déterminant possessif"}],
 items:[
   {t:"Je leur réponds.",c:"pron"},
   {t:"Leur maison est ancienne.",c:"det"},
   {t:"Nous leur écrivons.",c:"pron"},
   {t:"Leurs voisins arrivent.",c:"det"},
   {t:"Tu leur souris.",c:"pron"},
   {t:"Leur vélo est réparé.",c:"det"},
   {t:"Leurs clés sont perdues.",c:"det"},
   {t:"Elle leur téléphone.",c:"pron"}
 ],
 fbOk:"Excellent ! Tu distingues la fonction du mot selon son rôle dans la phrase.",
 fbKo:"Pense à observer le mot qui suit :",
 fbKoPuces:["s'il accompagne un nom → déterminant ;","s'il accompagne un verbe → pronom."],
 recap:"Act. 1 — Classement"},

/* ══ ACTIVITÉ 2 — Compléter la phrase ══ */
{act:2,actLabel:"Activité 2 · Compléter la phrase",emoji:"✏️",type:"qcm",
 consigne:"Choisis la forme qui complète correctement la phrase.",
 label:"Question 1",
 phrase:"Les élèves ouvrent ___ manuel.",
 question:"Quelle forme convient ?",
 options:["leur","leurs"], ans:0,
 fb:"Le nom manuel est au singulier : on écrit leur.",
 recap:"Act. 2 — Q1"},

{act:2,actLabel:"Activité 2 · Compléter la phrase",emoji:"✏️",type:"qcm",
 consigne:"Choisis la forme qui complète correctement la phrase.",
 label:"Question 2",
 phrase:"Les élèves rangent ___ cahiers.",
 question:"Quelle forme convient ?",
 options:["leur","leurs"], ans:1,
 fb:"Le nom cahiers est au pluriel : le déterminant devient leurs.",
 recap:"Act. 2 — Q2"},

{act:2,actLabel:"Activité 2 · Compléter la phrase",emoji:"✏️",type:"qcm",
 consigne:"Choisis la forme qui complète correctement la phrase.",
 label:"Question 3",
 phrase:"Je ___ distribue les feuilles.",
 question:"Quelle forme convient ?",
 options:["leurs","leur"], ans:1,
 fb:"Ici, le mot remplace des personnes. Tu peux dire à eux.",
 recap:"Act. 2 — Q3"},

{act:2,actLabel:"Activité 2 · Compléter la phrase",emoji:"✏️",type:"qcm",
 consigne:"Choisis la forme qui complète correctement la phrase.",
 label:"Question 4",
 phrase:"Les artistes présentent ___ œuvres.",
 question:"Quelle forme convient ?",
 options:["leur","leurs"], ans:1,
 fb:"Le nom œuvres est pluriel.",
 recap:"Act. 2 — Q4"},

{act:2,actLabel:"Activité 2 · Compléter la phrase",emoji:"✏️",type:"qcm",
 consigne:"Choisis la forme qui complète correctement la phrase.",
 label:"Question 5",
 phrase:"Nous ___ souhaitons une bonne journée.",
 question:"Quelle forme convient ?",
 options:["leur","leurs"], ans:0,
 fb:"Tu peux remplacer par à eux.",
 recap:"Act. 2 — Q5"}
];

var NB=DATA.length;
var MAXPTS=DATA.map(function(d){return d.type==='tri'?d.items.length:1;});
var TOTAL=MAXPTS.reduce(function(a,b){return a+b;},0); /* 13 */
var LABELS=['A','B','C','D'];
var RAIN=['📌','📝','✏️','📗','🔖','✨'];

var state=DATA.map(function(){return {done:false,pts:0,pick:null,assign:null,sel:null,bank:null};});
var cur=0;

/* ── AUDIO ── */
var actx=null,audioReady=false;
function initA(){
  if(audioReady)return;
  try{ actx=new (window.AudioContext||window.webkitAudioContext)(); audioReady=true; }catch(e){}
}
document.addEventListener('pointerdown',function once(){
  initA();
  if(actx&&actx.state==='suspended')actx.resume();
  document.removeEventListener('pointerdown',once);
});
function tone(f1,f2,dur,type){
  if(!actx)return;
  var o=actx.createOscillator(),g=actx.createGain();
  o.type=type||'sine';
  o.frequency.setValueAtTime(f1,actx.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(f2,1),actx.currentTime+dur);
  g.gain.setValueAtTime(.15,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+dur);
  o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+dur);
}
function beepOk(){ if(!actx)return; tone(660,880,.12,'sine'); setTimeout(function(){tone(880,1100,.14,'sine');},110); }
function beepErr(){ tone(220,90,.22,'sawtooth'); }
function beepFinal(ok){
  if(!actx)return;
  if(ok){ [523,659,784,988,1175].forEach(function(f,i){ setTimeout(function(){tone(f,f,.18,'triangle');},i*140); }); }
  else { tone(200,120,.5,'sine'); }
}

/* ── UTILS ── */
function fisher(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){
    var r=new Uint32Array(1); crypto.getRandomValues(r);
    var j=Math.abs((r[0]^Date.now()))%(i+1);
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function flash(sym){
  var el=$('flashPop'); el.textContent=sym;
  el.classList.remove('play'); void el.offsetWidth; el.classList.add('play');
}
function ptsObtenus(){ return state.reduce(function(s,st){return s+st.pts;},0); }
function ptsTraites(){ return state.reduce(function(s,st,i){return s+(st.done?MAXPTS[i]:0);},0); }
function majHud(){
  var traites=ptsTraites(), ok=ptsObtenus();
  $('chOk').textContent=ok;
  $('chKo').textContent=traites-ok;
  $('chRest').textContent=TOTAL-traites;
  $('progFill').style.width=Math.round(traites/TOTAL*100)+'%';
  var h='';
  for(var i=0;i<NB;i++){
    var c='pdot';
    if(state[i].done) c+=(state[i].pts===MAXPTS[i]?' done':' done-ko');
    else if(i===cur) c+=' active';
    h+='<div class="'+c+'"></div>';
  }
  $('dotsProg').innerHTML=h;
}

/* ── DÉMARRAGE ── */
$('btnStart').addEventListener('click',function(){
  $('phase1').style.display='none';
  $('phase2').classList.add('show');
  $('quizZone').classList.add('show');
  render(0);
  window.scrollTo({top:0,behavior:'smooth'});
});

/* ── RENDU ── */
function render(i){
  cur=i;
  var d=DATA[i], st=state[i];
  var h='';
  h+='<div class="theme-badge">'+esc(d.actLabel)+'</div>';
  h+='<div class="q-label">'+esc(d.label)+'</div>';
  h+='<div class="consigne">'+d.emoji+' '+esc(d.consigne)+'</div>';
  if(d.aide) h+='<div class="aide">'+esc(d.aide)+'</div>';

  if(d.type==='tri'){
    if(!st.bank) st.bank=fisher(d.items.map(function(it,k){return k;}));
    if(!st.assign) st.assign=d.items.map(function(){return null;});
    h+='<div class="banque-lbl">Phrases à classer</div>';
    h+='<div class="banque" id="banque"></div>';
    h+='<div class="cols" id="cols">';
    d.colonnes.forEach(function(c){
      h+='<div class="col col-'+c.k+'" data-col="'+c.k+'">'
        +'<div class="col-titre">'+esc(c.titre)+'</div>'
        +'<div class="col-body" data-body="'+c.k+'"></div></div>';
    });
    h+='</div>';
  } else {
    h+='<div class="q-phrase">'+esc(d.phrase).replace('___','<span class="trou">___</span>')+'</div>';
    h+='<div class="q-texte">'+esc(d.question)+'</div>';
    h+='<div class="opts" id="optsWrap">';
    d.options.forEach(function(o,idx){
      h+='<button type="button" class="opt" data-idx="'+idx+'"><span class="lettre">'+LABELS[idx]+'</span><span>'+esc(o)+'</span></button>';
    });
    h+='</div>';
  }

  h+='<div class="fb-box" id="fbBox"></div>';
  h+='<div class="btn-row">';
  h+='<button class="btn btn-valider" id="btnValider" disabled>Valider</button>';
  h+='<button class="btn btn-retry" id="btnRetry" style="display:none;">↺ Recommencer cette question</button>';
  h+='<button class="btn btn-suivant" id="btnNext">'+(i===NB-1?'Voir le bilan →':'Suivant →')+'</button>';
  h+='</div>';

  $('qBody').innerHTML=h;
  attach(i);
  if(st.done) restore(i);
  majHud();
}

/* ── INTERACTIONS ── */
function attach(i){
  var d=DATA[i];
  if(d.type==='tri'){
    $('banque').addEventListener('click',function(ev){
      var b=ev.target.closest('.etiq');
      if(!b||b.classList.contains('locked'))return;
      var k=parseInt(b.dataset.k,10);
      state[i].sel=(state[i].sel===k)?null:k;
      renderTri(i);
    });
    $('cols').addEventListener('click',function(ev){
      var chip=ev.target.closest('.etiq');
      if(chip&&!chip.classList.contains('locked')){
        state[i].assign[parseInt(chip.dataset.k,10)]=null;
        state[i].sel=null;
        renderTri(i);
        return;
      }
      var col=ev.target.closest('.col');
      if(!col||col.classList.contains('locked'))return;
      if(state[i].sel===null)return;
      state[i].assign[state[i].sel]=col.dataset.col;
      state[i].sel=null;
      renderTri(i);
    });
    renderTri(i);
  } else {
    $('optsWrap').addEventListener('click',function(ev){
      var b=ev.target.closest('.opt');
      if(!b||b.classList.contains('locked'))return;
      Array.prototype.forEach.call(document.querySelectorAll('#optsWrap .opt'),function(x){x.classList.remove('selected');});
      b.classList.add('selected');
      state[i].pick=parseInt(b.dataset.idx,10);
      $('btnValider').disabled=false;
    });
  }
  $('btnValider').addEventListener('click',function(){ valider(i); });
  $('btnRetry').addEventListener('click',function(){ retry(i); });
  $('btnNext').addEventListener('click',function(){
    if(i===NB-1){ bilan(); } else { render(i+1); }
  });
}

function renderTri(i){
  var d=DATA[i], st=state[i];
  var hb='';
  st.bank.forEach(function(k){
    if(st.assign[k]!==null)return;
    hb+='<button type="button" class="etiq'+(st.sel===k?' sel':'')+'" data-k="'+k+'">'+esc(d.items[k].t)+'</button>';
  });
  var banque=$('banque');
  banque.innerHTML=hb;
  banque.className='banque'+(hb===''?' vide':'');
  d.colonnes.forEach(function(c){
    var body=document.querySelector('#cols [data-body="'+c.k+'"]');
    var hc='';
    st.bank.forEach(function(k){
      if(st.assign[k]!==c.k)return;
      hc+='<button type="button" class="etiq" data-k="'+k+'">'+esc(d.items[k].t)+'</button>';
    });
    body.innerHTML=hc||'<div class="col-vide">Colonne vide</div>';
  });
  Array.prototype.forEach.call(document.querySelectorAll('#cols .col'),function(col){
    if(st.sel!==null)col.classList.add('actif'); else col.classList.remove('actif');
  });
  $('btnValider').disabled = st.assign.indexOf(null)!==-1;
}

/* ── VALIDATION ── */
function valider(i){
  var d=DATA[i], st=state[i];
  if(st.done)return;
  st.done=true;
  $('btnValider').disabled=true;
  $('btnValider').style.display='none';
  var fb=$('fbBox'), pts=0, ok=false;

  if(d.type==='tri'){
    st.sel=null;
    renderTri(i);
    d.items.forEach(function(it,k){ if(st.assign[k]===it.c)pts++; });
    ok = pts===d.items.length;
    verrouTri(i);
    fb.className='fb-box show '+(ok?'ok':'ko');
    if(ok){
      fb.innerHTML='<span class="fb-titre">✅ Classement complet '+pts+'/'+d.items.length+'</span>'+esc(d.fbOk);
    } else {
      var puces='';
      d.fbKoPuces.forEach(function(p){ puces+='<li>'+esc(p)+'</li>'; });
      fb.innerHTML='<span class="fb-titre">❌ '+pts+'/'+d.items.length+' phrase'+(pts>1?'s':'')+' bien classée'+(pts>1?'s':'')+'</span>'
        +esc(d.fbKo)+'<ul>'+puces+'</ul>';
    }
  } else {
    ok = st.pick===d.ans;
    pts = ok?1:0;
    verrouOpts(i);
    fb.className='fb-box show '+(ok?'ok':'ko');
    fb.innerHTML='<span class="fb-titre">'+(ok?'✅ Bonne réponse':'❌ À revoir')+'</span>'+esc(d.fb);
  }

  st.pts=pts;
  flash(ok?'✓':'✗');
  if(ok)beepOk(); else beepErr();
  $('btnRetry').style.display='inline-block';
  $('btnNext').classList.add('show');
  majHud();
}

function verrouTri(i){
  var d=DATA[i], st=state[i];
  Array.prototype.forEach.call(document.querySelectorAll('#cols .col'),function(c){c.classList.add('locked');c.classList.remove('actif');});
  Array.prototype.forEach.call(document.querySelectorAll('#cols .etiq'),function(b){
    var k=parseInt(b.dataset.k,10);
    b.classList.add('locked');
    b.classList.add(st.assign[k]===d.items[k].c?'correct':'wrong');
  });
  $('banque').classList.add('locked');
}

function verrouOpts(i){
  var d=DATA[i], st=state[i];
  Array.prototype.forEach.call(document.querySelectorAll('#optsWrap .opt'),function(b){
    b.classList.add('locked');
    var idx=parseInt(b.dataset.idx,10);
    if(idx===d.ans)b.classList.add('correct');
    else if(idx===st.pick)b.classList.add('wrong');
  });
}

/* ── RECOMMENCER UNE QUESTION ── */
function retry(i){
  state[i]={done:false,pts:0,pick:null,assign:null,sel:null,bank:null};
  render(i);
}

/* ── RESTAURATION ── */
function restore(i){
  var d=DATA[i], st=state[i];
  var fb=$('fbBox');
  $('btnValider').style.display='none';
  if(d.type==='tri'){
    renderTri(i);
    verrouTri(i);
    var ok=st.pts===d.items.length;
    fb.className='fb-box show '+(ok?'ok':'ko');
    if(ok){ fb.innerHTML='<span class="fb-titre">✅ Classement complet '+st.pts+'/'+d.items.length+'</span>'+esc(d.fbOk); }
    else {
      var puces='';
      d.fbKoPuces.forEach(function(p){ puces+='<li>'+esc(p)+'</li>'; });
      fb.innerHTML='<span class="fb-titre">❌ '+st.pts+'/'+d.items.length+' phrase'+(st.pts>1?'s':'')+' bien classée'+(st.pts>1?'s':'')+'</span>'+esc(d.fbKo)+'<ul>'+puces+'</ul>';
    }
  } else {
    var okq=st.pts===1;
    verrouOpts(i);
    fb.className='fb-box show '+(okq?'ok':'ko');
    fb.innerHTML='<span class="fb-titre">'+(okq?'✅ Bonne réponse':'❌ À revoir')+'</span>'+esc(d.fb);
  }
  $('btnRetry').style.display='inline-block';
  $('btnNext').classList.add('show');
}

/* ── BILAN ── */
function bilan(){
  var s1=0,s2=0;
  DATA.forEach(function(d,i){ if(d.act===1)s1+=state[i].pts; else s2+=state[i].pts; });
  var total=s1+s2;

  $('quizZone').classList.remove('show');
  $('resultats').classList.add('show');
  $('resScore').textContent=total+'/'+TOTAL;
  $('resSub').innerHTML='Activité 1 : '+s1+'/8<br>Activité 2 : '+s2+'/5';

  var msg;
  if(total===13) msg="Maîtrise complète ! Tu ne confonds plus le déterminant et le pronom.";
  else if(total>=10) msg="Très bon travail. Quelques hésitations restent à lever.";
  else if(total>=7) msg="Bonne base. Reprends les items signalés en rouge.";
  else msg="Relis la règle : devant un nom, leur s'accorde ; devant un verbe, il reste invariable.";
  $('resMsg').textContent=msg;

  var nb=total>0?Math.max(1,Math.round(total/TOTAL*5)):0;
  var st='';
  for(var k=1;k<=5;k++) st+= (k<=nb?'★':'☆');
  $('resStars').textContent=st;

  var r='';
  DATA.forEach(function(d,i){
    var full=state[i].pts===MAXPTS[i];
    var val=MAXPTS[i]>1?(state[i].pts+'/'+MAXPTS[i]):(full?'✓':'✗');
    r+='<div class="recap-item"><span>'+esc(d.recap)+'</span><span class="st '+(full?'ok':'ko')+'">'+val+'</span></div>';
  });
  $('recapList').innerHTML=r;

  var stamp=$('stamp'); stamp.classList.remove('play'); void stamp.offsetWidth; stamp.classList.add('play');
  beepFinal(total/TOTAL>=.7);

  if(total/TOTAL>=.7){
    for(var c=0;c<26;c++){
      (function(){
        var el=document.createElement('div');
        el.className='confetti';
        el.textContent=RAIN[Math.floor(Math.random()*RAIN.length)];
        el.style.left=(Math.random()*100)+'%';
        el.style.animationDelay=(Math.random()*.8)+'s';
        $('resultats').appendChild(el);
        setTimeout(function(){el.remove();},3000);
      })();
    }
  }
  $('resultats').scrollIntoView({behavior:'smooth',block:'start'});
}

/* ── RECOMMENCER TOUT ── */
$('btnRestart').addEventListener('click',function(){
  state=DATA.map(function(){return {done:false,pts:0,pick:null,assign:null,sel:null,bank:null};});
  cur=0;
  Array.prototype.forEach.call(document.querySelectorAll('.confetti'),function(c){c.remove();});
  $('resultats').classList.remove('show');
  $('quizZone').classList.add('show');
  render(0);
  window.scrollTo({top:0,behavior:'smooth'});
});
</script>
</body>
</html>
