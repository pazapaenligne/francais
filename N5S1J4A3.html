<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Je relève le défi – 5e S1 J4 · Mots croisés</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --jour:#3ab5d8;--jour-fonce:#1a6e88;--jour-clair:#e8f6fb;--jour-pale:#9dd4e8;
  --day-glow:rgba(58,181,216,.35);
  --bg:#fffdf7;--dark:#1a1f2e;
  --vert:#22c55e;--rouge:#ef4444;--orange:#f5a623;
  --txt:#2b2b2b;--gris:#8b8b8b;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden;padding:16px 12px 60px;position:relative;}
.bulle{position:fixed;border-radius:50%;filter:blur(6px);opacity:.5;z-index:0;pointer-events:none;}
.b1{width:200px;height:200px;background:#ffd84d;top:-60px;right:-50px;}
.b2{width:240px;height:240px;background:var(--jour-pale);bottom:-80px;left:-70px;}
.b3{width:150px;height:150px;background:#9be7a5;top:45%;right:-70px;}
.b4{width:130px;height:130px;background:#f9b8c5;top:30%;left:-60px;}
.wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;width:100%;}

/* HEADER */
.header{text-align:center;margin-bottom:18px;}
.logo-badge{display:inline-flex;align-items:center;gap:8px;background:#f5c518;color:#3a2c00;font-family:'Orbitron',sans-serif;font-weight:700;font-size:.72rem;letter-spacing:1.5px;padding:6px 14px;border-radius:20px;box-shadow:0 3px 10px rgba(245,197,24,.4);margin-bottom:10px;}
.dots{display:inline-flex;gap:3px;}
.dots i{width:7px;height:7px;border-radius:50%;background:#3a2c00;display:block;}
.dots i:nth-child(2){opacity:.6;}.dots i:nth-child(3){opacity:.3;}
.semaine{font-family:'Orbitron',sans-serif;font-size:.75rem;letter-spacing:3px;color:var(--gris);text-transform:uppercase;margin-bottom:6px;}
.titre{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(1.4rem,6vw,2.3rem);line-height:1.15;color:var(--txt);margin-bottom:6px;}
.titre .accent{color:var(--jour);}
.sous-titre{font-family:'Orbitron',sans-serif;font-size:clamp(.65rem,2.5vw,.82rem);letter-spacing:1.5px;color:var(--gris);margin-bottom:14px;}
.badge-revision{display:inline-block;background:var(--jour);color:#fff;font-family:'Orbitron',sans-serif;font-weight:700;font-size:clamp(.68rem,2.5vw,.82rem);letter-spacing:1px;padding:9px 16px;border-radius:24px;box-shadow:0 4px 14px var(--day-glow);animation:pulse 1.8s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.05);box-shadow:0 6px 22px rgba(58,181,216,.7);}}

/* GAME PANEL */
.game{background:var(--dark);border:2px solid var(--jour);border-radius:18px;padding:16px 14px;margin-bottom:20px;box-shadow:0 0 24px var(--day-glow),inset 0 0 40px rgba(0,0,0,.3);}
.game-label{font-family:'JetBrains Mono',monospace;font-size:.62rem;font-weight:700;letter-spacing:2px;color:var(--jour);opacity:.85;margin-bottom:12px;}
.score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.score-cell{text-align:center;}
.score-val{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(1.8rem,7vw,2.8rem);line-height:1;}
.score-val.ok{color:var(--vert);text-shadow:0 0 14px rgba(34,197,94,.6);}
.score-val.rem{color:var(--jour);text-shadow:0 0 14px var(--day-glow);}
.score-val.ko{color:var(--rouge);text-shadow:0 0 14px rgba(239,68,68,.6);}
.score-lbl{font-family:'JetBrains Mono',monospace;font-size:.58rem;letter-spacing:1.5px;color:rgba(255,255,255,.45);text-transform:uppercase;margin-top:2px;}
.etoiles{text-align:center;margin-bottom:14px;font-size:clamp(1.1rem,4vw,1.55rem);letter-spacing:clamp(3px,1.5vw,8px);}
.star{color:rgba(255,255,255,.22);transition:.3s;display:inline-block;}
.star.on{color:var(--jour);text-shadow:0 0 12px var(--jour);animation:starPop .5s cubic-bezier(.18,.89,.32,1.6);}
@keyframes starPop{0%{transform:scale(0);}60%{transform:scale(1.5);}100%{transform:scale(1);}}
.xp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.xp-head span{font-family:'Orbitron',sans-serif;font-size:.6rem;letter-spacing:1px;color:var(--jour);opacity:.85;}
.xp-head span:last-child{font-size:.68rem;font-weight:700;opacity:1;}
.xp-bar{height:9px;background:rgba(255,255,255,.08);border-radius:8px;overflow:hidden;}
.xp-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--jour-fonce),var(--jour),#a8e6f5);box-shadow:0 0 10px var(--jour);border-radius:8px;transition:width .8s cubic-bezier(.22,1,.36,1);}
.score-counter{font-family:'Orbitron',sans-serif;font-size:.65rem;letter-spacing:2px;color:var(--jour);text-align:center;margin-top:8px;opacity:.8;}

/* LAYOUT — grille gauche, indices droite, côte à côte */
.main-layout{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start;}
@media(max-width:750px){.main-layout{grid-template-columns:1fr;}}
.clues-layout{display:flex;flex-direction:column;gap:12px;}

/* GRILLE */
.grid-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.grid-outer{display:inline-block;background:var(--dark);border:3px solid var(--jour);border-radius:14px;padding:8px;box-shadow:0 0 20px var(--day-glow);}
.cw-grid{display:grid;gap:2px;}
.cell{position:relative;}
.cell.black{background:#0d1117;border-radius:3px;}
.cell.white{background:#fff;border-radius:4px;border:1.5px solid #ccc;}
.cell.white.active{background:var(--jour-clair);border-color:var(--jour);}
.cell.white.correct{background:#e7faec;border-color:var(--vert);}
.cell.white.wrong{background:#fdeaea;border-color:var(--rouge);}
.cell-num{position:absolute;top:1px;left:2px;font-size:clamp(6px,1vw,9px);font-family:'Orbitron',sans-serif;font-weight:700;color:var(--jour-fonce);line-height:1;pointer-events:none;z-index:2;}
.cell-input{width:100%;height:100%;border:none;background:transparent;text-align:center;font-family:'Orbitron',sans-serif;font-weight:700;text-transform:uppercase;cursor:pointer;outline:none;padding:0;caret-color:transparent;color:var(--txt);}
.cell.white.active .cell-input{color:var(--jour-fonce);}
.cell.white.correct .cell-input{color:#157f3a;}
.cell.white.wrong .cell-input{color:var(--rouge);}

/* INDICES */
.clues-panel{}
.clues-layout{display:flex;flex-direction:column;gap:12px;min-width:260px;max-width:360px;}
.clues-card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 4px 16px rgba(0,0,0,.07);max-height:340px;overflow-y:auto;}
.clues-section-title{font-family:'Orbitron',sans-serif;font-size:.72rem;font-weight:700;letter-spacing:1.5px;color:var(--jour-fonce);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.clues-section-title::after{content:'';flex:1;height:1.5px;background:var(--jour-pale);}
.clue-row{display:flex;align-items:flex-start;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;margin-bottom:4px;transition:background .15s,border-left .1s;border-left:3px solid transparent;}
.clue-row:hover{background:var(--jour-clair);}
.clue-row.active{background:var(--jour-clair);border-left:3px solid var(--jour);}
.clue-row.done{opacity:.45;}
.clue-num{font-family:'Orbitron',sans-serif;font-size:.7rem;font-weight:700;color:var(--jour);min-width:28px;flex-shrink:0;margin-top:2px;}
.clue-body{font-size:.9rem;color:var(--txt);line-height:1.5;}
.clue-groupe{font-size:.78rem;color:var(--gris);font-style:italic;}

/* BOUTONS */
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px;}
.btn{font-family:'Orbitron',sans-serif;font-weight:700;font-size:clamp(.7rem,2vw,.8rem);letter-spacing:1px;padding:11px 14px;border:none;border-radius:10px;cursor:pointer;transition:transform .12s;min-height:46px;-webkit-tap-highlight-color:transparent;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:#fff;}
.btn:active{transform:scale(.96);}
.btn-verifier{background:var(--vert);}
.btn-verifier:not(:disabled){animation:neonV 1.4s ease-in-out infinite;}
@keyframes neonV{0%,100%{box-shadow:0 0 6px rgba(34,197,94,.5);}50%{box-shadow:0 0 18px rgba(34,197,94,.95);}}
.btn-solution{background:var(--jour);display:none;}
.btn-recommencer{background:#6b7280;display:none;}
.btn-solution.show,.btn-recommencer.show{display:inline-flex;}
.btn:disabled{background:#d8d8d8!important;cursor:not-allowed;animation:none!important;box-shadow:none!important;}

/* FEEDBACK */
.feedback{display:none;margin-top:12px;padding:12px 16px;border-radius:10px;font-size:.88rem;font-weight:700;line-height:1.6;}
.feedback.show{display:block;}
.feedback.ok{background:#e7faec;color:#157f3a;border:1px solid #9be7a5;}
.feedback.bien{background:#fff8e6;color:#8a6000;border:1px solid #f5d080;}
.feedback.ko{background:#fdeaea;color:#c0392b;border:1px solid #f5b5b5;}

/* XP POP */
.xp-pop{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%) scale(.5);font-family:'Orbitron',sans-serif;font-weight:900;font-size:2.5rem;color:var(--jour);text-shadow:0 0 20px var(--jour),0 4px 10px rgba(0,0,0,.3);z-index:50;opacity:0;pointer-events:none;}
.xp-pop.go{animation:xpfly 1.2s cubic-bezier(.22,1,.36,1) forwards;}
@keyframes xpfly{0%{opacity:0;transform:translate(-50%,-50%) scale(.4);}25%{opacity:1;transform:translate(-50%,-50%) scale(1.25);}70%{opacity:1;transform:translate(-50%,-80%) scale(1);}100%{opacity:0;transform:translate(-50%,-130%) scale(.9);}}
@media(max-width:380px){.game{padding:12px 10px;}}
</style>
</head>
<body>
<div class="bulle b1"></div><div class="bulle b2"></div>
<div class="bulle b3"></div><div class="bulle b4"></div>
<div class="wrap">

<div class="header">
  <div class="logo-badge"><span class="dots"><i></i><i></i><i></i></span>PAZAPA · FRANÇAIS · 5E</div>
  <div class="semaine">Semaine 1 – Jour 4</div>
  <h1 class="titre">Je relève le <span class="accent">défi</span> !</h1>
  <div class="sous-titre">Mots croisés · Conjugaison 1er, 2e et 3e groupe</div>
  <div class="badge-revision">DÉFI CONJUGAISON · S1 J4 · JEUDI</div>
</div>

<div class="game">
  <div class="game-label">MOTS CROISÉS · 12 MOTS · PRÉSENT DE L'INDICATIF</div>
  <div class="score-grid">
    <div class="score-cell"><div class="score-val ok" id="cnt-ok">0</div><div class="score-lbl">Trouvés</div></div>
    <div class="score-cell"><div class="score-val rem" id="cnt-rem">12</div><div class="score-lbl">Restants</div></div>
    <div class="score-cell"><div class="score-val ko" id="cnt-ko">0</div><div class="score-lbl">Erreurs</div></div>
  </div>
  <div class="etoiles" id="etoiles"></div>
  <div class="xp-head"><span>XP PROGRESS</span><span id="xp-pct">0 %</span></div>
  <div class="xp-bar"><div class="xp-fill" id="xp-fill"></div></div>
  <div class="score-counter" id="score-lbl">0 / 12 mots trouvés</div>
</div>

<div class="main-layout">
  <div>
    <div class="grid-scroll">
      <div class="grid-outer">
        <div class="cw-grid" id="cw-grid"></div>
      </div>
    </div>
    <div class="btns">
      <button class="btn btn-verifier" id="btn-verifier" onclick="verifier()">✔ VÉRIFIER</button>
      <button class="btn btn-solution" id="btn-sol" onclick="solution()">Solution</button>
      <button class="btn btn-recommencer" id="btn-rec" onclick="recommencer()">↺ Recommencer</button>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="clues-layout">
    <div class="clues-card">
      <div class="clues-section-title">Horizontaux</div>
      <div id="clues-h"></div>
    </div>
    <div class="clues-card">
      <div class="clues-section-title">Verticaux</div>
      <div id="clues-v"></div>
    </div>
  </div>
</div>
</div>
<div class="xp-pop" id="xp-pop">+XP !</div>

<script>
var ROWS=14, COLS=13;
var WORDS=[
  {word:"CHERCHES",   r:0,  c:0,  horiz:true,  clue:"Tu ___ le chemin (chercher, présent, 2e pers. sing.)",        groupe:"1er groupe"},
  {word:"RANGE",      r:0,  c:3,  horiz:false, clue:"Il ___ ses affaires (ranger, présent, 3e pers. sing.)",       groupe:"1er groupe"},
  {word:"PREND",      r:2,  c:0,  horiz:true,  clue:"Il ___ le livre (prendre, présent, 3e pers. sing.)",          groupe:"3e groupe"},
  {word:"TRAVERSENT", r:3,  c:6,  horiz:false, clue:"Ils ___ la forêt (traverser, présent, 3e pers. pl.)",         groupe:"1er groupe"},
  {word:"GRANDIS",    r:3,  c:10, horiz:false, clue:"Je ___ chaque année (grandir, présent, 1re pers. sing.)",     groupe:"2e groupe"},
  {word:"PREPARE",    r:4,  c:1,  horiz:true,  clue:"Je ___ mes notes (préparer, présent, 1re pers. sing.)",       groupe:"1er groupe"},
  {word:"PARTONS",    r:5,  c:8,  horiz:false, clue:"Nous ___ en voyage (partir, présent, 1re pers. pl.)",         groupe:"3e groupe"},
  {word:"MARCHEZ",    r:6,  c:0,  horiz:false, clue:"Vous ___ sur la route (marcher, présent, 2e pers. pl.)",      groupe:"1er groupe"},
  {word:"CHOISIT",    r:7,  c:2,  horiz:false, clue:"Il ___ la bonne réponse (choisir, présent, 3e pers. sing.)", groupe:"2e groupe"},
  {word:"VIENT",      r:7,  c:12, horiz:false, clue:"Il ___ de loin (venir, présent, 3e pers. sing.)",             groupe:"3e groupe"},
  {word:"CHOISISSONS",r:9,  c:0,  horiz:true,  clue:"Nous ___ ensemble (choisir, présent, 1re pers. pl.)",         groupe:"2e groupe"},
  {word:"FINISSENT",  r:11, c:4,  horiz:true,  clue:"Ils ___ le travail (finir, présent, 3e pers. pl.)",           groupe:"2e groupe"},
];

// ── Construire la grille ──
var cellData=[];
for(var r=0;r<ROWS;r++){cellData.push([]);for(var c=0;c<COLS;c++)cellData[r].push({letter:'',white:false,num:0});}
WORDS.forEach(function(w){
  for(var i=0;i<w.word.length;i++){
    var r=w.horiz?w.r:w.r+i, c=w.horiz?w.c+i:w.c;
    cellData[r][c].white=true; cellData[r][c].letter=w.word[i];
  }
});

// Numérotation ordre de lecture
var numMap={};
var starts=[];
WORDS.forEach(function(w){var k=w.r+','+w.c;if(!numMap[k])starts.push({r:w.r,c:w.c,k:k});});
starts.sort(function(a,b){return a.r!==b.r?a.r-b.r:a.c-b.c;});
var cnt=1;
starts.forEach(function(s){if(!numMap[s.k]){numMap[s.k]=cnt++;cellData[s.r][s.c].num=numMap[s.k];}});
WORDS.forEach(function(w){w.num=numMap[w.r+','+w.c];});

// ── Rendre la grille ──
var CS=Math.max(24,Math.min(32,Math.floor((window.innerWidth*0.42)/(COLS+1))));
var grid=document.getElementById('cw-grid');
grid.style.gridTemplateColumns='repeat('+COLS+','+CS+'px)';
grid.style.gridTemplateRows='repeat('+ROWS+','+CS+'px)';
var inputs={};
for(var r=0;r<ROWS;r++){
  for(var c=0;c<COLS;c++){
    var d=cellData[r][c];
    var div=document.createElement('div');
    div.className='cell '+(d.white?'white':'black');
    div.style.width=CS+'px'; div.style.height=CS+'px';
    div.dataset.r=r; div.dataset.c=c;
    if(d.white){
      if(d.num>0){var sp=document.createElement('span');sp.className='cell-num';sp.textContent=d.num;div.appendChild(sp);}
      var inp=document.createElement('input');
      inp.type='text'; inp.maxLength=1; inp.className='cell-input';
      inp.style.fontSize=Math.max(10,CS*0.45)+'px';
      inp.dataset.r=r; inp.dataset.c=c;
      inp.autocomplete='off'; inp.autocorrect='off'; inp.autocapitalize='characters'; inp.spellcheck=false;
      inp.addEventListener('input',onInput);
      inp.addEventListener('keydown',onKeydown);
      inp.addEventListener('focus',onFocus);
      div.appendChild(inp);
      inputs[r+','+c]=inp;
    }
    grid.appendChild(div);
  }
}

// ── Mot actif ──
var activeWord=null;
function cells(w){
  var a=[];
  for(var i=0;i<w.word.length;i++) a.push({r:w.horiz?w.r:w.r+i, c:w.horiz?w.c+i:w.c});
  return a;
}
function setActive(w){
  document.querySelectorAll('.cell.white').forEach(function(el){el.classList.remove('active');});
  document.querySelectorAll('.clue-row').forEach(function(el){el.classList.remove('active');});
  if(!w){activeWord=null;return;}
  activeWord=w;
  cells(w).forEach(function(p){
    var el=document.querySelector('.cell[data-r="'+p.r+'"][data-c="'+p.c+'"]');
    if(el&&!el.classList.contains('correct')&&!el.classList.contains('wrong')) el.classList.add('active');
  });
  var cl=document.getElementById('cr-'+w.num+'-'+(w.horiz?'h':'v'));
  if(cl){cl.classList.add('active');cl.scrollIntoView({behavior:'smooth',block:'nearest'});}
}
function onFocus(e){
  var r=+e.target.dataset.r, c=+e.target.dataset.c;
  var cands=WORDS.filter(function(w){return cells(w).some(function(p){return p.r===r&&p.c===c;});});
  if(!cands.length) return;
  if(activeWord&&cands.includes(activeWord)) setActive(activeWord);
  else setActive(cands[0]);
}
function normLetter(v){return v.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z]/g,'');}
function onInput(e){
  var v=normLetter(e.target.value); e.target.value=v;
  if(v&&activeWord){
    var cs=cells(activeWord);
    var idx=cs.findIndex(function(p){return p.r===+e.target.dataset.r&&p.c===+e.target.dataset.c;});
    if(idx>=0&&idx<cs.length-1){var ni=inputs[cs[idx+1].r+','+cs[idx+1].c];if(ni)ni.focus();}
  }
  updateProgress();
}
function onKeydown(e){
  var r=+e.target.dataset.r, c=+e.target.dataset.c;
  if(e.key==='Backspace'&&e.target.value===''&&activeWord){
    var cs=cells(activeWord);
    var idx=cs.findIndex(function(p){return p.r===r&&p.c===c;});
    if(idx>0){var pi=inputs[cs[idx-1].r+','+cs[idx-1].c];if(pi){pi.value='';pi.focus();}}
    e.preventDefault();
  } else if(['ArrowRight','ArrowLeft','ArrowUp','ArrowDown'].includes(e.key)){
    e.preventDefault();
    var dr=e.key==='ArrowDown'?1:e.key==='ArrowUp'?-1:0;
    var dc=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;
    var ni=inputs[(r+dr)+','+(c+dc)]; if(ni) ni.focus();
  } else if(e.key==='Tab'){
    e.preventDefault();
    var idx=WORDS.indexOf(activeWord);
    var nw=WORDS[(idx+1)%WORDS.length];
    setActive(nw);
    var fc=cells(nw)[0]; var fi=inputs[fc.r+','+fc.c]; if(fi) fi.focus();
  }
}

// ── Indices ──
function buildClues(){
  var byNum=[].concat(WORDS).sort(function(a,b){return a.num!==b.num?a.num-b.num:(a.horiz?0:1);});
  byNum.forEach(function(w){
    var div=document.createElement('div');
    div.className='clue-row'; div.id='cr-'+w.num+'-'+(w.horiz?'h':'v');
    div.innerHTML='<span class="clue-num">'+w.num+(w.horiz?'H':'V')+'</span>'
      +'<span class="clue-body">'+w.clue+'<br><span class="clue-groupe">'+w.groupe+'</span></span>';
    div.addEventListener('click',function(){
      setActive(w);
      var fc=cells(w)[0]; var fi=inputs[fc.r+','+fc.c]; if(fi) fi.focus();
    });
    document.getElementById(w.horiz?'clues-h':'clues-v').appendChild(div);
  });
}
buildClues();

// ── Progression ──
function updateProgress(){
  if(verified) return;
  var found=WORDS.filter(function(w){
    return cells(w).every(function(p,i){var inp=inputs[p.r+','+p.c];return inp&&inp.value===w.word[i];});
  }).length;
  var pct=Math.round(found/WORDS.length*100);
  document.getElementById('xp-fill').style.width=pct+'%';
  document.getElementById('xp-pct').textContent=pct+' %';
  document.getElementById('cnt-rem').textContent=WORDS.length-found;
  document.getElementById('score-lbl').textContent=found+' / '+WORDS.length+' mots trouvés';
}

// Init étoiles
(function(){var et=document.getElementById('etoiles');et.innerHTML='';for(var i=0;i<5;i++){var s=document.createElement('span');s.className='star';s.textContent='★';et.appendChild(s);}})();

// ── Vérifier ──
var verified=false;
function verifier(){
  if(verified) return;
  verified=true;
  document.getElementById('btn-verifier').disabled=true;
  document.getElementById('btn-sol').classList.add('show');
  document.getElementById('btn-rec').classList.add('show');
  var ok=0,ko=0;
  var cellOk={},cellKo={};
  WORDS.forEach(function(w){
    var cs=cells(w); var wOk=true;
    cs.forEach(function(p,i){
      var inp=inputs[p.r+','+p.c]; var v=inp?inp.value:'';
      if(v===w.word[i]) cellOk[p.r+','+p.c]=true;
      else {cellKo[p.r+','+p.c]=true; wOk=false;}
    });
    var cl=document.getElementById('cr-'+w.num+'-'+(w.horiz?'h':'v'));
    if(wOk){ok++;if(cl)cl.classList.add('done');}
    else ko++;
  });
  Object.keys(cellOk).forEach(function(k){
    var el=document.querySelector('.cell[data-r="'+k.split(',')[0]+'"][data-c="'+k.split(',')[1]+'"]');
    if(el){el.classList.remove('active','wrong');el.classList.add('correct');}
  });
  Object.keys(cellKo).forEach(function(k){
    if(!cellOk[k]){
      var el=document.querySelector('.cell[data-r="'+k.split(',')[0]+'"][data-c="'+k.split(',')[1]+'"]');
      if(el){el.classList.remove('active');el.classList.add('wrong');}
    }
  });
  document.getElementById('cnt-ok').textContent=ok;
  document.getElementById('cnt-ko').textContent=ko;
  document.getElementById('cnt-rem').textContent=WORDS.length-ok;
  var pct=Math.round(ok/WORDS.length*100);
  document.getElementById('xp-fill').style.width=pct+'%';
  document.getElementById('xp-pct').textContent=pct+' %';
  document.getElementById('score-lbl').textContent=ok+' / '+WORDS.length+' mots corrects';
  var nb=ok>=12?5:ok>=9?4:ok>=7?3:ok>=4?2:1;
  var et=document.getElementById('etoiles');
  Array.from(et.children).forEach(function(s,i){if(i<nb)s.classList.add('on');});
  var fb=document.getElementById('feedback');
  if(ok===12){
    fb.className='feedback show ok';
    fb.innerHTML='<b>Parfait !</b> 12/12 — Tu maîtrises la conjugaison des trois groupes au présent !';
    var p=document.getElementById('xp-pop');p.textContent='+100 XP !';p.classList.remove('go');void p.offsetWidth;p.classList.add('go');
  } else if(ok>=8){
    fb.className='feedback show bien';
    fb.innerHTML='<b>Très bien !</b> '+ok+'/12. Quelques terminaisons à revoir. Rappel&nbsp;: 2e groupe (-is, -it, -issons, -issez, -issent), 3e groupe (irrégulier).';
  } else if(ok>=4){
    fb.className='feedback show bien';
    fb.innerHTML='<b>Bon début&nbsp;!</b> '+ok+'/12. Révise les terminaisons du 2e groupe (-iss-) et les formes irrégulières du 3e groupe.';
  } else {
    fb.className='feedback show ko';
    fb.innerHTML='<b>À retravailler.</b> '+ok+'/12. Revois&nbsp;: 1er groupe (-e, -es, -e, -ons, -ez, -ent), 2e groupe (-is, -it, -issons, -issez, -issent), 3e groupe (irréguliers à apprendre par cœur).';
  }
}

function solution(){
  WORDS.forEach(function(w){
    cells(w).forEach(function(p,i){
      var inp=inputs[p.r+','+p.c]; if(inp) inp.value=w.word[i];
      var el=document.querySelector('.cell[data-r="'+p.r+'"][data-c="'+p.c+'"]');
      if(el){el.classList.remove('wrong','active');el.classList.add('correct');}
    });
  });
  document.getElementById('cnt-ok').textContent=12;
  document.getElementById('cnt-rem').textContent=0;
  document.getElementById('score-lbl').textContent='12 / 12 mots trouvés';
}

function recommencer(){
  verified=false;
  document.getElementById('btn-verifier').disabled=false;
  document.getElementById('btn-sol').classList.remove('show');
  document.getElementById('btn-rec').classList.remove('show');
  document.getElementById('feedback').className='feedback';
  document.querySelectorAll('.cell-input').forEach(function(i){i.value='';});
  document.querySelectorAll('.cell.white').forEach(function(c){c.classList.remove('correct','wrong','active');});
  document.querySelectorAll('.clue-row').forEach(function(c){c.classList.remove('active','done');});
  var et=document.getElementById('etoiles');Array.from(et.children).forEach(function(s){s.classList.remove('on');});
  document.getElementById('cnt-ok').textContent=0;
  document.getElementById('cnt-ko').textContent=0;
  document.getElementById('cnt-rem').textContent=12;
  document.getElementById('xp-fill').style.width='0%';
  document.getElementById('xp-pct').textContent='0 %';
  document.getElementById('score-lbl').textContent='0 / 12 mots trouvés';
  activeWord=null;
}

// Démarrer sur le 1er mot
setActive(WORDS[0]);
var fc=cells(WORDS[0])[0];
var fi=inputs[fc.r+','+fc.c];
if(fi) setTimeout(function(){fi.focus();},300);
</script>
