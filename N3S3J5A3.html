<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dictée – Homophones – 3e S3 J5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;600&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --jour:#f5c518;--jour-fonce:#8a6000;--jour-clair:#fffbeb;--jour-pale:#f5e08a;
  --day-glow:rgba(245,197,24,.32);
  --bg:#fffdf7;--dark:#13161e;
  --vert-ok:#22a55a;--vert-bg:#e7faec;
  --rouge-err:#e63950;--rouge-bg:#fdeaea;
  --orange:#d97706;
  --acier:#4a5568;--acier-clair:#f7f8fa;--acier-bord:#e2e8f0;
  --txt:#1a202c;--gris:#718096;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden;}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes slide{0%{background-position:0%}100%{background-position:300%}}
@keyframes stampPop{0%{opacity:0;transform:scale(2.2) rotate(-8deg)}60%{opacity:1;transform:scale(1.1) rotate(-8deg)}100%{opacity:1;transform:scale(1) rotate(-4deg)}}

/* BULLES */
.bubble{position:fixed;border-radius:50%;z-index:0;pointer-events:none;filter:blur(2px);opacity:.35;}
.bubble.b1{width:130px;height:130px;background:var(--jour);top:-34px;right:-30px;}
.bubble.b2{width:96px;height:96px;background:#b94040;bottom:30px;left:-26px;}
.bubble.b3{width:74px;height:74px;background:#8dc63f;top:42%;right:-28px;}
.bubble.b4{width:84px;height:84px;background:#f9c0bb;top:26%;left:-32px;}

.p2-wrap{max-width:820px;margin:0 auto;padding:20px 14px 60px;position:relative;z-index:1;}

/* HEADER */
.p2-header{text-align:center;margin-bottom:20px;animation:fadeUp .5s ease;}
.logo-badge{display:inline-flex;align-items:center;gap:8px;background:var(--jour);color:var(--jour-fonce);font-family:'Orbitron',sans-serif;font-weight:700;font-size:12px;letter-spacing:1.2px;padding:7px 15px;border-radius:22px;box-shadow:0 4px 14px var(--day-glow);margin-bottom:12px;}
.semaine{font-family:'Orbitron',sans-serif;font-size:.82rem;letter-spacing:2px;color:var(--gris);text-transform:uppercase;margin-bottom:5px;}
.titre{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(1.3rem,4.5vw,2rem);line-height:1.15;margin-bottom:6px;}
.titre .accent{color:var(--jour-fonce);}
.badge-theme{display:inline-block;background:var(--jour);color:var(--jour-fonce);font-family:'Orbitron',sans-serif;font-weight:700;font-size:clamp(.68rem,2.5vw,.75rem);letter-spacing:1px;text-transform:uppercase;padding:8px 18px;border-radius:24px;box-shadow:0 4px 14px var(--day-glow);}

/* AUDIO */
.audio-card{background:#fff;border:1.5px solid var(--acier-bord);border-radius:14px;padding:16px 18px;margin-bottom:14px;box-shadow:0 3px 14px rgba(107,107,88,.07);animation:fadeUp .5s ease .1s both;}
.audio-label{font-family:'Orbitron',sans-serif;font-size:.72rem;letter-spacing:1.5px;color:var(--gris);text-transform:uppercase;margin-bottom:10px;}
.audio-controls{display:flex;align-items:center;gap:14px;}
.btn-play{width:44px;height:44px;border-radius:50%;border:none;background:var(--jour);color:var(--jour-fonce);font-size:1.1rem;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px var(--day-glow);}
.btn-play:hover{background:var(--jour-pale);}
.audio-progress{flex:1;}
.progress-bar{height:8px;background:var(--acier-clair);border-radius:99px;cursor:pointer;margin-bottom:5px;border:1px solid var(--acier-bord);}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--jour-fonce),var(--jour));border-radius:99px;width:0%;transition:width .3s linear;}
.audio-time{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--gris);}

/* SAISIE */
.saisie-card{background:#fff;border:1.5px solid var(--acier-bord);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 3px 14px rgba(107,107,88,.07);animation:fadeUp .5s ease .2s both;}
.saisie-label{font-family:'Orbitron',sans-serif;font-size:.72rem;letter-spacing:1.5px;color:var(--gris);text-transform:uppercase;margin-bottom:10px;}
textarea{width:100%;min-height:160px;border:1.5px solid var(--acier-bord);border-radius:10px;padding:14px;font-family:'IM Fell English',serif;font-size:1.05rem;line-height:1.9;color:var(--txt);resize:vertical;outline:none;background:var(--bg);}
textarea:focus{border-color:var(--jour);box-shadow:0 0 0 3px var(--day-glow);}

/* BOUTONS */
.btn-row{display:flex;gap:10px;margin-bottom:16px;animation:fadeUp .5s ease .3s both;}
.btn-principal{flex:2;font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(.9rem,2.8vw,1.05rem);letter-spacing:1.5px;padding:16px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--jour),var(--jour-fonce));color:#fff;cursor:pointer;min-height:54px;box-shadow:0 4px 16px var(--day-glow);transition:transform .12s;}
.btn-principal:hover{transform:translateY(-2px);}
.btn-sec{flex:1;font-family:'Orbitron',sans-serif;font-weight:700;font-size:clamp(.85rem,2.5vw,.95rem);padding:16px;border:2px solid var(--acier-bord);border-radius:12px;background:#fff;color:var(--acier);cursor:pointer;min-height:54px;transition:transform .12s;}
.btn-sec:hover{transform:translateY(-2px);}

/* LÉGENDE */
.legende{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px;font-size:.82rem;font-family:'JetBrains Mono',monospace;}
.leg-item{display:flex;align-items:center;gap:6px;color:var(--gris);}
.leg-dot{width:14px;height:14px;border-radius:4px;flex-shrink:0;}

/* CORRECTION */
.correction-card{display:none;background:#fff;border:1.5px solid var(--acier-bord);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 3px 14px rgba(107,107,88,.07);animation:fadeUp .4s ease;}
.correction-card.show{display:block;}
.correction-label{font-family:'Orbitron',sans-serif;font-size:.72rem;letter-spacing:1.5px;color:var(--gris);text-transform:uppercase;margin-bottom:12px;}
.correction-txt{font-family:'IM Fell English',serif;font-size:1.05rem;line-height:2.1;color:var(--txt);}

/* TOKENS */
.ref-txt{font-family:'IM Fell English',serif;font-size:1.05rem;line-height:2.1;color:var(--txt);}
.ref-txt .ref-cible{color:var(--jour-fonce);font-weight:800;background:var(--jour-clair);border-radius:4px;padding:1px 5px;border-bottom:2px solid var(--jour);}font-weight:700;background:var(--vert-bg);padding:1px 5px;border-radius:4px;text-decoration:none !important;border-bottom:none !important;}
.tok-cible-ko{font-size:0;padding:0;margin:0;}
.tok-cible-ko::after{content:attr(data-corr);font-size:1rem;color:#157f3a;font-weight:800;background:var(--vert-bg);border-radius:4px;padding:2px 6px;border:1.5px solid var(--vert-ok);text-decoration:none;}
.tok-hors-cible{font-size:0;padding:0;margin:0;}
.tok-hors-cible::after{content:attr(data-corr);font-size:1rem;color:var(--orange);font-weight:700;background:#fff6ea;border-radius:4px;padding:2px 5px;border:1.5px solid var(--orange);}

/* SCORE */
.score-card{display:none;background:#fff;border:2px solid var(--jour);border-radius:16px;padding:24px;text-align:center;box-shadow:0 8px 30px var(--day-glow);margin-bottom:16px;position:relative;overflow:hidden;animation:fadeUp .4s ease;}
.score-card.show{display:block;}
.score-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--jour-fonce),var(--jour),var(--jour-pale),var(--jour-fonce));background-size:300%;animation:slide 4s linear infinite;}
.score-tampon{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(.9rem,3.5vw,1.25rem);padding:9px 20px;border-radius:10px;border:3px solid;display:inline-block;transform:rotate(-3deg);animation:stampPop .5s cubic-bezier(.3,1.6,.5,1);margin-bottom:10px;}
.score-tampon.ok{color:#3fa66f;border-color:#3fa66f;}
.score-tampon.moyen{color:#e8902a;border-color:#e8902a;}
.score-tampon.ko{color:var(--rouge-err);border-color:var(--rouge-err);}
.score-note{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(2.8rem,10vw,4.5rem);line-height:1;color:var(--jour-fonce);margin:.3rem 0 .2rem;}
.score-etoiles{font-size:1.9rem;letter-spacing:.1em;margin:.3rem 0 .6rem;}
.score-detail{font-family:'JetBrains Mono',monospace;font-size:.82rem;color:var(--gris);}
</style>
</head>
<body>
<div class="bubble b1"></div><div class="bubble b2"></div>
<div class="bubble b3"></div><div class="bubble b4"></div>

<div class="p2-wrap">
  <div class="p2-header">
    <div class="logo-badge">PAZAPA &middot; FRANÇAIS &middot; 3ÈME</div>
    <div class="semaine">Semaine 3 &mdash; Jour 5</div>
    <h1 class="titre"><span class="accent">Dictée</span></h1>
    <div class="badge-theme">ces &middot; c'est &middot; ses &middot; s'est &middot; /10</div>
  </div>

  <!-- LECTEUR AUDIO -->
  <div class="audio-card">
    <div class="audio-label">Écouter la dictée</div>
    <div class="audio-controls">
      <button class="btn-play" id="btnPlay" onclick="togglePlay()">&#9654;</button>
      <div class="audio-progress">
        <div class="progress-bar" id="progressBar" onclick="seekAudio(event)">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="audio-time"><span id="timeCur">0:00</span> / <span id="timeTot">0:00</span></div>
      </div>
    </div>
    <audio id="audioEl" src="audio/DicteeN3S3J5.mp3" preload="metadata"></audio>
  </div>

  <!-- SAISIE -->
  <div class="saisie-card">
    <div class="saisie-label">Votre texte</div>
    <textarea id="saisieZone" placeholder="Écrivez votre texte ici…" spellcheck="false"></textarea>
  </div>

  <!-- BOUTONS -->
  <div class="btn-row">
    <button class="btn-principal" onclick="corriger()">CORRIGER</button>
    <button class="btn-sec" onclick="recommencer()">&#8635; Recommencer</button>
  </div>

  <!-- LÉGENDE -->
  <div class="legende" id="legende" style="display:none">
    <div class="leg-item"><div class="leg-dot" style="background:var(--vert-bg);border:1.5px solid var(--vert-ok)"></div>Cible correcte</div>
    <div class="leg-item"><div class="leg-dot" style="background:var(--rouge-bg);border:1.5px solid var(--rouge-err)"></div>Cible incorrecte (comptée)</div>
    <div class="leg-item"><div class="leg-dot" style="background:#fff6ea;border:1.5px solid var(--orange)"></div>Faute hors cible (non comptée)</div>
  </div>

  <!-- CORRECTION -->
  <div class="correction-card" id="correctionCard">
    <div class="correction-label">Correction détaillée — votre texte</div>
    <div class="correction-txt" id="correctionTxt"></div>
    <div class="correction-label" style="margin-top:18px;padding-top:14px;border-top:1.5px solid var(--acier-bord);">Texte de référence complet</div>
    <div class="correction-txt ref-txt" id="refTxt"></div>
  </div>

  <!-- SCORE -->
  <div class="score-card" id="scoreCard">
    <div class="score-tampon" id="scoreTampon"></div>
    <div class="score-note" id="scoreNote"></div>
    <div class="score-etoiles" id="scoreEtoiles"></div>
    <div class="score-detail" id="scoreDetail"></div>
  </div>
</div>

<script>
/* ══════════════════════════════════════
   DICTÉE · N3S3J5A3
   Homophones ces / c'est / ses / s'est — 3e S3 J5
   Score /10 · -1 par faute · plancher 0
   ══════════════════════════════════════ */

/* ── TEXTE DE RÉFÉRENCE (verbatim prof) ── */
var TEXTE_REF = "Le romantisme, c'est avant tout un mouvement littéraire qui s'est épanoui en France dans la première moitié du XIXe siècle. C'est Victor Hugo qui s'est imposé comme la figure centrale de ce mouvement. Ses œuvres couvrent tous les genres : ses romans, ses poèmes et ses drames ont marqué durablement la littérature française. Hugo s'est engagé pour les démunis tout au long de sa vie. Son combat contre l'injustice s'est traduit dans ses œuvres les plus célèbres. Lamartine, lui, c'est dans la mélancolie et la contemplation de la nature qu'il a trouvé ses plus belles inspirations. Ces méditations poétiques restent parmi les textes fondateurs du lyrisme romantique. Musset s'est révélé comme l'un des poètes les plus sensibles de son époque. Ces auteurs ont tous contribué à faire du romantisme l'un des mouvements les plus riches de la littérature française.";

/* ── CIBLES — ordonnées par ordre d'apparition dans le texte ── */
var CIBLES_DEF = [
  {aff:"c'est",   norm:"c'est",   cat:"CEST"},
  {aff:"s'est",   norm:"s'est",   cat:"SEST"},
  {aff:"C'est",   norm:"C'est",   cat:"CEST"},
  {aff:"s'est",   norm:"s'est",   cat:"SEST"},
  {aff:"Ses",     norm:"Ses",     cat:"SES"},
  {aff:"ses",     norm:"ses",     cat:"SES"},
  {aff:"ses",     norm:"ses",     cat:"SES"},
  {aff:"ses",     norm:"ses",     cat:"SES"},
  {aff:"s'est",   norm:"s'est",   cat:"SEST"},
  {aff:"s'est",   norm:"s'est",   cat:"SEST"},
  {aff:"ses",     norm:"ses",     cat:"SES"},
  {aff:"c'est",   norm:"c'est",   cat:"CEST"},
  {aff:"ses",     norm:"ses",     cat:"SES"},
  {aff:"Ces",     norm:"Ces",     cat:"CES"},
  {aff:"s'est",   norm:"s'est",   cat:"SEST"},
  {aff:"Ces",     norm:"Ces",     cat:"CES"},
];

/* ── ALGO LCS ── */
function preClean(s){
  return s.normalize('NFD')
    .replace(/[\u2018\u2019\u02bc]/g,"'")
    .replace(/[\u00e6]/g,'ae').replace(/[\u0153]/g,'oe')
    .normalize('NFC')
    .replace(/\bXIX\b/gi,'19').replace(/\b19\b/g,'19');
}
function normTok(s){
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()
    .replace(/['']/g,"'").replace(/[^a-z0-9']/g,'');
}
function normStrict(s){
  return s.toLowerCase().replace(/['']/g,"'").replace(/[^a-z0-9'\u00e0-\u00ff]/g,'');
}
function levenshtein(a,b){
  var m=a.length,n=b.length,d=[];
  for(var i=0;i<=m;i++){d[i]=[i];}
  for(var j=0;j<=n;j++){d[0][j]=j;}
  for(var i=1;i<=m;i++) for(var j=1;j<=n;j++){
    d[i][j]=a[i-1]===b[j-1]?d[i-1][j-1]:1+Math.min(d[i-1][j],d[i][j-1],d[i-1][j-1]);
  }
  return d[m][n];
}
function commonPrefix(a,b){var i=0;while(i<a.length&&i<b.length&&a[i]===b[i])i++;return i;}
function tokSim(a,b){
  if(a===b)return true;
  if(levenshtein(a,b)<=2)return true;
  if(commonPrefix(a,b)>=4)return true;
  return false;
}
function tokeniser(txt){
  return preClean(txt).split(/(\s+|[.,;:!?«»\u2026—\u2014\(\)\[\]""])/u).filter(function(t){return t.trim()!=='';});
}
function lcsAlign(ref,hyp){
  var R=ref.length,H=hyp.length,dp=[];
  for(var i=0;i<=R;i++){dp[i]=[];for(var j=0;j<=H;j++)dp[i][j]=0;}
  for(var i=1;i<=R;i++) for(var j=1;j<=H;j++){
    if(tokSim(normTok(ref[i-1]),normTok(hyp[j-1])))dp[i][j]=dp[i-1][j-1]+1;
    else dp[i][j]=Math.max(dp[i-1][j],dp[i][j-1]);
  }
  var align=[],i=R,j=H;
  while(i>0||j>0){
    if(i>0&&j>0&&tokSim(normTok(ref[i-1]),normTok(hyp[j-1]))){align.unshift({ri:i-1,hi:j-1});i--;j--;}
    else if(j>0&&(i===0||dp[i][j-1]>=dp[i-1][j])){align.unshift({ri:-1,hi:j-1});j--;}
    else{align.unshift({ri:i-1,hi:-1});i--;}
  }
  return align;
}

function buildCibleMap(refToks){
  var map=[],pos=0;
  for(var k=0;k<CIBLES_DEF.length;k++){
    var c=CIBLES_DEF[k];
    for(var i=pos;i<refToks.length;i++){
      if(normTok(refToks[i])===normTok(c.aff)){
        map.push({c:c,ri:i});
        pos=i+1;
        break;
      }
    }
  }
  return map;
}

/* ── CORRECTION ── */
var checked=false;
function corriger(){
  if(checked)return;
  var saisie=$('saisieZone').value.trim();
  if(!saisie){alert('Écris ton texte avant de corriger.');return;}
  checked=true;

  var refToks=tokeniser(TEXTE_REF);
  var hypToks=tokeniser(saisie);
  var cibleMap=buildCibleMap(refToks);
  var cibleRi={};
  cibleMap.forEach(function(m){cibleRi[m.ri]=m.c;});

  var align=lcsAlign(refToks,hypToks);
  var tokens=[];
  align.forEach(function(a){
    if(a.ri>=0&&a.hi>=0){
      var rt=refToks[a.ri],ht=hypToks[a.hi];
      var isCible=cibleRi.hasOwnProperty(a.ri);
      var isWord=/[a-zA-Z\u00C0-\u024F]/.test(normTok(rt));
      if(!isWord){tokens.push({rt:rt,ht:ht,status:'ok'});return;}
      if(normStrict(ht)===normStrict(rt)){
        tokens.push({rt:rt,ht:ht,status:isCible?'cible_ok':'ok',cible:isCible?cibleRi[a.ri]:null});
      } else if(isCible){
        tokens.push({rt:rt,ht:ht,status:'cible_ko',cible:cibleRi[a.ri]});
      } else {
        tokens.push({rt:rt,ht:ht,status:'hors_cible'});
      }
    } else if(a.ri>=0){
      var rt=refToks[a.ri];
      var isCible=cibleRi.hasOwnProperty(a.ri);
      var isWord=/[a-zA-Z\u00C0-\u024F]/.test(normTok(rt));
      if(!isWord){tokens.push({rt:rt,ht:'',status:'ok'});return;}
      tokens.push({rt:rt,ht:'',status:isCible?'cible_ko':'hors_cible',cible:isCible?cibleRi[a.ri]:null});
    }
  });

  /* -1 par faute sur cible, plancher 0 */
  var fautesCibles=0;
  tokens.forEach(function(t){if(t.status==='cible_ko')fautesCibles++;});
  var score=Math.max(0,10-fautesCibles);

  $('correctionTxt').innerHTML=buildCorrHTML(tokens);
  $('refTxt').innerHTML=buildRefHTML(refToks,cibleRi);
  $('correctionCard').className='correction-card show';
  $('legende').style.display='flex';

  var nb=score>=9?5:score>=7?4:score>=5?3:score>=3?2:1;
  $('scoreNote').textContent=score+'/10';
  $('scoreEtoiles').textContent='\u2b50'.repeat(nb)+'\u2606'.repeat(5-nb);
  $('scoreDetail').textContent=fautesCibles+' faute'+(fautesCibles>1?'s':'')+' sur cible'+(fautesCibles>1?'s':'')+' \u00d7 1 pt';
  var tp=$('scoreTampon');
  if(score>=9){tp.textContent='EXCELLENT';tp.className='score-tampon ok';}
  else if(score>=7){tp.textContent='TR\u00c8S BIEN';tp.className='score-tampon ok';}
  else if(score>=5){tp.textContent='BIEN';tp.className='score-tampon moyen';}
  else{tp.textContent='\u00c0 RETRAVAILLER';tp.className='score-tampon ko';}
  $('scoreCard').className='score-card show';
  setTimeout(function(){$('scoreCard').scrollIntoView({behavior:'smooth',block:'nearest'});},300);
}

function buildRefHTML(refToks,cibleRi){
  var html='';
  for(var i=0;i<refToks.length;i++){
    var rt=refToks[i];
    var next=refToks[i+1];
    var sep=' ';
    if(next&&/^[.,;:!?\u2026\u2019)\u00bb\]\u2014\u2013—]/.test(next))sep='';
    if(/[\u2019'\(\u00ab\[]$/.test(rt))sep='';
    if(cibleRi.hasOwnProperty(i)){
      html+='<span class="ref-cible">'+esc(rt)+'</span>';
    } else {
      html+=esc(rt);
    }
    if(i<refToks.length-1)html+=sep;
  }
  return html;
}

function buildCorrHTML(tokens){
  var html='';
  for(var i=0;i<tokens.length;i++){
    var t=tokens[i],next=tokens[i+1];
    var sep=' ';
    if(next){
      var nr=next.rt||'';
      if(/^[.,;:!?\u2026\u2019)\u00bb\]\u2014\u2013—]/.test(nr))sep='';
    }
    var cr=t.rt||'';
    if(/[\u2019'\(\u00ab\[]$/.test(cr))sep='';
    var ht=t.ht||t.rt||'';
    if(t.status==='ok'||t.status===undefined){
      if(!ht){if(i<tokens.length-1)html+=sep;continue;}
      html+=esc(ht);
    } else if(t.status==='cible_ok'){
      html+='<span class="tok-cible-ok">'+esc(ht)+'</span>';
    } else if(t.status==='cible_ko'){
      var corr=t.cible?t.cible.aff:t.rt;
      html+='<span class="tok-cible-ko" data-corr="'+esc(corr)+'">'+esc(ht)+'</span>';
    } else if(t.status==='hors_cible'){
      html+='<span class="tok-hors-cible" data-corr="'+esc(t.rt)+'">'+esc(ht)+'</span>';
    }
    if(i<tokens.length-1)html+=sep;
  }
  return html;
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function $(id){return document.getElementById(id);}

function recommencer(){
  checked=false;
  $('saisieZone').value='';
  $('correctionCard').className='correction-card';
  $('scoreCard').className='score-card';
  $('legende').style.display='none';
  $('saisieZone').focus();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ── LECTEUR AUDIO ── */
var audio=$('audioEl');
audio.addEventListener('timeupdate',function(){
  if(!audio.duration)return;
  var pct=audio.currentTime/audio.duration*100;
  $('progressFill').style.width=pct+'%';
  $('timeCur').textContent=fmt(audio.currentTime);
  $('timeTot').textContent=fmt(audio.duration);
});
audio.addEventListener('ended',function(){$('btnPlay').innerHTML='&#9654;';});
function fmt(s){var m=Math.floor(s/60),ss=Math.floor(s%60);return m+':'+(ss<10?'0':'')+ss;}
function togglePlay(){
  if(audio.paused){audio.play();$('btnPlay').innerHTML='&#9646;&#9646;';}
  else{audio.pause();$('btnPlay').innerHTML='&#9654;';}
}
function seekAudio(e){
  if(!audio.duration)return;
  var r=$('progressBar').getBoundingClientRect();
  audio.currentTime=(e.clientX-r.left)/r.width*audio.duration;
}
