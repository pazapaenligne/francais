<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pazapa – J'observe et je teste – S1 J4 – 5e</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --day:#3ab5d8;--day-dark:#1a6e88;--day-dark2:#0d3d4d;
  --day-light:#e8f6fb;--day-border:#9dd4e8;--day-glow:rgba(58,181,216,.25);
  --bg:#ffffff;--surface:#ffffff;--surface2:#fafafa;--border:#e8e4d9;
  --yellow:#f5c518;--green:#8dc63f;--green-light:#f0faeb;--green-dark:#3d7a10;
  --pink:#f28b82;--pink-light:#fff0ef;--pink-dark:#c0392b;
  --orange:#f5a623;
  --text:#1a1d23;--muted:#8a8f9a;
  --radius:16px;--radius-sm:10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:1.5rem .75rem 3rem;overflow-x:hidden;-webkit-tap-highlight-color:transparent;}
.wrap{width:100%;max-width:660px;}
.bubble1{position:fixed;border-radius:50%;z-index:0;pointer-events:none;width:280px;height:280px;top:-90px;right:-90px;background:radial-gradient(circle,rgba(58,181,216,.14),transparent 70%);}
.bubble2{position:fixed;border-radius:50%;z-index:0;pointer-events:none;width:220px;height:220px;bottom:-70px;left:-70px;background:radial-gradient(circle,rgba(245,197,24,.10),transparent 70%);}
.bubble3{position:fixed;border-radius:50%;z-index:0;pointer-events:none;width:140px;height:140px;top:40%;left:-55px;background:radial-gradient(circle,rgba(141,198,63,.08),transparent 70%);}
.bubble4{position:fixed;border-radius:50%;z-index:0;pointer-events:none;width:110px;height:110px;bottom:18%;right:-45px;background:radial-gradient(circle,rgba(242,139,130,.08),transparent 70%);}
header{text-align:center;margin-bottom:1.4rem;position:relative;z-index:1;}
.logo-badge{display:inline-block;background:#f5c518;border-radius:50px;padding:6px 16px;box-shadow:0 2px 8px rgba(245,197,24,.35);margin-bottom:.5rem;}
.week-label{font-family:'JetBrains Mono',monospace;font-size:.8rem;color:var(--muted);margin-bottom:.4rem;}
h1{font-size:clamp(1.2rem,4.5vw,1.85rem);font-weight:800;line-height:1.3;word-break:break-word;}
h1 .hl{color:var(--day-dark);}
.prog-wrap{width:100%;margin-bottom:.8rem;position:relative;z-index:1;}
.prog-info{display:flex;justify-content:space-between;font-size:.73rem;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:.3rem;}
.prog-bg{background:var(--border);border-radius:99px;height:7px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--day),var(--yellow));border-radius:99px;transition:width .5s ease;width:0%;}
.chips{display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap;position:relative;z-index:1;}
.chip{display:flex;align-items:center;gap:.35rem;padding:.25rem .65rem;border-radius:99px;font-size:.74rem;font-family:'JetBrains Mono',monospace;border:1.5px solid var(--border);background:var(--surface);font-weight:600;white-space:nowrap;}
.chip .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
/* CARD */
.card{width:100%;background:var(--surface);border:1.5px solid #e0ddd5;border-radius:var(--radius);padding:1.5rem 1.3rem 1.3rem;position:relative;z-index:1;box-shadow:0 6px 28px rgba(0,0,0,.07);animation:fadeUp .35s ease both;margin-bottom:1.8rem;}
.card-stripe{position:absolute;top:0;left:0;right:0;height:4px;border-radius:var(--radius) var(--radius) 0 0;background:linear-gradient(90deg,var(--day),var(--yellow),var(--orange),var(--pink));}
.ex-num{font-size:.68rem;font-family:'JetBrains Mono',monospace;color:var(--muted);margin-bottom:.4rem;text-transform:uppercase;letter-spacing:.1em;}
.theme-badge{display:inline-block;font-size:.63rem;font-weight:800;padding:.15rem .6rem;border-radius:99px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:.75rem;background:var(--day-light);color:var(--day-dark);border:1.5px solid var(--day-border);white-space:nowrap;}
/* OBSERVE BOX */
.observe-box{background:var(--day-light);border:1.5px solid var(--day-border);border-left:4px solid var(--day);border-radius:var(--radius-sm);padding:.8rem 1.1rem;margin-bottom:1rem;font-size:clamp(1rem,2.8vw,1.1rem);font-weight:700;color:var(--day-dark);font-family:'JetBrains Mono',monospace;line-height:1.9;word-break:break-word;}
.q-text{font-size:clamp(.9rem,2.5vw,1rem);font-weight:700;color:var(--text);margin-bottom:.9rem;line-height:1.65;}
/* CHOIX QCM */
.choices{display:flex;flex-direction:column;gap:.55rem;margin-bottom:.5rem;}
.choice-btn{background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:clamp(.9rem,2.5vw,1rem);font-weight:600;padding:.7rem 1rem;cursor:pointer;transition:background .12s,border-color .12s,transform .1s;min-height:48px;-webkit-tap-highlight-color:transparent;font-family:Arial,Helvetica,sans-serif;text-align:left;display:flex;align-items:center;gap:.65rem;word-break:break-word;}
.choice-btn:hover:not(:disabled){background:var(--day-light);border-color:var(--day);}
.choice-btn:active:not(:disabled){transform:scale(.98);}
.choice-btn:disabled{cursor:default;}
.choice-letter{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:800;font-family:'JetBrains Mono',monospace;background:var(--border);color:var(--text);transition:background .12s,color .12s;min-width:26px;}
.choice-btn.selected .choice-letter{background:var(--day);color:#fff;}
.choice-btn.correct-ans{border-color:var(--green)!important;background:var(--green-light)!important;color:var(--green-dark)!important;}
.choice-btn.correct-ans .choice-letter{background:var(--green);color:#fff;}
.choice-btn.wrong-ans{border-color:var(--pink)!important;background:var(--pink-light)!important;color:var(--pink-dark)!important;}
.choice-btn.wrong-ans .choice-letter{background:var(--pink);color:#fff;}
/* DRAG ACT7 */
.drag-bank{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem;background:var(--surface2);border:1.5px dashed var(--border);border-radius:var(--radius-sm);padding:.75rem;min-height:52px;}
.drag-chip{background:var(--day-light);border:2px solid var(--day-border);border-radius:8px;padding:.4rem .85rem;font-size:.92rem;font-weight:700;color:var(--day-dark);cursor:grab;user-select:none;-webkit-user-select:none;transition:transform .1s,box-shadow .1s;font-family:'JetBrains Mono',monospace;white-space:nowrap;-webkit-tap-highlight-color:transparent;}
.drag-chip:active{cursor:grabbing;transform:scale(1.06);}
.drag-chip.chip-ok{background:#d4edda;border-color:var(--green);color:var(--green-dark);cursor:default;}
.drag-chip.chip-ko{background:#ffe0de;border-color:var(--pink);color:var(--pink-dark);cursor:default;}
.cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.6rem;margin-bottom:.5rem;}
.col-box{background:var(--surface2);border:2px solid var(--border);border-radius:var(--radius-sm);padding:.5rem .5rem;min-height:70px;}
.col-title{font-size:.72rem;font-weight:800;color:var(--day-dark);text-align:center;margin-bottom:.4rem;text-transform:uppercase;letter-spacing:.05em;font-family:'JetBrains Mono',monospace;}
.col-drop{min-height:44px;display:flex;flex-wrap:wrap;gap:.3rem;justify-content:center;align-items:flex-start;padding-top:.2rem;}
.col-drop .drag-chip{font-size:.78rem;padding:.3rem .55rem;}
.col-box.drag-over{border-color:var(--day);background:var(--day-light);}
/* BOUTONS */
.btn-row{display:flex;gap:.55rem;flex-wrap:wrap;margin-top:.9rem;}
@media(max-width:479px){.btn-row{flex-direction:column;}.btn-row .btn{width:100%;justify-content:center;}}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.65rem 1.2rem;border-radius:var(--radius-sm);font-family:Arial,Helvetica,sans-serif;font-size:clamp(.88rem,2.5vw,.97rem);font-weight:800;cursor:pointer;border:none;transition:transform .12s,box-shadow .14s;min-height:2.8rem;-webkit-tap-highlight-color:transparent;}
.btn:active{transform:scale(.96);}
.btn:disabled{opacity:.35;cursor:default;transform:none!important;}
.btn-primary{background:var(--day);color:#fff;box-shadow:0 3px 12px var(--day-glow);}
.btn-primary:hover:not(:disabled){transform:translateY(-1px);}
.btn-ghost{background:transparent;color:var(--muted);border:1.5px solid var(--border);}
.btn-ghost:hover:not(:disabled){border-color:var(--day);color:var(--text);}
/* FEEDBACK */
.feedback{margin-top:1rem;padding:.85rem 1rem;border-radius:var(--radius-sm);font-size:clamp(.87rem,2.5vw,.97rem);display:none;align-items:flex-start;gap:.6rem;line-height:1.75;word-break:break-word;}
.feedback.show{display:flex;}
.feedback.ok{background:var(--green-light);border:1.5px solid var(--green);color:var(--green-dark);}
.feedback.ko{background:var(--pink-light);border:1.5px solid var(--pink);color:var(--pink-dark);}
.fb-icon{font-size:1.3rem;flex-shrink:0;}
.fb-title{font-weight:800;margin-bottom:.2rem;}
.fb-det{font-family:'JetBrains Mono',monospace;font-size:.82rem;color:var(--text);margin-top:.2rem;line-height:1.85;}
/* RÉSULTATS */
.results{display:none;width:100%;position:relative;z-index:1;animation:fadeUp .4s ease both;}
.results.show{display:block;}
.results-card{background:var(--surface);border:1.5px solid #e0ddd5;border-radius:var(--radius);padding:2rem 1.4rem;box-shadow:0 6px 28px rgba(0,0,0,.07);text-align:center;position:relative;}
.results-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;border-radius:var(--radius) var(--radius) 0 0;background:linear-gradient(90deg,var(--day),var(--yellow),var(--orange),var(--pink));}
.score-big{font-size:clamp(2.8rem,10vw,4.5rem);font-weight:800;line-height:1;margin:.6rem 0 .3rem;color:var(--day-dark);}
.stars{font-size:1.9rem;margin:.4rem 0 .8rem;letter-spacing:.1em;}
.r-msg{color:var(--muted);font-size:clamp(.88rem,2.5vw,1rem);margin-bottom:1rem;line-height:1.8;}
.recap{text-align:left;display:flex;flex-direction:column;gap:.4rem;margin-bottom:1.4rem;}
.recap-item{display:flex;align-items:center;gap:.6rem;padding:.5rem .9rem;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:.82rem;font-family:'JetBrains Mono',monospace;}
.recap-item.ok-r{border-color:#b5e08a;}
.recap-item.ko-r{border-color:#f9c0bb;}
/* BONUS POPUP */
.bonus-box{margin-top:1rem;padding:.9rem 1rem;background:#fffbeb;border:2px solid #f5c518;border-radius:var(--radius-sm);animation:fadeUp .3s ease both;}
.bonus-q{font-size:clamp(.88rem,2.5vw,.97rem);font-weight:700;color:#856404;margin-bottom:.7rem;line-height:1.65;}
.bonus-choices{display:flex;flex-direction:column;gap:.4rem;}
.bonus-btn{background:#fff;border:1.5px solid #f5c518;border-radius:var(--radius-sm);color:var(--text);font-size:clamp(.88rem,2.5vw,.95rem);font-weight:600;padding:.55rem .9rem;cursor:pointer;min-height:44px;-webkit-tap-highlight-color:transparent;font-family:Arial,Helvetica,sans-serif;text-align:left;transition:background .12s,border-color .12s;}
.bonus-btn:hover:not(:disabled){background:#fffbeb;border-color:#c47a10;}
.bonus-btn:disabled{cursor:default;}
.bonus-btn.b-correct{border-color:var(--green);background:var(--green-light);color:var(--green-dark);}
.bonus-btn.b-wrong  {border-color:var(--pink);background:var(--pink-light);color:var(--pink-dark);}
.bonus-fb{font-size:.82rem;font-family:'JetBrains Mono',monospace;margin-top:.6rem;padding:.6rem .8rem;border-radius:var(--radius-sm);display:none;line-height:1.75;}
.bonus-fb.show{display:block;}
.bonus-fb.ok{background:var(--green-light);color:var(--green-dark);}
.bonus-fb.ko{background:var(--pink-light);color:var(--pink-dark);}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:500px){.card{padding:1.2rem 1rem;}.cols{grid-template-columns:1fr 1fr 1fr;}}
</style>
</head>
<body>
<div class="bubble1"></div><div class="bubble2"></div>
<div class="bubble3"></div><div class="bubble4"></div>
<div class="wrap">

<header>
  <div class="logo-badge">
    <span style="color:#e8002d;font-size:14px;">&#9679;</span>
    <span style="color:#8dc63f;font-size:14px;">&#9679;</span>
    <span style="color:#3ab5d8;font-size:14px;">&#9679;</span>
    <span style="font-family:monospace;font-size:14px;font-weight:800;color:#000;letter-spacing:.5px;">&nbsp;Pazapa &middot; Fran&ccedil;ais &middot; 5&egrave;me</span>
  </div>
  <div class="week-label">Semaine 1 &ndash; Jour 4 &mdash; J&rsquo;observe et je teste</div>
  <h1>Le pr&eacute;sent de l&rsquo;indicatif &middot;<br><span class="hl">Les trois groupes</span></h1>
</header>

<div class="prog-wrap">
  <div class="prog-info">
    <span id="prog-label">Question 1 / 7</span>
    <span id="prog-pct">0&nbsp;%</span>
  </div>
  <div class="prog-bg"><div class="prog-fill" id="prog-fill"></div></div>
</div>
<div class="chips">
  <div class="chip"><div class="dot" style="background:#8dc63f"></div><span id="cnt-ok">0</span>&nbsp;correct(s)</div>
  <div class="chip"><div class="dot" style="background:#f28b82"></div><span id="cnt-ko">0</span>&nbsp;erreur(s)</div>
  <div class="chip"><div class="dot" style="background:#8a8f9a"></div><span id="cnt-rem">7</span>&nbsp;restant(s)</div>
</div>

<!-- CARDS générées par JS -->
<div id="cards-zone"></div>

<!-- RÉSULTATS -->
<div class="results" id="results-screen">
  <div class="results-card">
    <div class="logo-badge" style="display:inline-block;background:#f5c518;border-radius:50px;padding:6px 16px;box-shadow:0 2px 8px rgba(245,197,24,.35);margin-bottom:.6rem;">
      <span style="color:#e8002d;font-size:14px;">&#9679;</span>
      <span style="color:#8dc63f;font-size:14px;">&#9679;</span>
      <span style="color:#3ab5d8;font-size:14px;">&#9679;</span>
      <span style="font-family:monospace;font-size:13px;font-weight:800;color:#000;letter-spacing:.5px;">&nbsp;Résultats</span>
    </div>
    <div class="score-big"><span id="r-score">0</span>/7</div>
    <div class="stars" id="r-stars"></div>
    <div class="r-msg" id="r-msg"></div>
    <div class="recap" id="r-recap"></div>
    <button class="btn btn-primary" onclick="restartAll()" style="width:100%;justify-content:center;">&#8635;&nbsp;Recommencer</button>
  </div>
</div>

</div>
<script>
var QS = [
  {
    num: 1, badge: 'Intrus', type: 'qcm',
    observe: null,
    q: 'Quel verbe n\u2019appartient pas au m\u00eame groupe que les autres\u00a0?',
    opts: ['parler','finir','regarder','marcher'],
    ans: 1,
    fbOk: 'Bravo\u00a0! Tu as trouv\u00e9 l\u2019intrus.',
    fbKo: 'Pas tout \u00e0 fait. Observe les infinitifs\u00a0: trois se terminent en -er, un seul diff\u00e8re.',
    bonus: { q: 'Et selon toi, \u00e0 quel groupe appartient <em>finir</em>\u00a0?', opts: ['1\u1d49 groupe','2\u1d49 groupe','3\u1d49 groupe'], ans: 1, fbOk: 'Oui\u00a0! <em>Finir</em> est du 2\u1d49 groupe\u00a0: son participe pr\u00e9sent est <em>finissant</em>.', fbKo: '<em>Finir</em> est du 2\u1d49 groupe. Astuce\u00a0: au participe pr\u00e9sent, les verbes du 2\u1d49 groupe prennent -issant (fin-issant).' }
  },
  {
    num: 2, badge: 'Intrus', type: 'qcm',
    observe: null,
    q: 'Quel verbe n\u2019appartient pas au m\u00eame groupe que les autres\u00a0?',
    opts: ['prendre','grandir','choisir','rougir'],
    ans: 0,
    fbOk: 'Bravo\u00a0! Tu as trouv\u00e9 l\u2019intrus.',
    fbKo: 'Pas tout \u00e0 fait. Observe les infinitifs\u00a0: trois se ressemblent, un seul a un comportement diff\u00e9rent.',
    bonus: { q: 'Et selon toi, \u00e0 quel groupe appartient <em>prendre</em>\u00a0?', opts: ['1\u1d49 groupe','2\u1d49 groupe','3\u1d49 groupe'], ans: 2, fbOk: 'Exact\u00a0! <em>Prendre</em> est du 3\u1d49 groupe\u00a0: c\u2019est un verbe irr\u00e9gulier dont l\u2019infinitif ne se termine pas en -er et qui ne fait pas -issant.', fbKo: '<em>Prendre</em> appartient au 3\u1d49 groupe. Ce sont les verbes irr\u00e9guliers\u00a0: ils ne font pas -er, ni -issant au participe pr\u00e9sent.' }
  },
  {
    num: 3, badge: 'Observation', type: 'qcm',
    observe: 'je parle\ntu regardes\nnous marchons',
    q: 'Ces verbes appartiennent\u00a0:',
    opts: ['au 2\u1d49 groupe','au 1\u1d49 groupe','au 3\u1d49 groupe'],
    ans: 1,
    fbOk: 'Oui\u00a0! Les terminaisons -e, -es, -ons sont caract\u00e9ristiques du 1\u1d49 groupe. Ces verbes ont un infinitif en -er.',
    fbKo: 'La bonne r\u00e9ponse est le 1\u1d49 groupe. Les terminaisons -e, -es, -ons appartiennent aux verbes en -er (parler, regarder, marcher).'
  },
  {
    num: 4, badge: 'Observation', type: 'qcm',
    observe: 'nous finissons\nvous choisissez\nils grandissent',
    q: 'Ces verbes appartiennent\u00a0:',
    opts: ['au 1\u1d49 groupe','au 3\u1d49 groupe','au 2\u1d49 groupe'],
    ans: 2,
    fbOk: 'Exact\u00a0! Le radical -iss- (finiss-, choisis-, grandiss-) est la marque du 2\u1d49 groupe.',
    fbKo: 'La bonne r\u00e9ponse est le 2\u1d49 groupe. La pr\u00e9sence du radical -iss- (finissons, choisissez, grandissent) est la marque du 2\u1d49 groupe.'
  },
  {
    num: 5, badge: 'Rep\u00e8re l\u2019erreur', type: 'qcm',
    observe: 'je parle\nnous regardons\nils regardent\nvous regarder',
    q: 'Quel verbe est mal conjugu\u00e9\u00a0?',
    opts: ['je parle','vous regarder','nous regardons','ils regardent'],
    ans: 1,
    fbOk: 'Bien vu\u00a0! \u00ab\u00a0vous regarder\u00a0\u00bb est une forme infinitive, pas une forme conjugu\u00e9e. Il faut \u00e9crire \u00ab\u00a0vous regardez\u00a0\u00bb.',
    fbKo: 'La forme incorrecte est \u00ab\u00a0vous regarder\u00a0\u00bb. C\u2019est un infinitif, pas une forme conjugu\u00e9e. La bonne forme est \u00ab\u00a0vous regardez\u00a0\u00bb.'
  },
  {
    num: 6, badge: 'Rep\u00e8re l\u2019erreur', type: 'qcm',
    observe: 'nous finissons\nvous choisisez\nils grandissent\nje rougis',
    q: 'Quel verbe est mal conjugu\u00e9\u00a0?',
    opts: ['nous finissons','ils grandissent','je rougis','vous choisisez'],
    ans: 3,
    fbOk: 'Excellent\u00a0! La bonne forme est \u00ab\u00a0vous choisissez\u00a0\u00bb — avec deux s dans -issez.',
    fbKo: 'La forme incorrecte est \u00ab\u00a0vous choisisez\u00a0\u00bb. Il manque un s\u00a0: la bonne forme est \u00ab\u00a0vous choisissez\u00a0\u00bb.'
  },
  {
    num: 7, badge: 'Classement', type: 'drag',
    observe: null,
    q: 'Classe chaque verbe dans la bonne colonne.',
    words: ['marcher','finir','prendre','choisir','jouer','voir'],
    cols: ['1\u1d49 groupe','2\u1d49 groupe','3\u1d49 groupe'],
    ans: { 'marcher':0,'jouer':0,'finir':1,'choisir':1,'prendre':2,'voir':2 },
    fbOk: 'Parfait\u00a0! 1\u1d49\u00a0: marcher, jouer (-er). 2\u1d49\u00a0: finir, choisir (-ir + -issant). 3\u1d49\u00a0: prendre, voir (verbes irr\u00e9guliers).',
    fbKo: 'Classement attendu\u00a0— 1\u1d49\u00a0: marcher, jouer. 2\u1d49\u00a0: finir, choisir. 3\u1d49\u00a0: prendre, voir.'
  }
];

var scores = new Array(QS.length).fill(null);
var done   = new Array(QS.length).fill(false);
var dragSrc = null;

function gid(id){ return document.getElementById(id); }
function shuffle(a){ var b=a.slice(); for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;} return b; }

/* ══ BUILD ALL CARDS ════════════════════════════════ */
function buildAll(){
  var zone = gid('cards-zone'); zone.innerHTML='';
  QS.forEach(function(q, qi){ zone.appendChild(buildCard(q, qi)); });
}

function buildCard(q, qi){
  var card = document.createElement('div'); card.className='card'; card.id='card'+qi;

  var stripe = document.createElement('div'); stripe.className='card-stripe'; card.appendChild(stripe);

  var num = document.createElement('div'); num.className='ex-num';
  num.textContent = 'Activité '+q.num+' / '+QS.length;
  card.appendChild(num);

  var badge = document.createElement('div'); badge.className='theme-badge'; badge.textContent=q.badge;
  card.appendChild(badge);

  if(q.observe){
    var obs = document.createElement('div'); obs.className='observe-box';
    obs.innerHTML = q.observe.replace(/\n/g,'<br>');
    card.appendChild(obs);
  }

  var qtext = document.createElement('div'); qtext.className='q-text'; qtext.innerHTML=q.q;
  card.appendChild(qtext);

  var body = document.createElement('div'); body.id='body'+qi; card.appendChild(body);

  if(q.type==='qcm') buildQCM(q, qi, body);
  else if(q.type==='drag') buildDrag(q, qi, body);

  var fb = document.createElement('div'); fb.className='feedback'; fb.id='fb'+qi;
  fb.innerHTML='<span class="fb-icon" id="fbi'+qi+'"></span><div><div class="fb-title" id="fbt'+qi+'"></div><div class="fb-det" id="fbd'+qi+'"></div></div>';
  card.appendChild(fb);

  var brow = document.createElement('div'); brow.className='btn-row';
  var vbtn = document.createElement('button'); vbtn.className='btn btn-primary'; vbtn.id='vbtn'+qi;
  vbtn.innerHTML='&#10003;&nbsp;Vérifier';
  vbtn.addEventListener('click', function(){ verif(qi); });
  var rbtn = document.createElement('button'); rbtn.className='btn btn-ghost';
  rbtn.innerHTML='&#8635;&nbsp;Recommencer';
  rbtn.addEventListener('click', function(){ resetQ(qi); });
  brow.appendChild(vbtn); brow.appendChild(rbtn);
  card.appendChild(brow);
  return card;
}

function buildQCM(q, qi, body){
  var list = document.createElement('div'); list.className='choices';
  var letters = ['A','B','C','D'];
  q.opts.forEach(function(opt, i){
    var btn = document.createElement('button'); btn.className='choice-btn';
    btn.innerHTML='<span class="choice-letter">'+letters[i]+'</span><span>'+opt+'</span>';
    btn.dataset.idx=i;
    btn.addEventListener('click', function(){
      if(done[qi]) return;
      list.querySelectorAll('.choice-btn').forEach(function(b){ b.classList.remove('selected'); });
      btn.classList.add('selected');
    });
    list.appendChild(btn);
  });
  body.appendChild(list);
}

function buildDrag(q, qi, body){
  var bank = document.createElement('div'); bank.className='drag-bank'; bank.id='bank'+qi;
  shuffle(q.words).forEach(function(w){
    bank.appendChild(makeChip(w, qi));
  });
  body.appendChild(bank);

  var grid = document.createElement('div'); grid.className='cols';
  q.cols.forEach(function(col, ci){
    var box = document.createElement('div'); box.className='col-box'; box.dataset.col=ci;
    var title = document.createElement('div'); title.className='col-title'; title.textContent=col;
    var drop = document.createElement('div'); drop.className='col-drop'; drop.id='drop'+qi+'_'+ci;
    drop.dataset.col=ci;
    drop.addEventListener('dragover', function(e){ e.preventDefault(); box.classList.add('drag-over'); });
    drop.addEventListener('dragleave', function(){ box.classList.remove('drag-over'); });
    drop.addEventListener('drop', function(e){
      e.preventDefault(); box.classList.remove('drag-over');
      if(dragSrc) doDropChip(dragSrc, drop, qi);
    });
    drop.addEventListener('touchend', function(e){
      if(!dragSrc) return;
      var t=e.changedTouches[0];
      var el=document.elementFromPoint(t.clientX,t.clientY);
      var target=el?el.closest('.col-drop'):null;
      if(target) doDropChip(dragSrc, target, qi);
      dragSrc=null;
    });
    box.appendChild(title); box.appendChild(drop); grid.appendChild(box);
  });
  body.appendChild(grid);
}

function makeChip(w, qi){
  var chip = document.createElement('div'); chip.className='drag-chip'; chip.textContent=w; chip.dataset.word=w;
  chip.draggable=true;
  chip.addEventListener('dragstart', function(e){ dragSrc=chip; e.dataTransfer.effectAllowed='move'; });
  chip.addEventListener('touchstart', function(){ dragSrc=chip; }, {passive:true});
  return chip;
}

function doDropChip(chip, drop, qi){
  if(done[qi]) return;
  if(chip.parentElement && chip.parentElement.classList.contains('col-drop')){
    chip.remove();
  } else if(chip.parentElement && chip.parentElement.id==='bank'+qi){
    chip.remove();
  }
  drop.appendChild(chip);
  dragSrc=null;
}

/* ══ VÉRIFIER ════════════════════════════════════════ */
function verif(qi){
  if(done[qi]) return;
  done[qi]=true;
  gid('vbtn'+qi).disabled=true;
  var q=QS[qi]; var ok=false;

  if(q.type==='qcm'){
    var btns=gid('body'+qi).querySelectorAll('.choice-btn');
    var sel=-1;
    btns.forEach(function(b,i){ if(b.classList.contains('selected')) sel=i; });
    ok=(sel===q.ans);
    btns.forEach(function(b,i){
      b.disabled=true; b.classList.remove('selected');
      if(i===q.ans) b.classList.add('correct-ans');
      else if(i===sel&&!ok) b.classList.add('wrong-ans');
    });
  } else if(q.type==='drag'){
    var allOk=true;
    gid('body'+qi).querySelectorAll('.drag-chip').forEach(function(chip){
      var w=chip.dataset.word;
      var parentDrop=chip.parentElement;
      var placedCol=parentDrop?parseInt(parentDrop.dataset.col):-1;
      chip.draggable=false;
      if(placedCol===q.ans[w]){ chip.classList.add('chip-ok'); }
      else { chip.classList.add('chip-ko'); allOk=false; }
    });
    ok=allOk;
  }

  scores[qi]=ok?1:0;

  var fb=gid('fb'+qi); fb.className='feedback show '+(ok?'ok':'ko');
  gid('fbi'+qi).textContent=ok?'\u2705':'\u274c';
  gid('fbt'+qi).textContent=ok?'Bien observé\u00a0!':'Regarde encore…';
  gid('fbd'+qi).innerHTML=ok?q.fbOk:q.fbKo;

  updateGlobal();
  if(q.bonus) setTimeout(function(){ showBonus(qi, q.bonus); }, 400);
  if(done.every(function(d){ return d; })) setTimeout(showResults, 600);
}

function showBonus(qi, bonus){
  var card = gid('card'+qi);
  var box = document.createElement('div'); box.className='bonus-box'; box.id='bonus'+qi;
  var bq = document.createElement('div'); bq.className='bonus-q'; bq.innerHTML=bonus.q;
  var bchoices = document.createElement('div'); bchoices.className='bonus-choices';
  var bonusDone = false;
  bonus.opts.forEach(function(opt,i){
    var btn = document.createElement('button'); btn.className='bonus-btn';
    btn.textContent=opt;
    btn.addEventListener('click', function(){
      if(bonusDone) return; bonusDone=true;
      bchoices.querySelectorAll('.bonus-btn').forEach(function(b){ b.disabled=true; });
      var ok2=(i===bonus.ans);
      btn.classList.add(ok2?'b-correct':'b-wrong');
      bchoices.children[bonus.ans].classList.add('b-correct');
      var bfb = gid('bfb'+qi); bfb.className='bonus-fb show '+(ok2?'ok':'ko');
      bfb.innerHTML=(ok2?'✅ ':'❌ ')+(ok2?bonus.fbOk:bonus.fbKo);
    });
    bchoices.appendChild(btn);
  });
  var bfb = document.createElement('div'); bfb.className='bonus-fb'; bfb.id='bfb'+qi;
  box.appendChild(bq); box.appendChild(bchoices); box.appendChild(bfb);
  card.appendChild(box);
  box.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function resetQ(qi){
  done[qi]=false; scores[qi]=null;
  gid('vbtn'+qi).disabled=false;
  gid('fb'+qi).className='feedback';
  var body=gid('body'+qi); body.innerHTML='';
  var q=QS[qi];
  if(q.type==='qcm') buildQCM(q,qi,body);
  else buildDrag(q,qi,body);
  updateGlobal();
}

/* ══ GLOBAL ══════════════════════════════════════════ */
function updateGlobal(){
  var ok=0,ko=0,rem=0;
  scores.forEach(function(s){ if(s===1)ok++; else if(s===0)ko++; else rem++; });
  var done_count=QS.length-rem;
  gid('cnt-ok').textContent=ok;
  gid('cnt-ko').textContent=ko;
  gid('cnt-rem').textContent=rem;
  var pct=Math.round(done_count/QS.length*100);
  gid('prog-fill').style.width=pct+'%';
  gid('prog-label').textContent=done_count+' / '+QS.length+' questions';
  gid('prog-pct').textContent=pct+'\u00a0%';
}

/* ══ RÉSULTATS ════════════════════════════════════════ */
function showResults(){
  var total=scores.reduce(function(a,b){ return a+(b||0); },0);
  gid('r-score').textContent=total;
  var s=total>=7?5:total>=5?4:total>=4?3:total>=2?2:1;
  gid('r-stars').textContent='\u2b50'.repeat(s)+'\u2606'.repeat(5-s);
  var msgs=[
    'Relis les définitions et recommence !',
    'Tu progresses — continue !',
    'Pas mal, quelques notions à revoir.',
    'Très bien ! Tu maîtrises presque tout.',
    'Parfait ! Tu connais les trois groupes sur le bout des doigts.'
  ];
  gid('r-msg').textContent=msgs[s-1];
  var recap=gid('r-recap'); recap.innerHTML='';
  var labels=['Intrus (parler…)','Intrus (grandir…)','Observation (je parle…)','Observation (finissons…)','Erreur (regarder…)','Erreur (finissons…)','Classement'];
  labels.forEach(function(lbl,i){
    var ok2=scores[i]===1;
    var d=document.createElement('div'); d.className='recap-item '+(ok2?'ok-r':'ko-r');
    d.innerHTML='<span>'+(ok2?'\u2705':'\u274c')+'</span><span style="flex:1;color:#8a8f9a;">'+lbl+'</span><span style="color:#1a6e88;font-weight:700;">'+(ok2?'Correct':'À revoir')+'</span>';
    recap.appendChild(d);
  });
  gid('results-screen').classList.add('show');
  window.scrollTo({top:0,behavior:'smooth'});
}

function restartAll(){
  scores=new Array(QS.length).fill(null);
  done=new Array(QS.length).fill(false);
  gid('results-screen').classList.remove('show');
  buildAll(); updateGlobal();
  window.scrollTo({top:0,behavior:'smooth'});
}

buildAll(); updateGlobal();
</script>
</body>
