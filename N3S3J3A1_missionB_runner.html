<style>

  #ol .ch button.ko{border-color:#e74c3c!important;background:rgba(231,76,60,0.2)!important;color:#e74c3c}

/*r19*/'111111111111111111111111111111111111111111111111111111111111111111111111111111',
/*r20*/'111111111111111111111111111111111111111111111111111111111111111111111111111111',
];
const ROWS=RAW.length, COLS=RAW[0].length;

let blocks=[],questions=[],hearts=[],goals=[],starTiles=[],moneyBags=[],bonusQ=null;

function buildLevel(){
  blocks=[];questions=[];hearts=[];goals=[];
  starTiles=[];moneyBags=[];bonusQ=null;
  let qi=0;
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const v=+RAW[r][c], wx=c*T, wy=r*T;
      if(v===1) blocks.push({wx,wy,w:T,h:T,breakable:false});
      if(v===2){questions.push({wx,wy,w:T,h:T,on:true,qi:qi%QS.length});qi++;}
      if(v===3) hearts.push({wx,wy,w:T,h:T,on:true});
      if(v===4) goals.push({wx,wy,w:T,h:T});
      if(v===5) starTiles.push({wx,wy,w:T,h:T,open:false,openTimer:0,crumble:0});
      if(v===6) moneyBags.push({wx,wy,w:T,h:T,on:true});
      if(v===7) blocks.push({wx,wy,w:T,h:T,breakable:true,breaking:false,breakTimer:0});
      if(v===8) bonusQ={wx,wy,w:T,h:T,on:true};
    }
  }
}

function buildEnemies(){
  enemies=ENM_DEF.map(e=>({wx:e.ox,wy:e.row*T,w:T,h:T,dir:e.dir,vy:0}));
}

let p={};
function resetPlayer(){
  p={wx:30,wy:200,w:T,h:PH_NORMAL,vy:0,onGround:false,
     dir:1,frame:0,ft:0,crouching:false,
     currentQ:null,goalBlocked:false,goalBlockTimer:0};
}

function ix(a,b){return a.wx<b.wx+b.w&&a.wx+a.w>b.wx&&a.wy<b.wy+b.h&&a.wy+a.h>b.wy;}
function solidBlocks(){return blocks.filter(b=>!b.breaking).concat(starTiles.filter(s=>!s.open));}
function hitB(o){return solidBlocks().some(b=>ix(o,b));}

/* ── AUDIO ────────────────────────────────────────────────────── */
let ac=null;
function beep(f,d,type,vol){
  try{
    if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();
    o.connect(g);g.connect(ac.destination);
    o.frequency.value=f;o.type=type||'square';
    g.gain.setValueAtTime(vol||0.06,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+d/1000);
    o.start();o.stop(ac.currentTime+d/1000);
  }catch(e){}
}
function beepHeart(){beep(880,60);setTimeout(()=>beep(1320,100),65);}
function beepMoney(){beep(660,50);setTimeout(()=>beep(990,80),55);}
function beepBreak(){beep(160,50,'sawtooth',0.12);setTimeout(()=>beep(100,80,'sawtooth',0.1),60);}
function beepCrumble(){beep(200,60,'sawtooth',0.09);setTimeout(()=>beep(130,100,'sawtooth',0.07),70);}
function beepWin(){beep(660,80);setTimeout(()=>beep(880,80),100);setTimeout(()=>beep(1100,220),200);}
function beepBonus(){
  beep(440,70,'square',0.11);setTimeout(()=>beep(554,70,'square',0.12),85);
  setTimeout(()=>beep(659,70,'square',0.12),170);setTimeout(()=>beep(880,220,'square',0.14),255);
}
function beepGoalBlock(){beep(300,120,'square',0.08);}

/* ── PARTICULES ───────────────────────────────────────────────── */
function spawnP(wx,wy,color,n,vy0){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,sp=1+Math.random()*4;
    particles.push({x:wx+T/2,y:wy+T/2,vx:Math.cos(a)*sp,
      vy:(vy0||0)+Math.sin(a)*sp-2,life:50+Math.random()*30,maxLife:80,color,r:2+Math.random()*3});
  }
}
function updateP(){
  particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life--;return p.life>0;});
}
function drawP(){
  particles.forEach(pt=>{
    cx.save();cx.globalAlpha=pt.life/pt.maxLife;
    cx.fillStyle=pt.color;
    cx.beginPath();cx.arc(pt.x-camX,pt.y,pt.r,0,Math.PI*2);cx.fill();
    cx.restore();
  });
}

/* ── DALLE ÉTOILE ─────────────────────────────────────────────── */
function updateStarTiles(){
  starTiles.forEach(s=>{
    if(s.open){
      s.openTimer++;if(s.crumble<16)s.crumble++;
      if(s.openTimer>360){s.open=false;s.openTimer=0;s.crumble=0;}
      return;
    }
    const pBot=p.wy+p.h;
    const over=(p.wx+p.w-2>s.wx&&p.wx+2<s.wx+s.w&&pBot>=s.wy-1&&pBot<=s.wy+10&&p.onGround);
    if(over){s.open=true;s.openTimer=0;s.crumble=0;beepCrumble();spawnP(s.wx,s.wy,'#5a9a20',14);}
  });
}

/* ── PHYSIQUE JOUEUR ──────────────────────────────────────────── */
function applyCrouch(){
  const want=K[40]&&p.onGround;
  if(want&&!p.crouching){
    p.h=PH_CROUCH;p.wy+=PH_NORMAL-PH_CROUCH;p.crouching=true;
  }
  if(!want&&p.crouching){
    const test={wx:p.wx,wy:p.wy-(PH_NORMAL-PH_CROUCH),w:p.w,h:PH_NORMAL};
    if(!hitB(test)){p.wy-=PH_NORMAL-PH_CROUCH;p.h=PH_NORMAL;p.crouching=false;}
  }
}

function updatePlayer(){
  if(dead||wonLevel)return;
  applyCrouch();
  p.vy+=GRAVITY;
  if(K[32]&&p.onGround){p.vy=JUMP_VY;p.onGround=false;if(p.crouching){p.wy-=(PH_NORMAL-PH_CROUCH);}p.crouching=false;p.h=PH_NORMAL;beep(600,70);}
  if(K[37]){p.dir=-1;p.wx-=SPEED;if(hitB(p)||p.wx<0)p.wx+=SPEED;}
  if(K[39]){p.dir=1; p.wx+=SPEED;if(hitB(p))p.wx-=SPEED;}

  const steps=Math.ceil(Math.abs(p.vy));
  const dy=p.vy/steps;
  p.onGround=false;
  for(let i=0;i<steps;i++){
    p.wy+=dy;
    if(hitB(p)){
      /* Casse les blocs destructibles frappés par la tête */
      if(dy<0){
        blocks.forEach(b=>{
          if(b.breakable&&!b.breaking&&ix(p,b)&&p.wy<=b.wy+b.h&&p.wy+2>=b.wy){
            b.breaking=true;b.breakTimer=0;
            beepBreak();spawnP(b.wx,b.wy,'#c89050',14);spawnP(b.wx,b.wy,'#7a4f2c',8);
          }
        });
      }
      p.wy-=dy;if(dy>0)p.onGround=true;p.vy=0;break;
    }
  }
  blocks=blocks.filter(b=>{
    if(!b.breaking)return true;
    b.breakTimer++;return b.breakTimer<14;
  });

  const sx=p.wx-camX;
  if(sx>SCROLL_AT)camX=p.wx-SCROLL_AT;
  if(sx<200&&camX>0)camX=Math.max(0,p.wx-200);

  if(K[37]||K[39]){p.ft++;if(p.ft>=4){p.frame=(p.frame+1)%4;p.ft=0;}}
  else p.frame=0;

  if(p.wy>CH+80){loseLife();return;}

  /* Questions */
  questions.forEach(c=>{
    if(c.on&&ix(p,c)){c.on=false;p.currentQ=c;beep(660,80);askQ(c.qi,false);}
  });
  /* Cœurs */
  hearts.forEach(h=>{
    if(h.on&&ix(p,h)){h.on=false;lives=Math.min(lives+1,5);updateHUD();beepHeart();
      spawnP(h.wx,h.wy,'#e74c3c',12);}
  });
  /* Sacs d'argent */
  moneyBags.forEach(m=>{
    if(m.on&&ix(p,m)){m.on=false;score+=15;updateHUD();beepMoney();
      spawnP(m.wx,m.wy,'#f0c040',16);spawnP(m.wx,m.wy,'#fff',6);}
  });
  /* Bonus souterrain */
  if(bonusQ&&bonusQ.on&&ix(p,bonusQ)){
    bonusQ.on=false;beepBonus();
    flashTimer=22;flashColor='rgba(137,200,67,0.6)';
    spawnP(bonusQ.wx,bonusQ.wy,'#89c843',30);spawnP(bonusQ.wx,bonusQ.wy,'#e5c417',18);
    askQ(-1,true);
  }
  /* Drapeau */
  goals.forEach(g=>{
    if(!ix(p,g))return;
    const rem=questions.filter(c=>c.on).length;
    if(rem>0){
      if(!goalBlockedTimer){goalBlockedTimer=180;beepGoalBlock();showGoalMsg();}
    } else winLevel();
  });
  if(goalBlockedTimer>0){goalBlockedTimer--;if(goalBlockedTimer===0)hideGoalMsg();}
  /* Ennemis */
  enemies.forEach(e=>{if(ix(p,e))loseLife();});
}

function updateEnemies(){
  enemies.forEach(e=>{
    e.vy+=GRAVITY;
    const steps=Math.ceil(Math.abs(e.vy));
    const dy=e.vy/steps;
    for(let i=0;i<steps;i++){e.wy+=dy;if(hitB(e)){e.wy-=dy;e.vy=0;break;}}
    e.wx+=e.dir*1.8;if(hitB(e)){e.wx-=e.dir*1.8;e.dir*=-1;}
  });
}

/* ── RENDU ────────────────────────────────────────────────────── */
function toSX(wx){return Math.round(wx-camX);}

function render(){
  tick++;
  /* Ciel dégradé */
  const skyGrad=cx.createLinearGradient(0,0,0,CH*0.6);
  skyGrad.addColorStop(0,'#2a6abf');skyGrad.addColorStop(1,'#5aa0e8');
  cx.fillStyle=skyGrad;cx.fillRect(0,0,CW,CH);

  drawClouds();
  drawHills();

  /* Fond tunnel (bande sombre propre entre le sol et le plancher) */
  const tunY=15*T, tunH=5*T;  /* r15 à r20 */
  cx.fillStyle='#18181f';
  cx.fillRect(0,tunY,CW,tunH);
  /* Légère texture tunnel */
  cx.fillStyle='rgba(0,0,40,0.3)';
  cx.fillRect(0,tunY,CW,4);
  /* Ligne de sol dorée */
  cx.fillStyle='#e5c417';
  cx.fillRect(0,tunY-2,CW,3);

  /* Blocs */
  blocks.forEach(b=>{
    if(b.breaking)return;
    const x=toSX(b.wx);
    if(x>-T&&x<CW+T){
      if(b.breakable)drawBreakableBlock(x,b.wy);
      else drawBlock(x,b.wy);
    }
  });

  /* Blocs en train de se casser */
  blocks.filter(b=>b.breaking).forEach(b=>{
    const x=toSX(b.wx);if(x<=-T||x>=CW+T)return;
    const prog=b.breakTimer/14;
    cx.save();cx.globalAlpha=1-prog;
    cx.fillStyle='#c89050';
    const s=T*(1-prog*0.6);
    cx.fillRect(x+(T-s)/2,b.wy+(T-s)/2,s,s);
    cx.restore();
  });

  /* Dalles étoile */
  starTiles.forEach(s=>{const x=toSX(s.wx);if(x>-T&&x<CW+T)drawStarTile(x,s.wy,s);});

  /* Collectibles */
  questions.forEach(c=>{if(!c.on)return;const x=toSX(c.wx);if(x>-T&&x<CW+T)drawQuestion(x,c.wy);});
  hearts.forEach(h=>{if(!h.on)return;const x=toSX(h.wx);if(x>-T&&x<CW+T)drawHeart(x,h.wy);});
  moneyBags.forEach(m=>{if(!m.on)return;const x=toSX(m.wx);if(x>-T&&x<CW+T)drawMoneyBag(x,m.wy);});
  if(bonusQ&&bonusQ.on){const x=toSX(bonusQ.wx);if(x>-T&&x<CW+T)drawBonusQ(x,bonusQ.wy);}

  goals.forEach(g=>{const x=toSX(g.wx);if(x>-T&&x<CW+T)drawGoal(x,g.wy);});
  enemies.forEach(e=>{const x=toSX(e.wx);if(x>-T&&x<CW+T)drawEnemy(x,e.wy);});

  drawP();
  drawPlayer(toSX(p.wx),p.wy);

  if(flashTimer>0){
    cx.save();cx.globalAlpha=flashTimer/22*0.5;
    cx.fillStyle=flashColor;cx.fillRect(0,0,CW,CH);
    cx.restore();flashTimer--;
  }
}

/* ── DESSINS ──────────────────────────────────────────────────── */
function drawBlock(x,y){
  /* Bloc avec dégradé interne et relief */
  cx.fillStyle='#8b5e3c';cx.fillRect(x,y,T,T);
  cx.fillStyle='#a07040';cx.fillRect(x+1,y+1,T-2,6);
  cx.fillStyle='#6a3e1c';cx.fillRect(x+1,y+T-4,T-2,3);
  cx.strokeStyle='#4a2a0a';cx.lineWidth=1;cx.strokeRect(x+.5,y+.5,T-1,T-1);
}

function drawBreakableBlock(x,y){
  cx.fillStyle='#c89050';cx.fillRect(x,y,T,T);
  cx.fillStyle='#e0a860';cx.fillRect(x+1,y+1,T-2,5);
  cx.fillStyle='#a07030';cx.fillRect(x+1,y+T-4,T-2,3);
  cx.strokeStyle='#7a5010';cx.lineWidth=1;cx.strokeRect(x+.5,y+.5,T-1,T-1);
  /* Fissures */
  cx.strokeStyle='#6a3a08';cx.lineWidth=1;
  cx.beginPath();cx.moveTo(x+T/2,y+2);cx.lineTo(x+T/2-3,y+T/2);cx.lineTo(x+T/2+2,y+T-3);cx.stroke();
  cx.beginPath();cx.moveTo(x+T/2-2,y+T/2);cx.lineTo(x+3,y+T/2+3);cx.stroke();
}

function drawStarTile(x,y,s){
  if(s.open){
    const prog=Math.min(s.crumble/10,1),half=Math.floor(T/2*(1-prog));
    cx.fillStyle='#5a3010';
    if(half>0){cx.fillRect(x,y,half,T);cx.fillRect(x+T-half,y,half,T);}
    return;
  }
  cx.fillStyle='#2a7a18';cx.fillRect(x,y,T,T);
  cx.fillStyle='#3a9a25';cx.fillRect(x+1,y+1,T-2,5);
  cx.strokeStyle='#1a5a10';cx.lineWidth=1;cx.strokeRect(x+.5,y+.5,T-1,T-1);
  const pulse=0.5+Math.sin(tick*.22)*0.5;
  cx.save();cx.globalAlpha=pulse;
  cx.fillStyle='#e5c417';cx.font='bold 13px monospace';
  cx.textAlign='center';cx.textBaseline='middle';
  cx.fillText('★',x+T/2,y+T/2+1);cx.restore();
}

function drawQuestion(x,y){
  const bob=Math.sin(tick*.16)*3;
  /* Halo lumineux */
  cx.save();cx.globalAlpha=0.25+Math.sin(tick*.16)*0.15;
  cx.fillStyle='#e5c417';cx.beginPath();cx.arc(x+T/2,y+T/2+bob,T*0.85,0,Math.PI*2);cx.fill();
  cx.restore();
  /* Bloc question */
  cx.fillStyle='#e5c417';cx.beginPath();cx.arc(x+T/2,y+T/2+bob,T/2-1,0,Math.PI*2);cx.fill();
  cx.fillStyle='#fff';cx.font='bold 12px monospace';
  cx.textAlign='center';cx.textBaseline='middle';
  cx.fillText('?',x+T/2,y+T/2+bob+1);cx.textAlign='left';
}

function drawHeart(x,y){
  const bob=Math.sin(tick*.18+1)*3;
  const hx=x+T/2,hy=y+T/2+bob,s=0.9;
  cx.fillStyle='#e74c3c';
  cx.beginPath();cx.moveTo(hx,hy+6*s);
  cx.bezierCurveTo(hx-8*s,hy,hx-8*s,hy-6*s,hx,hy-4*s);
  cx.bezierCurveTo(hx+8*s,hy-6*s,hx+8*s,hy,hx,hy+6*s);
  cx.fill();
  cx.fillStyle='rgba(255,255,255,.35)';
  cx.beginPath();cx.ellipse(hx-2*s,hy-3*s,2.5*s,2*s,-.5,0,Math.PI*2);cx.fill();
}

function drawMoneyBag(x,y){
  const bob=Math.sin(tick*.14+2)*3;
  const bx=x+T/2,by=y+T/2+bob;
  /* Sac */
  cx.fillStyle='#c8922a';
  cx.beginPath();cx.ellipse(bx,by+2,T/2-1,T/2,0,0,Math.PI*2);cx.fill();
  /* Reflet */
  cx.fillStyle='#e8b840';
  cx.beginPath();cx.ellipse(bx-3,by-2,4,3,-.5,0,Math.PI*2);cx.fill();
  /* Ficelle */
  cx.fillStyle='#8b5e1a';cx.fillRect(bx-3,by-T/2-1,6,5);
  /* Nœud */
  cx.fillStyle='#f0c040';
  cx.beginPath();cx.arc(bx,by-T/2+2,3,0,Math.PI*2);cx.fill();
  /* € */
  cx.fillStyle='#4a2a00';cx.font='bold 9px monospace';
  cx.textAlign='center';cx.textBaseline='middle';
  cx.fillText('$',bx,by+3);cx.textAlign='left';
}

function drawBonusQ(x,y){
  const bob=Math.sin(tick*.12)*4,glow=0.4+Math.sin(tick*.15)*0.4;
  cx.save();cx.globalAlpha=glow*0.5;
  cx.fillStyle='#89c843';cx.beginPath();cx.arc(x+T/2,y+T/2+bob,T*0.95,0,Math.PI*2);cx.fill();
  cx.restore();
  cx.fillStyle='#89c843';cx.beginPath();cx.arc(x+T/2,y+T/2+bob,T/2,0,Math.PI*2);cx.fill();
  cx.fillStyle='#082008';cx.font='bold 14px monospace';
  cx.textAlign='center';cx.textBaseline='middle';
  cx.fillText('★',x+T/2,y+T/2+bob+1);cx.textAlign='left';
}

function drawGoal(x,y){
  /* Poteau */
  cx.fillStyle='#bbb';cx.fillRect(x+T/2-1,y-24,3,T+24);
  /* Drapeau */
  cx.fillStyle='#89c843';
  cx.beginPath();cx.moveTo(x+T/2+2,y-24);cx.lineTo(x+T+4,y-16);cx.lineTo(x+T/2+2,y-8);cx.fill();
  /* Base */
  cx.fillStyle='#4a8a20';cx.fillRect(x+2,y,T-4,T);
  cx.fillStyle='#5aaa28';cx.fillRect(x+3,y+1,T-6,5);
}

function drawEnemy(x,y){
  /* Ennemi rouge losange animé */
  const pu=Math.sin(tick*.25)*2;
  cx.fillStyle='#c0392b';
  cx.beginPath();cx.moveTo(x+T/2,y+pu);cx.lineTo(x+T-1,y+T/2);
  cx.lineTo(x+T/2,y+T-1-pu);cx.lineTo(x+1,y+T/2);cx.closePath();cx.fill();
  cx.fillStyle='#e74c3c';
  cx.beginPath();cx.moveTo(x+T/2,y+2+pu);cx.lineTo(x+T-4,y+T/2);
  cx.lineTo(x+T/2,y+T-3-pu);cx.lineTo(x+4,y+T/2);cx.closePath();cx.fill();
}

function drawPlayer(x,y){
  if(spriteLoaded){
    cx.save();
    const dw=p.crouching?44:52, dh=p.crouching?30:58;
    const dyOff=p.crouching?(p.h-dh):0;
    const bob=(K[37]||K[39])&&p.onGround?Math.sin(tick*.35)*2:0;
    const jumping=!p.onGround&&p.vy<2;
    const angle=jumping?(p.dir===1?-0.15:0.15):0;
    cx.translate(x+p.w/2,y+p.h/2+dyOff+bob);
    if(p.dir===-1)cx.scale(-1,1);
    cx.rotate(angle);
    cx.drawImage(sprite,-dw/2,-dh/2,dw,dh);
    cx.restore();
  } else {
    /* Fallback géométrique */
    cx.fillStyle='#e5c417';cx.fillRect(x+2,y+p.h/2,p.w-4,p.h/2-1);
    cx.fillStyle='#f5d08a';cx.fillRect(x+3,y+2,p.w-6,p.h/2-3);
    cx.fillStyle='#1a1a2e';
    cx.fillRect(p.dir===1?x+p.w-7:x+3,y+5,4,4);
  }
}

function drawClouds(){
  cx.fillStyle='rgba(255,255,255,0.9)';
  const clouds=[{bx:60,y:28,rx:36,ry:14},{bx:220,y:16,rx:28,ry:11},
                {bx:420,y:32,rx:40,ry:15},{bx:640,y:18,rx:32,ry:12}];
  clouds.forEach(cl=>{
    const x=((cl.bx-camX*0.2)%(CW+200)+CW+200)%(CW+200)-100;
    cx.beginPath();cx.ellipse(x,cl.y,cl.rx,cl.ry,0,0,Math.PI*2);cx.fill();
    cx.beginPath();cx.ellipse(x-cl.rx*.5,cl.y+4,cl.rx*.6,cl.ry*.8,0,0,Math.PI*2);cx.fill();
    cx.beginPath();cx.ellipse(x+cl.rx*.5,cl.y+4,cl.rx*.55,cl.ry*.75,0,0,Math.PI*2);cx.fill();
  });
}

function drawHills(){
  /* Collines vertes en parallaxe */
  cx.fillStyle='#4a9a28';
  const hills=[{bx:0,w:180,h:60},{bx:200,w:220,h:80},{bx:480,w:180,h:50},{bx:700,w:200,h:70}];
  hills.forEach(h=>{
    const x=((h.bx-camX*0.4)%(CW+300)+CW+300)%(CW+300)-150;
    cx.beginPath();cx.ellipse(x+h.w/2,15*T,h.w/2,h.h,0,0,Math.PI*2);cx.fill();
  });
  /* Ligne herbe */
  cx.fillStyle='#5aba30';
  cx.fillRect(0,15*T-3,CW,4);
}

/* ── HUD ─────────────────────────────────────────────────────── */
function updateHUD(){
  document.getElementById('sc').textContent='Score : '+score;
  document.getElementById('li').textContent='❤'.repeat(lives);
  const rem=questions.filter(c=>c.on).length;
  const qEl=document.getElementById('qc');
  if(rem>0) qEl.textContent='● '+rem+' question'+(rem>1?'s':'')+' restante'+(rem>1?'s':'');
  else qEl.textContent='✔ Tout répondu !';
}

function showGoalMsg(){document.getElementById('goal-msg').classList.add('show');}
function hideGoalMsg(){document.getElementById('goal-msg').classList.remove('show');}

/* ── OVERLAYS ─────────────────────────────────────────────────── */
const OL=document.getElementById('ol');
const HDR='<div class="ph">PAZAPA</div><div class="ps">EN LIGNE</div>';
function showOL(t,btn){OL.className='';OL.style.display='flex';OL.innerHTML=HDR+'<p>'+t+'</p><button id="sb" onclick="startGame()">'+btn+'</button>';}
function hideOL(){OL.style.display='none';OL.className='';}

function askQ(qi,isBonus){
  paused=true;
  const q=isBonus?QBONUS:QS[qi];
  OL.style.display='flex';OL.className=isBonus?'bonus-mode':'';
  const intro=isBonus
    ?HDR+'<p style="color:#89c843;font-weight:700;margin:0 0 6px">★ QUESTION BONUS +'+QBONUS.pts+' pts !</p>'
    :HDR;
  let html=intro+'<p style="color:#e5c417;margin:0 0 10px">'+q.q+'</p><div class="ch">';
  q.ch.forEach((c,i)=>{html+='<button onclick="answer('+i+','+q.a+','+isBonus+')">'+c+'</button>';});
  OL.innerHTML=html+'</div>';
}

function answer(i,a,isBonus){
  const btns=OL.querySelectorAll('.ch button');
  btns.forEach((b,j)=>{b.onclick=null;if(j===a)b.classList.add('ok');else if(j===i)b.classList.add('ko');});
  if(i===a){
    const pts=isBonus?QBONUS.pts:10;score+=pts;updateHUD();
    if(isBonus){
      flashTimer=20;flashColor='rgba(137,200,67,0.5)';
      spawnP(p.wx,p.wy,'#89c843',20);beepBonus();
    } else {beep(880,60);setTimeout(()=>beep(1100,90),75);}
  } else {
    beep(200,250);
    if(p.currentQ)p.currentQ.on=true;  /* question réapparaît */
    updateHUD();
  }
  p.currentQ=null;
  setTimeout(()=>{hideOL();paused=false;},1600);
}

function loseLife(){
  if(dead||wonLevel)return;
  dead=true;lives--;updateHUD();beep(180,350);
  if(lives<=0){stopGame();showOL('Partie terminée — Score : '+score+' pts','Recommencer');}
  else setTimeout(()=>{resetPlayer();camX=0;dead=false;},600);
}

function winLevel(){
  if(wonLevel)return;wonLevel=true;
  winAnim=true;winTick=0;winCoins=[];chestOpen=false;chestShake=0;
  if(loopId){clearInterval(loopId);loopId=null;}
  loopId=setInterval(renderWin,16);
  /* Fanfare à t=0 */
  beep(660,120);
  setTimeout(()=>beep(880,120),200);
  setTimeout(()=>beep(1100,120),400);
  setTimeout(()=>beep(1320,400),600);
  /* Coffre s'ouvre à t=2s */
  setTimeout(()=>{
    chestOpen=true;
    beep(180,200,'sawtooth',0.1);
  },2000);
  /* 1ère vague de pièces à t=2.5s */
  setTimeout(()=>{
    beep(660,80);setTimeout(()=>beep(880,80),100);setTimeout(()=>beep(1100,200),200);
    for(let i=0;i<50;i++){
      const a=(Math.random()*Math.PI*1.6)-Math.PI*1.3;
      const sp=1.5+Math.random()*5;
      winCoins.push({
        x:CW/2, y:CH/2-20,
        vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-3,
        life:120+Math.random()*60, maxLife:180,
        color:['#f0c040','#ffd700','#e5c417','#fff8dc'][Math.floor(Math.random()*4)],
        r:3+Math.random()*4, rot:Math.random()*Math.PI*2, rotV:(Math.random()-.5)*.2
      });
    }
  },2500);
  /* 2e vague à t=3.5s */
  setTimeout(()=>{
    for(let i=0;i<30;i++){
      const a=Math.random()*Math.PI*2, sp=1+Math.random()*4;
      winCoins.push({
        x:CW/2+(Math.random()-0.5)*40, y:CH/2-10,
        vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-2,
        life:100+Math.random()*50, maxLife:150,
        color:['#f0c040','#ffd700'][Math.floor(Math.random()*2)],
        r:2+Math.random()*3, rot:0, rotV:(Math.random()-.5)*.25
      });
    }
  },3500);
  /* Overlay final à t=5s */
  setTimeout(()=>{
    winAnim=false;
    if(loopId){clearInterval(loopId);loopId=null;}
    /* Envoyer le score à la page parente */
    var pts=Math.min(Math.floor(score/10),4);
    try{window.parent.postMessage({type:'pazapaScore',score:pts},'*');}catch(e){}
    showOL(
      'Bravo ! Niveau terminé !<br><span style="font-size:20px;color:#e5c417">Score final : '+score+' pts ★</span>',
      'Rejouer →'
    );
  },5000);
}

function renderWin(){
  winTick++;
  /* Fond qui s'assombrit progressivement */
  cx.fillStyle='rgba(10,10,30,0.06)';
  cx.fillRect(0,0,CW,CH);

  /* Coffre centré */
  const cx0=CW/2, cy0=CH/2;
  drawChest(cx0,cy0);

  /* Pièces */
  winCoins=winCoins.filter(coin=>{
    coin.x+=coin.vx; coin.y+=coin.vy;
    coin.vy+=0.12; coin.vx*=0.995;
    coin.rot+=coin.rotV; coin.life--;
    if(coin.life<=0)return false;
    const alpha=Math.min(1, coin.life/coin.maxLife*2);
    cx.save();
    cx.globalAlpha=alpha;
    cx.translate(coin.x, coin.y);
    cx.rotate(coin.rot);
    cx.fillStyle=coin.color;
    cx.beginPath();
    cx.ellipse(0,0,coin.r,coin.r*0.55,0,0,Math.PI*2);
    cx.fill();
    cx.fillStyle='rgba(255,255,255,0.45)';
    cx.beginPath();
    cx.ellipse(-coin.r*0.2,-coin.r*0.15,coin.r*0.35,coin.r*0.22,-.3,0,Math.PI*2);
    cx.fill();
    cx.restore();
    return true;
  });

  /* Score */
  if(winTick>60){
    const a=Math.min(1,(winTick-60)/30);
    cx.save(); cx.globalAlpha=a;
    cx.fillStyle='rgba(0,0,20,0.75)';
    cx.fillRect(CW/2-170,28,340,52);
    cx.strokeStyle='#e5c417'; cx.lineWidth=2;
    cx.strokeRect(CW/2-170,28,340,52);
    cx.fillStyle='#e5c417';
    cx.font='bold 15px Orbitron,monospace';
    cx.textAlign='center'; cx.textBaseline='middle';
    cx.fillText('SCORE : '+score+' pts  ★',CW/2,54);
    cx.restore();
  }

  /* BRAVO */
  if(winTick>90){
    const a=Math.min(1,(winTick-90)/30);
    cx.save(); cx.globalAlpha=a;
    cx.fillStyle='#fff';
    cx.font='bold 32px Orbitron,monospace';
    cx.textAlign='center'; cx.textBaseline='middle';
    cx.fillText('BRAVO !',CW/2,CH-60);
    cx.restore();
  }
}

function drawChest(x,y){
  /* Ouverture progressive du couvercle */
  const openProgress=chestOpen ? Math.min(1,(winTick-125)/40) : 0;
  const lidAngle=openProgress * (-Math.PI/2);

  const W=140, HB=80;  /* largeur, hauteur corps */
  const HL=50;          /* hauteur couvercle */
  const X=x-W/2, YB=y-HB/2;

  /* Ombre au sol */
  cx.fillStyle='rgba(0,0,0,0.25)';
  cx.beginPath();
  cx.ellipse(x, YB+HB+8, W/2*0.9, 10, 0, 0, Math.PI*2);
  cx.fill();

  /* === CORPS DU COFFRE === */
  /* Face principale */
  cx.fillStyle='#5a2d0c'; cx.fillRect(X, YB, W, HB);
  /* Planches bois */
  cx.fillStyle='#7a3d18';
  for(let i=0;i<4;i++) cx.fillRect(X+4, YB+4+i*18, W-8, 12);
  /* Cerclage métal horizontal */
  cx.fillStyle='#8a8a8a';
  cx.fillRect(X, YB+HB*0.35-3, W, 6);
  cx.fillRect(X, YB+HB-5, W, 5);
  cx.fillRect(X, YB, W, 5);
  /* Cerclage vertical */
  cx.fillRect(X, YB, 6, HB);
  cx.fillRect(X+W-6, YB, 6, HB);
  cx.fillRect(X+W/2-3, YB, 6, HB);
  /* Rivets */
  cx.fillStyle='#bbb';
  [[X+10,YB+10],[X+W-10,YB+10],[X+10,YB+HB-10],[X+W-10,YB+HB-10]].forEach(([rx,ry])=>{
    cx.beginPath(); cx.arc(rx,ry,4,0,Math.PI*2); cx.fill();
  });
  /* Intérieur visible quand ouvert */
  if(openProgress>0.3){
    const a=Math.min(1,(openProgress-0.3)/0.4);
    cx.save(); cx.globalAlpha=a;
    cx.fillStyle='#8b1a1a';
    cx.fillRect(X+6, YB+5, W-12, HB*0.35-8);
    /* Pièces à l'intérieur */
    cx.fillStyle='#f0c040';
    for(let i=0;i<6;i++){
      cx.beginPath();
      cx.ellipse(X+20+i*18, YB+HB*0.2, 8, 5, 0, 0, Math.PI*2);
      cx.fill();
    }
    cx.restore();
  }

  /* === COUVERCLE (pivote depuis le bord haut du corps) === */
  cx.save();
  cx.translate(x, YB);          /* pivot = haut du corps */
  cx.rotate(lidAngle);
  /* Corps couvercle */
  cx.fillStyle='#6a3510';
  cx.fillRect(-W/2, -HL, W, HL);
  /* Planches couvercle */
  cx.fillStyle='#8a4520';
  for(let i=0;i<2;i++) cx.fillRect(-W/2+4, -HL+4+i*20, W-8, 14);
  /* Cerclage couvercle */
  cx.fillStyle='#8a8a8a';
  cx.fillRect(-W/2, -HL, W, 5);
  cx.fillRect(-W/2, -5, W, 5);
  cx.fillRect(-W/2, -HL, 6, HL);
  cx.fillRect(W/2-6, -HL, 6, HL);
  cx.fillRect(W/2/2-3, -HL, 6, HL);
  /* Rivets couvercle */
  cx.fillStyle='#bbb';
  [[-W/2+10,-HL+10],[W/2-10,-HL+10],[-W/2+10,-10],[W/2-10,-10]].forEach(([rx,ry])=>{
    cx.beginPath(); cx.arc(rx,ry,4,0,Math.PI*2); cx.fill();
  });
  /* Ornement central doré */
  cx.fillStyle='#c8922a'; cx.beginPath(); cx.arc(0,-HL/2,16,0,Math.PI*2); cx.fill();
  cx.fillStyle='#e5c417'; cx.beginPath(); cx.arc(0,-HL/2,11,0,Math.PI*2); cx.fill();
  cx.fillStyle='#fff8dc'; cx.beginPath(); cx.arc(0,-HL/2,5,0,Math.PI*2); cx.fill();
  cx.restore();

  /* === SERRURE (sur le joint corps/couvercle) === */
  cx.fillStyle='#c8922a';
  cx.fillRect(x-12, YB-8, 24, 16);
  cx.fillStyle='#e5c417';
  cx.beginPath(); cx.arc(x, YB, 8, Math.PI, 0); cx.fill();
  cx.fillStyle='#b09010';
  cx.fillRect(x-5, YB, 10, 10);
  cx.fillStyle='#e5c417';
  cx.beginPath(); cx.arc(x, YB+5, 3, 0, Math.PI*2); cx.fill();
}

function gameLoop(){
  if(paused)return;
  updatePlayer();updateStarTiles();updateEnemies();updateP();render();
}
function stopGame(){if(loopId){clearInterval(loopId);loopId=null;}}

function startGame(){
  score=0;lives=3;paused=false;wonLevel=false;dead=false;
  camX=0;tick=0;particles=[];flashTimer=0;goalBlockedTimer=0;
  buildLevel();buildEnemies();resetPlayer();updateHUD();hideOL();hideGoalMsg();
  stopGame();loopId=setInterval(gameLoop,16);
}

document.addEventListener('keydown',e=>{K[e.which]=true;if([32,37,38,39,40].includes(e.which))e.preventDefault();});
document.addEventListener('keyup',e=>{K[e.which]=false;});

buildLevel();buildEnemies();resetPlayer();render();
</script>
