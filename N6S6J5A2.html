<title>Je m'entraîne — Le puzzle des explorateurs du temps — 6e S6 J5</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --jour:#f5c518;--jour-fonce:#8a6000;--jour-clair:#fffbeb;--jour-pale:#f5e08a;
  --day-glow:rgba(245,197,24,.28);
  --bg:#fffdf7;--txt:#1a1200;--gris:#6a5500;--bord:#e8d080;
  --vert:#22c55e;--vert-bg:#e7faec;--vert-bord:#86efac;
  --rouge:#ef4444;--rouge-bg:#fdeaea;--rouge-bord:#fca5a5;
  --bleu:#3ab5d8;--bleu-bg:#e8f6fb;--bleu-bord:#9dd4e8;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes flashPop{0%{opacity:1;transform:translate(-50%,-50%) scale(.3)}40%{opacity:1;transform:translate(-50%,-50%) scale(1.35)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
@keyframes particleUp{0%{opacity:0;transform:translateY(0) scale(0)}30%{opacity:1}100%{opacity:0;transform:translateY(-70px) scale(1)}}
@keyframes glowOk{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}100%{box-shadow:0 0 0 10px rgba(34,197,94,0)}}
@keyframes glowErr{0%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}100%{box-shadow:0 0 0 10px rgba(239,68,68,0)}}
@keyframes popIn{0%{transform:scale(0)}80%{transform:scale(1.1)}100%{transform:scale(1)}}
.bubble{position:fixed;border-radius:50%;z-index:0;pointer-events:none;filter:blur(2px);opacity:.22;}
.bubble.b1{width:120px;height:120px;background:var(--jour-pale);top:-30px;right:-30px;}
.bubble.b2{width:80px;height:80px;background:var(--jour);bottom:20px;left:-20px;}
.bubble.b3{width:60px;height:60px;background:#3ab5d8;top:38%;right:-18px;}
.bubble.b4{width:70px;height:70px;background:#8dc63f;top:20%;left:-24px;}
#flashIcon{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:4.5rem;z-index:9999;pointer-events:none;opacity:0;}
#flashIcon.show{animation:flashPop .9s ease forwards;}
.wrap{max-width:960px;margin:0 auto;padding:16px 14px 80px;position:relative;z-index:2;}
/* HEADER */
.header{text-align:center;padding:18px 0 14px;animation:fadeUp .5s ease;}
.logo-badge{display:inline-flex;align-items:center;gap:8px;background:var(--jour);color:#3a1800;font-family:Orbitron,sans-serif;font-weight:700;font-size:14px;letter-spacing:1.2px;padding:7px 16px;border-radius:22px;box-shadow:0 4px 14px var(--day-glow);margin-bottom:12px;}
.logo-badge .pts{display:inline-flex;gap:4px;}
.logo-badge .pts i{width:8px;height:8px;border-radius:50%;display:block;}
.logo-badge .pts i:nth-child(1){background:#8a6000;}
.logo-badge .pts i:nth-child(2){background:#fff;}
.logo-badge .pts i:nth-child(3){background:var(--jour-pale);}
.semaine{font-family:Orbitron,sans-serif;font-size:.88rem;letter-spacing:2px;color:var(--gris);text-transform:uppercase;margin-bottom:6px;}
.titre{font-family:Orbitron,sans-serif;font-weight:900;font-size:clamp(1.3rem,4.5vw,2rem);color:var(--txt);line-height:1.15;margin-bottom:8px;}
.titre .accent{color:var(--jour-fonce);}
.header-badge{display:inline-block;background:var(--jour);color:#3a1800;font-family:Orbitron,sans-serif;font-weight:700;font-size:.78rem;letter-spacing:1px;text-transform:uppercase;padding:6px 18px;border-radius:22px;}
/* DÉFIS NAV */
.defis-nav{display:flex;gap:8px;margin-bottom:14px;}
.defi-tab{flex:1;padding:10px 8px;border-radius:11px;border:2px solid var(--bord);background:var(--jour-clair);text-align:center;}
.defi-tab.active{border-color:var(--jour-fonce);background:var(--jour-pale);}
.defi-tab.done{border-color:var(--vert-bord);background:var(--vert-bg);}
.defi-tab.locked{opacity:.45;}
.defi-tab .tab-num{font-family:Orbitron,sans-serif;font-size:.72rem;font-weight:900;letter-spacing:1px;color:var(--gris);display:block;text-transform:uppercase;}
.defi-tab.active .tab-num{color:var(--jour-fonce);}
.defi-tab.done .tab-num{color:#157f3a;}
.defi-tab .tab-label{font-family:Orbitron,sans-serif;font-size:.7rem;font-weight:700;color:var(--txt);display:block;margin-top:2px;}
.defi-tab .tab-score{font-family:JetBrains Mono,monospace;font-size:.75rem;color:var(--gris);margin-top:3px;display:block;}
/* SCORE BAR */
.score-bar-wrap{background:#fff;border:1px solid var(--bord);border-radius:12px;padding:12px 15px;margin-bottom:14px;}
.score-bar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;}
.score-bar-label{font-family:Orbitron,sans-serif;font-size:.75rem;font-weight:700;letter-spacing:1px;color:var(--jour-fonce);text-transform:uppercase;}
.score-bar-val{font-family:JetBrains Mono,monospace;font-size:.9rem;font-weight:600;color:var(--jour-fonce);}
.score-bar-bg{background:var(--jour-clair);border-radius:99px;height:8px;overflow:hidden;}
.score-bar-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--jour-fonce),var(--jour));border-radius:99px;transition:width .5s ease;}
.dots-row{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px;}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--bord);background:var(--jour-clair);font-family:JetBrains Mono,monospace;font-size:.65rem;color:var(--gris);display:flex;align-items:center;justify-content:center;transition:all .3s;flex-shrink:0;}
.dot.ok{background:var(--vert-bg);border-color:var(--vert-bord);color:#157f3a;}
.dot.ko{background:var(--rouge-bg);border-color:var(--rouge-bord);color:#b91c1c;}
/* CARTE */
.defi-card{background:#fff;border:1.5px solid var(--bord);border-radius:14px;overflow:hidden;box-shadow:0 3px 16px rgba(245,197,24,.1);animation:fadeUp .4s ease;margin-bottom:14px;}
.defi-header{background:linear-gradient(135deg,var(--jour-fonce),var(--jour));padding:13px 18px;}
.defi-header-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.defi-nom{font-family:Orbitron,sans-serif;font-weight:900;font-size:.82rem;letter-spacing:1.5px;color:#fff;text-transform:uppercase;}
.defi-pts{font-family:JetBrains Mono,monospace;font-size:.75rem;color:rgba(255,255,255,.85);}
.defi-sous-titre{font-size:.92rem;color:rgba(255,255,255,.9);margin-top:4px;font-style:italic;}
.defi-body{padding:16px 18px 20px;}
.consigne-box{background:var(--jour-clair);border-left:4px solid var(--jour-fonce);border-radius:0 9px 9px 0;padding:10px 14px;font-size:.95rem;color:var(--jour-fonce);font-style:italic;margin-bottom:16px;line-height:1.6;}
.exemple-box{background:#f0faeb;border:1px solid #b5e08a;border-radius:9px;padding:10px 14px;font-size:.9rem;color:#2a5010;line-height:1.7;margin-bottom:14px;}
.exemple-box strong{color:#3d7a10;}
/* DEFI 1 — PUZZLE PHRASES */
.phrase-item{border:1.5px solid var(--bord);border-radius:11px;padding:14px 16px;background:#fffdf5;margin-bottom:12px;}
.phrase-numero{font-family:Orbitron,sans-serif;font-size:.7rem;font-weight:700;color:var(--gris);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;}
.phrase-selects{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px;}
.phrase-selects select{border:2px solid var(--bord);border-radius:8px;padding:8px 12px;font-size:.95rem;font-family:Arial,sans-serif;color:var(--txt);background:#fff;outline:none;cursor:pointer;transition:border-color .15s;min-height:44px;}
.phrase-selects select:focus{border-color:var(--jour-fonce);}
.phrase-selects select.ok{border-color:var(--vert);background:var(--vert-bg);color:#157f3a;}
.phrase-selects select.ko{border-color:var(--rouge);background:var(--rouge-bg);color:#b91c1c;}
.phrase-selects select[disabled]{cursor:default;}
.phrase-sep{font-size:1.1rem;color:var(--gris);}
.phrase-result{font-size:.95rem;color:var(--jour-fonce);font-style:italic;min-height:22px;margin-top:6px;}
.phrase-fb{font-size:.9rem;padding:7px 10px;border-radius:8px;margin-top:6px;display:none;line-height:1.6;}
.phrase-fb.show{display:block;}
.phrase-fb.ok{background:var(--vert-bg);border:1px solid var(--vert-bord);color:#157f3a;}
.phrase-fb.ko{background:var(--rouge-bg);border:1px solid var(--rouge-bord);color:#7a1f1f;}
.attention-box{background:#fff8e0;border:1.5px solid var(--jour);border-radius:9px;padding:10px 14px;font-size:.9rem;color:var(--gris);margin-bottom:14px;line-height:1.6;}
/* DEFI 2 — COFFRES */
.coffres-wrap{display:flex;flex-direction:column;gap:12px;}
.coffre{border:2px dashed var(--bord);border-radius:12px;padding:12px 14px;background:#fafdf0;min-height:80px;transition:border-color .2s,background .2s;}
.coffre.dragover{border-color:var(--jour-fonce);background:var(--jour-clair);}
.coffre-titre{font-family:Orbitron,sans-serif;font-size:.75rem;font-weight:700;color:var(--jour-fonce);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.coffre-contenu{display:flex;flex-wrap:wrap;gap:6px;min-height:36px;}
.phrase-chip{background:var(--jour-pale);border:1.5px solid var(--jour);border-radius:8px;padding:6px 12px;font-size:.9rem;cursor:grab;user-select:none;animation:popIn .25s ease;transition:all .2s;}
.phrase-chip:hover{transform:translateY(-2px);box-shadow:0 4px 10px var(--day-glow);}
.phrase-chip.placed.ok{background:var(--vert-bg);border-color:var(--vert-bord);color:#157f3a;cursor:default;}
.phrase-chip.placed.ko{background:var(--rouge-bg);border-color:var(--rouge-bord);color:#b91c1c;cursor:default;}
.phrases-dispo{display:flex;flex-wrap:wrap;gap:8px;padding:12px;background:#f5f5ea;border-radius:10px;min-height:50px;margin-bottom:12px;border:2px dashed #ccc;}
/* DEFI 3 — TRANSFORMATIONS */
.transfo-phrase-source{background:var(--jour-clair);border-left:4px solid var(--jour-fonce);border-radius:0 9px 9px 0;padding:12px 16px;font-size:1rem;font-style:italic;color:var(--jour-fonce);margin-bottom:14px;line-height:1.6;}
.transfo-list{display:flex;flex-direction:column;gap:12px;}
.transfo-item{border:1.5px solid var(--bord);border-radius:11px;padding:12px 16px;background:#fafdf5;}
.transfo-consigne{font-size:.9rem;color:var(--gris);margin-bottom:7px;font-style:italic;}
.transfo-input{width:100%;border:2px solid var(--bord);border-radius:8px;padding:9px 13px;font-size:.95rem;font-family:Arial;color:var(--txt);outline:none;transition:border-color .15s;}
.transfo-input:focus{border-color:var(--jour-fonce);}
.transfo-input.ok{border-color:var(--vert);background:var(--vert-bg);color:#157f3a;}
.transfo-input.ko{border-color:var(--rouge);background:var(--rouge-bg);color:#b91c1c;}
.transfo-input[disabled]{cursor:default;}
.transfo-fb{font-size:.9rem;padding:6px 10px;border-radius:7px;margin-top:5px;display:none;line-height:1.6;}
.transfo-fb.show{display:block;}
.transfo-fb.ok{background:var(--vert-bg);border:1px solid var(--vert-bord);color:#157f3a;}
.transfo-fb.ko{background:var(--rouge-bg);border:1px solid var(--rouge-bord);color:#7a1f1f;}
/* JUSTIFICATIF */
.justif-card{border:1.5px solid var(--bleu-bord);border-radius:12px;overflow:hidden;margin-top:14px;}
.justif-header{background:var(--bleu-bg);padding:10px 14px;font-family:Orbitron,sans-serif;font-size:.72rem;font-weight:700;color:#1a6e88;text-transform:uppercase;letter-spacing:1px;}
.justif-table{width:100%;border-collapse:collapse;font-size:.92rem;}
.justif-table th{background:#d6ecf7;padding:9px 12px;text-align:left;font-family:Orbitron,sans-serif;font-size:.7rem;letter-spacing:1px;color:#1a6e88;}
.justif-table td{padding:9px 12px;border-bottom:1px solid var(--bleu-bord);background:#fff;line-height:1.6;}
.justif-table tr:nth-child(even) td{background:var(--bleu-bg);}
/* COMMUN */
.sep{border:none;border-top:2px dashed var(--bord);margin:14px 0;}
.sous-score{background:var(--jour-clair);border:1px solid var(--bord);border-radius:10px;padding:12px 16px;text-align:center;margin-top:14px;display:none;}
.sous-score-val{font-family:JetBrains Mono,monospace;font-weight:700;font-size:1.4rem;color:var(--jour-fonce);}
.sous-score-label{font-family:Orbitron,sans-serif;font-size:.72rem;color:var(--gris);text-transform:uppercase;letter-spacing:1px;margin-top:2px;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.btn{border:none;border-radius:10px;font-family:Orbitron,sans-serif;font-weight:800;font-size:clamp(.88rem,2.5vw,.97rem);letter-spacing:1px;text-transform:uppercase;padding:0 18px;min-height:2.8rem;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px;}
.btn-valider{background:linear-gradient(135deg,var(--jour-fonce),var(--jour));color:#fff;box-shadow:0 4px 12px var(--day-glow);}
.btn-valider:hover:not([disabled]){transform:translateY(-2px);}
.btn-valider[disabled]{opacity:.4;cursor:default;}
.btn-suite{background:var(--vert);color:#fff;}
.btn-suite:hover{transform:translateY(-2px);}
.btn-rec{background:var(--jour-clair);color:var(--jour-fonce);border:2px solid var(--bord);}
/* BILAN */
.bilan{display:none;background:#fff;border:2px solid var(--jour-fonce);border-radius:16px;padding:28px 24px;text-align:center;box-shadow:0 8px 28px var(--day-glow);position:relative;overflow:hidden;margin-top:14px;}
.bilan.show{display:block;animation:fadeUp .5s ease;}
.bilan-particles{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}
.bilan-global{font-family:Orbitron,sans-serif;font-weight:900;font-size:clamp(2.8rem,10vw,4.5rem);color:var(--jour-fonce);line-height:1;margin-bottom:4px;}
.bilan-global small{font-size:.32em;color:var(--gris);}
.bilan-etoiles{font-size:1.9rem;margin:8px 0;}
.bilan-tampon{font-family:Orbitron,sans-serif;font-weight:900;font-size:clamp(.82rem,2.5vw,.95rem);letter-spacing:2px;padding:7px 20px;border-radius:8px;display:inline-block;margin-bottom:12px;text-transform:uppercase;}
.bilan-tampon.ok{color:#157f3a;border:2.5px solid #157f3a;}
.bilan-tampon.moyen{color:var(--jour-fonce);border:2.5px solid var(--jour-fonce);}
.bilan-tampon.ko{color:#7a1f1f;border:2.5px solid #7a1f1f;}
.bilan-msg{font-size:clamp(.88rem,2.5vw,1rem);color:var(--txt);line-height:1.8;margin-bottom:20px;max-width:520px;margin-left:auto;margin-right:auto;}
.bilan-detail{display:flex;flex-direction:column;gap:6px;max-width:460px;margin:0 auto 22px;text-align:left;}
.bilan-ligne{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:9px;}
.bilan-ligne.ok{background:var(--vert-bg);color:#157f3a;}
.bilan-ligne.moyen{background:#fffbeb;color:#8a6000;}
.bilan-ligne.ko{background:var(--rouge-bg);color:#7a1f1f;}
.bilan-ligne-label{font-size:.85rem;}
.bilan-ligne-score{font-family:JetBrains Mono,monospace;font-weight:700;}
.btn-recommencer{font-family:Orbitron,sans-serif;font-weight:900;font-size:.78rem;letter-spacing:1.5px;text-transform:uppercase;background:linear-gradient(135deg,var(--jour-fonce),var(--jour));color:#fff;border:none;border-radius:12px;padding:0 28px;min-height:2.8rem;cursor:pointer;box-shadow:0 4px 14px var(--day-glow);transition:all .2s;}
.btn-recommencer:hover{transform:translateY(-2px);}

/* ÉTIQUETTES DÉFI 1 */
.etiq-section{display:flex;flex-direction:column;gap:14px;margin-bottom:16px;}
.etiq-groupe{border-radius:11px;padding:12px 14px;background:#fafdf5;}
.etiq-titre{font-family:Orbitron,sans-serif;font-size:.75rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;}
.etiq-bleu{color:#1a6e88;}.etiq-jaune{color:var(--jour-fonce);}.etiq-vert{color:#3d7a10;}
.etiq-liste{display:flex;flex-wrap:wrap;gap:8px;}
.etiq{display:inline-flex;align-items:center;padding:9px 16px;border-radius:9px;font-size:.95rem;font-weight:700;cursor:pointer;user-select:none;transition:all .2s;border:2.5px solid transparent;min-height:44px;}
.etiq-b{background:#e8f6fb;color:#1a6e88;border-color:#9dd4e8;}
.etiq-j{background:var(--jour-clair);color:var(--jour-fonce);border-color:var(--jour-pale);}
.etiq-v{background:#f0faeb;color:#3d7a10;border-color:#b5e08a;}
.etiq:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.12);}
.etiq.selected{border-color:currentColor;box-shadow:0 0 0 3px rgba(0,0,0,.15);transform:scale(1.05);}
.etiq.used{opacity:.35;cursor:not-allowed;transform:none !important;box-shadow:none !important;text-decoration:line-through;}
/* ASSEMBLAGE */
.assemblage-wrap{background:#fff;border:1.5px solid var(--bord);border-radius:12px;padding:14px 16px;margin-bottom:12px;}
.assemblage-titre{font-family:Orbitron,sans-serif;font-size:.75rem;font-weight:700;color:var(--gris);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;}
.assemblage-slots{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.slot{min-width:120px;min-height:44px;border:2.5px dashed var(--bord);border-radius:9px;padding:8px 12px;display:flex;align-items:center;font-size:.95rem;font-weight:700;transition:all .2s;}
.slot-j{border-color:var(--jour-pale);background:var(--jour-clair);}
.slot-b{border-color:#9dd4e8;background:#e8f6fb;}
.slot-v{border-color:#b5e08a;background:#f0faeb;}
.slot-placeholder{color:var(--bord);font-weight:400;font-style:italic;font-size:.85rem;}
.slot-val{color:var(--txt);}
.slot-plus{font-size:1.2rem;color:var(--gris);flex-shrink:0;}

<script>/* ═══ DONNÉES ═══ */
var D1_ETIQ_HOM = ["on", "on n'", "ont"];
var D1_ETIQ_IND = ["aujourd'hui", "hier", "demain"];
var D1_ETIQ_GRP = ["observe les étoiles", "oublié leurs cartes", "partira vers le nord"];

var D1_COMBOS = [
  {
    indice:"aujourd'hui", hom:"on", grp:"observe les étoiles",
    temps:"Présent",
    phrases:["aujourd'hui, on observe les étoiles","aujourd hui, on observe les etoiles","aujourd hui on observe les etoiles"],
    phraseRef:"Aujourd'hui, on observe les étoiles.",
    fb:"Homonyme : <strong>on</strong> (pronom indéfini → il observe ✓). Temps : présent."
  },
  {
    indice:"hier", hom:"ont", grp:"oublié leurs cartes",
    temps:"Passé composé",
    phrases:["hier, ils ont oublié leurs cartes","hier ils ont oublie leurs cartes","hier, ils ont oublie leurs cartes"],
    phraseRef:"Hier, ils ont oublié leurs cartes.",
    fb:"Homonyme : <strong>ont</strong> (verbe avoir → ils avaient oublié ✓). Temps : passé composé."
  },
  {
    indice:"demain", hom:"on n'", grp:"partira vers le nord",
    temps:"Futur simple",
    phrases:["demain, on ne partira pas vers le nord","demain on ne partira pas vers le nord"],
    phraseRef:"Demain, on ne partira pas vers le nord.",
    fb:"Homonyme : <strong>on n'</strong> (négation). Temps : futur simple."
  }
];

var d1SelInd=null, d1SelHom=null, d1SelGrp=null;
var d1Validees=new Set();
var d1Validee=false;

var COFFRES = [
  {id:"Présent", label:"📦 Présent", phrases:[0,6]},
  {id:"Imparfait", label:"📦 Imparfait", phrases:[1]},
  {id:"Passé composé", label:"📦 Passé composé", phrases:[2,4]},
  {id:"Futur simple", label:"📦 Futur simple", phrases:[3]},
  {id:"Futur antérieur", label:"📦 Futur antérieur", phrases:[5]}
];



var TRANSFO = [
  {
    consigne:"➡ Imparfait",
    attendu:["autrefois, on observait les étoiles","autrefois on observait les étoiles"],
    fb:"Imparfait de observer : Autrefois, on observait les étoiles."
  },
  {
    consigne:"➡ Passé composé",
    attendu:["hier, on a observé les étoiles","hier on a observe les etoiles","hier, on a observe les étoiles"],
    fb:"Passé composé de observer : Hier, on a observé les étoiles."
  },
  {
    consigne:"➡ Futur simple",
    attendu:["demain, on observera les étoiles","demain on observera les étoiles","demain, on observera les etoiles"],
    fb:"Futur simple de observer : Demain, on observera les étoiles."
  },
  {
    consigne:"➡ Futur antérieur",
    attendu:["avant minuit, on aura observé les étoiles","avant midi, on aura observé les étoiles","avant minuit on aura observe les etoiles","avant midi on aura observe les etoiles"],
    fb:"Futur antérieur de observer : Avant minuit, on aura observé les étoiles."
  }
];

/* ═══ ÉTAT ═══ */
var scores=[0,0,0];
var d2Validee=false;
var d2Placements={};
var dragPhrase=null;
var actx=null;

/* ═══ FONCTIONS ═══ */
function initA(){if(actx)return;try{actx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}

function beep(f1,f2,d,tp,vol){if(!actx)return;const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;o.type=tp||'sine';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol||.1,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+.02);}

function beepOk(){initA();beep(660,880,.07,'sine',.08);setTimeout(()=>beep(880,1100,.12,'sine',.1),75);}

function beepErr(){initA();beep(220,90,.22,'sawtooth',.09);}

function beepFinal(ok){initA();if(ok){[523,659,784,1047,1318].forEach((f,i)=>setTimeout(()=>beep(f,f,.22,'triangle',.14),i*140));}else{beep(200,80,.4,'sawtooth',.11);}}

function showFlash(ok){const f=document.getElementById('flashIcon');if(!f)return;f.textContent=ok?'✓':'✗';f.style.color=ok?'#22c55e':'#ef4444';f.style.animation='none';void f.offsetWidth;f.className='show';}

function buildDots(n){const r=document.getElementById('dotsRow');r.innerHTML='';for(let i=0;i<n;i++){const d=document.createElement('div');d.className='dot';d.id='dot_'+i;d.textContent=i+1;r.appendChild(d);}}

function markDot(i,ok){const d=document.getElementById('dot_'+i);if(d){d.className='dot '+(ok?'ok':'ko');d.textContent=ok?'✓':'✗';}}

function updateBar(s,t,l){document.getElementById('scoreVal').textContent=s+' / '+t;document.getElementById('scoreFill').style.width=Math.round(s/t*100)+'%';document.getElementById('scoreLabel').textContent=l;}

function updateTabs(a){for(let i=0;i<3;i++){const t=document.getElementById('tab'+i);t.className='defi-tab '+(i<a?'done':i===a?'active':'locked');}}

function norm(s){s=s.replace(/[ ​‌‍﻿]/g,' ').toLowerCase().trim().replace(/[.,!?;:’‘']/g,'').replace(/[ ]+/g,' ').replace(/[àâä]/g,'a').replace(/[éèêë]/g,'e').replace(/[îï]/g,'i').replace(/[ôö]/g,'o').replace(/[ùûü]/g,'u').replace(/ç/g,'c').trim();return s;}

function renderDefi1(){
  d1Validee=false; scores[0]=0;
  d1SelInd=null; d1SelHom=null; d1SelGrp=null;
  d1Validees=new Set();
  updateTabs(0); buildDots(3); updateBar(0,3,'Défi 1 — Construis les phrases');
  document.getElementById('bilan').className='bilan';
  const zone=document.getElementById('zoneMain'); zone.innerHTML='';
  const card=document.createElement('div'); card.className='defi-card';

  let h='<div class="defi-header"><div class="defi-header-top">'
    +'<span class="defi-nom">🧩 Défi 1 — Construis les phrases</span>'
    +'<span class="defi-pts">3 pts</span></div>'
    +'<div class="defi-sous-titre">Assemble les trois combinaisons possibles.</div></div>'
    +'<div class="defi-body">';

  h+='<div class="consigne-box">Clique une étiquette de chaque catégorie pour assembler une phrase, écris-la, puis valide. Trouve les 3 combinaisons\u00a0!</div>';
  

  /* ÉTIQUETTES */
  h+='<div class="etiq-section">';
  h+='<div class="etiq-groupe"><div class="etiq-titre etiq-bleu">🟦 Homonymes</div><div class="etiq-liste" id="etiqHom">';
  D1_ETIQ_HOM.forEach(e=>{const id='eh_'+e.replace(/[^a-z]/gi,'_');h+=`<div class="etiq etiq-b" data-type="hom" data-val="${e}" id="${id}">${e}</div>`;});
  h+='</div></div>';
  h+='<div class="etiq-groupe"><div class="etiq-titre etiq-jaune">🟨 Indices temporels</div><div class="etiq-liste" id="etiqInd">';
  D1_ETIQ_IND.forEach(e=>{const id='ei_'+e.replace(/[^a-z]/gi,'_');h+=`<div class="etiq etiq-j" data-type="ind" data-val="${e}" id="${id}">${e}</div>`;});
  h+='</div></div>';
  h+='<div class="etiq-groupe"><div class="etiq-titre etiq-vert">🟩 Groupes verbaux</div><div class="etiq-liste" id="etiqGrp">';
  D1_ETIQ_GRP.forEach(e=>{const id='eg_'+e.replace(/[^a-z]/gi,'_');h+=`<div class="etiq etiq-v" data-type="grp" data-val="${e}" id="${id}">${e}</div>`;});
  h+='</div></div>';
  h+='</div>';

  /* ZONE ASSEMBLAGE */
  h+='<div class="assemblage-wrap">'
    +'<div class="assemblage-titre">Ma phrase assemblée</div>'
    +'<div class="assemblage-slots">'
    +'<div class="slot slot-j" id="slotInd"><span class="slot-placeholder">🟨 Indice</span></div>'
    +'<span class="slot-plus">+</span>'
    +'<div class="slot slot-b" id="slotHom"><span class="slot-placeholder">🟦 Homonyme</span></div>'
    +'<span class="slot-plus">+</span>'
    +'<div class="slot slot-v" id="slotGrp"><span class="slot-placeholder">🟩 Groupe verbal</span></div>'
    +'</div>'
    +'<div class="phrase-ecrite-wrap">'
    +'<label for="phraseEcrite" style="font-size:.9rem;color:var(--gris);font-style:italic;">Écris la phrase complète\u00a0:</label>'
    +'<input type="text" id="phraseEcrite" class="phrase-ecrite-input" placeholder="Écris la phrase entière ici\u2026" autocomplete="off" autocorrect="off" spellcheck="false">'
    +'</div>'
    +'<div class="assemblage-fb" id="assemblageFb"></div>'
    +'<div class="btn-row">'
    +'<button class="btn btn-valider" onclick="d1Valider()">✓\u00a0Valider cette phrase</button>'
    +'<button class="btn btn-rec" onclick="d1Reset()">↺\u00a0Effacer</button>'
    +'</div></div>';

  /* LISTE VALIDÉES */
  h+='<div class="sep"></div>'
    +'<div class="validees-titre">Phrases trouvées\u00a0: <span id="d1Count">0</span> / 3</div>'
    +'<div class="validees-liste" id="d1Liste"></div>'
    +'<div class="sous-score" id="sousScore1" style="display:none;">'
    +'<div class="sous-score-val" id="sousScoreVal1">0 / 3</div>'
    +'<div class="sous-score-label">Score Défi 1</div></div>'
    +'<div class="btn-row" id="suiteRow1" style="display:none;">'
    +'<button class="btn btn-suite" onclick="renderDefi2()">Défi 2\u00a0\u203a</button>'
    +'</div>'
    +'</div>';

  card.innerHTML=h; zone.appendChild(card);

  card.querySelectorAll('.etiq').forEach(el=>{
    el.addEventListener('click',()=>{
      if(el.dataset.disabled==='1') return;
      const type=el.dataset.type, val=el.dataset.val;
      if(type==='hom'){
        if(el.dataset.disabled==='1') return;
        card.querySelectorAll('.etiq[data-type="hom"]:not(.used)').forEach(e=>e.classList.remove('selected'));
        el.classList.add('selected'); d1SelHom=val;
        document.getElementById('slotHom').innerHTML=`<span class="slot-val">${val}</span>`;
      } else if(type==='ind'){
        card.querySelectorAll('.etiq[data-type="ind"]:not(.used)').forEach(e=>e.classList.remove('selected'));
        el.classList.add('selected'); d1SelInd=val;
        document.getElementById('slotInd').innerHTML=`<span class="slot-val">${val}</span>`;
      } else if(type==='grp'){
        card.querySelectorAll('.etiq[data-type="grp"]:not(.used)').forEach(e=>e.classList.remove('selected'));
        el.classList.add('selected'); d1SelGrp=val;
        document.getElementById('slotGrp').innerHTML=`<span class="slot-val">${val}</span>`;
      }
    });
  });

  document.getElementById('phraseEcrite').addEventListener('keydown',e=>{
    if(e.key==='Enter') d1Valider();
  });
}

function d1Reset(){
  d1SelInd=null; d1SelHom=null; d1SelGrp=null;
  document.querySelectorAll('.etiq:not(.used)').forEach(e=>e.classList.remove('selected'));
  document.getElementById('slotInd').innerHTML='<span class="slot-placeholder">🟨 Indice</span>';
  document.getElementById('slotHom').innerHTML='<span class="slot-placeholder">🟦 Homonyme</span>';
  document.getElementById('slotGrp').innerHTML='<span class="slot-placeholder">🟩 Groupe verbal</span>';
  const inp=document.getElementById('phraseEcrite'); if(inp) inp.value='';
  const fb=document.getElementById('assemblageFb'); if(fb){fb.className='assemblage-fb';fb.innerHTML='';}
}

function d1Valider(){
  const fb=document.getElementById('assemblageFb');
  const inp=document.getElementById('phraseEcrite');
  if(!d1SelInd||!d1SelHom||!d1SelGrp){
    fb.innerHTML='✏️\u00a0Choisis une étiquette de chaque catégorie.';
    fb.className='assemblage-fb ko show'; beepErr(); return;
  }
  if(!inp||inp.value.trim().length<5){
    fb.innerHTML='✏️\u00a0Écris la phrase complète avant de valider\u00a0!';
    fb.className='assemblage-fb ko show'; beepErr(); return;
  }
  const cle=d1SelInd+'|'+d1SelHom+'|'+d1SelGrp;
  const combo=D1_COMBOS.find(c=>c.indice===d1SelInd&&c.hom===d1SelHom&&c.grp===d1SelGrp);
  if(!combo){
    fb.innerHTML='✗\u00a0Cette combinaison n\'est pas possible. Essaie une autre\u00a0!';
    fb.className='assemblage-fb ko show'; beepErr(); showFlash(false); return;
  }
  if(d1Validees.has(cle)){
    fb.innerHTML='⚠️\u00a0Tu as déjà trouvé cette combinaison\u00a0!';
    fb.className='assemblage-fb info show'; return;
  }
  const saisie=inp.value.trim();
  const okPhrase=combo.phrases.some(a=>matchPhrase(a,saisie));
  if(!okPhrase){
    fb.innerHTML='✗\u00a0La combinaison est correcte mais vérifie la phrase écrite\u00a0!<br><em>Attendu\u00a0: '+combo.phraseRef+'</em>';
    fb.className='assemblage-fb ko show'; beepErr(); showFlash(false); return;
  }
  /* ✅ Bonne réponse */
  d1Validees.add(cle);
  scores[0]++;
  markDot(scores[0]-1,true);
  updateBar(scores[0],3,'Défi 1 — Construis les phrases');
  document.getElementById('tabScore0').textContent=scores[0]+' / 3';
  document.getElementById('d1Count').textContent=scores[0];
  document.getElementById('sousScoreVal1').textContent=scores[0]+' / 3';
  document.getElementById('sousScore1').style.display='block';
  /* Désactiver ind et grp utilisés */
  const usedInd=document.querySelector(`.etiq[data-type="ind"][data-val="${d1SelInd}"]`);
  const usedGrp=document.querySelector(`.etiq[data-type="grp"][data-val="${d1SelGrp}"]`);
  if(usedInd){usedInd.classList.add('used');usedInd.dataset.disabled='1';}
  if(usedGrp){usedGrp.classList.add('used');usedGrp.dataset.disabled='1';}
  const usedHom=document.querySelector(`.etiq[data-type="hom"][data-val="${d1SelHom}"]`);
  if(usedHom){usedHom.classList.add('used');usedHom.dataset.disabled='1';}
  /* Feedback */
  fb.innerHTML='✓\u00a0'+combo.fb+'<br><em>'+combo.phraseRef+'</em>';
  fb.className='assemblage-fb ok show';
  /* Ajouter à la liste */
  const chip=document.createElement('div'); chip.className='validee-chip';
  chip.innerHTML=`<span class="validee-temps">${combo.temps}</span> ${combo.phraseRef}`;
  document.getElementById('d1Liste').appendChild(chip);
  beepOk(); showFlash(true);
  setTimeout(()=>d1Reset(),1200);
  if(scores[0]>=3){
    document.getElementById('suiteRow1').style.display='flex';
    beepFinal(true);
  } else if(scores[0]>=1 && document.getElementById('suiteRow1').style.display!=='flex'){
    document.getElementById('suiteRow1').style.display='flex';
  }
}

function matchPhrase(attendu, saisie){
  const na=norm(attendu).replace(/\.$/,'');
  const ns=norm(saisie);
  return ns===na||ns===na+'.'||ns.startsWith(na+' ')||ns.includes(na);
}

function deposerPhrase(id,temps,card){
  const chip=card.querySelector('#chip_'+id);
  if(!chip||chip.classList.contains('placed'))return;
  if(d2Placements[id]!==undefined){
    const prev=card.querySelector('#contenu_'+d2Placements[id].replace(/[\s]/g,'_'));
    if(prev&&prev.contains(chip))prev.removeChild(chip);
  }
  d2Placements[id]=temps;
  const contenu=card.querySelector('#contenu_'+temps.replace(/[\s]/g,'_'));
  if(contenu)contenu.appendChild(chip);
  const dispo=card.querySelector('#phrasesDispo');
  if(dispo&&dispo.contains(chip))dispo.removeChild(chip);
  chip.classList.add('placed');
  updateBar(Object.keys(d2Placements).length,7,'Défi 2 — Classe tes trouvailles');
}

  {id:1, phrase:"Autrefois, on regardait l'horizon.",       temps:"Imparfait"},
  {id:2, phrase:"Hier, ils ont oublié leurs cartes.",       temps:"Passé composé"},
  {id:3, phrase:"Demain, on partira vers le nord.",         temps:"Futur simple"},
  {id:4, phrase:"On n'a jamais vu ce paysage.",            temps:"Passé composé"},
  {id:5, phrase:"Quand nous arriverons, ils auront terminé l'expédition.", temps:"Futur antérieur"},
  {id:6, phrase:"Aujourd'hui, ils découvrent une grotte.", temps:"Présent"}
];

function renderDefi2(){
  d2Validee=false;d2Placements={};scores[1]=0;
  updateTabs(1);buildDots(7);updateBar(0,7,'Défi 2 — Classe tes trouvailles');
  const zone=document.getElementById('zoneMain');zone.innerHTML='';

  const card=document.createElement('div');card.className='defi-card';
  let h='<div class="defi-header"><div class="defi-header-top"><span class="defi-nom">📦 Défi 2 — Classe tes trouvailles</span><span class="defi-pts">7 pts</span></div><div class="defi-sous-titre">Glisse chaque phrase dans le bon coffre selon son temps.</div></div><div class="defi-body">';
  h+='<div class="consigne-box">Glisse chaque phrase dans le coffre qui correspond à son temps, ou clique sur une phrase puis sur un coffre.</div>';

  /* Phrases disponibles (mélangées) */
  const ordre=[...PHRASES_D1].sort(()=>Math.random()-.5);
  h+='<div class="phrases-dispo" id="phrasesDispo">';
  ordre.forEach(p=>{
    h+=`<div class="phrase-chip" id="chip_${p.id}" draggable="true" data-id="${p.id}">${p.phrase}</div>`;
  });
  h+='</div>';

  /* Coffres */
  h+='<div class="coffres-wrap">';
  COFFRES.forEach(c=>{
    h+=`<div class="coffre" id="coffre_${c.id.replace(/\s/g,'_')}" data-temps="${c.id}">`;
    h+=`<div class="coffre-titre">${c.label}</div>`;
    h+=`<div class="coffre-contenu" id="contenu_${c.id.replace(/\s/g,'_')}"></div>`;
    h+='</div>';
  });
  h+='</div>';

  h+='<div class="btn-row"><button class="btn btn-valider" id="btnValD2" onclick="validerDefi2()">✓&nbsp;Valider</button></div>';
  h+='<div class="sous-score" id="sousScore2"><div class="sous-score-val" id="sousScoreVal2">0 / 7</div><div class="sous-score-label">Score Défi 2</div></div>';
  h+='<div class="btn-row" id="suiteRow2" style="display:none;"><button class="btn btn-suite" onclick="renderDefi3()">Défi 3&nbsp;›</button></div>';
  h+='</div>';
  card.innerHTML=h;
  zone.appendChild(card);

  /* Drag & drop */
  card.querySelectorAll('.phrase-chip').forEach(chip=>{
    chip.addEventListener('dragstart',e=>{dragPhrase=chip.dataset.id;e.dataTransfer.effectAllowed='move';});
    chip.addEventListener('click',()=>{
      card.querySelectorAll('.phrase-chip').forEach(c=>c.classList.remove('selected'));
      chip.classList.add('selected');
      dragPhrase=chip.dataset.id;
    });
  });
  card.querySelectorAll('.coffre').forEach(coffre=>{
    coffre.addEventListener('dragover',e=>{e.preventDefault();coffre.classList.add('dragover');});
    coffre.addEventListener('dragleave',()=>coffre.classList.remove('dragover'));
    coffre.addEventListener('drop',e=>{e.preventDefault();coffre.classList.remove('dragover');if(dragPhrase!==null){deposerPhrase(dragPhrase,coffre.dataset.temps,card);dragPhrase=null;}});
    coffre.addEventListener('click',()=>{
      const sel=card.querySelector('.phrase-chip.selected');
      if(sel){deposerPhrase(sel.dataset.id,coffre.dataset.temps,card);sel.classList.remove('selected');dragPhrase=null;}
    });
  });
}

function validerDefi2(){
  if(d2Validee)return;
  d2Validee=true;
  document.getElementById('btnValD2').setAttribute('disabled','');
  let sc=0;
  PHRASES_D1.forEach((p,i)=>{
    const placed=d2Placements[p.id];
    const ok=(placed===p.temps);
    const chip=document.querySelector('#chip_'+p.id);
    if(chip){chip.classList.add(ok?'ok':'ko');}
    markDot(i,ok);
    if(ok)sc++;
  });
  scores[1]=sc;
  updateBar(sc,7,'Défi 2 — Classe tes trouvailles');
  document.getElementById('tabScore1').textContent=sc+' / 7';
  document.getElementById('sousScoreVal2').textContent=sc+' / 7';
  document.getElementById('sousScore2').style.display='block';
  document.getElementById('suiteRow2').style.display='flex';
  beepFinal(sc>=5);
}

function renderDefi3(){
  scores[2]=0;
  updateTabs(2);buildDots(4);updateBar(0,4,'Défi 3 — Le transformeur de temps');
  const zone=document.getElementById('zoneMain');zone.innerHTML='';
  let d3Validee=false;

  const card=document.createElement('div');card.className='defi-card';
  let h='<div class="defi-header"><div class="defi-header-top"><span class="defi-nom">🔄 Défi 3 — Le transformeur de temps</span><span class="defi-pts">4 pts</span></div><div class="defi-sous-titre">Transforme la phrase en changeant le temps.</div></div><div class="defi-body">';
  h+='<div class="consigne-box">Transforme la phrase de départ selon les consignes. Écris la phrase entière avec le nouvel indice temporel.</div>';
  h+='<div class="transfo-phrase-source">Phrase de départ&nbsp;: <strong>Aujourd\'hui, on observe les étoiles.</strong></div>';
  h+='<div class="transfo-list">';
  TRANSFO.forEach((t,i)=>{
    h+=`<div class="transfo-item">`;
    h+=`<div class="transfo-consigne">${t.consigne}</div>`;
    h+=`<input class="transfo-input" type="text" id="t3inp_${i}" placeholder="Ta réponse…" autocomplete="off" autocorrect="off" spellcheck="false">`;
    h+=`<div class="transfo-fb" id="t3fb_${i}"></div>`;
    h+='</div>';
  });
  h+='</div>';
  h+='<div class="sep"></div>';
  /* Justificatif */
  h+='<div class="justif-card"><div class="justif-header">🔍 Justification des homonymes</div>';
  h+='<table class="justif-table"><thead><tr><th>Forme</th><th>Pourquoi ?</th></tr></thead><tbody>';
  h+='<tr><td><strong>on</strong></td><td>Pronom personnel ; peut souvent être remplacé par <em>il</em>.</td></tr>';
  h+='<tr><td><strong>on n\'</strong></td><td>Marque une négation (on n\'a jamais vu).</td></tr>';
  h+='<tr><td><strong>ont</strong></td><td>Verbe avoir au présent ; peut être remplacé par <em>avaient</em>.</td></tr>';
  h+='</tbody></table></div>';

  h+='<div class="btn-row"><button class="btn btn-valider" id="btnValD3" onclick="validerDefi3()">✓&nbsp;Valider</button></div>';
  h+='<div class="sous-score" id="sousScore3"><div class="sous-score-val" id="sousScoreVal3">0 / 4</div><div class="sous-score-label">Score Défi 3</div></div>';
  h+='<div class="btn-row" id="suiteRow3" style="display:none;"><button class="btn btn-suite" onclick="afficherBilan()">Voir le bilan&nbsp;›</button></div>';
  h+='</div>';
  card.innerHTML=h;
  zone.appendChild(card);

  card.querySelectorAll('.transfo-input').forEach((inp,i)=>{
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')validerDefi3();});
  });

  window.validerDefi3=function(){
    if(d3Validee)return;
    d3Validee=true;
    document.getElementById('btnValD3').setAttribute('disabled','');
    let sc=0;
    TRANSFO.forEach((t,i)=>{
      const inp=document.getElementById('t3inp_'+i);
      const fb=document.getElementById('t3fb_'+i);
      if(!inp)return;
      const ok=t.attendu.some(a=>norm(a)===norm(inp.value));
      inp.className='transfo-input '+(ok?'ok':'ko');
      inp.setAttribute('disabled','');
      fb.innerHTML=(ok?'✓&nbsp;Bonne réponse&nbsp;!&nbsp;':'✗&nbsp;')+'<em>'+t.fb+'</em>';
      fb.className='transfo-fb '+(ok?'ok':'ko')+' show';
      markDot(i,ok);
      if(ok)sc++;
      if(ok)beepOk(); else beepErr();
    });
    scores[2]=sc;
    updateBar(sc,4,'Défi 3 — Le transformeur de temps');
    document.getElementById('tabScore2').textContent=sc+' / 4';
    document.getElementById('sousScoreVal3').textContent=sc+' / 4';
    document.getElementById('sousScore3').style.display='block';
    document.getElementById('suiteRow3').style.display='flex';
    beepFinal(sc>=3);
    showFlash(sc>=3);
  };
}

function afficherBilan(){
  document.getElementById('zoneMain').innerHTML='';
  const total=scores[0]+scores[1]+scores[2];
  document.getElementById('bGlobal').textContent=total;
  const pct=total/18;
  const nb=pct>=.9?5:pct>=.72?4:pct>=.5?3:pct>=.3?2:1;
  document.getElementById('bEtoiles').textContent='⭐'.repeat(nb)+'☆'.repeat(5-nb);
  const tp=document.getElementById('bTampon'),msg=document.getElementById('bMsg');
  if(total>=17){tp.textContent='MAÎTRISE PARFAITE';tp.className='bilan-tampon ok';msg.textContent='Excellent ! Tu maîtrises parfaitement les homonymes et les temps du verbe.';}
  else if(total>=13){tp.textContent='TRÈS BON TRAVAIL';tp.className='bilan-tampon ok';msg.textContent='Très bonne maîtrise ! Quelques points encore à consolider.';}
  else if(total>=9){tp.textContent='EN BONNE VOIE';tp.className='bilan-tampon moyen';msg.textContent='Tu progresses ! Revois les homonymes et les indices temporels.';}
  else{tp.textContent='À CONSOLIDER';tp.className='bilan-tampon ko';msg.textContent='Relis le cours et recommence : les indices temporels t\'aident à trouver le bon temps !';}
  document.getElementById('bDetail').innerHTML=[
    {label:'Défi 1 — Construis les phrases',score:scores[0],total:7},
    {label:'Défi 2 — Classe tes trouvailles',score:scores[1],total:7},
    {label:'Défi 3 — Le transformeur de temps',score:scores[2],total:4}
  ].map(l=>{const cl=l.score/l.total>=.7?'ok':l.score/l.total>=.4?'moyen':'ko';
    return `<div class="bilan-ligne ${cl}"><span class="bilan-ligne-label">${l.label}</span><span class="bilan-ligne-score">${l.score} / ${l.total}</span></div>`;
  }).join('');
  document.getElementById('bilan').className='bilan show';
  beepFinal(total>=13);
  if(total>=13){
    const box=document.getElementById('bilanParticles');box.innerHTML='';
    ['🧩','✨','⭐','🗺️','⏱️','💫','🧩','✨','⭐','🗺️','⏱️','💫','🧩','✨','⭐','🗺️','⏱️','💫','🧩','✨','⭐','🗺️','⏱️','🧩','✨'].forEach((em,i)=>{
      const e=document.createElement('div');e.textContent=em;
      e.style.cssText=`position:absolute;font-size:${1.2+Math.random()*.9}rem;left:${3+Math.random()*94}%;bottom:${Math.random()*30}%;opacity:0;pointer-events:none;animation:particleUp ${1+Math.random()*1.1}s ease ${i*0.07+Math.random()*0.2}s forwards;`;
      box.appendChild(e);
    });
  }
}

function recommencer(){
  scores=[0,0,0];d1Validee=false;d2Validee=false;d2Placements={};dragPhrase=null;
  d1SelInd=null;d1SelHom=null;d1SelGrp=null;d1Validees=new Set();
  document.getElementById('bilan').className='bilan';
  updateTabs(0);buildDots(3);updateBar(0,3,'Défi 1 — Construis les phrases');
  renderDefi1();
  window.scrollTo({top:0,behavior:'smooth'});
}

document.addEventListener('pointerdown',initA,{once:true});

/* ═══ INIT (en dernier) ═══ */
(function init(){buildDots(3);renderDefi1();})();</script>
