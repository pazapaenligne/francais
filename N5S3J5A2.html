<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>N3S3J5A2 — Je m'entraîne – Homophones – 5e S3 J5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;600&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --jour:#f5c518;--jour-fonce:#8a6000;--jour-clair:#fffbeb;--jour-pale:#f5e08a;
  --day-glow:rgba(245,197,24,.28);
  --bg:#fffdf7;
  --vert:#22c55e;--vert-bg:#e7faec;--vert-bord:#86efac;
  --rouge:#ef4444;--rouge-bg:#fdeaea;--rouge-bord:#fca5a5;
  --txt:#2a1a00;--gris:#8a6a20;
  --bord:#f5e08a;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden;}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes glowOk{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}100%{box-shadow:0 0 0 10px rgba(34,197,94,0)}}
@keyframes glowErr{0%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}100%{box-shadow:0 0 0 10px rgba(239,68,68,0)}}
@keyframes flashPop{0%{opacity:1;transform:translate(-50%,-50%) scale(.3)}40%{opacity:1;transform:translate(-50%,-50%) scale(1.35)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
@keyframes particleUp{0%{opacity:0;transform:translateY(0) scale(0)}30%{opacity:1}100%{opacity:0;transform:translateY(-70px) scale(1)}}
@keyframes slide{0%{background-position:0%}100%{background-position:300%}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}

.bubble{position:fixed;border-radius:50%;z-index:0;pointer-events:none;filter:blur(2px);opacity:.22;}
.bubble.b1{width:120px;height:120px;background:var(--jour-pale);top:-30px;right:-30px;}
.bubble.b2{width:80px;height:80px;background:var(--jour);bottom:20px;left:-20px;}
.bubble.b3{width:60px;height:60px;background:#3ab5d8;top:38%;right:-18px;}
.bubble.b4{width:70px;height:70px;background:#8dc63f;top:20%;left:-24px;}

#flashIcon{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:4.5rem;z-index:9999;pointer-events:none;opacity:0;}
#flashIcon.show{animation:flashPop .9s ease forwards;}

.wrap{max-width:1000px;margin:0 auto;padding:16px 14px 80px;position:relative;z-index:2;}

/* HEADER */
.header{text-align:center;padding:18px 0 14px;animation:fadeUp .5s ease;}
.logo-badge{display:inline-flex;align-items:center;gap:8px;background:var(--jour);color:var(--jour-fonce);font-family:'Orbitron',sans-serif;font-weight:700;font-size:12px;letter-spacing:1.2px;padding:7px 16px;border-radius:22px;box-shadow:0 4px 14px var(--day-glow);margin-bottom:12px;}
.logo-badge .pts{display:inline-flex;gap:4px;}
.logo-badge .pts i{width:8px;height:8px;border-radius:50%;display:block;}
.logo-badge .pts i:nth-child(1){background:#8a6000;}
.logo-badge .pts i:nth-child(2){background:#fff;}
.logo-badge .pts i:nth-child(3){background:#f5e08a;}
.semaine{font-family:'Orbitron',sans-serif;font-size:.82rem;letter-spacing:2px;color:var(--gris);text-transform:uppercase;margin-bottom:6px;}
.titre{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(1.3rem,5vw,2rem);color:var(--txt);line-height:1.15;margin-bottom:8px;}
.titre .accent{color:var(--jour-fonce);}
.header-badge{display:inline-block;background:var(--jour);color:var(--jour-fonce);font-family:'Orbitron',sans-serif;font-weight:700;font-size:.65rem;letter-spacing:1px;text-transform:uppercase;padding:6px 18px;border-radius:22px;box-shadow:0 3px 12px var(--day-glow);}

/* SCORE BAR */
.score-bar-wrap{background:#fff;border:1px solid var(--bord);border-radius:12px;padding:12px 16px;margin-bottom:14px;}
.score-bar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;}
.score-bar-label{font-family:'Orbitron',sans-serif;font-size:.6rem;font-weight:700;letter-spacing:1px;color:var(--jour-fonce);text-transform:uppercase;}
.score-bar-val{font-family:'JetBrains Mono',monospace;font-size:.88rem;font-weight:600;color:var(--jour-fonce);}
.score-bar-bg{background:var(--jour-clair);border-radius:99px;height:8px;overflow:hidden;}
.score-bar-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--jour-fonce),var(--jour));border-radius:99px;transition:width .5s ease;}
.dots-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--bord);background:var(--jour-clair);font-family:'JetBrains Mono',monospace;font-size:.58rem;color:var(--gris);display:flex;align-items:center;justify-content:center;transition:all .3s;flex-shrink:0;}
.dot.ok{background:var(--vert-bg);border-color:var(--vert-bord);color:#157f3a;}
.dot.ko{background:var(--rouge-bg);border-color:var(--rouge-bord);color:#b91c1c;}

/* ÉTAPES NAV */
.etapes-nav{display:flex;gap:8px;margin-bottom:14px;}
.etape-tab{flex:1;padding:10px 8px;border-radius:11px;border:2px solid var(--bord);background:var(--jour-clair);text-align:center;cursor:default;}
.etape-tab.active{border-color:var(--jour-fonce);background:var(--jour-pale);}
.etape-tab.done{border-color:var(--vert-bord);background:var(--vert-bg);}
.etape-tab.locked{opacity:.5;}
.etape-tab .tab-num{font-family:'Orbitron',sans-serif;font-size:.6rem;font-weight:900;letter-spacing:1px;color:var(--gris);display:block;text-transform:uppercase;}
.etape-tab.active .tab-num{color:var(--jour-fonce);}
.etape-tab.done .tab-num{color:#157f3a;}
.etape-tab .tab-label{font-family:'Orbitron',sans-serif;font-size:.58rem;font-weight:700;color:var(--txt);display:block;margin-top:2px;}

/* CARTE */
.etape-card{background:#fff;border:1.5px solid var(--bord);border-radius:14px;overflow:hidden;box-shadow:0 3px 16px rgba(245,197,24,.1);animation:fadeUp .4s ease;}
.etape-header{background:linear-gradient(135deg,var(--jour-fonce),var(--jour));padding:13px 18px;}
.etape-header-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.etape-nom{font-family:'Orbitron',sans-serif;font-weight:900;font-size:.78rem;letter-spacing:1.5px;color:#fff;text-transform:uppercase;}
.etape-pts{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:rgba(255,255,255,.8);}
.etape-sous-titre{font-family:'IM Fell English',serif;font-style:italic;font-size:.9rem;color:rgba(255,255,255,.9);margin-top:4px;}
.etape-body{padding:16px 18px 20px;}

/* CONSIGNE */
.consigne-box{background:var(--jour-clair);border-left:4px solid var(--jour-fonce);border-radius:0 9px 9px 0;padding:10px 14px;font-size:.92rem;color:var(--jour-fonce);font-style:italic;margin-bottom:16px;line-height:1.6;}

/* COMPTEUR FAUTES */
.compteur{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.compteur-label{font-family:'Orbitron',sans-serif;font-size:.62rem;font-weight:700;letter-spacing:1px;color:var(--jour-fonce);text-transform:uppercase;}
.compteur-dots{display:flex;gap:6px;}
.c-dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--bord);background:var(--jour-clair);transition:all .3s;}
.c-dot.found{background:var(--vert);border-color:var(--vert-bord);}

/* TEXTE CLIQUABLE */
.texte-cliquable{font-family:'IM Fell English',serif;font-size:1.1rem;line-height:2.4;color:var(--txt);padding:14px 4px;}
.mot{display:inline;cursor:pointer;border-radius:4px;padding:2px 3px;transition:background .12s,color .12s;position:relative;}
.mot:hover{background:var(--jour-pale);}
.mot.found{background:var(--vert-bg);color:#157f3a;font-weight:700;cursor:default;}
.mot.wrong{background:var(--rouge-bg);color:#b91c1c;animation:shake .3s ease;}
.mot.wrong-fade{background:transparent;color:var(--txt);}
.mot[data-faute="true"]{cursor:pointer;}

/* FEEDBACK TEMPORAIRE */
.fb-temp{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border:2px solid var(--rouge-bord);border-radius:12px;padding:12px 20px;font-size:.9rem;color:#7a1f1f;z-index:8888;box-shadow:0 4px 20px rgba(0,0,0,.2);text-align:center;pointer-events:none;opacity:0;transition:opacity .2s;}
.fb-temp.show{opacity:1;}

/* TEXTE SUPPORT (partie 2) */
.texte-support{background:var(--jour-clair);border:1.5px solid var(--bord);border-radius:10px;padding:14px 18px;font-family:'IM Fell English',serif;font-size:1rem;line-height:1.9;color:var(--txt);margin-bottom:14px;}
.texte-support .faute-mot{color:#b91c1c;font-weight:700;text-decoration:underline wavy #b91c1c;}
.support-label{font-family:'Orbitron',sans-serif;font-size:.6rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--jour-fonce);margin-bottom:8px;display:block;}

/* IFRAME */
.iframe-wrap{border-radius:12px;overflow:hidden;border:2px solid var(--bord);box-shadow:0 4px 18px rgba(245,197,24,.15);}
.iframe-wrap iframe{display:block;width:100%;border:none;height:520px;}

/* BOUTONS */
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
.btn{border:none;border-radius:10px;font-family:'Orbitron',sans-serif;font-weight:700;font-size:.7rem;letter-spacing:1px;text-transform:uppercase;padding:0 18px;min-height:3rem;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px;}
.btn-suite{background:var(--vert);color:#fff;}
.btn-suite:hover{transform:translateY(-2px);}
.btn-rec{background:var(--jour-clair);color:var(--jour-fonce);border:2px solid var(--bord);}

/* BILAN */
.bilan{display:none;background:#fff;border:2px solid var(--jour-fonce);border-radius:16px;padding:28px 24px;text-align:center;box-shadow:0 8px 28px var(--day-glow);position:relative;overflow:hidden;margin-top:14px;}
.bilan.show{display:block;animation:fadeUp .5s ease;}
.bilan-particles{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}
.bilan-global{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(2.8rem,9vw,4.5rem);color:var(--jour-fonce);line-height:1;margin-bottom:4px;}
.bilan-global small{font-size:.32em;color:var(--gris);}
.bilan-etoiles{font-size:1.6rem;margin:8px 0;}
.bilan-tampon{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(.75rem,2.5vw,.92rem);letter-spacing:2px;padding:7px 20px;border-radius:8px;display:inline-block;margin-bottom:12px;text-transform:uppercase;}
.bilan-tampon.ok{color:#157f3a;border:2.5px solid #157f3a;}
.bilan-tampon.moyen{color:var(--jour-fonce);border:2.5px solid var(--jour-fonce);}
.bilan-tampon.ko{color:#7a1f1f;border:2.5px solid #7a1f1f;}
.bilan-msg{font-size:.95rem;color:var(--txt);line-height:1.7;margin-bottom:20px;max-width:520px;margin-left:auto;margin-right:auto;}
.bilan-detail{display:flex;flex-direction:column;gap:6px;max-width:460px;margin:0 auto 22px;text-align:left;}
.bilan-ligne{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:9px;}
.bilan-ligne.ok{background:var(--vert-bg);color:#157f3a;}
.bilan-ligne.moyen{background:#fffbeb;color:#8a6000;}
.bilan-ligne.ko{background:var(--rouge-bg);color:#7a1f1f;}
.bilan-ligne-label{font-size:.82rem;}
.bilan-ligne-score{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.88rem;}
.btn-recommencer{font-family:'Orbitron',sans-serif;font-weight:900;font-size:.72rem;letter-spacing:1.5px;text-transform:uppercase;background:linear-gradient(135deg,var(--jour-fonce),var(--jour));color:#fff;border:none;border-radius:12px;padding:0 28px;min-height:3rem;cursor:pointer;box-shadow:0 4px 14px var(--day-glow);transition:all .2s;}
.btn-recommencer:hover{transform:translateY(-2px);}
</style>
</head>
<body>
<div id="flashIcon"></div>
<div class="fb-temp" id="fbTemp"></div>
<div class="bubble b1"></div>
<div class="bubble b2"></div>
<div class="bubble b3"></div>
<div class="bubble b4"></div>

<div class="wrap">

  <!-- HEADER -->
  <div class="header">
    <div>
      <div class="logo-badge">
        <span class="pts"><i></i><i></i><i></i></span>
        PAZAPA &middot; FRANÇAIS &middot; 5E
      </div>
    </div>
    <div class="semaine">Semaine 3 &mdash; Jour 5</div>
    <h1 class="titre">Je <span class="accent">m'entraîne</span></h1>
    <div class="header-badge">Détective des homophones &middot; /10</div>
  </div>

  <!-- SCORE BAR -->
  <div class="score-bar-wrap">
    <div class="score-bar-head">
      <span class="score-bar-label" id="scoreLabel">Partie 1 — Repérer les fautes</span>
      <span class="score-bar-val" id="scoreVal">0 / 5</span>
    </div>
    <div class="score-bar-bg"><div class="score-bar-fill" id="scoreFill"></div></div>
    <div class="dots-row" id="dotsRow"></div>
  </div>

  <!-- ÉTAPES NAV -->
  <div class="etapes-nav">
    <div class="etape-tab active" id="tab0">
      <span class="tab-num">Partie 1</span>
      <span class="tab-label">Repérer les fautes</span>
    </div>
    <div class="etape-tab locked" id="tab1">
      <span class="tab-num">Partie 2</span>
      <span class="tab-label">Corriger — Labyrinthe</span>
    </div>
  </div>

  <!-- ZONE PRINCIPALE -->
  <div id="zoneMain"></div>

  <!-- BILAN -->
  <div class="bilan" id="bilan">
    <div class="bilan-particles" id="bilanParticles"></div>
    <div class="bilan-global"><span id="bGlobal">0</span><small> / 10</small></div>
    <div class="bilan-etoiles" id="bEtoiles"></div>
    <div class="bilan-tampon" id="bTampon"></div>
    <div class="bilan-msg" id="bMsg"></div>
    <div class="bilan-detail" id="bDetail"></div>
    <button class="btn-recommencer" onclick="recommencer()">&#8635;&nbsp;Recommencer</button>
  </div>

</div>

<script>
/* ══ DONNÉES ══ */

/* Le texte découpé mot par mot — data-faute=true pour les 5 mots fautifs */
/* Texte : Le jeune navigateur à un message important a partager à l'autre bout de la Terre.
           Il navigue est traverse l'océan. On entend les vagues... Les marins on peur car le danger et proche. */

var MOTS = [
  {t:'Le',f:false},{t:'jeune',f:false},{t:'navigateur',f:false},
  {t:'à',f:true,id:'f1',correct:'a'},
  {t:'un',f:false},{t:'message',f:false},{t:'important',f:false},
  {t:'a',f:true,id:'f2',correct:'à'},
  {t:'partager',f:false},
  {t:'à',f:false},{t:'l\'autre',f:false},{t:'bout',f:false},{t:'de',f:false},{t:'la',f:false},{t:'Terre.',f:false},
  {t:'Il',f:false},{t:'navigue',f:false},
  {t:'est',f:true,id:'f3',correct:'et'},
  {t:'traverse',f:false},{t:'l\'océan.',f:false},
  {t:'On',f:false},{t:'entend',f:false},{t:'les',f:false},{t:'vagues...',f:false},
  {t:'Les',f:false},{t:'marins',f:false},
  {t:'on',f:true,id:'f4',correct:'ont'},
  {t:'peur',f:false},{t:'car',f:false},{t:'le',f:false},{t:'danger',f:false},
  {t:'et',f:true,id:'f5',correct:'est'},
  {t:'proche.',f:false}
];

var FAUTES_IDS = ['f1','f2','f3','f4','f5'];
var score1 = 0; /* fautes trouvées */
var score2 = 0; /* score labyrinthe /5 */
var fautesOk = {};

/* ══ AUDIO ══ */
var actx=null;
function initA(){if(actx)return;try{actx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function beep(f1,f2,d,tp,vol){
  if(!actx)return;
  var o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;
  o.type=tp||'sine';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol||.1,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+.02);
}
function beepOk(){initA();beep(660,880,.07,'sine',.08);setTimeout(function(){beep(880,1100,.12,'sine',.1);},75);}
function beepErr(){initA();beep(220,90,.22,'sawtooth',.09);}
function beepFinal(ok){
  initA();
  if(ok){[523,659,784,1047,1318].forEach(function(f,i){setTimeout(function(){beep(f,f,.22,'triangle',.14);},i*140);});}
  else{beep(200,80,.4,'sawtooth',.11);}
}
document.addEventListener('pointerdown',initA,{once:true});

function showFlash(ok){
  var f=document.getElementById('flashIcon');
  if(!f)return;
  f.textContent=ok?'✓':'✗';
  f.style.color=ok?'#22c55e':'#ef4444';
  f.style.animation='none';void f.offsetWidth;
  f.className='show';
}

function showFbTemp(msg){
  var el=document.getElementById('fbTemp');
  el.textContent=msg;
  el.classList.add('show');
  setTimeout(function(){el.classList.remove('show');},1800);
}

/* ══ INIT ══ */
(function init(){
  buildDots(5);
  renderPartie1();
})();

function buildDots(n){
  var row=document.getElementById('dotsRow');
  row.innerHTML='';
  for(var i=0;i<n;i++){
    var d=document.createElement('div');
    d.className='dot';d.id='dot_'+i;d.textContent=i+1;
    row.appendChild(d);
  }
}

function markDot(idx,ok){
  var d=document.getElementById('dot_'+idx);
  if(d){d.className='dot '+(ok?'ok':'ko');d.textContent=ok?'✓':'✗';}
}

function updateBar(score,total,label){
  document.getElementById('scoreVal').textContent=score+' / '+total;
  document.getElementById('scoreFill').style.width=Math.round(score/total*100)+'%';
  document.getElementById('scoreLabel').textContent=label;
}

function updateTabs(p){
  document.getElementById('tab0').className='etape-tab '+(p===1?'active':'done');
  document.getElementById('tab1').className='etape-tab '+(p===2?'active':'locked');
}

/* ══ PARTIE 1 ══ */
function renderPartie1(){
  updateTabs(1);
  buildDots(5);
  updateBar(0,5,'Partie 1 — Repérer les fautes');
  score1=0;fautesOk={};
  var zone=document.getElementById('zoneMain');
  zone.innerHTML='';
  document.getElementById('bilan').className='bilan';

  var card=document.createElement('div');
  card.className='etape-card';
  var html='<div class="etape-header">';
  html+='<div class="etape-header-top"><span class="etape-nom">🔍 Partie 1</span><span class="etape-pts">5 pts</span></div>';
  html+='<div class="etape-sous-titre">Repère et clique sur les cinq fautes d\'homonymes</div>';
  html+='</div><div class="etape-body">';
  html+='<div class="consigne-box">Repère et corrige les cinq fautes d\'homonymes cachées dans ce texte.</div>';

  /* Compteur */
  html+='<div class="compteur">';
  html+='<span class="compteur-label">Fautes trouvées&nbsp;:</span>';
  html+='<div class="compteur-dots">';
  for(var i=0;i<5;i++) html+='<div class="c-dot" id="cdot_'+i+'"></div>';
  html+='</div></div>';

  /* Texte cliquable */
  html+='<div class="texte-cliquable" id="texteCliq">';
  MOTS.forEach(function(m,mi){
    if(mi===15||mi===20) html+='<br>';
    html+='<span class="mot" data-faute="'+(m.f?'true':'false')+'" data-mid="'+mi+'" id="mot_'+mi+'">'+m.t+'</span> ';
  });
  html+='</div>';

  html+='<div class="btn-row" id="suiteRow1" style="display:none;margin-top:14px;">';
  html+='<button class="btn btn-suite" onclick="lancerPartie2()">Partie 2 — Labyrinthe&nbsp;›</button></div>';
  html+='</div>';
  card.innerHTML=html;
  zone.appendChild(card);

  /* Délégation clic */
  card.querySelector('#texteCliq').addEventListener('click',function(ev){
    var mot=ev.target.closest('.mot');
    if(!mot) return;
    var mi=+mot.dataset.mid;
    var m=MOTS[mi];
    if(m.f){
      if(fautesOk[m.id]) return; /* déjà trouvé */
      fautesOk[m.id]=true;
      mot.className='mot found';
      mot.title='✓ Faute trouvée — correction : '+m.correct;
      score1++;
      var cdot=document.getElementById('cdot_'+(score1-1));
      if(cdot) cdot.classList.add('found');
      markDot(score1-1,true);
      updateBar(score1,5,'Partie 1 — Repérer les fautes');
      beepOk();showFlash(true);
      if(score1===5){
        document.getElementById('suiteRow1').style.display='flex';
        beepFinal(true);
      }
    } else {
      /* Mot correct — feedback temporaire rouge */
      mot.className='mot wrong';
      showFbTemp('✗ Ce mot est correct\u00a0!');
      beepErr();showFlash(false);
      setTimeout(function(){mot.className='mot wrong-fade';
        setTimeout(function(){mot.className='mot';},300);
      },600);
    }
  });
}

/* ══ PARTIE 2 ══ */
function lancerPartie2(){
  updateTabs(2);
  buildDots(5);
  score2=0;
  updateBar(0,5,'Partie 2 — Corriger dans le labyrinthe');
  var zone=document.getElementById('zoneMain');
  zone.innerHTML='';

  var card=document.createElement('div');
  card.className='etape-card';
  var html='<div class="etape-header">';
  html+='<div class="etape-header-top"><span class="etape-nom">🌀 Partie 2</span><span class="etape-pts">Labyrinthe</span></div>';
  html+='<div class="etape-sous-titre">Corrige les fautes dans le labyrinthe</div>';
  html+='</div><div class="etape-body">';

  /* Texte de support avec fautes soulignées */
  html+='<span class="support-label">📄 Texte de référence — les fautes sont soulignées</span>';
  html+='<div class="texte-support">';
  html+='Le jeune navigateur <span class="faute-mot">à</span> un message important <span class="faute-mot">a</span> partager à l\'autre bout de la Terre.\u00a0';
  html+='Il navigue <span class="faute-mot">est</span> traverse l\'océan.\u00a0';
  html+='On entend les vagues...\u00a0Les marins <span class="faute-mot">on</span> peur car le danger <span class="faute-mot">et</span> proche.';
  html+='</div>';

  /* Iframe labyrinthe */
  html+='<div class="iframe-wrap">';
  html+='<iframe id="labyIframe" src="N3S3J5A2_labyrinthe.html" scrolling="no"></iframe>';
  html+='</div>';

  html+='<div class="sous-score" id="sousScore2" style="display:none;margin-top:14px;">';
  html+='<div style="font-family:\'JetBrains Mono\',monospace;font-weight:700;font-size:1.4rem;color:var(--jour-fonce);" id="sousScoreVal2">0 / 5</div>';
  html+='<div style="font-family:\'Orbitron\',sans-serif;font-size:.6rem;color:var(--gris);text-transform:uppercase;letter-spacing:1px;margin-top:2px;">Score Partie 2</div></div>';

  html+='<div class="btn-row" id="suiteRow2" style="display:none;margin-top:14px;">';
  html+='<button class="btn btn-suite" onclick="afficherBilan()">Voir le bilan&nbsp;›</button></div>';

/* Écouter le score du labyrinthe via postMessage */
window.addEventListener('message',function(ev){
  if(ev.data&&ev.data.type==='pazapaScore'){
    var s=Math.min(ev.data.score,5);
    score2=s;
    for(var i=0;i<5;i++) markDot(i,i<s);
    updateBar(s,5,'Partie 2 — Corriger dans le labyrinthe');
    var sv=document.getElementById('sousScoreVal2');
    var ss=document.getElementById('sousScore2');
    var sr=document.getElementById('suiteRow2');
    if(sv) sv.textContent=s+' / 5';
    if(ss) ss.style.display='block';
    if(sr) sr.style.display='flex';
    beepFinal(s>=4);
    document.getElementById('tabScore1') && (document.getElementById('tabScore1').textContent=s+' / 5');
  }
});

/* ══ BILAN ══ */
function afficherBilan(){
  document.getElementById('zoneMain').innerHTML='';
  var total=score1+score2;
  document.getElementById('bGlobal').textContent=total;
  var pct=total/10;
  var nb=pct>=.9?5:pct>=.7?4:pct>=.5?3:pct>=.3?2:1;
  document.getElementById('bEtoiles').textContent='⭐'.repeat(nb)+'☆'.repeat(5-nb);
  var tp=document.getElementById('bTampon');
  var msg=document.getElementById('bMsg');
  if(total>=9){
    tp.textContent='DÉTECTIVE CONFIRMÉ';tp.className='bilan-tampon ok';
    msg.textContent='Excellent\u00a0! Tu repères et corriges parfaitement les homophones.';
  } else if(total>=7){
    tp.textContent='TRÈS BON TRAVAIL';tp.className='bilan-tampon ok';
    msg.textContent='Tu maîtrises bien les homophones\u00a0! Quelques points à consolider.';
  } else if(total>=5){
    tp.textContent='EN BONNE VOIE';tp.className='bilan-tampon moyen';
    msg.textContent='Bonne progression\u00a0! Revois les tests de substitution pour les homophones difficiles.';
  } else {
    tp.textContent='À CONSOLIDER';tp.className='bilan-tampon ko';
    msg.textContent='Relis le référentiel et recommence\u00a0! Tu vas y arriver.';
  }
  var detail=document.getElementById('bDetail');
  var lignes=[
    {label:'Partie 1 — Repérer les fautes',score:score1,total:5},
    {label:'Partie 2 — Corriger',score:score2,total:5},
  ];
  var html='';
  lignes.forEach(function(l){
    var cl=l.score/l.total>=.7?'ok':l.score/l.total>=.4?'moyen':'ko';
    html+='<div class="bilan-ligne '+cl+'"><span class="bilan-ligne-label">'+l.label+'</span><span class="bilan-ligne-score">'+l.score+' / '+l.total+'</span></div>';
  });
  detail.innerHTML=html;
  document.getElementById('bilan').className='bilan show';
  beepFinal(total>=7);
  if(total>=7) launchEmojis();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* PLUIE D'EMOJI — thème mer / navigation */
function launchEmojis(){
  var box=document.getElementById('bilanParticles');
  box.innerHTML='';
  var emojis=['🌊','💧','⛵','🔭','🗺️','🌧️','💫','⚓','🌊','💧','⛵','🔭','🗺️','💫','🌊','💧','⛵','⚓','🌧️','🔭','💫','🌊','💧','⛵','🗺️'];
  emojis.forEach(function(em,i){
    var e=document.createElement('div');
    e.textContent=em;
    e.style.cssText='position:absolute;font-size:'+(1.2+Math.random()*.9)+'rem;'
      +'left:'+(3+Math.random()*94)+'%;bottom:'+(Math.random()*30)+'%;'
      +'opacity:0;pointer-events:none;'
      +'animation:particleUp '+(1+Math.random()*1.1)+'s ease '+(i*0.07+Math.random()*0.2)+'s forwards;';
    box.appendChild(e);
  });
}

/* ══ RECOMMENCER ══ */
function recommencer(){
  score1=0;score2=0;fautesOk={};
  document.getElementById('bilan').className='bilan';
  renderPartie1();
  window.scrollTo({top:0,behavior:'smooth'});
}
