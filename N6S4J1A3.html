<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Pazapa – Je relève le défi – S4 J1</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --day-color:#f5a623; --day-dark:#c47a10;
  --day-light:#fff5e0; --day-border:#f5d080;
  --day-glow:rgba(245,166,35,.35);
  --bg:#fffdf7; --surface:#ffffff; --surface2:#faf8f2;
  --border:#e8e4d9; --border2:#ddd8cc;
  --green:#22c55e; --vert-neon:#4ade80;
  --rouge:#ef4444; --txt:#1a1d23; --muted:#8a8f9a;
  --radius:14px; --radius-sm:9px;
  --neon-o:0 0 12px rgba(245,166,35,.55),0 0 28px rgba(245,166,35,.2);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
  background:var(--bg);color:var(--txt);
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:1.6rem 1rem 3.5rem;position:relative;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(245,166,35,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(245,166,35,.05) 1px,transparent 1px);
  background-size:44px 44px;
}
.g1{position:fixed;border-radius:50%;z-index:0;pointer-events:none;filter:blur(4px);opacity:.55;width:220px;height:220px;background:#ffd84d;top:-60px;right:-50px;}
.g2{position:fixed;border-radius:50%;z-index:0;pointer-events:none;filter:blur(4px);opacity:.55;width:240px;height:240px;background:var(--day-border);bottom:-80px;left:-70px;}
.g3{position:fixed;border-radius:50%;z-index:0;pointer-events:none;filter:blur(4px);opacity:.45;width:150px;height:150px;background:#9be7a5;top:45%;right:-70px;}
.g4{position:fixed;border-radius:50%;z-index:0;pointer-events:none;filter:blur(4px);opacity:.45;width:130px;height:130px;background:#f9b8c5;top:30%;left:-60px;}

.wrap{width:100%;max-width:760px;position:relative;z-index:1;}

/* HEADER */
header{text-align:center;margin-bottom:1.6rem;}
.logo-badge{
  display:inline-flex;align-items:center;gap:.45rem;
  background:linear-gradient(135deg,var(--day-dark),var(--day-color));
  color:#fff;font-family:'Orbitron',sans-serif;font-size:.72rem;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;padding:.3rem 1rem;border-radius:99px;
  margin-bottom:.6rem;white-space:nowrap;box-shadow:var(--neon-o);
}
.logo-dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0;}
.week-label{font-family:'JetBrains Mono',monospace;font-size:.78rem;color:var(--muted);margin-bottom:.5rem;letter-spacing:.06em;}
.defi-banner{display:flex;align-items:center;justify-content:center;gap:.7rem;margin-bottom:.4rem;}
.trophy{font-size:2.2rem;animation:trophy-bounce 1.6s ease-in-out infinite;filter:drop-shadow(0 0 10px rgba(245,166,35,.8));}
@keyframes trophy-bounce{
  0%,100%{transform:translateY(0) rotate(-8deg);}
  30%{transform:translateY(-8px) rotate(8deg);}
  60%{transform:translateY(-4px) rotate(-4deg);}
}
.defi-title{
  font-family:'Orbitron',sans-serif;font-weight:900;
  font-size:clamp(1.1rem,4.5vw,1.7rem);
  background:linear-gradient(135deg,var(--day-dark),var(--day-color),#f5c518);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  letter-spacing:.04em;
}
.defi-stars{display:flex;gap:3px;}
.defi-stars span{font-size:1rem;animation:star-pop 2s ease-in-out infinite;}
.defi-stars span:nth-child(1){animation-delay:0s;}
.defi-stars span:nth-child(2){animation-delay:.15s;}
.defi-stars span:nth-child(3){animation-delay:.3s;}
@keyframes star-pop{0%,100%{transform:scale(1);opacity:.7;}50%{transform:scale(1.4);opacity:1;}}
h1{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(1.2rem,4.5vw,1.8rem);line-height:1.2;word-break:break-word;color:var(--txt);}
h1 .hl{color:var(--day-color);text-shadow:var(--neon-o);}
.subtitle{color:var(--muted);font-size:clamp(.75rem,2.5vw,.85rem);margin-top:.4rem;font-family:'JetBrains Mono',monospace;}

/* SCOREBAR */
.scorebar{
  position:sticky;top:0;z-index:5;width:100%;
  background:rgba(255,253,247,.92);backdrop-filter:blur(12px);
  border:1.5px solid var(--border2);border-radius:99px;
  padding:.55rem 1.1rem;margin-bottom:1.6rem;
  display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;justify-content:center;
  box-shadow:0 4px 20px rgba(0,0,0,.08);
}
.sb-label{font-family:'JetBrains Mono',monospace;font-size:.76rem;font-weight:700;color:var(--day-dark);white-space:nowrap;}
.sb-track{flex:1;min-width:100px;height:6px;background:var(--border);border-radius:99px;overflow:hidden;}
.sb-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--day-dark),var(--day-color),#f5c518);border-radius:99px;transition:width .5s ease;box-shadow:var(--neon-o);}
.chip{display:inline-flex;align-items:center;gap:.35rem;padding:.22rem .65rem;border-radius:99px;font-family:'JetBrains Mono',monospace;font-size:.72rem;white-space:nowrap;border:1px solid var(--border2);background:var(--surface2);font-weight:700;}
.chip .dot{width:7px;height:7px;border-radius:50%;}
.chip.correct .dot{background:var(--green);}
.chip.wrong .dot{background:var(--rouge);}

/* CARD */
.card{
  width:100%;background:var(--surface);border:1.5px solid var(--border);
  border-radius:var(--radius);padding:0;position:relative;z-index:1;
  box-shadow:0 6px 24px rgba(0,0,0,.08);
  animation:fadeUp .4s ease both;margin-bottom:1.2rem;overflow:hidden;
}
.card-stripe{position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--day-dark),var(--day-color),#f5c518,var(--rouge));box-shadow:0 0 10px rgba(245,166,35,.4);}
.card-header{background:#13161e;padding:1.1rem 1.4rem 1rem;border-bottom:1px solid rgba(245,166,35,.2);}
.q-num{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:#5a6080;margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.12em;}
.q-txt{font-size:clamp(.95rem,3vw,1.08rem);font-weight:700;color:#e8dfc0;line-height:1.5;word-break:break-word;}
.card-body{background:var(--surface);padding:1.2rem 1.4rem 1.4rem;}

/* SOUS-QUESTION */
.sub-label{font-family:'JetBrains Mono',monospace;font-size:.68rem;font-weight:700;color:var(--day-dark);letter-spacing:.06em;text-transform:uppercase;margin-bottom:.6rem;margin-top:1rem;}
.sub-label:first-child{margin-top:0;}

/* OPTIONS QCM */
.opts{display:flex;flex-direction:column;gap:.55rem;margin-bottom:.3rem;}
.opt-btn{
  display:flex;align-items:center;gap:.65rem;text-align:left;
  padding:.65rem .95rem;
  border:2px solid var(--border);border-radius:var(--radius-sm);
  font-family:Arial,sans-serif;font-size:clamp(.88rem,2.6vw,.95rem);font-weight:500;
  cursor:pointer;background:var(--surface2);color:var(--txt);
  min-height:44px;line-height:1.5;word-break:break-word;
  transition:border-color .15s,background .15s,transform .1s;
}
.opt-btn:hover:not(.locked){border-color:var(--day-color);background:var(--day-light);}
.opt-btn:active{transform:scale(.98);}
.opt-btn.selected{border-color:var(--day-color);background:var(--day-light);box-shadow:0 0 0 3px rgba(245,166,35,.15);}
.opt-btn.correct-opt{border-color:var(--green);background:#e7faec;color:#2f6e10;cursor:default;}
.opt-btn.wrong-opt{border-color:var(--rouge);background:#fdeaea;color:#c0392b;cursor:default;text-decoration:line-through;}
.opt-btn.locked{cursor:default;}
.opt-mark{font-family:'JetBrains Mono',monospace;font-weight:700;width:1.4rem;flex-shrink:0;text-align:center;color:var(--day-dark);font-size:.85rem;}
.opt-mark.sel-mark{color:var(--day-color);}

/* SÉPARATEUR */
.sep{height:1px;background:var(--border);margin:1rem 0;}

/* BOUTONS */
.tools{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem;}
.btn{
  display:inline-flex;align-items:center;gap:.35rem;
  padding:.65rem 1.3rem;border-radius:var(--radius-sm);
  font-family:'Orbitron',sans-serif;font-size:clamp(.7rem,2.2vw,.78rem);font-weight:700;letter-spacing:.06em;
  cursor:pointer;border:none;transition:transform .12s,box-shadow .15s;min-height:44px;
}
.btn:active{transform:scale(.96);}
.btn:disabled{opacity:.35;cursor:default;}
.btn-p{background:linear-gradient(135deg,var(--day-dark),var(--day-color));color:#fff;box-shadow:var(--neon-o);}
.btn-p:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 0 20px rgba(245,166,35,.6);}
.btn-g{background:var(--surface2);color:var(--muted);border:1.5px solid var(--border2);}
.btn-g:hover:not(:disabled){border-color:var(--day-color);color:var(--txt);}

/* FEEDBACK */
.fb{margin-top:.9rem;padding:.75rem 1rem;border-radius:var(--radius-sm);font-size:clamp(.86rem,2.6vw,.94rem);display:none;align-items:flex-start;gap:.6rem;line-height:1.8;word-break:break-word;}
.fb.show{display:flex;animation:pop .3s cubic-bezier(.18,.89,.32,1.6);}
.fb.ok{background:#e7faec;border:1.5px solid var(--green);color:#2f6e10;}
.fb.ko{background:#fdeaea;border:1.5px solid var(--rouge);color:#c0392b;}
.fb-icon{font-size:1.2rem;flex-shrink:0;}

/* BILAN */
.global{
  width:100%;background:var(--surface);border:1.5px solid var(--border);
  border-radius:var(--radius);overflow:hidden;
  box-shadow:0 6px 24px rgba(0,0,0,.08);display:none;
}
.global.show{display:block;animation:fadeUp .5s ease both;}
.global .card-stripe{position:relative;height:3px;background:linear-gradient(90deg,var(--day-dark),var(--day-color),#f5c518,var(--rouge));}
.global-inner{padding:2rem 1.6rem;text-align:center;}
.global-score{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(2.6rem,11vw,4.5rem);line-height:1;margin:.4rem 0;}
.global-score .s-num{color:var(--day-color);text-shadow:var(--neon-o);}
.stars{font-size:1.9rem;margin:.3rem 0 .9rem;letter-spacing:.1em;}
.global-msg{color:var(--muted);font-size:clamp(.84rem,2.6vw,.92rem);margin-bottom:1.4rem;line-height:1.7;}
.btn-rejouer{display:block;width:100%;font-family:'Orbitron',sans-serif;font-weight:700;font-size:clamp(.88rem,3vw,1rem);letter-spacing:1px;padding:14px;border:none;border-radius:12px;color:#fff;background:var(--day-color);cursor:pointer;min-height:44px;}

@keyframes fadeUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
@keyframes pop{0%{transform:scale(.9);}60%{transform:scale(1.03);}100%{transform:scale(1);}}

@media(max-width:480px){
  .card-body{padding:1rem;}
  .card-header{padding:.9rem 1rem;}
  .tools{flex-direction:column;}
  .btn{width:100%;justify-content:center;}
}
</style>
</head>
<body>
<div class="g1"></div><div class="g2"></div><div class="g3"></div><div class="g4"></div>
<div class="wrap">

<header>
  <div class="logo-badge">
    <span class="logo-dot" style="background:#f5c518"></span>
    <span class="logo-dot" style="background:#8dc63f"></span>
    <span class="logo-dot" style="background:#f5a623"></span>
    Pazapa &middot; Français &middot; 6ème
  </div>
  <div class="week-label">Semaine 4 &ndash; Jour 1</div>
  <div class="defi-banner">
    <div class="trophy">&#127942;</div>
    <div class="defi-title">Je relève le défi !</div>
    <div class="defi-stars"><span>&#9733;</span><span>&#9733;</span><span>&#9733;</span></div>
  </div>
  <h1>Le <span class="hl">calligramme</span></h1>
  <p class="subtitle">5 questions &middot; compréhension &amp; justification</p>
</header>

<div class="scorebar">
  <span class="sb-label" id="sb-label">0 / 5 questions</span>
  <div class="sb-track"><div class="sb-fill" id="sb-fill"></div></div>
  <span class="chip correct"><span class="dot"></span><span id="sb-ok">0</span></span>
  <span class="chip wrong"><span class="dot"></span><span id="sb-ko">0</span></span>
</div>

<div id="cards-zone"></div>

<div class="global" id="global">
  <div class="card-stripe"></div>
  <div class="global-inner">
    <div style="font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-bottom:.5rem;">Bilan</div>
    <div class="global-score"><span class="s-num" id="g-num">0</span> / 5</div>
    <div class="stars" id="g-stars">&#9734;&#9734;&#9734;&#9734;&#9734;</div>
    <div class="global-msg" id="g-msg"></div>
    <button class="btn-rejouer" onclick="restart()">&#8635; Recommencer</button>
  </div>
</div>

</div>

<script>
/* ════════════════════════════════
   DONNÉES
════════════════════════════════ */
var QS = [
  {
    id:1,
    q:"Pourquoi Apollinaire a-t-il choisi cette forme&nbsp;?",
    // Bonne réponse en A (pos 0)
    opts:[
      "Pour montrer le monument tout en l\u2019\u00e9voquant.",
      "Pour rendre la lecture plus difficile.",
      "Pour cacher le sens du po\u00e8me.",
      "Pour raconter une aventure imaginaire."
    ],
    ans:0,
    sub:"Quel \u00e9l\u00e9ment justifie le mieux ta r\u00e9ponse&nbsp;?",
    // Bonne réponse en B (pos 1)
    jopts:[
      "Le dessin emp\u00eache de comprendre le texte.",
      "Le dessin et le sujet repr\u00e9sentent la m\u00eame chose.",
      "Le dessin est diff\u00e9rent du sujet \u00e9voqu\u00e9.",
      "Le dessin remplace compl\u00e8tement les mots."
    ],
    jans:1,
    fb_ok:"Bravo&nbsp;! Apollinaire a choisi la forme d\u2019une Tour Eiffel pour que le dessin et le sujet co\u00efncident. C\u2019est le principe m\u00eame du calligramme&nbsp;: la forme illustre le sens.",
    fb_ko:"Pas tout \u00e0 fait. Apollinaire a choisi cette forme pour que le dessin et le sujet se rejoignent. Dans un calligramme, la mise en page visuelle renforce le sens du texte."
  },
  {
    id:2,
    q:"Que montre ce calligramme sur la po\u00e9sie&nbsp;?",
    // Bonne réponse en C (pos 2)
    opts:[
      "Elle sert seulement \u00e0 raconter.",
      "Elle doit toujours \u00eatre chant\u00e9e.",
      "Elle peut \u00eatre lue et regard\u00e9e.",
      "Elle explique uniquement des id\u00e9es."
    ],
    ans:2,
    sub:"Quel \u00e9l\u00e9ment justifie le mieux cette r\u00e9ponse&nbsp;?",
    // Bonne réponse en A (pos 0)
    jopts:[
      "Les mots cr\u00e9ent aussi une image.",
      "Les mots forment plusieurs dialogues.",
      "Les mots suivent un ordre chronologique.",
      "Les mots d\u00e9crivent un personnage."
    ],
    jans:0,
    fb_ok:"Exact&nbsp;! Dans un calligramme, les mots forment \u00e0 la fois un texte \u00e0 lire et une image \u00e0 regarder. La po\u00e9sie d\u2019Apollinaire est donc visuelle autant que litt\u00e9raire.",
    fb_ko:"Pas tout \u00e0 fait. Le calligramme montre que la po\u00e9sie peut \u00eatre lue ET regard\u00e9e, car les mots eux-m\u00eames cr\u00e9ent une image."
  },
  {
    id:3,
    q:"Pourquoi le mot \u00ab\u202fPARIS\u202f\u00bb est-il plac\u00e9 pr\u00e8s du centre du calligramme&nbsp;?",
    // Bonne réponse en B (pos 1)
    opts:[
      "Parce que Paris est le mot le plus long du texte.",
      "Parce que Paris est au c\u0153ur du po\u00e8me.",
      "Parce que Paris est le premier mot \u00e9crit.",
      "Parce que Paris est le seul nom propre du texte."
    ],
    ans:1,
    sub:"Quel \u00e9l\u00e9ment justifie le mieux ta r\u00e9ponse&nbsp;?",
    // Bonne réponse en C (pos 2)
    jopts:[
      "Le mot est \u00e9crit avec des lettres plus petites.",
      "Le mot est entour\u00e9 de nombreux verbes.",
      "La Tour Eiffel est le symbole de Paris.",
      "Le mot est r\u00e9p\u00e9t\u00e9 plusieurs fois."
    ],
    jans:2,
    fb_ok:"Tr\u00e8s bien&nbsp;! Paris est le th\u00e8me central du po\u00e8me, et la Tour Eiffel en est le symbole universel. Sa position au centre du calligramme souligne cette importance.",
    fb_ko:"Pas tout \u00e0 fait. Paris est au c\u0153ur du po\u00e8me car la Tour Eiffel est son symbole. La position centrale du mot renforce cette id\u00e9e de centralit\u00e9."
  },
  {
    id:4,
    q:"Que cherche surtout \u00e0 faire Apollinaire avec ce calligramme&nbsp;?",
    // Bonne réponse en C (pos 2)
    opts:[
      "Raconter une histoire pleine de p\u00e9rip\u00e9ties.",
      "Donner des informations pr\u00e9cises sur Paris.",
      "Surprendre le lecteur en m\u00ealant texte et image.",
      "D\u00e9crire la construction de la Tour Eiffel."
    ],
    ans:2,
    sub:"Quel \u00e9l\u00e9ment justifie le mieux cette r\u00e9ponse&nbsp;?",
    // Bonne réponse en B (pos 1)
    jopts:[
      "Le po\u00e8me suit les \u00e9tapes d\u2019un r\u00e9cit.",
      "Le po\u00e8me attire d\u2019abord le regard par sa forme.",
      "Le po\u00e8me pr\u00e9sente de nombreuses dates.",
      "Le po\u00e8me d\u00e9crit les mat\u00e9riaux du monument."
    ],
    jans:1,
    fb_ok:"Excellent&nbsp;! Apollinaire joue sur la surprise visuelle&nbsp;: la forme du texte attire d\u2019abord le regard, avant m\u00eame la lecture. C\u2019est ce qui rend le calligramme si original.",
    fb_ko:"Pas tout \u00e0 fait. Apollinaire cherche avant tout \u00e0 surprendre en m\u00ealant texte et image. C\u2019est la forme du po\u00e8me qui attire en premier le regard du lecteur."
  },
  {
    id:5,
    q:"Quel r\u00f4le joue la forme de la Tour Eiffel dans la lecture&nbsp;?",
    // Bonne réponse en D (pos 3)
    opts:[
      "Elle remplace compl\u00e8tement le texte.",
      "Elle rend le sens impossible \u00e0 comprendre.",
      "Elle n\u2019a aucun lien avec le contenu.",
      "Elle aide \u00e0 comprendre le th\u00e8me du po\u00e8me."
    ],
    ans:3,
    sub:"Quel \u00e9l\u00e9ment justifie le mieux cette r\u00e9ponse&nbsp;?",
    // Bonne réponse en D (pos 3)
    jopts:[
      "Le dessin montre un autre monument.",
      "Le dessin cache la plupart des mots.",
      "Le dessin modifie les phrases du texte.",
      "Le dessin repr\u00e9sente le sujet \u00e9voqu\u00e9."
    ],
    jans:3,
    fb_ok:"Parfait&nbsp;! La forme de la Tour Eiffel aide le lecteur \u00e0 identifier imm\u00e9diatement le th\u00e8me du po\u00e8me. Le dessin et le sujet se renforcent mutuellement.",
    fb_ko:"Pas tout \u00e0 fait. La forme de la Tour Eiffel aide \u00e0 comprendre le th\u00e8me car le dessin repr\u00e9sente exactement le sujet \u00e9voqu\u00e9 dans le texte."
  }
];

var TOTAL = QS.length;
var state = QS.map(function(){ return {selA:null, selJ:null, done:false, ok:false}; });
var okCount = 0, koCount = 0;
var letters = ["A","B","C","D"];

/* ════════════════════════════════
   BUILD
════════════════════════════════ */
function build(){
  var zone = document.getElementById('cards-zone');
  zone.innerHTML = '';
  QS.forEach(function(q, qi){
    var card = document.createElement('div');
    card.className = 'card';
    card.id = 'card-'+qi;

    var header = document.createElement('div');
    header.className = 'card-header';
    header.innerHTML =
      '<div class="card-stripe"></div>' +
      '<div class="q-num">Question '+(qi+1)+' / '+TOTAL+'</div>' +
      '<div class="q-txt">'+q.q+'</div>';
    card.appendChild(header);

    var body = document.createElement('div');
    body.className = 'card-body';

    // Sous-question A
    var subA = document.createElement('div');
    subA.className = 'sub-label';
    subA.innerHTML = '&#9654; Choisis ta r\u00e9ponse';
    body.appendChild(subA);

    var optsA = document.createElement('div');
    optsA.className = 'opts';
    optsA.id = 'opts-a-'+qi;
    q.opts.forEach(function(opt, oi){
      var btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.type = 'button';
      btn.innerHTML = '<span class="opt-mark">'+letters[oi]+'</span><span>'+opt+'</span>';
      btn.dataset.qi = qi; btn.dataset.oi = oi; btn.dataset.part = 'a';
      btn.addEventListener('click', function(){ pickOpt(qi, oi, 'a', btn, optsA); });
      optsA.appendChild(btn);
    });
    body.appendChild(optsA);

    // Séparateur
    var sep = document.createElement('div'); sep.className = 'sep';
    body.appendChild(sep);

    // Sous-question J
    var subJ = document.createElement('div');
    subJ.className = 'sub-label';
    subJ.innerHTML = '&#9654; '+q.sub;
    body.appendChild(subJ);

    var optsJ = document.createElement('div');
    optsJ.className = 'opts';
    optsJ.id = 'opts-j-'+qi;
    q.jopts.forEach(function(opt, oi){
      var btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.type = 'button';
      btn.innerHTML = '<span class="opt-mark">'+letters[oi]+'</span><span>'+opt+'</span>';
      btn.dataset.qi = qi; btn.dataset.oi = oi; btn.dataset.part = 'j';
      btn.addEventListener('click', function(){ pickOpt(qi, oi, 'j', btn, optsJ); });
      optsJ.appendChild(btn);
    });
    body.appendChild(optsJ);

    // Boutons
    var tools = document.createElement('div');
    tools.className = 'tools';
    var btnV = document.createElement('button');
    btnV.className = 'btn btn-p';
    btnV.id = 'btn-v-'+qi;
    btnV.innerHTML = '&#10003; V\u00e9rifier';
    btnV.addEventListener('click', function(){ verif(qi); });
    var btnR = document.createElement('button');
    btnR.className = 'btn btn-g';
    btnR.innerHTML = '&#8635; Refaire';
    btnR.addEventListener('click', function(){ redoQ(qi); });
    tools.appendChild(btnV);
    tools.appendChild(btnR);
    body.appendChild(tools);

    // Feedback
    var fb = document.createElement('div');
    fb.className = 'fb'; fb.id = 'fb-'+qi;
    fb.innerHTML = '<span class="fb-icon" id="fbi-'+qi+'"></span><div id="fbm-'+qi+'"></div>';
    body.appendChild(fb);

    card.appendChild(body);
    zone.appendChild(card);
  });
}

/* ════════════════════════════════
   INTERACTIONS
════════════════════════════════ */
function pickOpt(qi, oi, part, btn, container){
  if(state[qi].done) return;
  container.querySelectorAll('.opt-btn').forEach(function(b){ b.classList.remove('selected'); });
  btn.classList.add('selected');
  if(part === 'a') state[qi].selA = oi;
  else             state[qi].selJ = oi;
}

function verif(qi){
  if(state[qi].done) return;
  var q = QS[qi], st = state[qi];
  if(st.selA === null || st.selJ === null){
    var fb = document.getElementById('fb-'+qi);
    fb.className = 'fb show ko';
    document.getElementById('fbi-'+qi).textContent = '!';
    document.getElementById('fbm-'+qi).innerHTML = '<strong>Attention&nbsp;!</strong> S\u00e9lectionne une r\u00e9ponse pour chaque question avant de valider.';
    return;
  }
  state[qi].done = true;
  document.getElementById('btn-v-'+qi).disabled = true;
  // Vérif : les deux doivent être corrects
  var okA = st.selA === q.ans;
  var okJ = st.selJ === q.jans;
  var ok  = okA && okJ;
  state[qi].ok = ok;
  if(ok) okCount++; else koCount++;
  // Colorier options A
  var optsA = document.getElementById('opts-a-'+qi);
  optsA.querySelectorAll('.opt-btn').forEach(function(b, i){
    b.classList.add('locked');
    b.classList.remove('selected');
    if(i === q.ans)              b.classList.add('correct-opt');
    else if(i === st.selA && !okA) b.classList.add('wrong-opt');
  });
  // Colorier options J
  var optsJ = document.getElementById('opts-j-'+qi);
  optsJ.querySelectorAll('.opt-btn').forEach(function(b, i){
    b.classList.add('locked');
    b.classList.remove('selected');
    if(i === q.jans)             b.classList.add('correct-opt');
    else if(i === st.selJ && !okJ) b.classList.add('wrong-opt');
  });
  // Feedback
  var fb = document.getElementById('fb-'+qi);
  fb.className = 'fb show '+(ok?'ok':'ko');
  document.getElementById('fbi-'+qi).textContent = ok ? '\u2713' : '\u2717';
  document.getElementById('fbm-'+qi).innerHTML = ok ? q.fb_ok : q.fb_ko;
  updateScore();
  checkAllDone();
}

function redoQ(qi){
  state[qi] = {selA:null, selJ:null, done:false, ok:false};
  if(state[qi].ok) okCount = Math.max(0, okCount-1);
  else koCount = Math.max(0, koCount-1);
  // Rebuild this card's options
  var optsA = document.getElementById('opts-a-'+qi);
  var optsJ = document.getElementById('opts-j-'+qi);
  [optsA, optsJ].forEach(function(container, pi){
    container.querySelectorAll('.opt-btn').forEach(function(b){
      b.className = 'opt-btn';
      var oi = parseInt(b.dataset.oi);
      var part = pi === 0 ? 'a' : 'j';
      b.addEventListener('click', function(){ pickOpt(qi, oi, part, b, container); });
    });
  });
  document.getElementById('btn-v-'+qi).disabled = false;
  document.getElementById('fb-'+qi).className = 'fb';
  updateScore();
}

/* ════════════════════════════════
   SCORE
════════════════════════════════ */
function updateScore(){
  var done = state.filter(function(s){ return s.done; }).length;
  document.getElementById('sb-ok').textContent  = okCount;
  document.getElementById('sb-ko').textContent  = koCount;
  document.getElementById('sb-label').textContent = okCount+' / '+TOTAL+' questions';
  document.getElementById('sb-fill').style.width = Math.round(okCount/TOTAL*100)+'%';
  document.getElementById('g-num').textContent   = okCount;
}

function checkAllDone(){
  var done = state.filter(function(s){ return s.done; }).length;
  if(done < TOTAL) return;
  var ratio = okCount/TOTAL;
  var stars = okCount>=TOTAL?5:ratio>=.8?4:ratio>=.6?3:ratio>=.4?2:okCount>0?1:0;
  document.getElementById('g-stars').textContent = '\u2B50'.repeat(stars)+'\u2606'.repeat(5-stars);
  var msg;
  if(okCount===TOTAL)   msg='Parfait\u00a0! Tu ma\u00eetrises l\u2019analyse du calligramme.';
  else if(ratio>=.8)    msg='Tr\u00e8s bien\u00a0! Encore un l\u00e9ger effort sur une question.';
  else if(ratio>=.6)    msg='Bien\u00a0! Quelques justifications \u00e0 retravailler.';
  else if(ratio>=.4)    msg='Continue\u00a0! Relis le calligramme et observe la forme.';
  else                  msg='\u00c0 retravailler\u00a0: relis les indices de chaque question.';
  document.getElementById('g-msg').textContent = msg;
  document.getElementById('global').classList.add('show');
  document.getElementById('global').scrollIntoView({behavior:'smooth',block:'nearest'});
}

/* ════════════════════════════════
   RESTART
════════════════════════════════ */
function restart(){
  okCount = 0; koCount = 0;
  state = QS.map(function(){ return {selA:null,selJ:null,done:false,ok:false}; });
  document.getElementById('global').classList.remove('show');
  build();
  updateScore();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* INIT */
build();
updateScore();
</script>
